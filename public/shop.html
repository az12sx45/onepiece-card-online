<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>商店｜偉大航道爭霸戰</title>
  <link rel="stylesheet" href="css/card-cursor-buggy-v1.css?v=20260905-game-cursors-v1">
  <script defer src="js/game_cursor_feedback_v1.js?v=20260905-game-cursors-v1"></script>
  <style>
    :root{
      --bg:#0b1014; --card:#141a1f; --line:#2a3038;
      --text:#e9f0f8; --muted:#9aa5b2;
      --gold:#ffd36b; --gold2:#ffb84a;
      --good:#34d399; --bad:#fb7185;
      --shadow: 0 10px 28px rgba(0,0,0,.38);
      --r:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC",sans-serif;
      background: radial-gradient(circle at 25% 15%, rgba(255,211,107,.10), transparent 55%),
                  radial-gradient(circle at 80% 85%, rgba(0,158,255,.07), transparent 55%),
                  linear-gradient(180deg,#070a0e 0%, #0b1014 40%, #080b10 100%);
      color:var(--text);
    }
    a{color:inherit}
    .top{
      position:sticky; top:0; z-index:30;
      backdrop-filter: blur(10px);
      background: rgba(14,18,24,.72);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .wrap{max-width:1100px;margin:0 auto;padding:14px 16px;}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    .brand{
      display:flex;align-items:center;gap:10px;
      font-weight:900; letter-spacing:.6px;
    }
    .brand .dot{
      width:12px;height:12px;border-radius:999px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      box-shadow:0 0 0 3px rgba(255,211,107,.12);
    }
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text); cursor:pointer;
      transition: .15s;
      user-select:none;
    }
    .btn:hover{background:rgba(255,255,255,.12)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background: rgba(255,211,107,.16);
      border-color: rgba(255,211,107,.35);
      color:#1b1408;
      font-weight:900;
    }
    .btn.ghost{ background: transparent; }
    .btn[disabled]{opacity:.55; cursor:not-allowed; transform:none}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-size:12px;
    }
    .coins{
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:.2px;
    }
    .status{ font-size:12px; color:var(--muted); }

    .panel{
      margin-top:10px;
      background: rgba(20,24,31,.78);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      padding:12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    }
    .title{
      font-weight:1000; font-size:18px;
      display:flex; align-items:center; gap:10px;
    }
    .sub{
      font-size:12px; color:var(--muted);
      margin-top:2px;
    }
    .controls{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .tabs{
      display:inline-flex; gap:6px; padding:4px;
      border-radius:999px;
      background: rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
    }
    .tab{
      border:none; cursor:pointer;
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      background: transparent;
      color: var(--muted);
    }
    .tab.active{
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      color:#1b1408;
      font-weight:900;
    }
    .input{
      display:flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
    }
    .input input{
      border:none; outline:none; background:transparent; color:var(--text);
      width:180px;
    }
    .select{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color:var(--text);
      outline:none;
    }

    .grid{
      padding:14px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    @media (max-width: 640px){ .grid{grid-template-columns: 1fr;} .input input{width:140px;} }

    .item{
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      overflow:hidden;
      display:flex; flex-direction:column;
      min-height: 210px;
    }
    .thumb{
      position:relative;
      height: 140px;
      background: radial-gradient(circle at 50% 30%, rgba(255,211,107,.10), rgba(0,0,0,.0) 60%),
                  linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.0));
      display:flex; align-items:center; justify-content:center;
    }
    .thumb img{
      width: 92px; height: 92px;
      border-radius: 18px;
      object-fit:cover;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      box-shadow: 0 10px 20px rgba(0,0,0,.35);
    }
    .rarity{
      position:absolute; left:10px; top:10px;
      font-size:11px; font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.32);
      color: #e8eef7;
    }
    .rarity.r-rare{ border-color: rgba(255,211,107,.40); background: rgba(255,211,107,.10); color: #ffe8b6; }
    .rarity.r-epic{ border-color: rgba(147,96,255,.40); background: rgba(147,96,255,.10); color: #f1e7ff; }
    .rarity.r-legend{ border-color: rgba(255,184,74,.55); background: rgba(255,184,74,.14); color: #fff2cc; box-shadow: 0 0 18px rgba(255,211,107,.22); }
    .rarity.r-mythic{ border-color: rgba(255, 70, 220, .55); background: rgba(255, 70, 220, .14); color: #ffe3fb; box-shadow: 0 0 18px rgba(255, 70, 220, .22); }

    .ownedTag{
      position:absolute; right:10px; top:10px;
      font-size:11px; font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(52,211,153,.40);
      background: rgba(52,211,153,.10);
      color: #b9f6dd;
    }
    .body{
      padding:12px 12px 10px;
      display:flex; flex-direction:column; gap:8px;
      flex:1;
    }
    .name{font-weight:1000}
    .desc{font-size:12px;color:rgba(233,240,248,.75);line-height:1.5; min-height: 34px;}
    .metaRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;}
    .price{font-weight:1000; color:var(--gold); font-variant-numeric:tabular-nums;}
    .actions{display:flex; gap:8px; justify-content:flex-end;}
    .btn.small{padding:8px 10px;border-radius:12px;font-size:13px}
    .btn.buy{
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      border-color: rgba(255,211,107,.55);
      color:#1b1408;
      font-weight:1000;
    }
    .btn.buy:hover{filter:brightness(1.05)}
    .hint{
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.06);
      color: var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    /* modal */
    .modalBack{
      position:fixed; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background: rgba(0,0,0,.70);
      padding: 18px;
    }
    .modalBack.show{display:flex}
    .modal{
      width: min(880px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(20,24,31,.90);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modalTop{
      padding:12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .modalTop .t{font-weight:1000}
    .modalBody{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap: 14px;
      padding: 14px;
    }
    @media (max-width: 720px){ .modalBody{grid-template-columns: 1fr;} }
    .preview{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      display:flex; align-items:center; justify-content:center;
      padding: 14px;
      min-height: 220px;
    }
    .preview img{width:200px;height:200px;border-radius:22px;object-fit:cover;border:1px solid rgba(255,255,255,.16);}
    .detail h3{margin:0 0 8px;font-weight:1000}
    .detail p{margin:0;color:rgba(233,240,248,.78);font-size:13px;line-height:1.7}
    .kv{display:grid;grid-template-columns: 90px 1fr;gap:8px;margin-top:10px;font-size:13px}
    .kv div{padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
    .kv .k{color:var(--muted)}
    .modalActions{display:flex; gap:8px; justify-content:flex-end; padding: 0 14px 14px;}
  
/* ===== Friends Dock: friend request row ===== */
#friendDock .fd-sep{
  padding:8px 10px;
  font-size:11px;
  color:rgba(255,255,255,.65);
  border-top:1px solid rgba(255,255,255,.08);
}
#friendDock .fd-item.req{ cursor:default; }
#friendDock .fd-reqwrap{
  display:flex;
  gap:6px;
  align-items:center;
  margin-left:auto;
}
#friendDock .fd-reqbtn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.92);
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;
}
#friendDock .fd-reqbtn:hover{ background:rgba(255,255,255,.14); }
#friendDock .fd-reqbtn.ok{ border-color:rgba(255,211,107,.45); }
#friendDock .fd-reqbtn.no{ border-color:rgba(255,100,100,.45); }
</style>
</head>
<body>

  <div class="top">
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <div style="font-size:14px">偉大航道爭霸戰｜商店</div>
            <div class="status" id="status">連線中…</div>
          </div>
        </div>

        <div class="row" style="gap:8px">
          <span class="pill" title="雲端金幣（以 stats.client.totals.coins 為準）">
            <span class="coins">金幣：<span id="coins">0</span></span>
          </span>
          <button class="btn" id="btnBack">← 回個人頁</button>
          <button class="btn ghost" id="btnReload" title="重新從雲端讀取">↻ 重新同步</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="panelHead">
        <div>
          <div class="title">商店（用累計金幣購買解鎖）</div>
          <div class="sub">購買會扣 <b>雲端累計金幣</b>，解鎖紀錄寫入 <code>stats.client.shop</code>。</div>
        </div>

        <div class="controls">
          <div class="tabs" role="tablist" aria-label="類別">
            <button class="tab active" data-tab="avatar" role="tab">頭像</button>
            <button class="tab" data-tab="wall" role="tab">牆面</button>
            <button class="tab" data-tab="item" role="tab">道具</button>
          </div>

          <label class="input" title="搜尋名稱/描述">
            🔎 <input id="q" placeholder="搜尋…" autocomplete="off"/>
          </label>

          <select id="sort" class="select" title="排序">
            <option value="priceAsc">價格：低 → 高</option>
            <option value="priceDesc">價格：高 → 低</option>
            <option value="rarityDesc">稀有度：高 → 低</option>
            <option value="ownedLast">已擁有：排後面</option>
          </select>
        </div>
      </div>

      <div id="grid" class="grid"></div>

      <div class="hint" id="hint">
        提示：若你覺得商店顯示金幣不對，通常是因為舊版商店讀的是 <code>stats.coins</code>，但你現在專案的金幣已統一累積在 <code>stats.client.totals.coins</code>。
        這版已修正並自動做相容轉換（必要時會把舊欄位同步回新欄位）。
      </div>
    </div>

    <div style="margin-top:10px;font-size:12px;color:var(--muted)" id="toast"></div>
  </div>

  <!-- Detail / Buy Modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="商品詳情">
    <div class="modal">
      <div class="modalTop">
        <div class="t" id="mTitle">商品</div>
        <button class="btn" id="mClose">✕</button>
      </div>
      <div class="modalBody">
        <div class="preview"><img id="mImg" alt="preview"/></div>
        <div class="detail">
          <h3 id="mName">—</h3>
          <p id="mDesc">—</p>
          <div class="kv">
            <div class="k">類別</div><div id="mType">—</div>
            <div class="k">稀有度</div><div id="mRarity">—</div>
            <div class="k">價格</div><div id="mPrice">—</div>
            <div class="k">狀態</div><div id="mOwned">—</div>
          </div>
        </div>
      </div>
      <div class="modalActions">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn buy" id="mBuy">購買</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ========================
    //  Cloud Shop (v2)
    //  - coins source of truth: stats.client.totals.coins
    //  - owned source of truth: stats.client.shop
    //  - flags are sold in ITEM tab, but stored in shop.ownedFlags (numbers)
    // ========================

    // server url
    const serverURL =
      new URLSearchParams(location.search).get('server')
      || "https://onepiece-card-online.onrender.com";

    // auth
    const secret = localStorage.getItem('opSecret');
    if(!secret){
      alert('尚未登入/沒有 secret，請先回主畫面登入。');
      location.href = 'start.html';
    }

    // UI helpers
    const $ = (id)=>document.getElementById(id);
    const esc = (s)=>String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const fmt = (n)=> (Number(n)||0).toLocaleString('en-US');
    const clampInt = (n, a, b)=> Math.max(a, Math.min(b, Math.floor(Number(n)||0)));
    const toast = (msg)=>{ $('toast').textContent = msg || ''; };

    // ===== rarity / price =====
    function rarityRank(r){
      return ({common:1, rare:2, epic:3, legend:4, mythic:5})[r] || 1;
    }
    function rarityLabel(r){
      return ({common:'普通', rare:'稀有', epic:'史詩', legend:'傳說', mythic:'神話'})[r] || '普通';
    }
    function rarityClass(r){
      if(r==='mythic') return 'r-mythic';
      if(r==='legend') return 'r-legend';
      if(r==='epic')   return 'r-epic';
      if(r==='rare')   return 'r-rare';
      return '';
    }
    const PRICE_BY_RARITY = {
      common: 5,
      rare: 10,
      epic: 18,
      legend: 25,
      mythic: 35,
    };
    function priceOf(it){
      if(Number.isFinite(Number(it.price))) return Number(it.price);
      return PRICE_BY_RARITY[it.rarity] ?? 5;
    }

    function typeLabel(t){
      return ({avatar:'頭像', wall:'牆面', item:'道具'})[t] || t;
    }

    // ========================
    // 商品（你之後要賣的就改這個陣列）
    // type: 'avatar' | 'wall' | 'item'
    // kind: 'flag' for pirate flags
    // ========================
    const SHOP = [
      // ===== Avatars 31-50 =====
      // 普通：31-37, 41, 42
      { id:'ava-31', type:'avatar', key:31, name:'路奇', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-32', type:'avatar', key:32, name:'大和', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-33', type:'avatar', key:33, name:'弗朗基', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-34', type:'avatar', key:34, name:'艾斯', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-35', type:'avatar', key:35, name:'巴索羅-大熊', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-36', type:'avatar', key:36, name:'鑽石裘斯', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-37', type:'avatar', key:37, name:'暴走喬巴', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-41', type:'avatar', key:41, name:'多拉格', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-42', type:'avatar', key:42, name:'火拳艾斯', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },

      // 稀有：38, 43, 44, 45, 46, 47
      { id:'ava-38', type:'avatar', key:38, name:'草帽的傳承', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },
      { id:'ava-43', type:'avatar', key:43, name:'ACE', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },
      { id:'ava-44', type:'avatar', key:44, name:'不死鳥馬可', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },
      { id:'ava-45', type:'avatar', key:45, name:'未來海賊王的左右手', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },
      { id:'ava-46', type:'avatar', key:46, name:'艾斯剪影', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },
      { id:'ava-47', type:'avatar', key:47, name:'魯夫Q版', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'rare' },

      // 史詩：39, 40, 48
      { id:'ava-39', type:'avatar', key:39, name:'魯夫紅藍光影', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'epic' },
      { id:'ava-40', type:'avatar', key:40, name:'海軍的未來 克比', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'epic' },
      { id:'ava-48', type:'avatar', key:48, name:'海軍元帥 赤犬', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'epic' },

      // 傳說：49, 50
      { id:'ava-49', type:'avatar', key:49, name:'尼卡大笑', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'legend' },
      { id:'ava-50', type:'avatar', key:50, name:'尼卡防風鏡', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'legend' },

      // ===== Walls 4-8 =====
      { id:'wall-4', type:'wall', key: 4, name:'牆面 #4', desc:'商店限定牆面（購買後可在個人頁面套用）', rarity:'common' },
      { id:'wall-5', type:'wall', key: 5, name:'牆面 #5', desc:'商店限定牆面（購買後可在個人頁面套用）', rarity:'rare' },
      { id:'wall-6', type:'wall', key: 6, name:'牆面 #6', desc:'商店限定牆面（購買後可在個人頁面套用）', rarity:'rare' },
      { id:'wall-7', type:'wall', key: 7, name:'牆面 #7', desc:'商店限定牆面（購買後可在個人頁面套用）', rarity:'epic' },
      { id:'wall-8', type:'wall', key: 8, name:'牆面 #8', desc:'商店限定牆面（購買後可在個人頁面套用）', rarity:'legend' },

    ];

    function imgUrl(it){
      if(it.type==='avatar') return `images/avatars/${it.key}.webp`;
      if(it.type==='wall')   return `images/walls/${it.key}.webp`;
      // flags live in images/flags
      if(it.type==='item' && it.kind==='flag') return `images/flags/${it.key}.webp`;
      // other items default
      return `images/items/${it.key}.webp`;
    }

    // ===== Cloud state =====
    let socket = null;
    let profile = null; // player_profiles row
    let saving = false;

    // ===== Normalization (match your project schema) =====
    function defaultClient(){
      return {
        version: 2,
        player: { name:'', avatar:'' },
        totals: { games:0, wins:0, coins:0 },
        recent: [],
        deluxeUnlocked: [],
        titles: { owned: [], equipped:'', equippedTier: 1 },
        bountyPosters: [],
        _appliedMatchKeys: [],
        shop: { ownedAvatars: [], ownedWalls: [], ownedItems: [], ownedFlags: [] }
      };
    }

    function ensureClient(){
      if(!profile) return;
      if(!profile.stats || typeof profile.stats!=='object') profile.stats = {};
      if(!profile.stats.client || typeof profile.stats.client!=='object') profile.stats.client = {};
      const base = defaultClient();

      const c = profile.stats.client;
      profile.stats.client = {
        ...base,
        ...c,
        player: { ...base.player, ...(c.player||{}) },
        totals: { ...base.totals, ...(c.totals||{}) },
        titles: { ...base.titles, ...(c.titles||{}) },
        shop:   { ...base.shop,   ...(c.shop||{}) }
      };

      // arrays ensure
      const s = profile.stats.client.shop;
      if(!Array.isArray(s.ownedAvatars)) s.ownedAvatars = [];
      if(!Array.isArray(s.ownedWalls))   s.ownedWalls   = [];
      if(!Array.isArray(s.ownedItems))   s.ownedItems   = [];
      if(!Array.isArray(s.ownedFlags))   s.ownedFlags   = [];

      // backward compat (old shop wrote stats.coins)
      const legacyCoins = Number(profile.stats.coins || 0) || 0;
      const newCoins = Number(profile.stats.client.totals.coins || 0) || 0;
      if(legacyCoins > 0 && newCoins <= 0){
        profile.stats.client.totals.coins = legacyCoins;
      }
      // keep legacy in sync (helps old pages)
      profile.stats.coins = Number(profile.stats.client.totals.coins || 0) || 0;
    }

    function coins(){
      ensureClient();
      return clampInt(profile?.stats?.client?.totals?.coins, 0, 1e12);
    }
    function setCoins(v){
      ensureClient();
      profile.stats.client.totals.coins = clampInt(v, 0, 1e12);
      profile.stats.coins = Number(profile.stats.client.totals.coins || 0) || 0;
    }

    function shopState(){
      ensureClient();
      return profile.stats.client.shop;
    }

    function isFlag(it){ return it?.type==='item' && it?.kind==='flag'; }

    function isOwned(it){
      const s = shopState();
      if(it.type==='avatar') return s.ownedAvatars.includes(Number(it.key));
      if(it.type==='wall')   return s.ownedWalls.includes(Number(it.key));
      if(isFlag(it))         return s.ownedFlags.includes(Number(it.key));
      return s.ownedItems.includes(String(it.key));
    }

    function own(it){
      const s = shopState();
      if(it.type==='avatar'){
        const k = Number(it.key);
        if(!s.ownedAvatars.includes(k)) s.ownedAvatars.push(k);
      }else if(it.type==='wall'){
        const k = Number(it.key);
        if(!s.ownedWalls.includes(k)) s.ownedWalls.push(k);
      }else if(isFlag(it)){
        const k = Number(it.key);
        if(!s.ownedFlags.includes(k)) s.ownedFlags.push(k);
      }else{
        const k = String(it.key);
        if(!s.ownedItems.includes(k)) s.ownedItems.push(k);
      }
    }

    // ===== Cloud API =====
    function profileGet(){
      return new Promise((resolve, reject)=>{
        socket.timeout(8000).emit('PROFILE_GET', { secret }, (err, res)=>{
          if(err) return reject(err);
          if(!res || !res.ok) return reject(res?.error || 'PROFILE_GET failed');
          profile = res.profile || {};
          ensureClient();
          resolve(profile);
        });
      });
    }

    function profileUpdate(patch){
      return new Promise((resolve, reject)=>{
        socket.timeout(8000).emit('PROFILE_UPDATE', { secret, patch }, (err, res)=>{
          if(err) return reject(err);
          if(!res || !res.ok) return reject(res?.error || 'PROFILE_UPDATE failed');
          if(res.profile) profile = res.profile;
          ensureClient();
          resolve(res);
        });
      });
    }

    async function saveCloud(reason){
      ensureClient();
      return await profileUpdate({
        stats: {
          ...(profile.stats || {}),
          coins: Number(profile.stats.coins || 0),
          client: profile.stats.client
        }
      });
    }

    // ===== UI state =====
    let curTab = 'avatar';
    let curPick = null;

    function applyCoinsUI(){
      $('coins').textContent = fmt(coins());
    }

    function render(){
      applyCoinsUI();

      const q = String($('q').value || '').trim().toLowerCase();
      const sort = $('sort').value;

      // filter
      let list = SHOP
        .filter(it => it.type === curTab)
        .map(it => ({ ...it, price: priceOf(it) }));

      if(q){
        list = list.filter(it =>
          (it.name && it.name.toLowerCase().includes(q)) ||
          (it.desc && it.desc.toLowerCase().includes(q)) ||
          String(it.key).includes(q)
        );
      }

      // sort
      list.sort((a,b)=>{
        const ao = isOwned(a), bo = isOwned(b);
        if(sort === 'ownedLast'){
          if(ao !== bo) return ao ? 1 : -1;
          return a.price - b.price;
        }
        if(sort === 'priceAsc')  return a.price - b.price;
        if(sort === 'priceDesc') return b.price - a.price;
        if(sort === 'rarityDesc'){
          const rr = rarityRank(b.rarity) - rarityRank(a.rarity);
          if(rr) return rr;
          return b.price - a.price;
        }
        return 0;
      });

      const grid = $('grid');
      grid.innerHTML = '';

      if(!list.length){
        grid.innerHTML = `<div style="grid-column:1/-1; padding:10px; color:var(--muted);">沒有符合的商品。</div>`;
        return;
      }

      for(const it of list){
        const owned = isOwned(it);
        const afford = coins() >= it.price;

        const el = document.createElement('div');
        el.className = 'item';

        el.innerHTML = `
          <div class="thumb">
            <span class="rarity ${rarityClass(it.rarity)}">${rarityLabel(it.rarity)}</span>
            ${owned ? `<span class="ownedTag">已擁有</span>` : ``}
            <img src="${esc(imgUrl(it))}" alt="${esc(it.name)}" loading="lazy"/>
          </div>
          <div class="body">
            <div class="name">${esc(it.name)}</div>
            <div class="desc">${esc(it.desc||'')}</div>
            <div class="metaRow">
              <div class="price">${fmt(it.price)} 金幣</div>
              <div class="actions">
                <button class="btn small" data-act="detail">查看</button>
                <button class="btn small buy" data-act="buy" ${owned || saving || !afford ? 'disabled' : ''}>
                  ${owned ? '已擁有' : (afford ? '購買' : '金幣不足')}
                </button>
              </div>
            </div>
          </div>
        `;

        el.querySelector('[data-act="detail"]').onclick = ()=> openModal(it);
        const buyBtn = el.querySelector('[data-act="buy"]');
        buyBtn.onclick = ()=> openModal(it, {focusBuy:true});

        grid.appendChild(el);
      }
    }

    // ===== modal =====
    function openModal(it, opt={}){
      curPick = { ...it, price: priceOf(it) };
      const owned = isOwned(curPick);

      $('mTitle').textContent = `商品詳情`;
      $('mImg').src = imgUrl(curPick);
      $('mName').textContent = curPick.name;
      $('mDesc').textContent = curPick.desc || '';
      $('mType').textContent = typeLabel(curPick.type);
      $('mRarity').textContent = rarityLabel(curPick.rarity);
      $('mPrice').textContent = `${fmt(curPick.price)} 金幣`;
      $('mOwned').textContent = owned ? '已擁有' : '未擁有';

      const btn = $('mBuy');
      btn.disabled = saving || owned || coins() < curPick.price;
      btn.textContent = owned ? '已擁有' : (coins() < curPick.price ? '金幣不足' : '購買');

      $('modalBack').classList.add('show');
      if(opt.focusBuy && !btn.disabled) btn.focus();
    }

    function closeModal(){
      $('modalBack').classList.remove('show');
      curPick = null;
    }

    async function buyCurrent(){
      const it = curPick;
      if(!it || saving) return;
      if(isOwned(it)) return;
      if(coins() < it.price){ alert('金幣不足'); return; }

      const ok = confirm(`確定花 ${fmt(it.price)} 金幣購買「${it.name}」？`);
      if(!ok) return;

      saving = true;
      toast('儲存中…');

      try{
        setCoins(coins() - it.price);
        own(it);
        await saveCloud('shop-buy');
        toast(`已購買：${it.name} ✓`);
        closeModal();
      }catch(e){
        console.error(e);
        toast('儲存失敗：請檢查網路/登入狀態（已嘗試保護性回復）');
        try{ await profileGet(); }catch(_){}
      }finally{
        saving = false;
        render();
      }
    }

    // ===== events =====
    $('btnBack').onclick = ()=> location.href = 'profile.html';
    $('btnReload').onclick = async ()=>{
      if(!socket || saving) return;
      toast('重新同步中…');
      try{
        await profileGet();
        toast('已同步 ✓');
      }catch(e){
        console.error(e);
        toast('同步失敗，請重整或檢查登入');
      }finally{
        render();
      }
    };

    document.querySelectorAll('.tab').forEach(b=>{
      b.onclick = ()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        curTab = b.dataset.tab;
        render();
      };
    });

    $('q').addEventListener('input', ()=> render());
    $('sort').addEventListener('change', ()=> render());

    $('mClose').onclick = closeModal;
    $('mCancel').onclick = closeModal;
    $('mBuy').onclick = buyCurrent;
    $('modalBack').addEventListener('click', (e)=>{
      if(e.target === $('modalBack')) closeModal();
    });
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') closeModal();
    });

<!-- 多聊天室托盤（LoL 風格：可同時開多個、可縮小保留） -->
<div id="fdChatTray" aria-label="chat-tray"></div>

<script>
(function(){
  // Avoid double init
  if (window.__friendDockInited) return;
  window.__friendDockInited = true;

  function q(sel){ return document.querySelector(sel); }
  function clamp(n,a,b){ n=Number(n); if(!Number.isFinite(n)) n=a; return Math.max(a,Math.min(b,n)); }
  function fmtTime(ts){
    try{
      const d = new Date(ts||Date.now());
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${hh}:${mm}`;
    }catch{ return ""; }
  }

  const dock = q("#friendDock");
  const listEl = q("#fdList");
  const hintEl = q("#fdHint");
  const minBtn = q("#fdMinBtn");
  const addInp = q("#fdAddName");
  const addBtn = q("#fdAddBtn");
  const tray  = q("#fdChatTray");

  const meAvaImg = q("#fdMeAvaImg");
  const meNameEl = q("#fdMeName");
  const openBtn  = q("#fdOpenBtn");

  function updateDockMinIcon(){
    // collapsed: + (展開) / expanded: - (縮小)
    try{ if(minBtn) minBtn.textContent = dock.classList.contains("collapsed") ? "+" : "-"; }catch(e){}
  }


  function renderMeMini(){
    const nm = String(me?.name || me?.displayName || localStorage.getItem("op_player_name") || localStorage.getItem("op_name") || "").trim();
    const av = Number(me?.avatar || localStorage.getItem("op_avatar") || localStorage.getItem("opAvatar") || 1) || 1;
    if(meAvaImg) meAvaImg.src = avatarUrlById(av);
    if(meNameEl) meNameEl.textContent = nm || (secret ? "玩家" : "未登入");
  }

  if(openBtn){
    openBtn.addEventListener("click", ()=>{
      dock.classList.remove("collapsed");
      updateDockMinIcon();
      try{ localStorage.setItem("op_fdock_collapsed", "0"); }catch{}
      try{ addInp && addInp.focus && addInp.focus(); }catch{}
    });
  }


  let sock = window.socket || null;
  let secret = "";
  let me = { userId: 0 };
  let friends = [];
  let requestsIn = [];
  let requestsOut = [];

  let unread = new Map(); // peerId -> count (dock badge)
  const openChats = new Map(); // peerId -> {peer, el, log, inp, send, badge, minimized}
  let chatOrder = []; // array of peerId \(left<->right ordering handled by flex row-reverse\)

// ===== 防止「自己看到自己訊息重複」：DM_SEND callback + DM_NEW echo 會造成重複顯示 =====
// 做法：送出成功時先把訊息簽名記到快取；收到同一則 DM_NEW（from=自己）就略過。
const __fdRecentSig = new Map(); // peerId -> Set(sig)
function __fdMsgSig(m){
  // 用 from/to/ts/body 組合做簽名；伺服器 echo 時通常一致
  const from = Number(m?.from)||0;
  const to   = Number(m?.to)||0;
  const ts   = Number(m?.ts)||0;
  const body = String(m?.body||"");
  return `${from}|${to}|${ts}|${body}`;
}
function __fdMarkRecent(m){
  try{
    const fromId = Number(m?.from)||0;
    const peerId = (fromId === Number(me?.userId)) ? Number(m?.to) : fromId;
    if(!peerId) return;
    const sig = __fdMsgSig(m);
    let set = __fdRecentSig.get(peerId);
    if(!set){ set = new Set(); __fdRecentSig.set(peerId, set); }
    set.add(sig);
    setTimeout(()=>{
      try{
        const s = __fdRecentSig.get(peerId);
        if(!s) return;
        s.delete(sig);
        if(s.size===0) __fdRecentSig.delete(peerId);
      }catch{}
    }, 12000);
  }catch{}
}

  // restore collapsed state
  try{
    const c = localStorage.getItem("op_fdock_collapsed");
    if(c === "0") dock.classList.remove("collapsed");
  }catch{}

  updateDockMinIcon();
  renderMeMini();

  function setHint(msg){
    if(!msg){ hintEl.style.display="none"; hintEl.textContent=""; return; }
    hintEl.style.display="block";
    hintEl.textContent = msg;
  }

  function ensureSocket(){
    // ✅ 重要：朋友聊天/未讀/打字提示依賴同一條 socket
    // 以前這裡會在 sock.connected === false 時「重建 socket」，導致 DM_NEW 監聽掛在舊 socket 上 → 訊息不即時
    if (sock) return sock;
    if (window.socket) { sock = window.socket; return sock; }

    const url =
      window.SERVER_URL ||
      window.serverURL ||
      localStorage.getItem("op_server_url") ||
      (location.origin.includes("onrender.com") ? location.origin : location.origin);

    if (typeof io !== "function"){
      setHint("缺少 Socket.IO（io）");
      return null;
    }

    sock = io(url, { transports: ["websocket"] });
    window.socket = sock;
    return sock;
  }

  function ensureSecret(){
    secret = (window.secret || localStorage.getItem("op_secret") || localStorage.getItem("opSecret") || "").trim();
    return secret;
  }

  function getDeviceId(){
    try{
      let did = localStorage.getItem("op_device_id");
      if(did && String(did).length >= 8) return String(did);
      did = (crypto?.randomUUID ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(16).slice(2)));
      localStorage.setItem("op_device_id", did);
      return did;
    }catch{
      return "dev-"+Date.now();
    }
  }

  function isAuthed(){
    return !!(secret && me && me.userId);
  }

  async function socialAuth(){
    ensureSocket();
    ensureSecret();
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("SOCIAL_AUTH", { secret, deviceId: getDeviceId() }, (err, res) => {
      if(err || !res?.ok){
        setHint("好友/聊天：尚未登入（缺少 secret）");
        return;
      }
      me = res.me || me;
      renderMeMini();

      // 更新自己的好友狀態（讓其他人看到你在shop頁）
      try{ sock.emit("PRESENCE_SET", { secret, page: "shop", deviceId: getDeviceId() }); }catch{}
      setHint("");
      fetchFriends();
    });
  }

  function fetchFriends(){
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("FRIENDS_GET", { secret }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "好友清單讀取失敗");
        return;
      }
      friends = (res.friends || []).slice(0, 200);
      
      requestsIn = (res.requestsIn || []).slice(0, 200);
      requestsOut = (res.requestsOut || []).slice(0, 200);
renderFriends();
      // sync open chat online status
      for(const [peerId, w] of openChats.entries()){
        const f = friends.find(x=>x.userId===peerId);
        if(f){
          w.peer = f;
          updateWinHeader(peerId);
        }
      }
    });
  }

  function avatarUrlById(id){
    const n = clamp(id, 1, 2000);
    return `images/avatars/${n}.webp`;
  }

  // ===== friends row "..." menu =====
  let __fdOpenMenuUid = null;

  function closeFriendMenus(){
    document.querySelectorAll('#friendDock .fd-menu').forEach(el=>el.remove());
    document.querySelectorAll('#friendDock .fd-morebtn').forEach(b=>b.classList.remove('on'));
    __fdOpenMenuUid = null;
  }

  function openFriendMenu(itemEl, f, btnEl){
    closeFriendMenus();
    __fdOpenMenuUid = Number(f?.userId)||0;
    if(btnEl) btnEl.classList.add('on');

    const menu = document.createElement('div');
    menu.className = 'fd-menu';

    const bView = document.createElement('button');
    bView.type = 'button';
    bView.textContent = '查看個人頁面';
    bView.addEventListener('click', (e)=>{
      e.stopPropagation();
      closeFriendMenus();
      const uid = Number(f?.userId)||0;
      if(uid>0) location.href = `profile.html?view=${uid}`;
    });

    const bDel = document.createElement('button');
    bDel.type = 'button';
    bDel.className = 'danger';
    bDel.textContent = '刪除好友';
    bDel.addEventListener('click', (e)=>{
      e.stopPropagation();
      const uid = Number(f?.userId)||0;
      if(!(uid>0)) return closeFriendMenus();
      if(!confirm(`確定要刪除好友「${String(f?.name||('#'+uid))}」嗎？
（會互相刪除）`)) return;
      if(!sock){ setHint('好友/聊天：Socket 尚未連線'); return; }
      if(!secret){ setHint('好友/聊天：請先登入（缺少 opSecret）'); return; }

      sock.timeout(12000).emit('FRIEND_REMOVE', { secret, userId: uid }, (err, res)=>{
        if(err || !res?.ok){
          setHint(res?.error || '刪除失敗');
          return;
        }
        setHint('');
        closeFriendMenus();
        fetchFriends();
      });
    });

    menu.appendChild(bView);
    menu.appendChild(bDel);
    // prevent click inside menu from bubbling to fd-item (open chat)
    menu.addEventListener('click', (e)=> e.stopPropagation());

    itemEl.appendChild(menu);
  }

  // close menus when clicking elsewhere
  document.addEventListener('click', (e)=>{
    const inDock = e.target && e.target.closest && e.target.closest('#friendDock');
    if(!inDock) return closeFriendMenus();
    if(e.target.closest('.fd-menu') || e.target.closest('.fd-morebtn')) return;
    closeFriendMenus();
  });



  function renderFriends(){
    listEl.innerHTML = "";
    // === incoming friend requests ===
    if(Array.isArray(requestsIn) && requestsIn.length){
      const h = document.createElement("div");
      h.className = "fd-sep";
      h.textContent = `好友邀請（${requestsIn.length}）`;
      listEl.appendChild(h);

      for(const r of requestsIn){
        const item = document.createElement("div");

        const ava = document.createElement("div");
        ava.className = "fd-ava";
        const img = document.createElement("img");
        img.alt = "";
        img.src = avatarUrlById(r.avatar);
        ava.appendChild(img);

        const meta = document.createElement("div");
        meta.className = "fd-meta";
        const name = document.createElement("div");
        name.className = "fd-name";
        name.textContent = r.name || ("#" + r.userId);
        const sub = document.createElement("div");
        sub.className = "fd-sub";
        sub.textContent = "想加你為好友";
        meta.appendChild(name); meta.appendChild(sub);

        const act = document.createElement("div");
        act.className = "fd-reqwrap";

        const ok = document.createElement("button");
        ok.type = "button";
        ok.className = "fd-reqbtn ok";
        ok.textContent = "確認";
        ok.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
          if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
          const uid = Number(r.userId)||0;
          sock.timeout(12000).emit("FRIEND_REQUEST_ACCEPT", { secret, userId: uid }, (err, res)=>{
            if(err || !res?.ok){ setHint(res?.error || "確認失敗"); return; }
            setHint("");
            fetchFriends();
          });
        });

        const no = document.createElement("button");
        no.type = "button";
        no.className = "fd-reqbtn no";
        no.textContent = "拒絕";
        no.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
          if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
          const uid = Number(r.userId)||0;
          sock.timeout(12000).emit("FRIEND_REQUEST_DECLINE", { secret, userId: uid }, (err, res)=>{
            if(err || !res?.ok){ setHint(res?.error || "拒絕失敗"); return; }
            setHint("");
            fetchFriends();
          });
        });

        act.appendChild(ok);
        act.appendChild(no);

        item.appendChild(ava);
        item.appendChild(meta);
        item.appendChild(act);

        listEl.appendChild(item);
      }

      const h2 = document.createElement("div");
      h2.className = "fd-sep";
      h2.textContent = "好友";
      listEl.appendChild(h2);
    }

    if(!friends.length && !(Array.isArray(requestsIn) && requestsIn.length)){
      const div = document.createElement("div");

      div.style.color="rgba(255,255,255,.65)";
      div.style.fontSize="11px";
      div.textContent = "目前沒有好友。你可以在上方輸入對方「名稱」送出好友邀請（對方確認後才會成為好友）。";
      listEl.appendChild(div);
      return;
    }

    const sorted = [...friends].sort((a,b)=> (b.online===true)-(a.online===true) || String(a.name).localeCompare(String(b.name),"zh-Hant"));
    for(const f of sorted){
      const item = document.createElement("div");
      item.className = "fd-item";
      item.dataset.uid = String(f.userId);

      const ava = document.createElement("div");
      ava.className = "fd-ava";
      const img = document.createElement("img");
      img.alt = "";
      img.src = avatarUrlById(f.avatar);
      ava.appendChild(img);

      const meta = document.createElement("div");
      meta.className = "fd-meta";

      name.textContent = f.name || ("#" + f.userId);
      const sub = document.createElement("div");
      sub.className = "fd-sub";
      const dot = document.createElement("span");
      dot.className = "fd-dot" + (f.online ? " on" : "");
      const sTxt = document.createElement("span");
      sTxt.textContent = f.online ? (f.activity || "線上") : "離線";
      sub.appendChild(dot); sub.appendChild(sTxt);

      meta.appendChild(name); meta.appendChild(sub);

      const badge = document.createElement("div");
      badge.className = "fd-badge";
      const u = unread.get(f.userId) || 0;
      if(u>0){

        badge.textContent = String(Math.min(99,u));
      }

      item.appendChild(ava);
item.appendChild(meta);

const moreWrap = document.createElement("div");
moreWrap.className = "fd-morewrap";

moreBtn.type = "button";

  function bringToFront(peerId){
    chatOrder = chatOrder.filter(x=>x!==peerId);
    chatOrder.push(peerId);
    // rebuild DOM order (row-reverse means last is closest to right)
    for(const id of chatOrder){
      const w = openChats.get(id);
      if(w && w.el) tray.appendChild(w.el);
    }
  }

  function updateWinHeader(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    const f = w.peer;
    const name = f?.name || ("#" + peerId);
    w.nameEl.textContent = name;
    w.statusEl.textContent = f?.online ? (f?.activity || "線上") : "離線";
    w.avaImg.src = avatarUrlById(f?.avatar || 1);
  }

  function setWinBadge(peerId, n){
    const w = openChats.get(peerId);
    if(!w) return;
    const v = Math.max(0, Number(n)||0);
    if(v<=0){
      w.badgeEl.style.display="none";
      w.badgeEl.textContent = "";
      return;
    }
    w.badgeEl.style.display="inline-flex";
    w.badgeEl.textContent = String(Math.min(99, v));
  }

  function scrollLogToBottom(peerId){
    const w = openChats.get(peerId);
    if(!w || !w.log) return;
    // 避免縮小狀態/剛開啟時高度尚未計算，使用 raf + setTimeout 雙保險
    try{ requestAnimationFrame(()=>{ try{ w.log.scrollTop = w.log.scrollHeight + 9999; }catch{} }); }catch{}
    setTimeout(()=>{ try{ w.log.scrollTop = w.log.scrollHeight + 9999; }catch{} }, 0);
  }

function appendMsgTo(peerId, m){
    const w = openChats.get(peerId);
    if(!w) return;
    const div = document.createElement("div");
    div.className = "fd-msg" + (Number(m.from) === Number(me.userId) ? " me" : "");
    div.textContent = m.body || "";
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = fmtTime(m.ts);
    div.appendChild(t);
    w.log.appendChild(div);
    scrollLogToBottom(peerId);
  }

  function loadHistory(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    w.log.innerHTML = "";
    sock.timeout(12000).emit("DM_HISTORY", { secret, withUserId: peerId, limit: 60 }, (err, res) => {
      if(err || !res?.ok){
        appendMsgTo(peerId, { from: peerId, body: "（讀取聊天記錄失敗）", ts: Date.now() });
        return;
      }
      const msgs = res.messages || [];
      for(const m of msgs) appendMsgTo(peerId, m);
    
      scrollLogToBottom(peerId);
  });
  }

  function sendMsg(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    const body = String(w.inp.value||"").trim();
    if(!body) return;
    w.inp.value = "";
    sock.timeout(12000).emit("DM_SEND", { secret, toUserId: peerId, body }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "送出失敗");
        return;
      }
      setHint("");
        if(res.message){
          __fdMarkRecent(res.message);
          appendMsgTo(peerId, res.message);
        }
    });
  }

  function closeChat(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    w.el.remove();
    openChats.delete(peerId);
    chatOrder = chatOrder.filter(x=>x!==peerId);
  }

  function toggleMin(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    w.minimized = !w.minimized;
    if(w.minimized) w.el.classList.add("minimized");
    else w.el.classList.remove("minimized");
    if(!w.minimized){
      scrollLogToBottom(peerId);
      setWinBadge(peerId, 0);
      w.el.classList.remove("unreadPulse");
      unread.set(peerId, 0);
      renderFriends();
      setTimeout(()=> w.inp?.focus(), 0);
    }
  }

  function createChatWindow(peer){
    const peerId = Number(peer.userId);
    const el = document.createElement("div");
    el.className = "fd-chatwin";
    el.dataset.peerId = String(peerId);

    el.innerHTML = `
      <div class="fd-chat-hd">
        <div class="fd-chat-peer" title="點一下可置頂">
          <div class="fd-ava" style="width:28px;height:28px;"><img class="fdChatAva" alt=""></div>
          <div class="meta" style="min-width:0;">
            <div class="n fdChatName">—</div>
            <div class="s fdChatStatus">—</div>
          </div>
        </div>
        <div class="fd-chat-actions">
          <span class="fd-chat-badge">0</span>
          <button class="fd-btn fdMin" title="縮小/還原">—</button>
          <button class="fd-btn fdClose" title="關閉聊天">✕</button>
        </div>
      </div>
      <div class="fd-chat-log"></div>
      <div class="fd-chat-in">
        <input class="fd-inp fdInp" placeholder="輸入訊息…（Enter 送出）" />
        <button class="fd-send fdSend">送出</button>
      </div>
    `;

    const log = el.querySelector(".fd-chat-log");
    const inp = el.querySelector(".fdInp");
    const sendBtn = el.querySelector(".fdSend");
    const closeBtn = el.querySelector(".fdClose");
    const minBtn = el.querySelector(".fdMin");
    const badgeEl = el.querySelector(".fd-chat-badge");

    const avaImg = el.querySelector(".fdChatAva");
    const nameEl = el.querySelector(".fdChatName");
    const statusEl = el.querySelector(".fdChatStatus");

    // wire
    sendBtn.addEventListener("click", ()=> sendMsg(peerId));
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") sendMsg(peerId); });
    closeBtn.addEventListener("click", ()=> closeChat(peerId));
    minBtn.addEventListener("click", ()=> toggleMin(peerId));
    el.querySelector(".fd-chat-peer")?.addEventListener("click", ()=>{
      bringToFront(peerId);
      if(openChats.get(peerId)?.minimized) toggleMin(peerId);
      setTimeout(()=> inp?.focus(), 0);
    });

    openChats.set(peerId, {
      peer,
      el, log, inp,
      avaImg, nameEl, statusEl,
      badgeEl,
      minimized:false
    });

    updateWinHeader(peerId);
    setWinBadge(peerId, 0);
    return el;
  }

  function openChat(peer){
    const peerId = Number(peer.userId);
    unread.set(peerId, 0);
    renderFriends();

    // 使用者主動開啟聊天 -> 視為已讀，停止提醒動畫
    stopUnreadPulse(peerId);

    if(openChats.has(peerId)){
      // restore + focus + bring front
      bringToFront(peerId);
      const w = openChats.get(peerId);
      w.peer = peer;
      updateWinHeader(peerId);
      if(w.minimized) toggleMin(peerId);
      setWinBadge(peerId, 0);
      setTimeout(()=> w.inp?.focus(), 0);
      return;
    }

    // cap windows like LoL (avoid overflow)
    const MAX_OPEN = 4;
    if(chatOrder.length >= MAX_OPEN){
      const kick = chatOrder.shift();
      if(kick != null) closeChat(kick);
    }

    const el = createChatWindow(peer);
    tray.appendChild(el);
    chatOrder.push(peerId);

    bringToFront(peerId);
    loadHistory(peerId);
    setTimeout(()=> openChats.get(peerId)?.inp?.focus(), 0);
  }

  function startUnreadPulse(peerId){
    const w = openChats.get(peerId);
    if(!w?.el) return;
    w.el.classList.add("unreadPulse");
  }
  function stopUnreadPulse(peerId){
    const w = openChats.get(peerId);
    if(!w?.el) return;
    w.el.classList.remove("unreadPulse");
  }

  // 當收到未讀訊息時：自動開「縮小聊天室」並慢慢忽暗忽明提醒
  function openChatAuto(peerId){
    peerId = Number(peerId);
    if(!Number.isFinite(peerId) || peerId<=0) return;

    const peer =
      friends.find(x => Number(x.userId) === peerId) ||
      { userId: peerId, name: "好友", avatar: 1, online: false };

    if(openChats.has(peerId)){
      const w = openChats.get(peerId);
      w.peer = peer;
      updateWinHeader(peerId);

      if(!w.minimized) toggleMin(peerId);

      const cnt = Math.max(1, Number(unread.get(peerId)||0) || 0);
      setWinBadge(peerId, cnt);
      startUnreadPulse(peerId);
      return;
    }

    const MAX_OPEN = 4;
    if(chatOrder.length >= MAX_OPEN){
      const kick = chatOrder.shift();
      if(kick != null) closeChat(kick);
    }

    const el = createChatWindow(peer);
    tray.appendChild(el);
    chatOrder.push(peerId);

    bringToFront(peerId);

    const w = openChats.get(peerId);
    if(w && !w.minimized) toggleMin(peerId);

    loadHistory(peerId);

    const cnt = Math.max(1, Number(unread.get(peerId)||0) || 0);
    setWinBadge(peerId, cnt);
    startUnreadPulse(peerId);
  }


  // click anywhere on collapsed dock to expand
  dock.addEventListener("click", (e) => {
    if(dock.classList.contains("collapsed")){
      if(e.target && (e.target.id === "fdMinBtn")) return;
      dock.classList.remove("collapsed");
      try{ localStorage.setItem("op_fdock_collapsed", "0"); }catch{}
      updateDockMinIcon();
    }
  });

  minBtn.addEventListener("click", () => {
    dock.classList.toggle("collapsed");
    updateDockMinIcon();
    renderMeMini();
    try{ localStorage.setItem("op_fdock_collapsed", dock.classList.contains("collapsed") ? "1" : "0"); }catch{}
  });

  addBtn.addEventListener("click", () => {
    const name = String(addInp.value||"").trim();
    if(!name) return;
    addInp.value = "";
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("FRIEND_ADD_BY_NAME", { secret, name }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "加入失敗");
        return;
      }
      setHint("");
      fetchFriends();
    });
  });

  addInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter") addBtn.click();
  });

  function wireSocketEvents(){
    if(!sock) return;

    // ✅ socket 可能自動重連；重連後要再做一次 SOCIAL_AUTH，否則伺服器不會把新 socket 記成在線上，DM_NEW 收不到
    if(!sock.__fdock_wired){
      sock.__fdock_wired = true;
      sock.on("connect", ()=>{
        try{
          ensureSecret();
          if(secret) socialAuth();
        }catch{}
      });
    }

    // ✅ 被擠下線：同帳號在別的裝置登入時，本頁要立刻退回 start（並清掉自動回房記錄）
    if(!sock.__session_kick_wired){
      sock.__session_kick_wired = true;
      sock.on("SESSION_KICK", (info)=>{
        try{
          localStorage.setItem("op_kicked_reason", String(info?.reason||"takeover"));
          // 清掉登入 + 回房資訊，避免無限回房
          [
            "op_secret","opSecret",
            "op_resume_roomId","op_resume_nonce","op_resume_gameId",
            "op_resume_endlock","op_resume_endAt","op_resume_done",
            "op_gameEndlock_roomId","op_gameEndlock_until"
          ].forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
        }catch{}
        try{ window.secret = ""; }catch{}
        try{ if(window.socket) window.socket.disconnect(); }catch{}
        location.href = "start.html?kicked=1";
      });
    }
    sock.on("FRIENDS_DIRTY", () => fetchFriends());
    sock.on("DM_NEW", (m) => {
      if(!isAuthed()) return;

      const fromId = Number(m.from);
      const peerId = (fromId === me.userId) ? Number(m.to) : fromId;

      // window open?
      if(openChats.has(peerId)){
        // 防止自己端重複：若此 DM_NEW 是我剛剛 DM_SEND 成功回傳的同一則，就略過
        if(Number(m?.from) === Number(me?.userId)){
          const sig = __fdMsgSig(m);
          const set = __fdRecentSig.get(peerId);
          if(set && set.has(sig)) return;
        }
        appendMsgTo(peerId, m);

        const w = openChats.get(peerId);
        // if minimized and message from other side -> show small badge on window
        if(w?.minimized && Number(m.from) !== Number(me.userId)){
          const cur = Number(w.badgeEl.textContent||"0") || 0;
          setWinBadge(peerId, cur + 1);
          startUnreadPulse(peerId);
        }else{
          setWinBadge(peerId, 0);
        }
      }else{
        // dock unread badge + 自動跳出縮小聊天室提醒
        if(Number(m.from) !== Number(me.userId)){
          const next = (unread.get(peerId)||0) + 1;
          unread.set(peerId, next);
          renderFriends();
          openChatAuto(peerId);
        }
      }
    });
  }

  // init
  ensureSocket();
  ensureSecret();
  wireSocketEvents();
  renderMeMini();
  socialAuth();
  setInterval(() => { if(secret) fetchFriends(); }, 12000);
})();
</script>

<style>
  #lobbyInviteBack{ display:none; position:fixed; inset:0; z-index:260; background:rgba(0,0,0,.70); align-items:center; justify-content:center; }
  #lobbyInviteSheet{ width:min(560px, 92vw); background:rgba(20,26,31,.98); border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:18px 18px 14px; box-shadow:0 18px 40px rgba(0,0,0,.45); }
  #lobbyInviteSheet .hd{ display:flex; gap:12px; align-items:center; }
  #lobbyInviteSheet .ava{ width:56px; height:56px; border-radius:14px; overflow:hidden; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); flex:0 0 auto; }
  #lobbyInviteSheet .ava img{ width:100%; height:100%; object-fit:cover; }
  #lobbyInviteSheet .ttl{ font-weight:800; font-size:18px; letter-spacing:.5px; }
  #lobbyInviteSheet .sub{ margin-top:2px; font-size:13px; color:rgba(255,255,255,.72); }
  #lobbyInviteSheet .meta{ margin-top:14px; padding:10px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.04); font-size:13px; color:rgba(255,255,255,.86); }
  #lobbyInviteSheet .row{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  #lobbyInviteSheet .btnx{ flex:1 1 140px; border-radius:14px; padding:10px 12px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#fff; font-weight:700; cursor:pointer; }
  #lobbyInviteSheet .btnx:hover{ background:rgba(255,255,255,.10); }
  #lobbyInviteSheet .btnx.ok{ border-color:rgba(120,255,170,.40); background:rgba(120,255,170,.12); }
  #lobbyInviteSheet .btnx.no{ border-color:rgba(255,120,120,.40); background:rgba(255,120,120,.12); }
  #lobbyInviteSheet .btnx.mute{ border-color:rgba(160,160,255,.45); background:rgba(160,160,255,.12); }
  #lobbyInviteSheet .small{ margin-top:10px; font-size:11px; color:rgba(255,255,255,.55); text-align:right; }
</style>

<div id="lobbyInviteBack" aria-hidden="true">
  <div id="lobbyInviteSheet" role="dialog" aria-label="lobby-invite">
    <div class="hd">
      <div class="ava"><img id="lobbyInviteAva" alt=""></div>
      <div>
        <div class="ttl" id="lobbyInviteTitle">遊戲邀請</div>
        <div class="sub" id="lobbyInviteSub">—</div>
      </div>
    </div>
    <div class="meta" id="lobbyInviteMeta">—</div>
    <div class="row">
      <button class="btnx ok" id="lobbyInviteOk" type="button">確認加入</button>
      <button class="btnx no" id="lobbyInviteNo" type="button">拒絕</button>
      <button class="btnx mute" id="lobbyInviteMute" type="button">暫停 5 分鐘</button>
    </div>
    <div class="small">（邀請有效時間：2 分鐘）</div>
  </div>
</div>

<script>
(function(){
  function q(id){ return document.getElementById(id); }
  const back = q('lobbyInviteBack');
  const ava  = q('lobbyInviteAva');
  const sub  = q('lobbyInviteSub');
  const meta = q('lobbyInviteMeta');
  const bOk  = q('lobbyInviteOk');
  const bNo  = q('lobbyInviteNo');
  const bMu  = q('lobbyInviteMute');

  let curInvite = null;

  function avatarUrlById(id){
    const n = Math.max(1, Math.min(2000, Number(id)||1));
    return `images/avatars/${n}.webp`;
  }

  function hide(){
    curInvite = null;
    if(back){ back.style.display='none'; back.setAttribute('aria-hidden','true'); }
  }

  function show(inv){
    if(!inv) return;
    curInvite = inv;
    if(ava) ava.src = avatarUrlById(inv.fromAvatar);
    if(sub) sub.textContent = `${String(inv.fromName||'好友')} 邀請你加入等待室`;
    if(meta) meta.textContent = `房號：${String(inv.roomId||'—')}`;
    if(back){ back.style.display='flex'; back.setAttribute('aria-hidden','false'); }
  }

  // 給 socket.on('EMIT') 呼叫用（若先收到，會暫存在 __pendingLobbyInvites）
  window.__onLobbyInvite = function(inv){
    try{ show(inv); }catch(e){ console.warn('[invite show failed]', e); }
  };

  // 若邀請在本 script 載入前就先收到：補撈最後一筆直接顯示
  try{
    const list = window.__pendingLobbyInvites;
    if(Array.isArray(list) && list.length){
      const last = list[list.length-1];
      window.__pendingLobbyInvites = [];
      show(last);
    }
  }catch(_){ }

  back && back.addEventListener('click', (e)=>{ if(e.target===back) hide(); });

  function respond(action){
    const inv = curInvite;
    if(!inv) return hide();
    const sec = String(localStorage.getItem('opSecret')||'').trim();
    const sock = window.socket;
    if(!sec || !sock){
      hide();
      alert('尚未登入或 socket 未連線');
      return;
    }
    sock.timeout(12000).emit('LOBBY_INVITE_RESPOND', { secret: sec, inviteId: inv.inviteId, action }, (err, res)=>{
      if(err || !res?.ok){
        hide();
        alert(res?.error || '回覆邀請失敗');
        return;
      }
      if(action==='accept'){
        const roomId = String(res.roomId || inv.roomId || '').trim();
        if(roomId){
          try{
            const prof = window.__cloudProfile;
            const name = String(prof?.playerName || window.__lobby?.me?.name || 'P').trim() || 'P';
            const avatar = Number(prof?.playerAvatar || window.__lobby?.me?.avatar || 1) || 1;
            const title = String(prof?.equippedTitle || '').trim();
            const tier  = Number(prof?.equippedTier || 1) || 1;
            if(typeof window.__enterRoom === 'function'){
              sock.emit('JOIN_ROOM', { roomId, displayName: name, avatar, title, titleTier: tier, secret: sec });
              window.__enterRoom(roomId, { host:false });
            }else{
              // 其他頁沒有等待室 UI：把 roomId 存起來，跳回 start.html 由 start 自動加入
              try{
                sessionStorage.setItem('op_pending_join_room', roomId);
                sessionStorage.setItem('op_pending_join_via', (location.pathname.split('/').pop()||''));
              }catch(_){}
              location.href = 'start.html';
            }
          }catch(e){
            console.warn('[invite accept join failed]', e);
          }
        }
      }
      hide();
    });
  }

  bOk && bOk.addEventListener('click', ()=> respond('accept'));
  bNo && bNo.addEventListener('click', ()=> respond('reject'));
  bMu && bMu.addEventListener('click', ()=> respond('mute5'));
})();
</script>
