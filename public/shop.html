<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>商店｜偉大航道爭霸戰</title>
  <style>
    :root{
      --bg:#0b1014; --card:#141a1f; --line:#2a3038;
      --text:#e9f0f8; --muted:#9aa5b2;
      --gold:#ffd36b; --gold2:#ffb84a;
      --good:#34d399; --bad:#fb7185;
      --shadow: 0 10px 28px rgba(0,0,0,.38);
      --r:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC",sans-serif;
      background: radial-gradient(circle at 25% 15%, rgba(255,211,107,.10), transparent 55%),
                  radial-gradient(circle at 80% 85%, rgba(0,158,255,.07), transparent 55%),
                  linear-gradient(180deg,#070a0e 0%, #0b1014 40%, #080b10 100%);
      color:var(--text);
    }
    a{color:inherit}
    .top{
      position:sticky; top:0; z-index:30;
      backdrop-filter: blur(10px);
      background: rgba(14,18,24,.72);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .wrap{max-width:1100px;margin:0 auto;padding:14px 16px;}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    .brand{
      display:flex;align-items:center;gap:10px;
      font-weight:900; letter-spacing:.6px;
    }
    .brand .dot{
      width:12px;height:12px;border-radius:999px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      box-shadow:0 0 0 3px rgba(255,211,107,.12);
    }
    .btn{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text); cursor:pointer;
      transition: .15s;
      user-select:none;
    }
    .btn:hover{background:rgba(255,255,255,.12)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background: rgba(255,211,107,.16);
      border-color: rgba(255,211,107,.35);
      color:#1b1408;
      font-weight:900;
    }
    .btn.ghost{ background: transparent; }
    .btn[disabled]{opacity:.55; cursor:not-allowed; transform:none}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-size:12px;
    }
    .coins{
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:.2px;
    }
    .status{ font-size:12px; color:var(--muted); }

    .panel{
      margin-top:10px;
      background: rgba(20,24,31,.78);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      padding:12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    }
    .title{
      font-weight:1000; font-size:18px;
      display:flex; align-items:center; gap:10px;
    }
    .sub{
      font-size:12px; color:var(--muted);
      margin-top:2px;
    }
    .controls{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .tabs{
      display:inline-flex; gap:6px; padding:4px;
      border-radius:999px;
      background: rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
    }
    .tab{
      border:none; cursor:pointer;
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      background: transparent;
      color: var(--muted);
    }
    .tab.active{
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      color:#1b1408;
      font-weight:900;
    }
    .input{
      display:flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
    }
    .input input{
      border:none; outline:none; background:transparent; color:var(--text);
      width:180px;
    }
    .select{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color:var(--text);
      outline:none;
    }

    .grid{
      padding:14px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    @media (max-width: 640px){ .grid{grid-template-columns: 1fr;} .input input{width:140px;} }

    .item{
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      overflow:hidden;
      display:flex; flex-direction:column;
      min-height: 210px;
    }
    .thumb{
      position:relative;
      height: 140px;
      background: radial-gradient(circle at 50% 30%, rgba(255,211,107,.10), rgba(0,0,0,.0) 60%),
                  linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.0));
      display:flex; align-items:center; justify-content:center;
    }
    .thumb img{
      width: 92px; height: 92px;
      border-radius: 18px;
      object-fit:cover;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      box-shadow: 0 10px 20px rgba(0,0,0,.35);
    }
    .rarity{
      position:absolute; left:10px; top:10px;
      font-size:11px; font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.32);
      color: #e8eef7;
    }
    .rarity.r-rare{ border-color: rgba(255,211,107,.40); background: rgba(255,211,107,.10); color: #ffe8b6; }
    .rarity.r-epic{ border-color: rgba(147,96,255,.40); background: rgba(147,96,255,.10); color: #f1e7ff; }
    .rarity.r-legend{ border-color: rgba(255,184,74,.55); background: rgba(255,184,74,.14); color: #fff2cc; box-shadow: 0 0 18px rgba(255,211,107,.22); }
    .rarity.r-mythic{ border-color: rgba(255, 70, 220, .55); background: rgba(255, 70, 220, .14); color: #ffe3fb; box-shadow: 0 0 18px rgba(255, 70, 220, .22); }

    .ownedTag{
      position:absolute; right:10px; top:10px;
      font-size:11px; font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(52,211,153,.40);
      background: rgba(52,211,153,.10);
      color: #b9f6dd;
    }
    .body{
      padding:12px 12px 10px;
      display:flex; flex-direction:column; gap:8px;
      flex:1;
    }
    .name{font-weight:1000}
    .desc{font-size:12px;color:rgba(233,240,248,.75);line-height:1.5; min-height: 34px;}
    .metaRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;}
    .price{font-weight:1000; color:var(--gold); font-variant-numeric:tabular-nums;}
    .actions{display:flex; gap:8px; justify-content:flex-end;}
    .btn.small{padding:8px 10px;border-radius:12px;font-size:13px}
    .btn.buy{
      background: linear-gradient(135deg,var(--gold),var(--gold2));
      border-color: rgba(255,211,107,.55);
      color:#1b1408;
      font-weight:1000;
    }
    .btn.buy:hover{filter:brightness(1.05)}
    .hint{
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.06);
      color: var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    /* modal */
    .modalBack{
      position:fixed; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background: rgba(0,0,0,.70);
      padding: 18px;
    }
    .modalBack.show{display:flex}
    .modal{
      width: min(880px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(20,24,31,.90);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .modalTop{
      padding:12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .modalTop .t{font-weight:1000}
    .modalBody{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap: 14px;
      padding: 14px;
    }
    @media (max-width: 720px){ .modalBody{grid-template-columns: 1fr;} }
    .preview{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      display:flex; align-items:center; justify-content:center;
      padding: 14px;
      min-height: 220px;
    }
    .preview img{width:200px;height:200px;border-radius:22px;object-fit:cover;border:1px solid rgba(255,255,255,.16);}
    .detail h3{margin:0 0 8px;font-weight:1000}
    .detail p{margin:0;color:rgba(233,240,248,.78);font-size:13px;line-height:1.7}
    .kv{display:grid;grid-template-columns: 90px 1fr;gap:8px;margin-top:10px;font-size:13px}
    .kv div{padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
    .kv .k{color:var(--muted)}
    .modalActions{display:flex; gap:8px; justify-content:flex-end; padding: 0 14px 14px;}
  </style>
</head>
<body>

  <div class="top">
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <div style="font-size:14px">偉大航道爭霸戰｜商店</div>
            <div class="status" id="status">連線中…</div>
          </div>
        </div>

        <div class="row" style="gap:8px">
          <span class="pill" title="雲端金幣（以 stats.client.totals.coins 為準）">
            <span class="coins">金幣：<span id="coins">0</span></span>
          </span>
          <button class="btn" id="btnBack">← 回個人頁</button>
          <button class="btn ghost" id="btnReload" title="重新從雲端讀取">↻ 重新同步</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="panelHead">
        <div>
          <div class="title">商店（用累計金幣購買解鎖）</div>
          <div class="sub">購買會扣 <b>雲端累計金幣</b>，解鎖紀錄寫入 <code>stats.client.shop</code>。</div>
        </div>

        <div class="controls">
          <div class="tabs" role="tablist" aria-label="類別">
            <button class="tab active" data-tab="avatar" role="tab">頭像</button>
            <button class="tab" data-tab="wall" role="tab">牆面</button>
            <button class="tab" data-tab="item" role="tab">道具</button>
          </div>

          <label class="input" title="搜尋名稱/描述">
            🔎 <input id="q" placeholder="搜尋…" autocomplete="off"/>
          </label>

          <select id="sort" class="select" title="排序">
            <option value="priceAsc">價格：低 → 高</option>
            <option value="priceDesc">價格：高 → 低</option>
            <option value="rarityDesc">稀有度：高 → 低</option>
            <option value="ownedLast">已擁有：排後面</option>
          </select>
        </div>
      </div>

      <div id="grid" class="grid"></div>

      <div class="hint" id="hint">
        提示：若你覺得商店顯示金幣不對，通常是因為舊版商店讀的是 <code>stats.coins</code>，但你現在專案的金幣已統一累積在 <code>stats.client.totals.coins</code>。
        這版已修正並自動做相容轉換（必要時會把舊欄位同步回新欄位）。
      </div>
    </div>

    <div style="margin-top:10px;font-size:12px;color:var(--muted)" id="toast"></div>
  </div>

  <!-- Detail / Buy Modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="商品詳情">
    <div class="modal">
      <div class="modalTop">
        <div class="t" id="mTitle">商品</div>
        <button class="btn" id="mClose">✕</button>
      </div>
      <div class="modalBody">
        <div class="preview"><img id="mImg" alt="preview"/></div>
        <div class="detail">
          <h3 id="mName">—</h3>
          <p id="mDesc">—</p>
          <div class="kv">
            <div class="k">類別</div><div id="mType">—</div>
            <div class="k">稀有度</div><div id="mRarity">—</div>
            <div class="k">價格</div><div id="mPrice">—</div>
            <div class="k">狀態</div><div id="mOwned">—</div>
          </div>
        </div>
      </div>
      <div class="modalActions">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn buy" id="mBuy">購買</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ========================
    //  Cloud Shop (v2)
    //  - coins source of truth: stats.client.totals.coins
    //  - owned source of truth: stats.client.shop
    //  - flags are sold in ITEM tab, but stored in shop.ownedFlags (numbers)
    // ========================

    // server url
    const serverURL =
      new URLSearchParams(location.search).get('server')
      || "https://onepiece-card-online.onrender.com";

    // auth
    const secret = localStorage.getItem('opSecret');
    if(!secret){
      alert('尚未登入/沒有 secret，請先回主畫面登入。');
      location.href = 'start.html';
    }

    // UI helpers
    const $ = (id)=>document.getElementById(id);
    const esc = (s)=>String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const fmt = (n)=> (Number(n)||0).toLocaleString('en-US');
    const clampInt = (n, a, b)=> Math.max(a, Math.min(b, Math.floor(Number(n)||0)));
    const toast = (msg)=>{ $('toast').textContent = msg || ''; };

    // ===== rarity / price =====
    function rarityRank(r){
      return ({common:1, rare:2, epic:3, legend:4, mythic:5})[r] || 1;
    }
    function rarityLabel(r){
      return ({common:'普通', rare:'稀有', epic:'史詩', legend:'傳說', mythic:'神話'})[r] || '普通';
    }
    function rarityClass(r){
      if(r==='mythic') return 'r-mythic';
      if(r==='legend') return 'r-legend';
      if(r==='epic')   return 'r-epic';
      if(r==='rare')   return 'r-rare';
      return '';
    }
    const PRICE_BY_RARITY = {
      common: 5,
      rare: 10,
      epic: 18,
      legend: 25,
      mythic: 35,
    };
    function priceOf(it){
      if(Number.isFinite(Number(it.price))) return Number(it.price);
      return PRICE_BY_RARITY[it.rarity] ?? 5;
    }

    function typeLabel(t){
      return ({avatar:'頭像', wall:'牆面', item:'道具'})[t] || t;
    }

    // ========================
    // 商品（你之後要賣的就改這個陣列）

    // kind: 'flag' for pirate flags

      { id:'ava-36', type:'avatar', key:36, name:'鑽石裘斯', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },
      { id:'ava-37', type:'avatar', key:37, name:'暴走喬巴', desc:'商店限定頭像（購買後可在個人頁面切換）', rarity:'common' },

      { id:'flag-4',  type:'item', kind:'flag', key:4,  name:'海賊旗 #4',  desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'common' },

      { id:'flag-6',  type:'item', kind:'flag', key:6,  name:'海賊旗 #6',  desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'rare' },
      { id:'flag-7',  type:'item', kind:'flag', key:7,  name:'海賊旗 #7',  desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'rare' },

      { id:'flag-9',  type:'item', kind:'flag', key:9,  name:'海賊旗 #9',  desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'epic' },
      { id:'flag-10', type:'item', kind:'flag', key:10, name:'海賊旗 #10', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'epic' },
      { id:'flag-11', type:'item', kind:'flag', key:11, name:'海賊旗 #11', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'legend' },
      { id:'flag-12', type:'item', kind:'flag', key:12, name:'海賊旗 #12', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'legend' },
      { id:'flag-13', type:'item', kind:'flag', key:13, name:'海賊旗 #13', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'legend' },
      { id:'flag-14', type:'item', kind:'flag', key:14, name:'海賊旗 #14', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'legend' },
      { id:'flag-15', type:'item', kind:'flag', key:15, name:'海賊旗 #15', desc:'懸賞牆專用海賊旗（購買後可在個人頁面套用）', rarity:'legend' },
    ];

    function imgUrl(it){
      if(it.type==='avatar') return `images/avatars/${it.key}.webp`;
      if(it.type==='wall')   return `images/walls/${it.key}.webp`;
      // flags live in images/flags
      if(it.type==='item' && it.kind==='flag') return `images/flags/${it.key}.webp`;
      // other items default
      return `images/items/${it.key}.webp`;
    }

    // ===== Cloud state =====
    let socket = null;
    let profile = null; // player_profiles row
    let saving = false;

    // ===== Normalization (match your project schema) =====
    function defaultClient(){
      return {
        version: 2,
        player: { name:'', avatar:'' },
        totals: { games:0, wins:0, coins:0 },
        recent: [],
        deluxeUnlocked: [],
        titles: { owned: [], equipped:'', equippedTier: 1 },
        bountyPosters: [],
        _appliedMatchKeys: [],
        shop: { ownedAvatars: [], ownedWalls: [], ownedItems: [], ownedFlags: [] }
      };
    }

    function ensureClient(){
      if(!profile) return;
      if(!profile.stats || typeof profile.stats!=='object') profile.stats = {};
      if(!profile.stats.client || typeof profile.stats.client!=='object') profile.stats.client = {};
      const base = defaultClient();

      const c = profile.stats.client;
      profile.stats.client = {
        ...base,
        ...c,
        player: { ...base.player, ...(c.player||{}) },
        totals: { ...base.totals, ...(c.totals||{}) },
        titles: { ...base.titles, ...(c.titles||{}) },
        shop:   { ...base.shop,   ...(c.shop||{}) }
      };

      // arrays ensure
      const s = profile.stats.client.shop;
      if(!Array.isArray(s.ownedAvatars)) s.ownedAvatars = [];
      if(!Array.isArray(s.ownedWalls))   s.ownedWalls   = [];
      if(!Array.isArray(s.ownedItems))   s.ownedItems   = [];
      if(!Array.isArray(s.ownedFlags))   s.ownedFlags   = [];

      // backward compat (old shop wrote stats.coins)
      const legacyCoins = Number(profile.stats.coins || 0) || 0;
      const newCoins = Number(profile.stats.client.totals.coins || 0) || 0;
      if(legacyCoins > 0 && newCoins <= 0){
        profile.stats.client.totals.coins = legacyCoins;
      }
      // keep legacy in sync (helps old pages)
      profile.stats.coins = Number(profile.stats.client.totals.coins || 0) || 0;
    }

    function coins(){
      ensureClient();
      return clampInt(profile?.stats?.client?.totals?.coins, 0, 1e12);
    }
    function setCoins(v){
      ensureClient();
      profile.stats.client.totals.coins = clampInt(v, 0, 1e12);
      profile.stats.coins = Number(profile.stats.client.totals.coins || 0) || 0;
    }

    function shopState(){
      ensureClient();
      return profile.stats.client.shop;
    }

    function isFlag(it){ return it?.type==='item' && it?.kind==='flag'; }

    function isOwned(it){
      const s = shopState();
      if(it.type==='avatar') return s.ownedAvatars.includes(Number(it.key));
      if(it.type==='wall')   return s.ownedWalls.includes(Number(it.key));
      if(isFlag(it))         return s.ownedFlags.includes(Number(it.key));
      return s.ownedItems.includes(String(it.key));
    }

    function own(it){
      const s = shopState();
      if(it.type==='avatar'){
        const k = Number(it.key);
        if(!s.ownedAvatars.includes(k)) s.ownedAvatars.push(k);
      }else if(it.type==='wall'){
        const k = Number(it.key);
        if(!s.ownedWalls.includes(k)) s.ownedWalls.push(k);
      }else if(isFlag(it)){
        const k = Number(it.key);
        if(!s.ownedFlags.includes(k)) s.ownedFlags.push(k);
      }else{
        const k = String(it.key);
        if(!s.ownedItems.includes(k)) s.ownedItems.push(k);
      }
    }

    // ===== Cloud API =====
    function profileGet(){
      return new Promise((resolve, reject)=>{
        socket.timeout(8000).emit('PROFILE_GET', { secret }, (err, res)=>{
          if(err) return reject(err);
          if(!res || !res.ok) return reject(res?.error || 'PROFILE_GET failed');
          profile = res.profile || {};
          ensureClient();
          resolve(profile);
        });
      });
    }

    function profileUpdate(patch){
      return new Promise((resolve, reject)=>{
        socket.timeout(8000).emit('PROFILE_UPDATE', { secret, patch }, (err, res)=>{
          if(err) return reject(err);
          if(!res || !res.ok) return reject(res?.error || 'PROFILE_UPDATE failed');
          if(res.profile) profile = res.profile;
          ensureClient();
          resolve(res);
        });
      });
    }

    async function saveCloud(reason){
      ensureClient();
      return await profileUpdate({
        stats: {
          ...(profile.stats || {}),
          coins: Number(profile.stats.coins || 0),
          client: profile.stats.client
        }
      });
    }

    // ===== UI state =====
    let curTab = 'avatar';
    let curPick = null;

    function applyCoinsUI(){
      $('coins').textContent = fmt(coins());
    }

    function render(){
      applyCoinsUI();

      const q = String($('q').value || '').trim().toLowerCase();
      const sort = $('sort').value;

      // filter
      let list = SHOP
        .filter(it => it.type === curTab)
        .map(it => ({ ...it, price: priceOf(it) }));

      if(q){
        list = list.filter(it =>
          (it.name && it.name.toLowerCase().includes(q)) ||
          (it.desc && it.desc.toLowerCase().includes(q)) ||
          String(it.key).includes(q)
        );
      }

      // sort
      list.sort((a,b)=>{
        const ao = isOwned(a), bo = isOwned(b);
        if(sort === 'ownedLast'){
          if(ao !== bo) return ao ? 1 : -1;
          return a.price - b.price;
        }
        if(sort === 'priceAsc')  return a.price - b.price;
        if(sort === 'priceDesc') return b.price - a.price;
        if(sort === 'rarityDesc'){
          const rr = rarityRank(b.rarity) - rarityRank(a.rarity);
          if(rr) return rr;
          return b.price - a.price;
        }
        return 0;
      });

      const grid = $('grid');
      grid.innerHTML = '';

      if(!list.length){
        grid.innerHTML = `<div style="grid-column:1/-1; padding:10px; color:var(--muted);">沒有符合的商品。</div>`;
        return;
      }

      for(const it of list){
        const owned = isOwned(it);
        const afford = coins() >= it.price;

        const el = document.createElement('div');
        el.className = 'item';

        el.innerHTML = `
          <div class="thumb">
            <span class="rarity ${rarityClass(it.rarity)}">${rarityLabel(it.rarity)}</span>
            ${owned ? `<span class="ownedTag">已擁有</span>` : ``}
            <img src="${esc(imgUrl(it))}" alt="${esc(it.name)}" loading="lazy"/>
          </div>
          <div class="body">
            <div class="name">${esc(it.name)}</div>
            <div class="desc">${esc(it.desc||'')}</div>
            <div class="metaRow">
              <div class="price">${fmt(it.price)} 金幣</div>
              <div class="actions">
                <button class="btn small" data-act="detail">查看</button>
                <button class="btn small buy" data-act="buy" ${owned || saving || !afford ? 'disabled' : ''}>
                  ${owned ? '已擁有' : (afford ? '購買' : '金幣不足')}
                </button>
              </div>
            </div>
          </div>
        `;

        el.querySelector('[data-act="detail"]').onclick = ()=> openModal(it);
        const buyBtn = el.querySelector('[data-act="buy"]');
        buyBtn.onclick = ()=> openModal(it, {focusBuy:true});

        grid.appendChild(el);
      }
    }

    // ===== modal =====
    function openModal(it, opt={}){
      curPick = { ...it, price: priceOf(it) };
      const owned = isOwned(curPick);

      $('mTitle').textContent = `商品詳情`;
      $('mImg').src = imgUrl(curPick);
      $('mName').textContent = curPick.name;
      $('mDesc').textContent = curPick.desc || '';
      $('mType').textContent = typeLabel(curPick.type);
      $('mRarity').textContent = rarityLabel(curPick.rarity);
      $('mPrice').textContent = `${fmt(curPick.price)} 金幣`;
      $('mOwned').textContent = owned ? '已擁有' : '未擁有';

      const btn = $('mBuy');
      btn.disabled = saving || owned || coins() < curPick.price;
      btn.textContent = owned ? '已擁有' : (coins() < curPick.price ? '金幣不足' : '購買');

      $('modalBack').classList.add('show');
      if(opt.focusBuy && !btn.disabled) btn.focus();
    }

    function closeModal(){
      $('modalBack').classList.remove('show');
      curPick = null;
    }

    async function buyCurrent(){
      const it = curPick;
      if(!it || saving) return;
      if(isOwned(it)) return;
      if(coins() < it.price){ alert('金幣不足'); return; }

      const ok = confirm(`確定花 ${fmt(it.price)} 金幣購買「${it.name}」？`);
      if(!ok) return;

      saving = true;
      toast('儲存中…');

      try{
        setCoins(coins() - it.price);
        own(it);
        await saveCloud('shop-buy');
        toast(`已購買：${it.name} ✓`);
        closeModal();
      }catch(e){
        console.error(e);
        toast('儲存失敗：請檢查網路/登入狀態（已嘗試保護性回復）');
        try{ await profileGet(); }catch(_){}
      }finally{
        saving = false;
        render();
      }
    }

    // ===== events =====
    $('btnBack').onclick = ()=> location.href = 'profile.html';
    $('btnReload').onclick = async ()=>{
      if(!socket || saving) return;
      toast('重新同步中…');
      try{
        await profileGet();
        toast('已同步 ✓');
      }catch(e){
        console.error(e);
        toast('同步失敗，請重整或檢查登入');
      }finally{
        render();
      }
    };

    document.querySelectorAll('.tab').forEach(b=>{
      b.onclick = ()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        curTab = b.dataset.tab;
        render();
      };
    });

    $('q').addEventListener('input', ()=> render());
    $('sort').addEventListener('change', ()=> render());

    $('mClose').onclick = closeModal;
    $('mCancel').onclick = closeModal;
    $('mBuy').onclick = buyCurrent;
    $('modalBack').addEventListener('click', (e)=>{
      if(e.target === $('modalBack')) closeModal();
    });
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') closeModal();
    });

    // ===== init =====
    (function init(){
      socket = io(serverURL, { transports:['websocket'] });

      socket.on('connect', async ()=>{
        $('status').textContent = '已連線';
        toast('');
        try{
          await profileGet();
          // 如果發現舊 coins→新 coins 的提升，順便寫回（避免其他頁面顯示不一致）
          const legacy = Number(profile?.stats?.coins || 0) || 0;
          const now = Number(profile?.stats?.client?.totals?.coins || 0) || 0;
          if(legacy !== now){
            try{ await saveCloud('shop-migrate-coins'); }catch(_){}
          }
          render();
        }catch(e){
          console.error(e);
          $('status').textContent = '讀取雲端失敗';
          toast('讀取雲端失敗，請重整或檢查登入');
        }
      });

      socket.on('disconnect', ()=>{
        $('status').textContent = '已斷線';
      });
    })();
  </script>

  background:linear-gradient(180deg, rgba(45,131,255,.35), rgba(31,95,255,.18));
  border-color:rgba(45,131,255,.45);
}
#friendChatFloat .cf-time{
  font-size:11px;
  color:#93a3b7;
  margin:0 6px;
  white-space:nowrap;
}
#friendChatFloat .cf-foot{
  padding:10px;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  gap:8px;
}
#friendChatFloat .cf-text{

  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;

  outline:none;
}
#friendChatFloat .cf-send{
  padding:10px 12px;

#friendChatFloat .cf-send:hover{ filter:brightness(1.05); }

/* Minimized */
#friendChatFloat.minimized{ height:auto; width:360px; }
#friendChatFloat.minimized .cf-tabs,
#friendChatFloat.minimized .cf-body,
#friendChatFloat.minimized .cf-foot{ display:none; }
#friendChatFloat.minimized .cf-head{ border-bottom:none; }
</style>

<div id="friendDock">
  <div class="fd-card">
    <div class="fd-header" id="fdHeaderHit">
      <div class="fd-title" title="好友 / 私訊">
        <div class="dot"></div>
        <span>好友</span>
      </div>
      <div class="fd-actions">
        <button class="fd-btn" data-act="refresh" title="重新整理">⟳</button>
        <button class="fd-btn" data-act="add" title="加入好友">＋</button>
        <button class="fd-btn" data-act="toggle" title="縮小/展開">▣</button>
      </div>
      <div class="fd-miniBadge" id="fdMiniUnread">0</div>
    </div>

    <div class="fd-body" id="fdBody">
      <div class="fd-addrow" id="fdAddRow" style="display:none">
        <input class="fd-input" id="fdAddInput" placeholder="輸入好友名稱加入…"/>
        <button class="fd-primary" id="fdAddBtn">加入</button>
      </div>

      <div class="fd-list" id="fdList"></div>

      <div class="fd-hint" id="fdHint"></div>
    </div>
  </div>
</div>

<!-- Left floating chat -->
<div id="friendChatFloat">
  <div class="cf-card">
    <div class="cf-head" id="cfDragHandle">
      <div class="cf-left">
        <div class="cf-title" id="cfTitle">聊天</div>
        <div class="cf-totalUnread" id="cfTotalUnread">0</div>
      </div>
      <div class="cf-actions">
        <button class="cf-btn" id="cfMinBtn" title="縮小/展開">—</button>
        <button class="cf-btn" id="cfCloseBtn" title="關閉">✕</button>
      </div>
    </div>
    <div class="cf-tabs" id="cfTabs"></div>
    <div class="cf-body" id="cfBody"></div>
    <div class="cf-foot">
      <input class="cf-text" id="cfInput" placeholder="輸入訊息…（Enter 送出）"/>
      <button class="cf-send" id="cfSendBtn">送出</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== Helpers =====
  const $ = (id) => document.getElementById(id);
  const dock = $("friendDock");
  const fdList = $("fdList");
  const fdHint = $("fdHint");
  const fdAddRow = $("fdAddRow");
  const fdAddInput = $("fdAddInput");
  const fdAddBtn = $("fdAddBtn");
  const fdMiniUnread = $("fdMiniUnread");

  const chat = $("friendChatFloat");
  const cfTitle = $("cfTitle");
  const cfTotalUnread = $("cfTotalUnread");
  const cfTabs = $("cfTabs");
  const cfBody = $("cfBody");
  const cfInput = $("cfInput");
  const cfSendBtn = $("cfSendBtn");
  const cfMinBtn = $("cfMinBtn");
  const cfCloseBtn = $("cfCloseBtn");
  const cfDragHandle = $("cfDragHandle");

  const LS_TABS = "op_dm_tabs_v1";        // [{id,name,avatar}]
  const LS_ACTIVE = "op_dm_active_v1";    // friendId
  const LS_CHAT_OPEN = "op_dm_open_v1";   // "1"/"0"
  const LS_CHAT_MIN = "op_dm_min_v1";     // "1"/"0"
  const LS_CHAT_POS = "op_dm_pos_v1";     // {left,bottom,width,height}

  const state = {
    me: null,
    friends: [], // {user_id,name,avatar,online}
    unread: new Map(), // friendId -> count
    tabs: [], // {id,name,avatar}
    activeId: null,
    chatOpen: false,
    chatMin: false,
    // histories cache: friendId -> messages array
    history: new Map()
  };

  function getSecret(){
    return localStorage.getItem("opSecret") || localStorage.getItem("op_secret") || "";
  }
  function fmtTime(ts){
    try{
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      return `${hh}:${mm}`;
    }catch{ return ""; }
  }
  function safeText(s){
    return String(s ?? "");
  }

  function setHint(msg){
    fdHint.textContent = msg || "";
  }

  function totalUnread(){
    let t = 0;
    for (const v of state.unread.values()) t += (Number(v)||0);
    return t;
  }

  function renderMiniUnread(){
    const t = totalUnread();
    fdMiniUnread.textContent = String(t);
    if (dock.classList.contains("fd-collapsed")){
      fdMiniUnread.style.display = t > 0 ? "flex" : "none";
    } else {
      fdMiniUnread.style.display = "none";
    }
    // chat header badge
    cfTotalUnread.textContent = String(t);
    if (t > 0) chat.classList.add("has-unread");
    else chat.classList.remove("has-unread");
  }

  // ===== Dock collapse behavior =====
  function setDockCollapsed(v){
    dock.classList.toggle("fd-collapsed", !!v);
    localStorage.setItem("op_friends_dock_collapsed", v ? "1" : "0");
    renderMiniUnread();
  }
  (function initDockCollapsed(){
    const saved = localStorage.getItem("op_friends_dock_collapsed");
    setDockCollapsed(saved === "1");
    // click header when collapsed to expand
    $("fdHeaderHit").addEventListener("click", (e) => {
      if (!dock.classList.contains("fd-collapsed")) return;
      const actBtn = e.target?.closest?.("button");
      if (actBtn) return;
      setDockCollapsed(false);
    });
  })();

  // ===== Chat window open/min/pos persistence =====
  function applyChatPos(){
    try{
      const raw = localStorage.getItem(LS_CHAT_POS);
      if (!raw) return;
      const p = JSON.parse(raw);
      if (!p) return;
      if (Number.isFinite(p.left)) chat.style.left = p.left + "px";
      if (Number.isFinite(p.bottom)) chat.style.bottom = p.bottom + "px";
      if (Number.isFinite(p.width)) chat.style.width = Math.max(300, p.width) + "px";
      if (Number.isFinite(p.height)) chat.style.height = Math.max(260, p.height) + "px";
    }catch{}
  }
  function saveChatPos(){
    try{
      const rect = chat.getBoundingClientRect();
      const p = { left: rect.left, bottom: (window.innerHeight - rect.bottom), width: rect.width, height: rect.height };
      localStorage.setItem(LS_CHAT_POS, JSON.stringify(p));
    }catch{}
  }
  function setChatOpen(v){
    state.chatOpen = !!v;
    chat.style.display = state.chatOpen ? "block" : "none";
    localStorage.setItem(LS_CHAT_OPEN, state.chatOpen ? "1" : "0");
    if (state.chatOpen) {
      applyChatPos();
      // ensure within viewport
      clampChatIntoViewport();
      requestAnimationFrame(() => cfInput?.focus?.());
    }
  }
  function setChatMin(v){
    state.chatMin = !!v;
    chat.classList.toggle("minimized", state.chatMin);
    localStorage.setItem(LS_CHAT_MIN, state.chatMin ? "1" : "0");
    // when minimized, keep unread badge visible
    renderMiniUnread();
  }
  function clampChatIntoViewport(){
    try{
      const rect = chat.getBoundingClientRect();
      let left = rect.left;
      let top = rect.top;
      const maxLeft = Math.max(8, window.innerWidth - rect.width - 8);
      const maxTop  = Math.max(8, window.innerHeight - rect.height - 8);
      left = Math.min(Math.max(8, left), maxLeft);
      top  = Math.min(Math.max(8, top), maxTop);
      chat.style.left = left + "px";
      // convert top->bottom for our positioning
      const bottom = Math.max(8, window.innerHeight - (top + rect.height));
      chat.style.bottom = bottom + "px";
      saveChatPos();
    }catch{}
  }
  (function initChatPersistence(){
    applyChatPos();
    const open = localStorage.getItem(LS_CHAT_OPEN) === "1";
    const min = localStorage.getItem(LS_CHAT_MIN) === "1";
    setChatOpen(open);
    setChatMin(min);
  })();

  // ===== Tabs persistence =====
  function loadTabs(){
    try{
      const raw = localStorage.getItem(LS_TABS);
      state.tabs = raw ? JSON.parse(raw) || [] : [];
    }catch{ state.tabs = []; }
    const active = localStorage.getItem(LS_ACTIVE);
    state.activeId = active ? Number(active) : null;
    if (!Number.isFinite(state.activeId)) state.activeId = null;
  }
  function saveTabs(){
    localStorage.setItem(LS_TABS, JSON.stringify(state.tabs));
    localStorage.setItem(LS_ACTIVE, state.activeId != null ? String(state.activeId) : "");
  }

  function ensureTab(friend){
    const id = Number(friend.user_id ?? friend.id);
    if (!Number.isFinite(id)) return;
    if (!state.tabs.some(t => Number(t.id) === id)){
      state.tabs.push({ id, name: friend.name || friend.displayName || "好友", avatar: friend.avatar || "" });
    }
    state.activeId = id;
    saveTabs();
    renderTabs();
  }

  function closeTab(id){
    id = Number(id);
    state.tabs = state.tabs.filter(t => Number(t.id) !== id);
    if (state.activeId === id){
      state.activeId = state.tabs.length ? Number(state.tabs[state.tabs.length-1].id) : null;
    }
    saveTabs();
    renderTabs();
    if (!state.tabs.length){
      // no tabs -> keep chat window open (LoL keeps window; but user may want it stay empty)
      cfTitle.textContent = "聊天";
      cfBody.innerHTML = "";
    } else {
      openActiveConversation();
    }
  }

  function renderTabs(){
    cfTabs.innerHTML = "";
    for (const t of state.tabs){
      const id = Number(t.id);
      const btn = document.createElement("div");
      btn.className = "cf-tab" + (state.activeId === id ? " active" : "");
      const unread = Number(state.unread.get(id) || 0);
      if (unread > 0) btn.classList.add("has-unread");
      btn.innerHTML = `
        <span class="n">${escapeHtml(t.name)}</span>
        <span class="u">${unread}</span>
        <span class="x" title="關閉分頁">×</span>
      `;
      btn.addEventListener("click", (e) => {
        const isClose = e.target && e.target.classList.contains("x");
        if (isClose){
          e.stopPropagation();
          closeTab(id);
          return;
        }
        state.activeId = id;
        saveTabs();
        renderTabs();
        openActiveConversation();
      });
      cfTabs.appendChild(btn);
    }
    // title text = active tab name
    const active = state.tabs.find(t => Number(t.id) === Number(state.activeId));
    cfTitle.textContent = active ? `聊天｜${active.name}` : "聊天";
    renderMiniUnread();
  }

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ===== Dragging =====
  (function initDrag(){
    let dragging = false;
    let startX = 0, startY = 0;
    let startLeft = 0, startBottom = 0;

    function isOnButton(e){
      return !!(e.target && (e.target.closest("#cfMinBtn") || e.target.closest("#cfCloseBtn")));
    }

    cfDragHandle.addEventListener("pointerdown", (e) => {
      if (isOnButton(e)) return;
      if (!state.chatOpen) return;
      dragging = true;
      cfDragHandle.setPointerCapture(e.pointerId);
      const rect = chat.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left;
      startBottom = (window.innerHeight - rect.bottom);
      cfDragHandle.style.cursor = "grabbing";
      e.preventDefault();
    });

    cfDragHandle.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      let newLeft = startLeft + dx;
      // dy positive means move down -> bottom decreases
      let newBottom = startBottom - dy;

      chat.style.left = newLeft + "px";
      chat.style.bottom = newBottom + "px";
      clampChatIntoViewport();
    });

    cfDragHandle.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      cfDragHandle.style.cursor = "grab";
      saveChatPos();
    });

    window.addEventListener("resize", () => {
      if (!state.chatOpen) return;
      clampChatIntoViewport();
    });
  })();

  // ===== Chat open/min/close buttons =====
  cfMinBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setChatMin(!state.chatMin);
  });
  cfCloseBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setChatOpen(false); // only close by button
  });

  // ===== Socket wrapper =====
  function getSocket(){
    return (window.socket && typeof window.socket.emit === "function") ? window.socket : null;
  }
  function emitAck(evt, payload, ms=12000){
    const s = getSocket();
    if (!s) return Promise.resolve({ ok:false, error:"no socket" });
    return new Promise((resolve) => {
      try{
        s.timeout(ms).emit(evt, payload, (err, res) => {
          if (err) return resolve({ ok:false, error:String(err?.message || err) });
          resolve(res || { ok:false, error:"no response" });
        });
      }catch(ex){
        resolve({ ok:false, error:String(ex?.message || ex) });
      }
    });
  }

  // ===== Presence + friends =====
  async function authSocial(){
    const secret = getSecret();
    if (!secret){
      setHint("請先登入（缺少 opSecret）");
      return { ok:false, error:"no secret" };
    }
    const res = await emitAck("SOCIAL_AUTH", { secret });
    if (!res?.ok){
      setHint("社交服務連線失敗：" + (res?.error || "unknown"));
    }
    return res;
  }

  async function refreshFriends(){
    const secret = getSecret();
    if (!secret){
      setHint("請先登入（缺少 opSecret）");
      return;
    }
    const res = await emitAck("FRIENDS_GET", { secret });
    if (!res?.ok){
      setHint("好友清單讀取失敗：" + (res?.error || "unknown"));
      return;
    }
    state.me = res.me || null;
    state.friends = Array.isArray(res.friends) ? res.friends : [];
    renderFriends();
    setHint("");
  }

  function renderFriends(){
    fdList.innerHTML = "";
    if (!state.friends.length){
      const empty = document.createElement("div");
      empty.style.color = "#9bb0c8";
      empty.style.fontSize = "13px";
      empty.style.padding = "8px 4px";
      empty.textContent = "尚無好友。可用上方輸入名稱加入。";
      fdList.appendChild(empty);
      return;
    }
    for (const f of state.friends){
      const id = Number(f.user_id);
      const item = document.createElement("div");
      const unread = Number(state.unread.get(id) || 0);
      item.className = "fd-item" + (unread > 0 ? " has-unread" : "");
      const isOnline = !!f.online;
      item.innerHTML = `
        <img class="fd-avatar" src="${escapeAttr(f.avatar || '')}" alt="">
        <div class="fd-meta">
          <div class="fd-name">${escapeHtml(f.name || "好友")}</div>
          <div class="fd-sub">
            <span class="fd-status ${isOnline ? "online":""}"><i></i>${isOnline ? "線上":"離線"}</span>
            <span class="fd-pill">私訊</span>
          </div>
        </div>
        <div class="fd-unread">${unread}</div>
      `;
      item.addEventListener("click", () => {
        // open chat + tab
        setChatOpen(true);
        setChatMin(false);
        ensureTab({ user_id:id, name:f.name, avatar:f.avatar });
        openActiveConversation();
      });
      fdList.appendChild(item);
    }
    renderMiniUnread();
  }

  function escapeAttr(s){
    return String(s ?? "").replace(/"/g, "&quot;");
  }

  // ===== Add friend =====
  async function addFriendByName(name){
    const secret = getSecret();
    if (!secret){
      setHint("請先登入（缺少 opSecret）");
      return;
    }
    name = String(name || "").trim();
    if (!name){
      setHint("請輸入好友名稱");
      return;
    }
    const res = await emitAck("FRIEND_ADD_BY_NAME", { secret, name });
    if (!res?.ok){
      setHint("加入失敗：" + (res?.error || "unknown"));
      return;
    }
    setHint("已加入好友：" + name);
    fdAddInput.value = "";
    await refreshFriends();
  }

  // ===== Chat history + send =====
  async function openActiveConversation(){
    if (state.activeId == null) return;
    const friendId = Number(state.activeId);
    const friend = state.friends.find(x => Number(x.user_id) === friendId) || state.tabs.find(x => Number(x.id) === friendId);
    cfTitle.textContent = friend?.name ? `聊天｜${friend.name}` : "聊天";
    // fetch history (cache)
    if (!state.history.has(friendId)){
      const secret = getSecret();
      if (!secret) return;
      const res = await emitAck("DM_HISTORY", { secret, peerUserId: friendId, limit: 80 });
      if (res?.ok){
        state.history.set(friendId, Array.isArray(res.messages) ? res.messages : []);
      } else {
        state.history.set(friendId, []);
      }
    }
    renderConversation(friendId);
    // mark read
    if (Number(state.unread.get(friendId)||0) > 0){
      state.unread.set(friendId, 0);
      renderFriends();
      renderTabs();
    }
  }

  function renderConversation(friendId){
    const msgs = state.history.get(friendId) || [];
    const meId = Number(state.me?.user_id);
    cfBody.innerHTML = "";
    for (const m of msgs){
      const isMe = Number(m.from_user_id) === meId;
      const row = document.createElement("div");
      row.className = "cf-msg" + (isMe ? " me":"");
      const bubble = document.createElement("div");
      bubble.className = "cf-bubble";
      bubble.textContent = safeText(m.body);
      const time = document.createElement("div");
      time.className = "cf-time";
      time.textContent = fmtTime(m.created_at || m.createdAt || Date.now());
      row.appendChild(bubble);
      row.appendChild(time);
      cfBody.appendChild(row);
    }
    // scroll bottom
    requestAnimationFrame(() => { cfBody.scrollTop = cfBody.scrollHeight; });
  }

  async function sendMessage(){
    const friendId = Number(state.activeId);
    if (!Number.isFinite(friendId) || friendId <= 0){
      setHint("請先選擇好友分頁");
      return;
    }
    const secret = getSecret();
    if (!secret){
      setHint("請先登入（缺少 opSecret）");
      return;
    }
    const body = String(cfInput.value || "").trim();
    if (!body) return;
    cfInput.value = "";
    const res = await emitAck("DM_SEND", { secret, toUserId: friendId, body });
    if (!res?.ok){
      setHint("傳送失敗：" + (res?.error || "unknown"));
      return;
    }
    // optimistic add into history
    const arr = state.history.get(friendId) || [];
    const msg = res.message || { from_user_id: state.me?.user_id, to_user_id: friendId, body, created_at: Date.now() };
    arr.push(msg);
    state.history.set(friendId, arr);
    renderConversation(friendId);
    setHint("");
  }

  cfSendBtn.addEventListener("click", sendMessage);
  cfInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      sendMessage();
    }
  });

  // ===== Dock buttons =====
  dock.querySelector('button[data-act="toggle"]').addEventListener("click", (e) => {
    e.stopPropagation();
    setDockCollapsed(!dock.classList.contains("fd-collapsed"));
  });
  dock.querySelector('button[data-act="refresh"]').addEventListener("click", async (e) => {
    e.stopPropagation();
    await refreshFriends();
  });
  dock.querySelector('button[data-act="add"]').addEventListener("click", (e) => {
    e.stopPropagation();
    const show = fdAddRow.style.display === "none";
    fdAddRow.style.display = show ? "flex" : "none";
    if (show) setTimeout(() => fdAddInput.focus(), 30);
  });
  fdAddBtn.addEventListener("click", () => addFriendByName(fdAddInput.value));
  fdAddInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      addFriendByName(fdAddInput.value);
    }
  });

  // ===== Incoming DM handler =====
  function attachSocketListeners(){
    const s = getSocket();
    if (!s) return;

    // Avoid double-binding (across soft reloads)
    if (window.__opFriendsDockBoundV4) return;
    window.__opFriendsDockBoundV4 = true;

    s.on("SOCIAL_PRESENCE", (payload) => {
      try{
        const map = payload?.online || {};
        for (const f of state.friends){
          f.online = !!map[String(f.user_id)];
        }
        renderFriends();
      }catch{}
    });

    s.on("DM_PUSH", (msg) => {
      try{
        const meId = Number(state.me?.user_id);
        const fromId = Number(msg?.from_user_id);
        const toId = Number(msg?.to_user_id);
        if (!Number.isFinite(fromId) || !Number.isFinite(toId)) return;

        const peerId = (fromId === meId) ? toId : fromId;

        // store into history cache
        const arr = state.history.get(peerId) || [];
        arr.push(msg);
        state.history.set(peerId, arr);

        // if tab exists and active and chat open and not minimized -> render & mark read
        const isActive = Number(state.activeId) === Number(peerId);
        if (isActive && state.chatOpen && !state.chatMin){
          renderConversation(peerId);
          state.unread.set(peerId, 0);
        } else {
          // increment unread
          const prev = Number(state.unread.get(peerId) || 0);
          state.unread.set(peerId, prev + 1);
        }

        // if there is a tab for this peer -> update badge; else keep unread on friend list only
        renderFriends();
        renderTabs();
        renderMiniUnread();
      }catch{}
    });
  }

  // ===== Boot =====
  loadTabs();
  renderTabs();
  attachSocketListeners();

  (async () => {
    const a = await authSocial();
    if (a?.ok){
      await refreshFriends();
      // restore tabs UI
      if (state.tabs.length){
        // ensure active is valid
        if (!state.tabs.some(t => Number(t.id) === Number(state.activeId))){
          state.activeId = Number(state.tabs[0].id);
          saveTabs();
        }
        renderTabs();
        // if chat open, render active convo
        if (state.chatOpen && state.activeId != null){
          openActiveConversation();
        }
      }
    }
  })();

})();
</script>
