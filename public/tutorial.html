<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>偉大航道爭霸戰｜新手導覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --brand-rgb:245,158,11; --spot-x:50vw; --spot-y:50vh; --spot-w:240px; --spot-h:160px; }
    html,body{height:100%;background:#0f1113;color:#eaecee;overflow-x:hidden}
    body{
      background:
        radial-gradient(1200px 800px at 10% 20%, rgba(255,184,77,.06), transparent 60%),
        radial-gradient(1200px 800px at 90% 80%, rgba(0,158,255,.05), transparent 60%),
        linear-gradient(180deg,#0f1113 0%,#14171a 100%);
    }
    body::before{
      content:''; position:fixed; inset:0; z-index:-1;
      background:var(--venue-bg-url, none), radial-gradient(circle at center, rgba(0,0,0,.15), rgba(0,0,0,.35));
      background-size:cover; background-position:center; background-repeat:no-repeat;
      opacity:.9;
    }
    .card{ background: rgba(16,20,24,.80); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; }
    .thumb{ width:68px; aspect-ratio:1242/1863; object-fit:cover; border-radius:10px; border:1px solid #2f353c; background:#0a0d10 }
    .thumb-lg{ width:110px; aspect-ratio:1242/1863; object-fit:cover; border-radius:12px; border:1px solid #2f353c; background:#0a0d10 }
    .thumb-xl{ width:min(22vw,190px); aspect-ratio:1242/1863; object-fit:cover; border-radius:14px; border:1px solid #2f353c; background:#0a0d10 }
    .deck{ position:relative; width:120px; aspect-ratio:1242/1863; border-radius:14px; border:1px solid #2a2f35; overflow:hidden; box-shadow:0 12px 28px rgba(0,0,0,.45) }
    .deck > img{ width:100%; height:100%; object-fit:cover; background:#0a0d10 }
    .draw-hint{
      position:absolute; right:150px; top:20%; transform:translateY(-50%); display:inline-flex; align-items:center; gap:4px;
      padding:4px 10px; border-radius:999px; font-size:11px; line-height:1.1;
      background: radial-gradient(circle at 0 0, rgba(250,250,210,.22), transparent 60%), radial-gradient(circle at 100% 100%, rgba(180,83,9,.60), transparent 65%), rgba(15,23,42,.92);
      border:1px solid rgba(250,204,21,.85); color:#fefce8; text-shadow:0 1px 2px rgba(0,0,0,.7);
      box-shadow: 0 0 0 1px rgba(15,23,42,.85), 0 0 12px 4px rgba(250,204,21,.55);
      pointer-events:none; white-space:nowrap; z-index:5; animation:drawHintPulse 1.6s ease-in-out infinite;
    }
    @keyframes drawHintPulse {
      0%,100% { transform: translateY(-50%) translateX(0); box-shadow:0 0 0 1px rgba(15,23,42,.85),0 0 10px 2px rgba(250,204,21,.35);} 
      50% { transform: translateY(-50%) translateX(-4px); box-shadow:0 0 0 1px rgba(15,23,42,.85),0 0 18px 6px rgba(250,204,21,.7);} 
    }
    @keyframes breath { 0%,100%{ box-shadow:0 0 0 0 rgba(250,204,21,.15),0 0 0 1px rgba(255,255,255,.06);} 50%{ box-shadow:0 0 18px 2px rgba(250,204,21,.3),0 0 0 1px rgba(255,255,255,.14);} }
    .panel-soft{ animation:breath 2.4s ease-in-out infinite; }
    .venue-tile{ position:relative; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.08); background:#0b0f13; cursor:pointer; }
    .venue-tile img{ width:100%; aspect-ratio:16/10; object-fit:cover; display:block; }
    .venue-tile .label{ position:absolute; inset:auto 8px 8px 8px; font-size:11px; padding:4px 8px; border-radius:999px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.1) }
    .player-card{ background:transparent; border:1.5px solid rgba(255,255,255,.25); border-radius:14px; padding:10px; }
    .player-card.current{ border-color: rgba(255,200,80,.85); box-shadow:0 0 10px rgba(255,200,80,.35); }
    .player-card.offline{ opacity:.55; }
    .avatar{ width:42px; height:42px; border-radius:999px; object-fit:cover; }
    .log-item{ padding:6px 8px; border-radius:10px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.04); }
    .btn-ui{ border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#fff; border-radius:12px; padding:.55rem .9rem; transition:all .15s ease; }
    .btn-ui:hover{ background:rgba(255,255,255,.12); }
    .btn-main{ background:#fbbf24; color:#111827; border-color:#f59e0b; font-weight:700; }
    .btn-main:hover{ background:#fcd34d; }

    .spotlight-layer{ position:fixed; inset:0; pointer-events:none; z-index:150; }
    .spotlight-hole{
      position:absolute; left:var(--spot-x); top:var(--spot-y); width:var(--spot-w); height:var(--spot-h); transform:translate(-50%,-50%);
      border-radius:22px; box-shadow:0 0 0 9999px rgba(0,0,0,.66), 0 0 0 2px rgba(251,191,36,.95), 0 0 34px rgba(251,191,36,.55);
      transition:all .35s ease;
    }
    .guide-arrow{
      position:absolute; left:var(--spot-x); top:calc(var(--spot-y) - var(--spot-h)/2 - 22px); transform:translateX(-50%);
      color:#fde68a; font-size:28px; text-shadow:0 0 10px rgba(251,191,36,.6); animation:floaty 1.2s ease-in-out infinite;
      transition:all .35s ease;
    }
    @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
    .guide-card{
      position:fixed; z-index:160; width:min(420px, calc(100vw - 24px));
      background:rgba(8,12,18,.94); border:1px solid rgba(251,191,36,.45); border-radius:20px;
      box-shadow:0 22px 40px rgba(0,0,0,.5), 0 0 22px rgba(251,191,36,.12);
      backdrop-filter:blur(10px); transition:all .35s ease;
    }
    .guide-head{ background:linear-gradient(90deg, rgba(251,191,36,.18), rgba(251,191,36,.05)); border-bottom:1px solid rgba(251,191,36,.18); }
    .guide-badge{ background:rgba(251,191,36,.16); color:#fde68a; border:1px solid rgba(251,191,36,.25); }

    .pulse-ring{ position:relative; }
    .pulse-ring::after{ content:''; position:absolute; inset:-8px; border-radius:18px; border:2px solid rgba(251,191,36,.8); animation:ring 1.8s ease-out infinite; }
    @keyframes ring{0%{opacity:.9; transform:scale(.96)}100%{opacity:0; transform:scale(1.08)}}

    .card-dex-overlay{ position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); }
    .card-dex-overlay.open{ display:flex; }

    .step-dot{ width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.25); }
    .step-dot.on{ background:#fbbf24; box-shadow:0 0 12px rgba(251,191,36,.7); }

    .hide-for-step{ display:none !important; }

    @media (max-width: 1023px){
      .draw-hint{ right:135px; top:14%; }
    }
    @media (max-width: 768px){
      .guide-arrow{ display:none; }
      .thumb-xl{ width:42vw; }
      .draw-hint{ right:122px; top:12%; }
    }
  </style>
</head>
<body>
  <header class="sticky top-0 z-40 bg-[#101418]/80 backdrop-blur border-b border-[#1c2229]">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="font-semibold tracking-wide">偉大航道爭霸戰</div>
      <div class="hidden text-xs px-2 py-1 rounded border border-neutral-700">房號：<span>教學</span></div>
      <div class="hidden text-xs px-2 py-1 rounded border border-neutral-700">連線：<span class="text-emerald-400">guide</span></div>
      <div id="topChest" class="text-xs px-2 py-1 rounded border border-neutral-700">寶箱金幣剩餘：<span id="chestLbl">30</span> 枚</div>
      <button id="cardDexBtn" class="px-2 py-1 rounded border border-[#374151] bg-[#111827]/80 text-[11px] tracking-wide hover:bg-[#020617] hover:border-[#f97373] hover:text-[#fee2e2] transition-colors duration-150">卡片圖鑑</button>
      <div class="ml-auto flex items-center gap-2" id="bgmArea">
        <div class="flex items-center gap-2 px-2 py-1 rounded-lg border border-[#2a2f35]">
          <button class="btn-ui !px-3 !py-2 text-xs">◀</button>
          <button class="btn-ui !px-3 !py-2 text-xs">▶</button>
          <button class="btn-ui !px-3 !py-2 text-xs">🔀</button>
          <div class="text-xs opacity-90">未播放</div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 md:px-4 py-4 grid gap-4 lg:grid-cols-[1.2fr_.8fr]">
    <section class="space-y-3">
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div id="venuesCard" class="card p-3 md:col-span-2 panel-soft">
          <div class="text-sm mb-2 opacity-80">本局場地</div>
          <div id="venues" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
        </div>
        <div id="deckCard" class="card p-3 flex items-center justify-between gap-3 relative panel-soft">
          <div class="text-sm opacity-80">牌堆 <span id="deckCnt" class="ml-2 px-1.5 py-0.5 rounded border border-[#2a2f35] text-amber-300 font-semibold">18</span></div>
          <button id="btnDraw" class="deck">
            <img id="deckImg" src="images/cards/back.webp" alt="deck" onerror="this.src='';this.style.background='#1f2937'"/>
          </button>
          <div id="drawHint" class="draw-hint"><span>👉</span><span>請抽牌</span></div>
        </div>
        <div id="discardCard" class="card p-3 md:col-span-3 panel-soft">
          <div class="flex items-center justify-between mb-2">
            <div class="text-sm opacity-80">棄牌</div>
            <button class="hidden px-3 py-1.5 rounded-lg border border-amber-400 bg-amber-300 text-black text-sm">下一局 ▶</button>
          </div>
          <div id="discard" class="flex gap-2 overflow-x-auto"></div>
        </div>
      </div>

      <div id="myPlayZone" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button id="playHand" class="border border-[#2f353c] rounded-xl overflow-hidden bg-black/20 p-2">
          <img id="imgHand" class="thumb-xl mx-auto" src="images/cards/8.webp" alt="hand" onerror="this.src='';this.style.height='180px';this.style.background='#111827'"/>
          <div class="text-xs opacity-75 mt-2">原本手牌</div>
        </button>
        <button id="playDrawn" class="border border-[#2f353c] rounded-xl overflow-hidden bg-black/20 p-2 pulse-ring">
          <img id="imgDrawn" class="thumb-xl mx-auto" src="images/cards/5.webp" alt="drawn" onerror="this.src='';this.style.height='180px';this.style.background='#111827'"/>
          <div class="text-xs text-amber-300 mt-2">剛抽到的牌</div>
        </button>
      </div>

      <div id="logCard" class="card p-3 panel-soft">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm opacity-80">對局日誌</div>
          <div class="text-xs text-neutral-400">輪到：<span id="turnLbl">你</span>｜階段：<span id="stepLbl">抽牌</span></div>
        </div>
        <ol id="logBox" class="text-sm space-y-1 list-decimal pl-5 max-h-72 overflow-auto"></ol>
      </div>
    </section>

    <aside class="space-y-3">
      <div id="playersCard" class="card p-3 panel-soft">
        <div class="text-sm mb-2 opacity-80">玩家</div>
        <div id="players" class="grid gap-2"></div>
      </div>
    </aside>
  </main>

  <div id="cardDexOverlay" class="card-dex-overlay">
    <div class="w-[min(1200px,96vw)] max-h-[92vh] rounded-2xl border border-slate-600/80 bg-[#050914]/95 shadow-2xl backdrop-blur-md overflow-hidden flex flex-col">
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-700/70 bg-gradient-to-r from-slate-900/80 via-slate-800/80 to-slate-900/80 text-xs md:text-sm">
        <div class="font-semibold tracking-wide">卡片圖鑑（教學示範）</div>
        <button id="cardDexClose" class="btn-ui !text-[11px] !py-1 !px-2">關閉</button>
      </div>
      <div class="grid md:grid-cols-[1.2fr_.8fr] gap-4 p-4 overflow-auto">
        <div id="cardDexGrid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
        <div class="border-t md:border-t-0 md:border-l border-slate-700/70 pt-3 md:pt-0 md:pl-4">
          <div id="dexEmpty" class="text-[11px] md:text-xs text-slate-300/80 italic">點左邊任一張卡片，可以查看大圖與強化版本。</div>
          <div id="dexPreview" class="hidden">
            <div id="dexTitle" class="text-sm font-semibold mb-2"></div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <div class="flex flex-col items-center">
                <div class="text-[10px] md:text-xs mb-1 opacity-75">一般</div>
                <img id="dexBase" class="w-full max-w-[340px] rounded-lg border border-slate-600/80 shadow-lg bg-black/40 object-contain"/>
              </div>
              <div class="flex flex-col items-center">
                <div class="text-[10px] md:text-xs mb-1 opacity-75">強化</div>
                <img id="dexEnh" class="w-full max-w-[340px] rounded-lg border border-rose-500/80 shadow-lg bg-black/40 object-contain"/>
              </div>
            </div>
            <div id="dexDesc" class="text-[11px] text-slate-300/75"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="spotlight-layer" id="spotlightLayer" aria-hidden="true">
    <div class="spotlight-hole"></div>
    <div class="guide-arrow">⬇</div>
  </div>

  <div id="guideCard" class="guide-card">
    <div class="guide-head px-4 py-3 rounded-t-[20px] flex items-center justify-between gap-3">
      <div>
        <div id="guideBadge" class="guide-badge inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-[11px] font-semibold">步驟 1 / 8</div>
        <div id="guideTitle" class="mt-2 text-lg font-bold">歡迎來到新手導覽</div>
      </div>
      <button id="skipGuide" class="btn-ui !text-xs !py-1 !px-2">略過</button>
    </div>
    <div class="px-4 py-4">
      <div id="guideText" class="text-sm leading-7 text-slate-200"></div>
      <div class="mt-4 flex items-center justify-between gap-3 flex-wrap">
        <div id="stepDots" class="flex items-center gap-2"></div>
        <div class="flex items-center gap-2 ml-auto">
          <button id="prevStep" class="btn-ui">上一步</button>
          <button id="nextStep" class="btn-ui btn-main">下一步</button>
        </div>
      </div>
      <div id="miniTip" class="mt-3 text-[12px] text-amber-200/85"></div>
    </div>
  </div>

<script>
const CARD_TEXT = {
  0:'薩波：看頂牌。強化時還能決定放回頂或底。',
  5:'索隆：指定一人棄牌。',
  8:'魯夫：決鬥型角色，強化時能更猛地壓制全場。',
  16:'青雉：凍結目標，限制對方下一步操作。'
};
const VENUE_INFO = [
  { name:'魚人島', img:'images/venues/魚人島.webp', bg:'images/venues/魚人島.webp', tip:'有些卡在自己的專屬場地會進入強化版。' },
  { name:'和之國', img:'images/venues/和之國.webp', bg:'images/venues/和之國.webp', tip:'點場地可查看背景，也能幫助你記住誰可能被強化。' },
  { name:'龐克哈薩特', img:'images/venues/龐克哈薩特.webp', bg:'images/venues/龐克哈薩特.webp', tip:'注意場地圖就是判斷卡片強化的重要線索。' },
  { name:'蛋糕島', img:'images/venues/蛋糕島.webp', bg:'images/venues/蛋糕島.webp', tip:'不同場地會改變不同角色的表現。' },
  { name:'德雷斯羅薩', img:'images/venues/德雷斯羅薩.webp', bg:'images/venues/德雷斯羅薩.webp', tip:'開局先看場地，是新手最需要養成的習慣。' },
  { name:'司法島', img:'images/venues/司法島.webp', bg:'images/venues/司法島.webp', tip:'你不需要背全部，只要先知道場地＝可能強化就夠了。' },
];
const DEX_CARDS = [
  { id:0, name:'薩波', venue:'德雷斯羅薩鬥技場', base:'images/cards/0.webp', enh:'images/cards/enh/0.webp' },
  { id:5, name:'索隆', venue:'和之國', base:'images/cards/5.webp', enh:'images/cards/enh/5.webp' },
  { id:8, name:'魯夫', venue:'魚人島', base:'images/cards/8.webp', enh:'images/cards/enh/8.webp' },
  { id:16, name:'青雉', venue:'龐克哈薩特', base:'images/cards/16.webp', enh:'images/cards/enh/16.webp' },
  { id:6, name:'羅', venue:'龐克哈薩特', base:'images/cards/6.webp', enh:'images/cards/enh/6.webp' },
  { id:7, name:'娜美', venue:'魚人島', base:'images/cards/7.webp', enh:'images/cards/enh/7.webp' },
  { id:4, name:'喬巴', venue:'磁鼓島', base:'images/cards/4.webp', enh:'images/cards/enh/4.webp' },
  { id:14, name:'大媽', venue:'蛋糕島', base:'images/cards/14.webp', enh:'images/cards/enh/14.webp' }
];

const state = {
  drawn:false,
  chosen:false,
  dexOpen:false,
  currentVenueBg:'',
  logs:[
    '開局後，先看場地有哪些。',
    '輪到你時，先抽一張牌。',
    '抽完後，兩張選一張打出。'
  ]
};

const steps = [
  {
    target:'main',
    pad:18,
    title:'這就是正式對戰畫面',
    text:'我把教學做成和你正式遊戲幾乎同樣的版面。之後你只要按「下一步」，我就會直接指給玩家看：現在能做什麼、每個區塊是做什麼。',
    tip:'這頁可以直接拿去當真正的新手導覽頁。',
    onEnter(){ document.getElementById('myPlayZone').classList.add('hidden'); setStepLabel('抽牌'); }
  },
  {
    target:'#venuesCard',
    pad:14,
    title:'先看「本局場地」',
    text:'每局開場先看這裡。場地會決定哪些角色可能變成強化版，所以新手第一眼先看場地，會比先看手牌更有方向。',
    tip:'你也可以直接點場地圖，示範切換背景。',
    onEnter(){ pulse('#venuesCard'); }
  },
  {
    target:'#deckCard',
    pad:14,
    title:'輪到你時，先抽牌',
    text:'你的遊戲本來就有「請抽牌」提示。新手只要記住：輪到自己、看到這個提示，就先按牌堆抽一張。',
    tip:'這一步可以直接點牌堆試試看。',
    onEnter(){ setStepLabel('抽牌'); document.getElementById('drawHint').style.display='inline-flex'; },
    advanceOn:'#btnDraw'
  },
  {
    target:'#myPlayZone',
    pad:14,
    title:'抽完後，兩張選一張打出',
    text:'抽完牌後，畫面會出現兩張牌：一張是原本手牌，一張是剛抽到的牌。你不是兩張都能打，而是要二選一。',
    tip:'右邊這張有黃圈，代表這裡正在示範你剛抽到的新牌。',
    onEnter(){ ensureDrawn(); setStepLabel('選牌'); },
  },
  {
    target:'#playDrawn',
    pad:12,
    title:'選好後，把其中一張打出去',
    text:'點你要出的那張牌。打出去後，效果會處理，然後才輪到下一位。新手最常卡住的地方，就是不知道這裡其實只是「從兩張裡選一張」。',
    tip:'現在就點這張牌，示範打出。',
    onEnter(){ ensureDrawn(); },
    advanceOn:'#playDrawn'
  },
  {
    target:'#playersCard',
    pad:14,
    title:'右邊這欄是所有玩家狀態',
    text:'這裡可以看誰還活著、誰是目前回合、誰可能斷線、每個人的金幣和手牌狀態。真正對戰時，很多判斷都要從這一欄做。',
    tip:'金框代表目前輪到的人。',
    onEnter(){ setCurrentPlayer(1); }
  },
  {
    target:'#logCard',
    pad:14,
    title:'看不懂發生什麼，就看對局日誌',
    text:'角色技能、決鬥結果、誰被棄牌、誰被麻痺，幾乎都能從這裡快速回頭看。新手如果一瞬間看不懂畫面，先看日誌最容易補上。',
    tip:'教學頁會把剛剛的抽牌和出牌寫進日誌。',
    onEnter(){ appendLog('你打出了索隆，指定一名對手棄牌。'); }
  },
  {
    target:'#cardDexBtn',
    pad:12,
    title:'不知道卡片效果？直接看卡片圖鑑',
    text:'這個按鈕很重要。玩家忘記某張牌效果時，不用離開頁面，直接打開圖鑑，就能看一般版和強化版差在哪裡。',
    tip:'點按鈕會打開示範圖鑑。',
    onEnter(){},
    advanceOn:'#cardDexBtn'
  },
  {
    target:'#guideCard',
    pad:10,
    title:'你已經懂基本流程了',
    text:'新手實際要記住的只有這條線：先看場地 → 輪到你先抽牌 → 兩張選一張打出 → 看右邊玩家狀態和下方日誌。其他功能再邊玩邊熟就行。',
    tip:'測試沒問題後，把這份 tutorial.html 放進 public，就能直接當正式新手導覽。',
    onEnter(){ document.getElementById('drawHint').style.display='none'; }
  }
];

const $ = (s)=>document.querySelector(s);
const guideCard = $('#guideCard');
const spotlightLayer = $('#spotlightLayer');
let stepIndex = 0;

function init(){
  renderVenues();
  renderDiscard();
  renderPlayers();
  renderLogs();
  renderDex();
  wireEvents();
  renderStepDots();
  goStep(0);
}

function renderVenues(){
  const box = $('#venues');
  box.innerHTML = VENUE_INFO.map((v,i)=>`
    <button class="venue-tile" data-venue="${i}" aria-label="${v.name}">
      <img src="${v.img}" alt="${v.name}" onerror="this.style.background='#1f2937';this.removeAttribute('src')">
      <div class="label">${v.name}</div>
    </button>
  `).join('');
}
function renderDiscard(){
  const box = $('#discard');
  box.innerHTML = [16, 0].map(id=>`<img class="thumb" src="images/cards/${id}.webp" onerror="this.removeAttribute('src');this.style.background='#111827'">`).join('');
}
function renderPlayers(){
  const players = [
    { id:0, name:'你', avatar:49, gold:7, hand:1, current:true },
    { id:1, name:'巴奇', avatar:31, gold:5, hand:1 },
    { id:2, name:'薩波', avatar:39, gold:4, hand:1 },
    { id:3, name:'魯海', avatar:45, gold:3, hand:1, offline:true },
  ];
  $('#players').innerHTML = players.map(p=>`
    <div class="player-card ${p.current?'current':''} ${p.offline?'offline':''}" data-player="${p.id}">
      <div class="flex items-center gap-3">
        <img class="avatar" src="images/avatars/${p.avatar}.webp" onerror="this.style.background='#374151';this.removeAttribute('src')">
        <div class="min-w-0 flex-1">
          <div class="font-semibold truncate">${p.name} ${p.offline?'<span class="text-xs text-rose-300">斷線中</span>':''}</div>
          <div class="text-xs opacity-70">金幣 ${p.gold} ｜ 手牌 ${p.hand} 張</div>
        </div>
      </div>
    </div>
  `).join('');
}
function renderLogs(){
  $('#logBox').innerHTML = state.logs.map(line=>`<li class="log-item">${escapeHtml(line)}</li>`).join('');
}
function appendLog(line){
  if (!state.logs.includes(line)) {
    state.logs.push(line);
    renderLogs();
  }
}
function renderDex(){
  $('#cardDexGrid').innerHTML = DEX_CARDS.map(c=>`
    <button class="rounded-xl overflow-hidden border border-slate-700 bg-slate-900/70 hover:border-amber-300 transition text-left" data-card="${c.id}">
      <img src="${c.base}" class="w-full aspect-[1242/1863] object-cover bg-black/40" onerror="this.removeAttribute('src');this.style.background='#111827'">
      <div class="px-2 py-1 text-[10px] flex items-center justify-between gap-1"><span class="truncate">${c.name}</span><span class="opacity-70">#${c.id}</span></div>
    </button>
  `).join('');
}
function showDexCard(id){
  const c = DEX_CARDS.find(x=>x.id===id) || DEX_CARDS[0];
  $('#dexEmpty').classList.add('hidden');
  $('#dexPreview').classList.remove('hidden');
  $('#dexTitle').textContent = `${c.name}｜強化場地：${c.venue}`;
  $('#dexBase').src = c.base;
  $('#dexEnh').src = c.enh;
  $('#dexDesc').textContent = CARD_TEXT[c.id] || '這張卡可以在圖鑑裡比較一般版與強化版差別。';
}
function openDex(){ state.dexOpen = true; $('#cardDexOverlay').classList.add('open'); if (!$('#dexPreview').classList.contains('hidden')) return; showDexCard(8); }
function closeDex(){ state.dexOpen = false; $('#cardDexOverlay').classList.remove('open'); }

function wireEvents(){
  $('#btnDraw').addEventListener('click', ()=>{
    if (stepIndex < 2) return;
    ensureDrawn();
    if (steps[stepIndex]?.advanceOn === '#btnDraw') nextStep();
  });
  $('#playHand').addEventListener('click', ()=>{ if (!state.drawn) return; chooseCard('hand'); });
  $('#playDrawn').addEventListener('click', ()=>{ if (!state.drawn) return; chooseCard('drawn'); if (steps[stepIndex]?.advanceOn === '#playDrawn') nextStep(); });
  $('#cardDexBtn').addEventListener('click', ()=>{ openDex(); if (steps[stepIndex]?.advanceOn === '#cardDexBtn') setTimeout(nextStep, 200); });
  $('#cardDexClose').addEventListener('click', closeDex);
  $('#cardDexOverlay').addEventListener('click', (e)=>{ if (e.target.id === 'cardDexOverlay') closeDex(); });
  $('#cardDexGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-card]');
    if (!btn) return;
    showDexCard(Number(btn.dataset.card));
  });
  $('#prevStep').addEventListener('click', prevStep);
  $('#nextStep').addEventListener('click', nextStep);
  $('#skipGuide').addEventListener('click', ()=>goStep(steps.length - 1));
  window.addEventListener('resize', ()=>positionGuide());
  document.querySelectorAll('.venue-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      const info = VENUE_INFO[Number(tile.dataset.venue)];
      if (!info) return;
      document.body.style.setProperty('--venue-bg-url', `url("${info.bg}")`);
      appendLog(`你查看了場地：${info.name}。`);
      $('#miniTip').textContent = info.tip;
    });
  });
}

function ensureDrawn(){
  if (state.drawn) return;
  state.drawn = true;
  $('#myPlayZone').classList.remove('hidden');
  $('#stepLbl').textContent = '選牌';
  $('#drawHint').style.display = 'none';
  appendLog('你抽了一張牌，現在要兩張選一張。');
}
function chooseCard(which){
  if (state.chosen) return;
  state.chosen = true;
  const playedId = which === 'drawn' ? 5 : 8;
  const box = $('#discard');
  const img = document.createElement('img');
  img.className = 'thumb';
  img.src = `images/cards/${playedId}.webp`;
  img.onerror = function(){ this.removeAttribute('src'); this.style.background='#111827'; };
  box.appendChild(img);
  box.scrollLeft = box.scrollWidth;
  appendLog(`你從兩張牌中選擇打出 ${playedId===5?'索隆':'魯夫'}。`);
  $('#playHand').classList.add('opacity-50');
  $('#playDrawn').classList.add('opacity-50');
  setCurrentPlayer(1);
}
function setCurrentPlayer(id){
  document.querySelectorAll('.player-card').forEach(el=>el.classList.remove('current'));
  const target = document.querySelector(`.player-card[data-player="${id}"]`);
  if (target) target.classList.add('current');
  $('#turnLbl').textContent = id === 0 ? '你' : target?.querySelector('.font-semibold')?.textContent?.replace('斷線中','').trim() || '對手';
}
function setStepLabel(text){ $('#stepLbl').textContent = text; }
function pulse(sel){ const el = $(sel); if (!el) return; el.classList.remove('pulse-ring'); void el.offsetWidth; el.classList.add('pulse-ring'); setTimeout(()=>el.classList.remove('pulse-ring'), 1800); }

function renderStepDots(){
  $('#stepDots').innerHTML = steps.map((_,i)=>`<span class="step-dot ${i===stepIndex?'on':''}" data-dot="${i}"></span>`).join('');
}

function goStep(i){
  stepIndex = Math.max(0, Math.min(steps.length - 1, i));
  const step = steps[stepIndex];
  $('#guideBadge').textContent = `步驟 ${stepIndex + 1} / ${steps.length}`;
  $('#guideTitle').textContent = step.title;
  $('#guideText').textContent = step.text;
  $('#miniTip').textContent = step.tip || '';
  $('#prevStep').disabled = stepIndex === 0;
  $('#prevStep').classList.toggle('opacity-50', stepIndex === 0);
  $('#nextStep').textContent = stepIndex === steps.length - 1 ? '重新看一次' : '下一步';
  renderStepDots();
  step.onEnter?.();
  positionGuide();
}
function nextStep(){
  if (stepIndex >= steps.length - 1) {
    resetDemo();
    goStep(0);
    return;
  }
  goStep(stepIndex + 1);
}
function prevStep(){ goStep(stepIndex - 1); }

function positionGuide(){
  const step = steps[stepIndex];
  const target = step.target === 'main' ? document.querySelector('main') : $(step.target);
  if (!target) return;
  const r = target.getBoundingClientRect();
  const pad = step.pad || 10;
  const spotX = r.left + r.width/2;
  const spotY = r.top + r.height/2;
  const spotW = Math.min(window.innerWidth - 24, r.width + pad*2);
  const spotH = Math.min(window.innerHeight - 24, r.height + pad*2);
  document.documentElement.style.setProperty('--spot-x', `${spotX}px`);
  document.documentElement.style.setProperty('--spot-y', `${spotY}px`);
  document.documentElement.style.setProperty('--spot-w', `${spotW}px`);
  document.documentElement.style.setProperty('--spot-h', `${spotH}px`);

  const cardW = Math.min(420, window.innerWidth - 24);
  const below = r.bottom + 18;
  const above = r.top - 18;
  let top = below;
  if (below + 220 > window.innerHeight && above > 240) top = Math.max(12, above - 210);
  top = Math.max(12, Math.min(window.innerHeight - 220, top));

  let left = r.left;
  if (left + cardW > window.innerWidth - 12) left = window.innerWidth - cardW - 12;
  if (left < 12) left = 12;
  guideCard.style.left = `${left}px`;
  guideCard.style.top = `${top}px`;

  spotlightLayer.style.display = step.target === '#guideCard' ? 'none' : 'block';
}

function resetDemo(){
  state.drawn = false;
  state.chosen = false;
  state.dexOpen = false;
  $('#myPlayZone').classList.add('hidden');
  $('#drawHint').style.display = 'inline-flex';
  $('#discard').innerHTML = [16,0].map(id=>`<img class="thumb" src="images/cards/${id}.webp" onerror="this.removeAttribute('src');this.style.background='#111827'">`).join('');
  state.logs = [
    '開局後，先看場地有哪些。',
    '輪到你時，先抽一張牌。',
    '抽完後，兩張選一張打出。'
  ];
  renderLogs();
  renderPlayers();
  closeDex();
  setCurrentPlayer(0);
  setStepLabel('抽牌');
}

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

init();
</script>
</body>
</html>
