        }
        const firstEmpty = state.slots.findIndex((slot) => !slot.cardId);
        const current = Math.max(0, Math.min(state.slots.length - 1, Number(state.selectedSlotIndex || 0)));
        const selectedSlot = keepSelection || firstEmpty < 0 ? current : firstEmpty;
        state.selectedSlotIndex = selectedSlot;
        openModal("選擇處刑台角色", `
          <div class="dialog-sub" style="margin-bottom:10px">先選玩家位置，再選白鬍子卡池角色。已加入、消失、其他處刑位使用中的角色不能選。</div>
          <div class="tool-row" style="justify-content:flex-start;margin-bottom:12px">
            ${state.slots.map((slot, index) => `<button class="count-btn${index === state.selectedSlotIndex ? " active" : ""}" type="button" data-select-slot="${index}">${slot.playerName}</button>`).join("")}
          </div>
          <div class="grid">
            ${whitebeardIds.map((id) => {
              const card = byId[id] || {};
              const usedByOtherSlot = state.slots.some((slot, index) => index !== state.selectedSlotIndex && slot.cardId === id);
              const disabled = state.lostWhitebeard.has(id) || state.joinedWhitebeard.has(id) || usedByOtherSlot;
              return `
                <button class="select-card${disabled ? " used" : ""}" type="button" data-select-wb="${id}" ${disabled ? "disabled" : ""}>
                  <img src="${portrait(id)}" alt="${nameOf(id)}" onerror="this.hidden=true">
                  <div>
                    <b>${fullNameOf(id)}</b>
                    <span class="card-meta">${tier(card.tier)} ・ ${card.attribute || "無"} ・ ${card.roleType || "角色"}</span>
                  </div>
                </button>
              `;
            }).join("")}
          </div>
        `);
      }

      function assignWhitebeardToExecution(cardId) {
        if (!cardId || !state.slots[state.selectedSlotIndex]) return;
        const assignedSlotIndex = state.selectedSlotIndex;
        state.slots[assignedSlotIndex].cardId = cardId;
        state.slots[assignedSlotIndex].roundsLeft = state.slots[assignedSlotIndex].roundsLeft ?? executionTurnsFor(assignedSlotIndex);
        state.setupStep = slotsReady() ? "ready" : "chooseExecution";
        state.rounds = soonestExecutionTurns();
        const firstEmpty = state.slots.findIndex((slot) => !slot.cardId);
        if (firstEmpty >= 0) state.selectedSlotIndex = firstEmpty;
        state.pendingWhitebeardChoice = "";
        closeModal();
        render();
        sendBoardCommand("assignExecution", { slotIndex: assignedSlotIndex, cardId });
        if (firstEmpty >= 0) setTimeout(() => openSelectModal(), 120);
      }

      function openExecutionConfirmModal(cardId) {
        const slot = state.slots[state.selectedSlotIndex];
        const card = byId[cardId] || {};
        state.pendingWhitebeardChoice = cardId;
        openModal("確認處刑台人選", `
          <div class="grid">
            <article class="select-card" style="min-height:230px">
              <img src="${portrait(cardId)}" alt="${nameOf(cardId)}" onerror="this.hidden=true">
              <div>
                <b>${fullNameOf(cardId)}</b>
                <span class="card-meta">${slot?.playerName || "玩家"} ・ ${tier(card.tier)} ・ ${card.roleType || "角色"}</span>
              </div>
            </article>
            <article class="select-card" style="min-height:230px">
              <div>
                <b>戰敗後果</b>
                <span class="card-meta">如果本次海軍本部副本失敗，這位白鬍子海賊團成員會消失，之後不能再被選上處刑台，也不能再作為支援角色。</span>
              </div>
              <div>
                <b>通關結果</b>
                <span class="card-meta">通關後可決定是否讓這位角色加入隊伍；隊伍上限仍為 6 人。</span>
              </div>
            </article>
          </div>
          <div class="tool-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn" type="button" data-change-wb>換人</button>
            <button class="btn primary" type="button" data-confirm-wb="${cardId}">確認送上處刑台</button>
          </div>
        `);
      }

      function startRaid() {
        if (!readyToStart()) return;
        state.started = true;
        state.finished = false;
        state.win = false;
        sendBoardCommand("startRaid", {});
        render();
      }

      async function winBattle() {
        if (!state.started || state.animating) return;
        const expired = tickExecutionTimers(2);
        state.bossIndex += 1;
        if (state.bossIndex >= bosses.length) await finishRaid(true);
        else {
          state.rescueDice = Math.max(0, Number(state.rescueDice || 0)) + 1;
          if (expired && state.rescueDice <= 0) await finishRaid(false);
          else render();
        }
      }

      function rollRescueDie() {
        if (state.finished || state.animating || Math.max(0, Number(state.rescueDice || 0)) <= 0) return;
        if (BOARD_MODE) {
          sendBoardCommand("rollRescueDie", {});
          return;
        }
        const roll = Math.floor(Math.random() * EXECUTION_BONUS_DICE_MAX) + 1;
        state.rescueDice = Math.max(0, Number(state.rescueDice || 0)) - 1;
        const bonus = addExecutionBonusTurns(roll);
        render();
        showRescueRollResult({ ok: true, roll, bonus, rescueDice: state.rescueDice, rounds: state.rounds });
      }

      async function stall() {
        if (!state.started || state.animating) return;
        const expired = tickExecutionTimers(1);
        if (expired) await finishRaid(false);
        else render();
      }

      function executionTargetSlotIndex() {
        const expired = state.slots.findIndex((slot) => slot.cardId && (slot.roundsLeft ?? 1) <= 0);
        if (expired >= 0) return expired;
        const current = currentSlotIndex();
        if (state.slots[current]?.cardId) return current;
        return state.slots.findIndex((slot) => slot.cardId);
      }

      function splitExecutionCard(slot, slotImg) {
        if (!slot || !slotImg || slot.querySelector(".execution-card-split")) return;
        const slotBox = slot.getBoundingClientRect();
        const imgBox = slotImg.getBoundingClientRect();
        const split = document.createElement("div");
        split.className = "execution-card-split";
        split.style.left = `${imgBox.left - slotBox.left}px`;
        split.style.top = `${imgBox.top - slotBox.top}px`;
        split.style.width = `${imgBox.width}px`;
        split.style.height = `${imgBox.height}px`;
        ["left", "right"].forEach((side) => {
          const half = document.createElement("div");
          half.className = `execution-card-half ${side}`;
          const clone = slotImg.cloneNode(true);
          clone.classList.remove("is-sentenced", "is-hidden-after-split");
          clone.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
          half.appendChild(clone);
          split.appendChild(half);
        });
        slot.appendChild(split);
        slotImg.classList.add("is-hidden-after-split");
        requestAnimationFrame(() => split.classList.add("is-splitting"));
      }

      async function playExecutionCutAnimation() {
        const targetIndex = executionTargetSlotIndex();
        if (targetIndex < 0) return false;
        state.animating = true;
        state.selectedSlotIndex = targetIndex;
        state.rulesActive = false;
        state.modalAfterClose = "";
        $("modalBack").classList.remove("show");
        render();
        renderHud();
        await sleep(80);
        const wrap = document.querySelector(`[data-slot-index="${targetIndex + 1}"]`);
        const slot = wrap?.querySelector(".slot");
        const slotImg = wrap?.querySelector(".slot-img");
        if (!wrap || !slot || !slotImg) {
          state.animating = false;
          renderHud();
          return false;
        }
        wrap.classList.add("execution-playing");
        const guard = document.createElement("img");
        guard.className = "execution-cut-guard";
        guard.alt = "處刑守衛";
        guard.src = `${executionCutAnimationUrl}?t=${Date.now()}`;
        wrap.appendChild(guard);
        await sleep(5080);
        slotImg.classList.add("is-sentenced");
        await sleep(360);
        splitExecutionCard(slot, slotImg);
        await sleep(1120);
        wrap.classList.add("execution-card-gone");
        await sleep(260);
        guard.remove();
        return true;
      }

      function openFailureAnimationPrompt() {
        if (state.animating) return;
        state.failureConfirmPending = true;
        state.resultModalShown = true;
        const targetIndex = executionTargetSlotIndex();
        const targetSlot = state.slots[targetIndex] || {};
        openModal("處刑台失守", `
          <div class="grid">
            <article class="select-card" style="min-height:180px">
              <div>
                <b>${targetSlot.cardId ? nameOf(targetSlot.cardId) : "處刑台角色"}</b>
                <span class="card-meta">${state.mode === "wipe" ? "救援失敗後，這位夥伴會回到招募池並清除額外養成；剩餘隊伍回到羅格鎮重新出發。" : "挑戰失敗後，這位白鬍子成員會消失並鎖定。"}</span>
              </div>
            </article>
            <article class="select-card" style="min-height:180px">
              <div>
                <b>確認後播放動畫</b>
                <span class="card-meta">按下確認才會開始處刑動畫；動畫結束後再顯示失敗結算。</span>
              </div>
            </article>
          </div>
          <div class="tool-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn danger" type="button" data-confirm-failure-animation>確認失敗</button>
          </div>
        `);
      }

      async function resolveFailureAfterConfirm() {
        if (state.animating) return;
        state.failureConfirmPending = false;
        await playExecutionCutAnimation();
        state.started = false;
        state.finished = true;
        state.win = false;
        state.helpers = [];
        if (state.mode === "wipe") {
          state.slots.forEach((slot) => {
            const player = playerById(slot.playerId);
            if (!player) return;
            player.crew = player.crew.filter((id) => id !== slot.cardId);
            if (!state.returnedCardPool.some((entry) => entry.cardId === slot.cardId && entry.fromPlayer === slot.playerName)) {
              state.returnedCardPool.push({ cardId: slot.cardId, fromPlayer: slot.playerName, clean: true });
            }
          });
        } else {
          state.slots.forEach((slot) => state.lostWhitebeard.add(slot.cardId));
        }
        state.slots.forEach((slot) => { if (slot.cardId) slot.executed = true; });
        state.failureAnimationDone = true;
        state.animating = false;
        render();
        openResultModal();
      }

      function createConquerorGuardSplit(wrap, waiting = false) {
        const split = document.createElement("div");
        split.className = `conqueror-guard-split${waiting ? " waiting" : ""}`;
        ["left", "right"].forEach((side) => {
          const half = document.createElement("span");
          half.className = `conqueror-guard-half ${side}`;
          const img = document.createElement("img");
          img.src = executionTopGuardHalfUrls[side];
          img.alt = "";
          half.appendChild(img);
          split.appendChild(half);
        });
        wrap.appendChild(split);
        return split;
      }

      function createConquerorPageAura(page) {
        const aura = document.createElement("div");
        aura.className = "conqueror-page-aura";
        aura.innerHTML = Array.from({ length: 6 }, () => `<span class="haki-bolt"></span>`).join("");
        page?.appendChild(aura);
        return aura;
      }

      async function playRescueSuccessAnimation() {
        const targetIndex = currentSlotIndex();
        if (!state.slots[targetIndex]?.cardId) return false;
        const rescueAssetsReady = preloadRescueAssets();
        state.animating = true;
        state.selectedSlotIndex = targetIndex;
        state.rulesActive = false;
        state.modalAfterClose = "";
        $("modalBack").classList.remove("show");
        render();
        renderHud();
        await sleep(80);
        const wrap = document.querySelector(`[data-slot-index="${targetIndex + 1}"]`);
        const slotImg = wrap?.querySelector(".slot-img");
        if (!wrap || !slotImg) {
          state.animating = false;
          renderHud();
          return false;
        }
        wrap.classList.add("execution-playing");
        const guard = document.createElement("img");
        guard.className = "execution-cut-guard execution-raise-guard";
        guard.alt = "處刑守衛";
        guard.src = `${executionCutAnimationUrl}?raise=${Date.now()}`;
        wrap.appendChild(guard);
        await sleep(5000);
        await rescueAssetsReady;
        guard.src = executionTopGuardFrameUrl;
        await nextFrame();
        const page = document.querySelector(".marineford");
        await playConquerorIntroVideo(page);
        const splitGuard = createConquerorGuardSplit(wrap, true);
        await nextFrame();
        guard.remove();
        splitGuard.classList.remove("waiting");
        const shock = document.createElement("div");
        shock.className = "rescue-shock";
        shock.innerHTML = `<span class="rescue-cracks"></span>`;
        wrap.appendChild(shock);
        const aura = createConquerorPageAura(page);
        page?.classList.remove("conqueror-page-shock");
        if (page) void page.offsetWidth;
        page?.classList.add("conqueror-page-shock");
        await sleep(1200);
        state.slots.forEach((slot) => { slot.rescued = true; });
        wrap.querySelector(".timer-badge")?.remove();
        slotImg.innerHTML = renderImage(portrait(state.slots[targetIndex].cardId, "normal"), nameOf(state.slots[targetIndex].cardId));
        slotImg.classList.add("is-rescued");
        await sleep(1700);
        page?.classList.remove("conqueror-page-shock");
        splitGuard.remove();
        shock.remove();
        aura?.remove();
        return true;
      }

      function openSuccessAnimationPrompt() {
        if (state.animating) return;
        state.successConfirmPending = true;
        state.resultModalShown = true;
        const targetIndex = currentSlotIndex();
        const targetSlot = state.slots[targetIndex] || {};
        openModal("救援成功", `
          <div class="grid">
            <article class="select-card" style="min-height:180px">
              <div>
                <b>${targetSlot.cardId ? nameOf(targetSlot.cardId) : "處刑台角色"}</b>
                <span class="card-meta">已突破海軍本部。按下確認後播放救援成功動畫。</span>
              </div>
            </article>
            <article class="select-card" style="min-height:180px">
              <div>
                <b>救援結算</b>
                <span class="card-meta">${state.mode === "wipe" ? "救回自己的夥伴並取得 3D2Y 的報紙。" : "救出白鬍子海賊團成員後，可以決定是否加入隊伍；滿員時可選擇替換。"}</span>
              </div>
            </article>
          </div>
          <div class="tool-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn primary" type="button" data-confirm-success-animation>確認救援成功</button>
          </div>
        `);
      }

      async function resolveSuccessAfterConfirm() {
        if (state.animating) return;
        state.successConfirmPending = false;
        await playRescueSuccessAnimation();
        state.started = false;
        state.finished = true;
        state.win = true;
        state.helpers = [];
        state.slots.forEach((slot) => { if (slot.cardId) slot.rescued = true; });
        if (!state.rewards.includes("3D2Y 的報紙")) state.rewards.push("3D2Y 的報紙");
        state.successAnimationDone = true;
        state.animating = false;
        render();
        if (state.mode !== "wipe" && state.slots.some((slot) => slot.source === "whitebeard" && slot.cardId && !state.joinedWhitebeard.has(slot.cardId))) openJoinModal();
        else openResultModal();
      }

      async function finishRaid(win) {
        if (state.finished || state.animating) return;
        if (!win) {
          openFailureAnimationPrompt();
          return;
        }
        openSuccessAnimationPrompt();
      }

      function openResultModal() {
        const title = state.win ? "救援成功" : "處刑台失守";
        openModal(title, `
          <div class="grid">
            <article class="select-card" style="min-height:180px">
              <b>${state.win ? "通關獎勵" : "失敗處理"}</b>
              <span class="card-meta">${state.win ? "取得 3D2Y 的報紙，救回處刑台角色。" : state.mode === "wipe" ? "處刑台角色已從隊伍移除，回到卡池重新招募；修練與額外數值清除；剩餘隊伍回到羅格鎮重新出發。" : "處刑台白鬍子角色已消失鎖定。"}</span>
            </article>
            <article class="select-card" style="min-height:180px">
              <b>處刑台</b>
              <div class="tool-row" style="justify-content:flex-start">${crewNames(state.slots.map((slot) => slot.cardId))}</div>
            </article>
          </div>
          ${BOARD_MODE ? `<div class="tool-row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" type="button" data-close-raid>返回地圖</button></div>` : ""}
        `);
      }

      function openJoinModal() {
        const pendingJoin = state.slots.some((slot) => slot.source === "whitebeard" && slot.cardId && !state.joinedWhitebeard.has(slot.cardId));
        openModal("是否加入隊伍", `
          <div class="dialog-sub" style="margin-bottom:10px">通關後，處刑台上的白鬍子卡池角色可以選擇加入對應玩家隊伍；隊伍滿 6 人時可選擇替換一位。</div>
          <div class="grid">
            ${state.slots.map((slot, index) => {
              const player = playerById(slot.playerId);
              const full = !player || player.crew.length >= 6;
              const joined = state.joinedWhitebeard.has(slot.cardId) || player?.crew.includes(slot.cardId);
              return `
                <article class="select-card">
                  <img src="${portrait(slot.cardId)}" alt="${nameOf(slot.cardId)}" onerror="this.hidden=true">
                  <div>
                    <b>${fullNameOf(slot.cardId)}</b>
                    <span class="card-meta">${slot.playerName} ・ 隊伍 ${player?.crew.length || 0}/6 ・ ${joined ? "已加入" : full ? "可替換加入" : "可加入"}</span>
                    <div class="tool-row" style="justify-content:flex-start;margin-top:8px">
                      <button class="btn primary" type="button" data-join-slot="${index}" ${joined || !player ? "disabled" : ""}>${full ? "選擇替換" : "加入隊伍"}</button>
                      <button class="btn" type="button" data-decline-slot="${index}" ${joined ? "disabled" : ""}>不加入</button>
                    </div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
          ${BOARD_MODE && !pendingJoin ? `<div class="tool-row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" type="button" data-close-raid>返回地圖</button></div>` : ""}
        `);
      }

      function openJoinReplaceModal(slotIndex) {
        const slot = state.slots[slotIndex];
        const player = playerById(slot?.playerId);
        if (!slot?.cardId || !player) {
          openJoinModal();
          return;
        }
        openModal("選擇替換成員", `
          <div class="dialog-sub" style="margin-bottom:10px">${fullNameOf(slot.cardId)} 要加入 ${player.name} 的隊伍，請選擇要替換掉的角色。</div>
          <div class="grid">
            ${player.crew.map((cardId, replaceIndex) => `
              <button class="select-card" type="button" data-replace-join-slot="${slotIndex}" data-replace-crew-index="${replaceIndex}">
                <img src="${portrait(cardId)}" alt="${nameOf(cardId)}" onerror="this.hidden=true">
                <div>
                  <b>${fullNameOf(cardId)}</b>
                  <span class="card-meta">替換後會回到可招募池；攜帶物會回到背包。</span>
                </div>
              </button>
            `).join("")}
          </div>
          <div class="tool-row" style="justify-content:flex-end;margin-top:14px">
            <button class="btn" type="button" data-back-join-modal>返回</button>
          </div>
        `);
      }

      function joinSlotToLocalTeam(slotIndex, replaceCrewIndex = -1) {
        const slot = state.slots[slotIndex];
        const player = playerById(slot?.playerId);
        if (!slot?.cardId || !player) return false;
        if (player.crew.includes(slot.cardId) || state.joinedWhitebeard.has(slot.cardId)) return false;
        if (player.crew.length >= 6) {
          if (replaceCrewIndex < 0 || replaceCrewIndex >= player.crew.length) return false;
          player.crew.splice(replaceCrewIndex, 1, slot.cardId);
        } else {
          player.crew.push(slot.cardId);
        }
        state.joinedWhitebeard.add(slot.cardId);
        sendBoardCommand("joinSlot", { slotIndex, cardId: slot.cardId, replaceCrewIndex });
        render();
        if (state.slots.some((entry) => entry.source === "whitebeard" && entry.cardId && !state.joinedWhitebeard.has(entry.cardId))) openJoinModal();
        else openResultModal();
        return true;
      }

      function render() {
        renderSlots();
        renderSides();
        renderPhases();
        renderHormonePanel();
        renderHud();
      }

      document.querySelectorAll("[data-debug-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.debugMode || "wipe";
          resetScenario();
        });
      });
      document.querySelectorAll("[data-debug-count]").forEach((button) => {
        button.addEventListener("click", () => {
          state.count = Math.max(1, Math.min(4, Number(button.dataset.debugCount || 1)));
          resetScenario();
        });
      });
      $("poolBtn").addEventListener("click", openPoolModal);
      $("teamBtn").addEventListener("click", openTeamModal);
      $("rerollBtn").addEventListener("click", handleAdjustAction);
      $("startBtn").addEventListener("click", handlePrimaryAction);
      $("battleBtn").addEventListener("click", startBattleFromEnemy);
      $("rescueDiceBtn").addEventListener("click", rollRescueDie);
      $("stallBtn").addEventListener("click", stall);
      $("hormonePanel").addEventListener("click", () => openHormoneModal());
      $("debugWinBtn").addEventListener("click", async () => {
        await winBattle();
        if (state.finished) setDebugMenu(false);
        else renderHud();
      });
      $("debugLoseBtn").addEventListener("click", async () => {
        await finishRaid(false);
        setDebugMenu(false);
      });
      $("debugResetBtn").addEventListener("click", () => {
        closeModal();
        hardResetDemo();
      });
      $("debugCloseBtn").addEventListener("click", () => setDebugMenu(false));
      $("debugBack").addEventListener("click", (event) => {
        if (event.target === $("debugBack")) setDebugMenu(false);
      });
      document.addEventListener("click", async (event) => {
        if (event.target.closest("[data-open-battle]")) {
          handleBossCardAction();
          return;
        }
        const changeLeader = event.target.closest("[data-change-leader]")?.dataset.changeLeader;
        if (changeLeader !== undefined) {
          openLeaderModal(Number(changeLeader));
          return;
        }
        const viewSlot = event.target.closest("[data-view-slot]")?.dataset.viewSlot;
        if (viewSlot === undefined) return;
        state.selectedSlotIndex = Math.max(0, Math.min(state.slots.length - 1, Number(viewSlot)));
        render();
      });
      document.addEventListener("click", (event) => {
        const playerId = event.target.closest("[data-hormone-player]")?.dataset.hormonePlayer;
        if (!playerId) return;
        useHormone(playerId);
      });
      $("modalBack").addEventListener("click", async (event) => {
        if (event.target.closest("[data-rules-continue]")) {
          state.rulesAckPending = true;
          closeModal();
          return;
        }
        if (event.target.closest("[data-close-raid]")) {
          sendBoardCommand("close", {});
          closeModal();
          return;
        }
        if (event.target === $("modalBack") || event.target.closest("[data-close-modal]")) {
          closeModal();
          return;
        }
        const battleResult = event.target.closest("[data-battle-result]")?.dataset.battleResult;
        if (battleResult) {
          closeModal();
          if (battleResult === "win") await winBattle();
          else await finishRaid(false);
          return;
        }
        if (event.target.closest("[data-confirm-failure-animation]")) {
          await resolveFailureAfterConfirm();
          return;
        }
        if (event.target.closest("[data-confirm-success-animation]")) {
          await resolveSuccessAfterConfirm();
          return;
        }
        const startLottery = event.target.closest("[data-start-lottery]")?.dataset.startLottery;
        if (startLottery) {
          if (startLottery === "crew") drawWipeCrewCaptives();
          else if (startLottery === "support") drawWipeSupport();
          return;
        }
        if (event.target.closest("[data-continue-lottery-flow]")) {
          closeModal();
          return;
        }
        if (event.target.closest("[data-start-ready-battle]")) {
          startBattleFromEnemy();
          return;
        }
        if (event.target.closest("[data-confirm-battle-start]")) {
          startBattleFromEnemy();
          return;
        }
        if (event.target.closest("[data-continue-setup]")) {
          continueSetupFlow();
          return;
        }
        const leaderButton = event.target.closest("[data-set-leader]");
        if (leaderButton) {
          setLeaderForPlayer(leaderButton.dataset.leaderPlayer, leaderButton.dataset.setLeader);
          closeModal();
          render();
          return;
        }
        const slotIndex = event.target.closest("[data-select-slot]")?.dataset.selectSlot;
        if (slotIndex !== undefined) {
          state.selectedSlotIndex = Number(slotIndex);
          openSelectModal(true);
          return;
        }
        const selectedId = event.target.closest("[data-select-wb]")?.dataset.selectWb;
        if (selectedId && state.slots[state.selectedSlotIndex]) {
          openExecutionConfirmModal(selectedId);
          return;
        }
        const confirmWb = event.target.closest("[data-confirm-wb]")?.dataset.confirmWb;
        if (confirmWb) {
          assignWhitebeardToExecution(confirmWb);
          return;
        }
        if (event.target.closest("[data-change-wb]")) {
          openSelectModal(true);
          return;
        }
        const joinSlot = event.target.closest("[data-join-slot]")?.dataset.joinSlot;
        if (joinSlot !== undefined) {
          const slot = state.slots[Number(joinSlot)];
          const player = playerById(slot?.playerId);
          if (slot && player && player.crew.length >= 6 && !player.crew.includes(slot.cardId) && !state.joinedWhitebeard.has(slot.cardId)) openJoinReplaceModal(Number(joinSlot));
          else joinSlotToLocalTeam(Number(joinSlot));
          return;
        }
        const replaceJoinButton = event.target.closest("[data-replace-join-slot]");
        if (replaceJoinButton) {
          joinSlotToLocalTeam(Number(replaceJoinButton.dataset.replaceJoinSlot), Number(replaceJoinButton.dataset.replaceCrewIndex));
          return;
        }
        if (event.target.closest("[data-back-join-modal]")) {
          openJoinModal();
          return;
        }
        const declineSlot = event.target.closest("[data-decline-slot]")?.dataset.declineSlot;
        if (declineSlot !== undefined) {
          const slot = state.slots[Number(declineSlot)];
          if (slot) {
            sendBoardCommand("declineSlot", { slotIndex: Number(declineSlot), cardId: slot.cardId });
            state.slots = state.slots.filter((entry) => entry !== slot);
            render();
            if (state.slots.some((entry) => entry.source === "whitebeard" && entry.cardId && !state.joinedWhitebeard.has(entry.cardId))) openJoinModal();
            else openResultModal();
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (!BOARD_MODE && (event.key === "F2" || (event.ctrlKey && event.shiftKey && key === "m"))) {
          event.preventDefault();
          setDebugMenu(!$("debugBack").classList.contains("show"));
        } else if (event.key === "Escape") {
          closeModal();
          setDebugMenu(false);
        }
      });
      if (BOARD_MODE) {
        window.addEventListener("message", (event) => {
          if (event?.data?.type === "board-marineford-update") readBoardSnapshot();
        });
        window.addEventListener("storage", readBoardCommandResult);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) readBoardSnapshot();
        });
        if (!readBoardSnapshot()) render();
        window.setInterval(readBoardSnapshot, 500);
        sendBoardCommand("ready", {});
      } else {
        resetScenario();
      }
    })();
  </script>
</body>
</html>
