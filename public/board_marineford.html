<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>頂上戰爭篇示範</title>
  <style>
    :root {
      --ink: #f8eed8;
      --muted: #d4c39e;
      --gold: #f1bf58;
      --gold2: #ffe6a8;
      --red: #cf4d3a;
      --panel: rgba(7, 12, 17, .84);
      --panel2: rgba(8, 13, 20, .96);
      --line: rgba(255, 229, 177, .24);
      --line2: rgba(255, 229, 177, .58);
      --ice: #8edcff;
      --light: #ffe58d;
      --magma: #ff7442;
      --sea: #5bb8c9;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; background: #07090d; color: var(--ink); }
    button { font: inherit; color: inherit; }

    .marineford {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      background-image:
        linear-gradient(180deg, rgba(5, 7, 10, .16), rgba(5, 7, 10, .78)),
        url("images/board/marineford/backgrounds/marineford_stage_bg.webp"),
        url("images/board/islands/marineford_island.webp");
      background-size: cover, cover, cover;
      background-position: center, center 44%, center 44%;
    }

    .marineford.conqueror-page-shock {
      animation: conquerorPageShake 2.7s cubic-bezier(.16, .74, .22, 1) forwards;
      transform-origin: center center;
      will-change: transform;
      backface-visibility: hidden;
    }

    .conqueror-video-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      background: #020308;
      opacity: 0;
      pointer-events: none;
      animation: conquerorVideoIn .22s ease forwards;
    }

    .conqueror-video-layer.needs-sound {
      pointer-events: auto;
      cursor: pointer;
    }

    .conqueror-video-layer.fade-out {
      animation: conquerorVideoOut .28s ease forwards;
    }

    .conqueror-video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .conqueror-video-sound-prompt {
      position: absolute;
      left: 50%;
      bottom: 13vh;
      transform: translateX(-50%);
      min-width: 240px;
      height: 50px;
      border: 1px solid rgba(255, 238, 188, .72);
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(26, 33, 43, .94), rgba(9, 13, 19, .96));
      box-shadow: 0 0 28px rgba(114, 210, 255, .24), inset 0 0 18px rgba(255, 255, 255, .08);
      color: var(--gold2);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .conqueror-page-aura {
      position: absolute;
      inset: -12vh -10vw;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .42), transparent 8%),
        radial-gradient(circle at 50% 48%, rgba(142, 213, 255, .45), transparent 29%),
        radial-gradient(circle at 50% 52%, rgba(4, 16, 31, .82), transparent 58%);
      will-change: opacity, transform;
      animation: conquerorPageAura 2.55s ease forwards;
    }

    .conqueror-page-aura::before,
    .conqueror-page-aura::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118vw;
      height: 70vh;
      border: 4px solid rgba(219, 245, 255, .86);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.28);
      opacity: 0;
      animation: conquerorPageRing 2.25s ease forwards;
    }

    .conqueror-page-aura::after {
      width: 145vw;
      height: 86vh;
      border-color: rgba(86, 169, 219, .58);
      animation-delay: .12s;
    }

    .haki-bolt {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(74vw, 980px);
      height: 5px;
      transform-origin: left center;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), rgba(121, 211, 255, .9), transparent);
      opacity: 0;
      animation: conquerorBolt 1.85s ease forwards;
    }

    .haki-bolt:nth-child(1) { --bolt-angle: 18deg; animation-delay: .04s; }
    .haki-bolt:nth-child(2) { --bolt-angle: 156deg; animation-delay: .11s; }
    .haki-bolt:nth-child(3) { --bolt-angle: 78deg; animation-delay: .18s; }
    .haki-bolt:nth-child(4) { --bolt-angle: 122deg; animation-delay: .25s; }
    .haki-bolt:nth-child(5) { --bolt-angle: -28deg; animation-delay: .32s; }
    .haki-bolt:nth-child(6) { --bolt-angle: -72deg; animation-delay: .39s; }

    .marineford::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(3, 6, 10, .96), rgba(3, 6, 10, .18) 30%, rgba(3, 6, 10, .18) 70%, rgba(3, 6, 10, .96)),
        linear-gradient(180deg, rgba(5, 9, 15, .05), rgba(5, 9, 15, .72) 62%, rgba(3, 5, 8, .9)),
        radial-gradient(circle at 50% 14%, rgba(255, 219, 139, .13), transparent 28%);
      pointer-events: none;
    }

    .marineford::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 42vh;
      z-index: -1;
      background: linear-gradient(180deg, transparent, rgba(4, 7, 10, .86));
      pointer-events: none;
    }

    .top-hud {
      position: absolute;
      inset: 16px 20px auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: start;
      z-index: 4;
      pointer-events: none;
    }

    .title small,
    .chip span,
    .slot small,
    .card-meta,
    .dialog-sub {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .05em;
    }

    .title h1 {
      margin: 2px 0 0;
      font-size: clamp(29px, 3.5vw, 48px);
      line-height: .9;
      text-shadow: 0 6px 24px rgba(0, 0, 0, .62);
    }

    .raid-summary, .status-row, .tool-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
    }

    .raid-summary {
      min-width: 300px;
      align-self: start;
      flex-direction: column;
      gap: 2px;
      border: 1px solid rgba(241, 191, 88, .36);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(14, 26, 36, .9), rgba(7, 10, 15, .82));
      padding: 9px 15px 10px;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .34);
    }

    .raid-summary span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .raid-summary strong {
      color: var(--gold);
      font-size: 20px;
      line-height: 1.1;
    }

    .status-row { justify-content: flex-end; }

    .tab, .btn, .icon-btn, .count-btn {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(6, 10, 15, .7);
      min-height: 38px;
      padding: 0 13px;
      cursor: pointer;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }

    .tab:hover, .btn:hover, .icon-btn:hover, .count-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line2);
      background: rgba(30, 35, 44, .9);
    }

    .tab.active, .count-btn.active, .btn.primary {
      border-color: rgba(241, 191, 88, .78);
      background: linear-gradient(180deg, rgba(111, 72, 29, .9), rgba(46, 28, 17, .94));
    }

    .btn.danger {
      border-color: rgba(207, 77, 58, .76);
      background: linear-gradient(180deg, rgba(116, 34, 27, .94), rgba(49, 19, 17, .94));
    }

    .btn.rescue-dice {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-color: rgba(255, 223, 128, .78);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, .28), transparent 28%),
        linear-gradient(180deg, rgba(145, 82, 22, .98), rgba(72, 34, 12, .98));
      color: #fff0bd;
      box-shadow: 0 0 18px rgba(241, 191, 88, .22), inset 0 1px rgba(255,255,255,.15);
    }

    .chip.execution-countdown {
      min-width: 210px;
      display: grid;
      grid-template-columns: minmax(72px, 1fr) auto;
      grid-template-areas:
        "label action"
        "count action";
      column-gap: 10px;
      align-items: center;
    }

    .chip.execution-countdown span {
      grid-area: label;
    }

    .chip.execution-countdown strong {
      grid-area: count;
      white-space: nowrap;
    }

    .chip.execution-countdown .btn.rescue-dice {
      grid-area: action;
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tab:disabled, .btn:disabled, .icon-btn:disabled, .count-btn:disabled {
      opacity: .4;
      transform: none;
      cursor: default;
    }

    .chip {
      min-width: 96px;
      border: 1px solid rgba(255, 229, 177, .2);
      border-radius: 8px;
      background: rgba(5, 9, 14, .78);
      padding: 7px 10px;
      box-shadow: inset 0 1px rgba(255,255,255,.04);
    }

    .chip strong {
      display: block;
      color: var(--gold);
      font-size: 19px;
      line-height: 1.05;
    }

    .stage {
      position: absolute;
      inset: 90px 18px 18px;
      display: grid;
      grid-template-columns: minmax(230px, 280px) minmax(420px, 1fr) minmax(190px, 270px);
      gap: 16px;
      align-items: stretch;
    }

    .side-lineup {
      display: grid;
      gap: 10px;
      align-content: center;
      min-height: 100%;
      pointer-events: none;
    }

    .execution-intel {
      pointer-events: auto;
      align-content: start;
      padding-top: 0;
      transform: translateY(-22px);
    }

    .intel-panel {
      display: grid;
      gap: 8px;
    }

    .intel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 0 2px 1px;
      color: var(--gold);
      font-weight: 900;
    }

    .intel-head small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .intel-list {
      display: grid;
      gap: 8px;
    }

    .intel-card {
      width: 100%;
      border: 1px solid rgba(255, 229, 177, .16);
      border-radius: 8px;
      background: rgba(4, 8, 13, .72);
      color: var(--ink);
      padding: 9px 10px;
      text-align: left;
      cursor: default;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }

    button.intel-card {
      cursor: pointer;
    }

    .intel-card.self {
      border-color: rgba(241, 191, 88, .42);
      background: linear-gradient(180deg, rgba(40, 29, 15, .78), rgba(5, 8, 13, .72));
    }

    .intel-card:hover {
      transform: translateY(-1px);
      border-color: rgba(241, 191, 88, .54);
      background: rgba(23, 29, 38, .9);
    }

    .intel-card span,
    .intel-card small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .intel-card b {
      display: block;
      margin: 3px 0 4px;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.1;
    }

    .intel-card strong {
      color: var(--gold);
      font-size: 13px;
      line-height: 1.2;
    }

    .intel-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .intel-actions button {
      min-height: 28px;
      border: 1px solid rgba(241, 191, 88, .34);
      border-radius: 7px;
      background: rgba(31, 23, 14, .86);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
      cursor: pointer;
    }

    .intel-actions button:hover {
      border-color: rgba(241, 191, 88, .7);
      background: rgba(70, 45, 20, .92);
    }

    .intel-empty {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .fighter-card {
      position: relative;
      min-height: 196px;
      border: 1px solid rgba(255, 229, 177, .2);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(12, 20, 28, .58), rgba(5, 8, 13, .92));
      overflow: hidden;
      display: grid;
      align-content: end;
      padding: 12px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, .34), inset 0 1px rgba(255,255,255,.05);
    }

    .fighter-card.main { min-height: 330px; }
    #bossLineup {
      align-content: start;
      padding-top: clamp(24px, 4.2vh, 34px);
      pointer-events: auto;
    }

    #bossLineup.raid-cleared {
      pointer-events: none;
    }

    #bossLineup .fighter-card.main {
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    #bossLineup .fighter-card.main:hover {
      transform: translateY(-2px);
      border-color: rgba(142, 220, 255, .78) !important;
      box-shadow: 0 20px 54px rgba(0,0,0,.42), 0 0 22px rgba(142,220,255,.2);
    }

    .battle-prompt {
      margin-top: 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      letter-spacing: .08em;
      text-shadow: 0 2px 7px rgba(0,0,0,.9), 0 0 14px rgba(241,191,88,.28);
      animation: battleFloat 1.55s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes battleFloat {
      0%, 100% { transform: translateY(0); opacity: .78; }
      50% { transform: translateY(-7px); opacity: 1; }
    }
    .fighter-card.helper { min-height: 174px; }
    .fighter-card.text-only {
      min-height: 82px;
      padding: 10px 12px;
      align-content: center;
    }

    .enemy-title {
      position: relative;
      z-index: 3;
      width: min(220px, calc(100% - 18px));
      margin: 0 auto -2px;
      border-top: 1px solid rgba(142, 220, 255, .52);
      border-bottom: 1px solid rgba(142, 220, 255, .52);
      background:
        linear-gradient(90deg, transparent, rgba(7, 24, 35, .92) 18%, rgba(6, 12, 20, .98) 50%, rgba(7, 24, 35, .92) 82%, transparent);
      color: var(--ice);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .18em;
      line-height: 1;
      padding: 8px 12px 7px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,.88), 0 0 18px rgba(142,220,255,.26);
      pointer-events: none;
    }

    .enemy-title::before,
    .enemy-title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 28px;
      height: 1px;
      background: rgba(142, 220, 255, .72);
      box-shadow: 0 0 10px rgba(142, 220, 255, .34);
    }

    .enemy-title::before { left: 10px; }
    .enemy-title::after { right: 10px; }

    .enemy-title span {
      position: relative;
      z-index: 1;
    }

    .enemy-title.defeated {
      border-color: rgba(241, 191, 88, .64);
      background:
        linear-gradient(90deg, transparent, rgba(58, 41, 19, .92) 18%, rgba(16, 12, 7, .98) 50%, rgba(58, 41, 19, .92) 82%, transparent);
      color: var(--gold2);
    }

    .fighter-card.defeated {
      min-height: 116px;
      border-color: rgba(241, 191, 88, .32);
      background: linear-gradient(180deg, rgba(44, 31, 16, .72), rgba(5, 8, 13, .84));
    }

    .fighter-img {
      position: absolute;
      inset: 10px 10px 62px;
      display: grid;
      place-items: end center;
      overflow: hidden;
      border-radius: 7px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.14));
    }

    .fighter-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 20px rgba(0, 0, 0, .58));
    }

    .fallback-face {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      border: 2px solid var(--line2);
      border-radius: 50%;
      background: rgba(0, 0, 0, .4);
      color: var(--gold);
      font-size: 34px;
      font-weight: 800;
    }

    .fighter-copy {
      position: relative;
      z-index: 1;
      margin: 0 -12px -12px;
      padding: 70px 12px 12px;
      background: linear-gradient(180deg, transparent, rgba(4, 7, 12, .96) 38%);
    }

    .fighter-copy b {
      display: block;
      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.08;
    }

    .fighter-card.text-only .fighter-copy {
      margin: 0;
      padding: 0;
      background: none;
    }

    .execution-zone {
      --platform-x: 50%;
      --platform-y: -426px;
      --platform-w: 94%;
      --platform-maxh: 635px;
      --platform-opacity: .82;
      --platform-frame-y: 170px;
      --platform-frame-h: 60px;
      --platform-frame-w: 64%;
      --slots-y: 140px;
      --slots-w: 73%;
      --slot-card-x: 0px;
      --slot-card-y: 112px;
      --slot-w: 166px;
      --slot-h: 264px;
      --slot-img-h: 250px;
      --slot-img-scale: 1.13;
      --slot-img-x: 0px;
      --slot-img-y: 4px;
      --slot-guard-x: 0px;
      --guard-w: 410%;
      --guard-y: -120px;
      --guard-h: 574px;
      --guard-opacity: .95;
      --cut-guard-x: -3px;
      --cut-guard-y: -13px;
      --slot-timer-space: 67px;
      --timer-x: -2px;
      --timer-y: -61px;
      --timer-size: 19px;
      position: relative;
      min-height: 100%;
      display: grid;
      align-items: center;
      justify-items: center;
      pointer-events: none;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .execution-zone::before {
      content: "";
      display: none;
      position: absolute;
      left: 50%;
      bottom: var(--platform-frame-y);
      width: min(var(--platform-frame-w), 900px);
      height: var(--platform-frame-h);
      transform: translateX(-50%);
      border: 1px solid rgba(241, 191, 88, .22);
      border-radius: 8px;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(255,255,255,.08) 10% 10.4%, transparent 10.4% 20%),
        linear-gradient(180deg, rgba(109, 56, 39, .38), rgba(33, 21, 17, .62));
      opacity: .74;
    }

    .platform-img {
      position: absolute;
      left: var(--platform-x);
      bottom: var(--platform-y);
      transform: translateX(-50%);
      width: var(--platform-w);
      max-height: var(--platform-maxh);
      object-fit: contain;
      opacity: var(--platform-opacity);
      filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .52));
    }

    .platform-fallback {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(94%, 850px);
      height: 230px;
      border: 2px solid rgba(241, 191, 88, .34);
      border-radius: 10px 10px 4px 4px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 3px, transparent 3px 36px),
        linear-gradient(180deg, rgba(108, 57, 39, .62), rgba(34, 22, 17, .9));
    }

    .execution-slots {
      position: relative;
      z-index: 1;
      width: min(var(--slots-w), 1120px);
      display: grid;
      grid-template-columns: repeat(var(--slot-count, 1), max-content);
      gap: clamp(10px, 1.8vw, 24px);
      justify-content: center;
      align-self: center;
      margin-bottom: var(--slots-y);
    }

    .slot-wrap {
      position: relative;
      width: var(--slot-card-w, var(--slot-w));
      min-height: calc(var(--slot-card-h, var(--slot-h)) + var(--slot-timer-space));
      padding-top: var(--slot-timer-space);
      overflow: visible;
    }

    .slot-wrap.has-card::before {
      content: "";
      position: absolute;
      left: calc(50% + var(--slot-guard-x, 0px));
      top: calc(var(--slot-guard-y, var(--guard-y)) + var(--slot-timer-space));
      z-index: 3;
      width: var(--slot-guard-w, var(--guard-w));
      height: var(--slot-guard-h, var(--guard-h));
      transform: translateX(-50%);
      background: url("images/board/marineford/props/execution_guard_crossed_swords.png") center center / contain no-repeat;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.56));
      opacity: var(--guard-opacity);
      pointer-events: none;
    }

    .slot-wrap.execution-playing::before {
      opacity: 0;
      transition: opacity .18s ease;
    }

    .slot-wrap.rescued::before {
      display: none;
    }

    .execution-cut-guard {
      position: absolute;
      left: calc(50% + var(--slot-guard-x, 0px) + var(--cut-guard-x, 0px));
      top: calc(var(--slot-guard-y, var(--guard-y)) + var(--slot-timer-space) + var(--cut-guard-y, 0px));
      z-index: 7;
      width: var(--slot-guard-w, var(--guard-w));
      height: var(--slot-guard-h, var(--guard-h));
      transform: translateX(-50%);
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.66));
      pointer-events: none;
    }

    .rescue-shock {
      position: absolute;
      left: 50%;
      top: calc(var(--slot-timer-space) + 52px);
      z-index: 9;
      width: 470%;
      height: 330px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      animation: conquerorShockBurst 2.05s ease forwards;
    }

    .rescue-shock::before,
    .rescue-shock::after {
      content: "";
      position: absolute;

    .lottery-running-modal > .lottery-stage.reel-count-1 .lottery-result strong {
      font-size: clamp(14px, 1.3vw, 20px);
    }

    .lottery-running-modal > .lottery-stage.reel-count-2 {
      top: 38%;
      height: auto;
      grid-template-rows: auto;
    }

    .lottery-running-modal > .lottery-stage.reel-count-4 {
      left: 12%;
      top: 25.1%;
      width: 76%;
      height: 56.1%;
      gap: 0 1.2%;
      align-content: stretch;
      overflow: hidden;
    }

    .lottery-running-modal > .lottery-stage.reel-count-4 .lottery-reel {
      height: 100%;
      aspect-ratio: auto;
      align-self: stretch;
    }

    .lottery-reel {
      position: relative;
      width: 100%;
      min-height: 0;
      aspect-ratio: 2.16 / 1;
      align-self: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: hidden;
    }

    .lottery-reel::before,
    .lottery-reel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("images/board/marineford_ui/marineford_player_lottery_reel_frame.webp") center / 100% 100% no-repeat;
      pointer-events: none;
    }

    .lottery-reel::before {
      z-index: 0;
    }

    .lottery-reel::after {
      z-index: 3;
    }

    .lottery-reel > small {
      position: absolute;
      left: 33%;
      top: 7%;
      z-index: 4;
      width: 34%;
      height: 16%;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f0d79d;
      font-size: clamp(9px, .78vw, 13px);
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lottery-reel .lottery-lane {
      position: absolute;
      left: 9%;
      top: 25%;
      z-index: 1;
      width: 82%;
      height: 49%;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: rgba(3, 8, 14, .42);
      box-shadow: none;
      overflow: hidden;
    }

    .lottery-reel .lottery-lane::before {
      display: none;
    }

    .lottery-reel .lottery-track {
      position: relative;
      z-index: 1;
      height: 100%;
      gap: 6px;
      padding: 0 4px;
    }

    .lottery-reel .lottery-token {
      flex: 0 0 clamp(54px, 5.5vw, 78px);
      height: calc(100% - 10px);
      margin: 5px 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      place-items: center;
      gap: 1px;
      padding: 2px 3px;
      border: 0;
      border-radius: 3px;
      background: rgba(5, 12, 20, .82);
      box-shadow: none;
    }

    .lottery-reel .lottery-token.hit {
      border: 0;
      background: rgba(36, 27, 13, .9);
      filter: brightness(1.12);
    }

    .lottery-reel .lottery-token img {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center top;
      filter: none;
    }

    .lottery-reel .lottery-token b {
      width: 100%;
      overflow: hidden;
      color: #f1e4c5;
      font-size: clamp(6px, .58vw, 9px);
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lottery-reel .lottery-result {
      position: absolute;
      left: 10%;
      top: 78%;
      z-index: 4;
      width: 80%;
      height: 15%;
      margin: 0;
      display: grid;
      grid-template-columns: 28% 44% 28%;
      align-items: center;
      gap: 0;
      overflow: hidden;
      color: #c2d6dc;
      font-size: clamp(6px, .52vw, 9px);
      line-height: 1;
      text-align: center;
    }

    .lottery-reel .lottery-result > span,
    .lottery-reel .lottery-result > strong {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0 4%;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .lottery-reel .lottery-result strong {
      color: #f2d181;
      font-size: clamp(8px, .72vw, 12px);
      line-height: 1;
    }

    .lottery-result-modal > .result-grid {
      position: absolute;
      left: 14%;
      top: 25%;
      z-index: 4;
      width: 72%;
      height: 57%;
      display: grid;
      grid-template-columns: repeat(var(--lottery-result-count, 4), minmax(0, 1fr));
      gap: 1.6%;
      align-items: center;
      justify-content: center;
      justify-items: center;
    }

    .lottery-result-modal .result-card {
      position: relative;
      width: min(100%, 250px);
      min-height: 0;
      aspect-ratio: 4 / 5;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: url("images/board/marineford_ui/marineford_lottery_result_character_frame.webp") center / 100% 100% no-repeat;
      box-shadow: none;
      overflow: hidden;
    }

    .lottery-result-modal .result-card > img {
      position: absolute;
      left: 18.5%;
      top: 20%;
      width: 63%;
      height: 51%;
      display: block;
      border: 0;
      border-radius: 0;
      background: transparent;
      object-fit: cover;
      object-position: center top;
    }

    .lottery-result-modal .result-card > div {
      display: contents;
    }

    .lottery-result-modal .lottery-result-owner,
    .lottery-result-modal .result-card b,
    .lottery-result-modal .result-card .card-meta {
      box-sizing: border-box;
      position: absolute;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin: 0;
      padding: 0 5%;
      text-align: center;
    }

    .lottery-result-modal .lottery-result-owner {
      left: 25%;
      top: 9%;
      width: 50%;
      height: 10%;
      color: #d7e4e7;
      font-size: clamp(9px, .74vw, 12px);
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lottery-result-modal .result-card b {
      left: 20%;
      top: 73%;
      width: 60%;
      height: 8%;
      color: #f2dca9;
      font-size: clamp(10px, .9vw, 14px);
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lottery-result-modal .result-card .card-meta {
      left: 18%;
      top: 83%;
      width: 64%;
      height: 10%;
      color: #c3d9df;
      font-size: clamp(8px, .66vw, 11px);
      line-height: 1.15;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .lottery-result-modal > .tool-row > :only-child {
      grid-column: 2;
    }

    @media (max-width: 980px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      .marineford {
        min-height: 100dvh;
        padding-bottom: 0;
        overflow: hidden;
      }

      .top-hud,
      .stage {
        position: absolute;
        margin: 0;
      }

      .top-hud {
        inset: 0;
        padding-top: 0;
      }

      .stage {
        inset: 90px 18px 18px;
        grid-template-columns: minmax(210px, 26vw) minmax(360px, 1fr) minmax(170px, 24vw);
        min-height: 0;
        margin-top: 0;
      }

      .status-row {
        justify-content: initial;
      }

      .side-lineup {
        display: grid;
      }

      .execution-zone {
        min-height: 100%;
      }

      .execution-slots {
        grid-template-columns: repeat(var(--slot-count, 1), max-content);
        margin-bottom: var(--slots-y);
      }

      .slot {
        min-height: var(--slot-card-h, var(--slot-h));
      }
    }
  </style>
</head>
<body>
  <main class="marineford">
    <img class="marineford-ui-frame" src="images/board/marineford_ui/marineford_raid_panel_frame.webp" alt="" aria-hidden="true">
    <header class="top-hud">

      </section>

      <section class="status-row">

        <div class="chip execution-countdown">

          <strong id="remainingTurnsText">40 回合</strong>

      <aside class="side-lineup execution-intel" id="helperLineup"></aside>

    <div class="modal-back" id="modalBack">

    <div class="debug-back" id="debugBack" aria-hidden="true">
      <section class="debug-panel" id="debugPanel">
        <h2>海軍本部測試選單</h2>
        <span class="debug-hint">F2 或 Ctrl+Shift+M 開關；這裡只給測試切入口、玩家數與結算。</span>
        <div class="debug-section">
          <b>進入形式</b>

            <button class="count-btn" type="button" data-debug-count="2">2人</button>

          <button class="btn danger" type="button" id="debugLoseBtn">副本戰敗</button>

  </main>

  <script src="js/board_cards.js?v=20260817-opening-roster-tiers-v2"></script>
  <script>
    (() => {
      const cards = window.BoardCards?.cards || [];
      const byId = Object.fromEntries(cards.map((card) => [card.id, card]));
      const whitebeardIds = ["whitebeard", "ace", "marco", "jozu", "vista", "izo", "little_oars_jr", "squard"];
      const compactNames = {
        whitebeard: "白鬍子",
        ace: "艾斯",
        marco: "馬可",
        jozu: "喬茲",
        vista: "比斯塔",
        izo: "以藏",
        little_oars_jr: "小奧茲 Jr.",
        squard: "史庫亞德",
      };
      const recruitableCardIds = cards
        .filter((card) => card?.id && !String(card.id).startsWith("prison_"))
        .sort((a, b) => ({ T1: 1, T2: 2, T3: 3, T4: 4, T5: 5, T6: 6 }[a.tier] || 9) - ({ T1: 1, T2: 2, T3: 3, T4: 4, T5: 5, T6: 6 }[b.tier] || 9))
        .map((card) => card.id);
      const crewFromPreferred = (preferred, count = 5) => {
        const merged = [...preferred, ...recruitableCardIds].filter((id, index, list) => byId[id] && list.indexOf(id) === index);
        return merged.slice(0, count);
      };
      const basePlayers = [
        { id: "p1", name: "魯夫船長", crew: crewFromPreferred(["luffy", "zoro", "sanji", "nami", "robin"]) },
        { id: "p2", name: "索隆船長", crew: crewFromPreferred(["zoro", "brook", "franky", "jinbe", "carrot"]) },
        { id: "p3", name: "羅船長", crew: crewFromPreferred(["law", "kid", "killer", "hancock", "sabo"]) },
        { id: "p4", name: "大和船長", crew: crewFromPreferred(["yamato", "kuzan", "smoker", "tashigi", "koby"]) },
      ];
      const bosses = [
        { key: "aokiji", name: "青雉", phase: "第一戰", role: "冰凍果實能力者", tint: "var(--ice)" },
        { key: "kizaru", name: "黃猿", phase: "第二戰", role: "閃閃果實能力者", tint: "var(--light)" },
        { key: "akainu", name: "赤犬", phase: "第三戰", role: "岩漿果實能力者", tint: "var(--magma)" },
        { key: "sengoku", name: "戰國元帥", phase: "最終戰", role: "海軍本部元帥", tint: "var(--gold)" },
      ];
      const state = {
        mode: "wipe",
        count: 1,
        started: false,
        finished: false,
        win: false,
        setupStep: "drawCrew",
        bossIndex: 0,
        rounds: 40,
        players: JSON.parse(JSON.stringify(basePlayers)),
        slots: [],
        helpers: [],
        returnedCardPool: [],
        rewards: [],
        lostWhitebeard: new Set(),
        joinedWhitebeard: new Set(),
        rescueDice: 0,
        selectedSlotIndex: 0,
        nextLeader: {},
        hormoneUsed: {},
        hormoneBoost: {},
        rulesShown: false,
        rulesActive: false,
        rulesAckPending: false,
        modalAfterClose: "",
        pendingWhitebeardChoice: "",
        resultModalShown: false,
        failureConfirmPending: false,
        failureAnimationDone: false,
        successConfirmPending: false,
        successAnimationDone: false,
        animating: false,
      };
      const $ = (id) => document.getElementById(id);
      const pageQuery = new URLSearchParams(location.search);
      const BOARD_MODE = pageQuery.get("board") === "1";
      const MARINEFORD_SNAPSHOT_KEY = "onepiece-board-marineford-snapshot-v1";
      const MARINEFORD_COMMAND_KEY = "onepiece-board-marineford-command-v1";
      const MARINEFORD_COMMAND_RESULT_KEY = "onepiece-board-marineford-command-result-v1";
      const tier = (value) => ({ T1: "S", T2: "A", T3: "B", T4: "C", T5: "D", T6: "E" })[value] || value || "-";
      const nameOf = (id) => compactNames[id] || byId[id]?.name || id || "空位";
      const fullNameOf = (id) => byId[id]?.name || nameOf(id);
      const initials = (text) => String(text || "?").replace(/[·・／\s.]/g, "").slice(0, 2);
      const portrait = (id, mood = "normal") => byId[id]?.battlePortraits?.[mood] || `images/board/battle/portraits/${id}/${mood}.webp`;
      const enemyPortrait = (key, mood = "normal") => `images/board/battle/enemies/${key}/${mood}.webp`;
      const usedWhitebeards = () => new Set([...state.slots, ...state.helpers].map((entry) => entry.cardId).filter((id) => whitebeardIds.includes(id)));
      const limitSupportHelpers = (helpers) => {
        const usedPlayers = new Set();
        const usedCards = new Set();
        return (Array.isArray(helpers) ? helpers : []).filter((entry) => {
          const playerId = entry?.playerId || "";
          const cardId = entry?.cardId || "";
          if (!playerId || !whitebeardIds.includes(cardId) || usedPlayers.has(playerId) || usedCards.has(cardId)) return false;
          usedPlayers.add(playerId);
          usedCards.add(cardId);
          return true;
        });
      };
      const unavailableWhitebeards = () => new Set([...state.lostWhitebeard, ...state.joinedWhitebeard, ...usedWhitebeards()]);
      const availableWhitebeards = () => whitebeardIds.filter((id) => !unavailableWhitebeards().has(id));
      const activePlayers = () => state.players.slice(0, state.count);
      const pick = (list, seed) => list[Math.abs(Math.floor(seed * 9973)) % Math.max(1, list.length)] || "";
      const randomPick = (list) => list[Math.floor(Math.random() * Math.max(1, list.length))] || "";
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
      const executionCutAnimationUrl = "images/board/marineford/props/execution_cut_video/marine_execution_raise_then_cut_snap_footlock_24fps.webp";
      const executionTopGuardFrameUrl = "images/board/marineford/props/execution_cut_video/transparent_frames_24fps_raise_then_cut_snap_footlock/marine_execution_raise_cut_footlock24_122.png";
      const conquerorIntroVideoUrl = "images/board/marineford/props/haki/conqueror_intro.mp4";
      const executionTopGuardHalfUrls = {
        left: "images/board/marineford/props/execution_cut_video/conqueror_guard_halves/execution_guard_top_left.png",
        right: "images/board/marineford/props/execution_cut_video/conqueror_guard_halves/execution_guard_top_right.png",
      };
      const EXECUTION_TURNS = 40;
      const EXECUTION_BONUS_DICE_MAX = 6;
      const executionTurnsFor = () => EXECUTION_TURNS;

      function sendBoardCommand(type, payload = {}) {
        if (!BOARD_MODE) return null;
        const command = {
          id: `marineford-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
          type,
          payload,
        };
        try {
          localStorage.setItem(MARINEFORD_COMMAND_KEY, JSON.stringify(command));
        } catch (_) {}
        try {
          window.parent?.postMessage({ type: "board-marineford-command", command }, window.location.origin || "*");
        } catch (_) {}
        return command;
      }

      function setFromArray(value) {
        return new Set(Array.isArray(value) ? value.filter(Boolean) : []);
      }

      function applyBoardView(view) {
        if (!view || typeof view !== "object") return false;
        if (state.animating) return false;
        const wasFinished = state.finished;
        const wasRulesActive = state.rulesActive;
        const modalOpen = $("modalBack")?.classList.contains("show");
        const pendingModalAfterClose = state.modalAfterClose;
        const incomingFinished = Boolean(view.finished);
        const incomingWin = Boolean(view.win);
        state.mode = view.mode || "wipe";
        state.count = Math.max(1, Math.min(4, Number(view.count || view.players?.length || 1)));
        state.started = Boolean(view.started);
        state.finished = incomingFinished;
        state.win = incomingWin;
        state.setupStep = view.setupStep || (state.mode === "wipe" ? "drawCrew" : "chooseExecution");
        state.bossIndex = Math.max(0, Math.min(bosses.length - 1, Number(view.bossIndex || 0)));
        state.rounds = Math.max(0, Number(view.rounds || 0));
        state.players = Array.isArray(view.players) && view.players.length
          ? JSON.parse(JSON.stringify(view.players))
          : JSON.parse(JSON.stringify(basePlayers.slice(0, state.count)));
        state.slots = Array.isArray(view.slots) ? JSON.parse(JSON.stringify(view.slots)) : [];
        if (BOARD_MODE && incomingFinished && !incomingWin && !state.failureAnimationDone) {
          state.slots.forEach((slot) => {
            if (slot?.cardId) slot.executed = false;
          });
        }
        if (BOARD_MODE && incomingFinished && incomingWin && !state.successAnimationDone) {
          state.slots.forEach((slot) => {
            if (slot?.cardId) slot.rescued = false;
          });
        }
        state.helpers = limitSupportHelpers(Array.isArray(view.helpers) ? JSON.parse(JSON.stringify(view.helpers)) : []);
        state.returnedCardPool = Array.isArray(view.returnedCardPool) ? JSON.parse(JSON.stringify(view.returnedCardPool)) : [];
        state.rewards = Array.isArray(view.rewards) ? view.rewards.slice() : [];
        state.lostWhitebeard = setFromArray(view.lostWhitebeard);
        state.joinedWhitebeard = setFromArray(view.joinedWhitebeard);
        state.rescueDice = Math.max(0, Math.floor(Number(view.rescueDice || 0)));
        state.selectedSlotIndex = Math.max(0, Number(view.selectedSlotIndex || 0));
        state.nextLeader = view.nextLeader && typeof view.nextLeader === "object" ? { ...view.nextLeader } : {};
        state.hormoneUsed = view.hormoneUsed && typeof view.hormoneUsed === "object" ? { ...view.hormoneUsed } : {};
        state.hormoneBoost = view.hormoneBoost && typeof view.hormoneBoost === "object" ? { ...view.hormoneBoost } : {};
        if (view.rulesShown) state.rulesAckPending = false;
        state.rulesShown = Boolean(view.rulesShown) || state.rulesAckPending || wasRulesActive;
        state.rulesActive = wasRulesActive && !view.rulesShown;
        state.modalAfterClose = modalOpen ? pendingModalAfterClose : "";
        if (!state.finished) {
          state.resultModalShown = false;
          state.failureConfirmPending = false;
          state.failureAnimationDone = false;
          state.successConfirmPending = false;
          state.successAnimationDone = false;
        }
        render();
        if (BOARD_MODE && state.finished && !wasFinished && !state.resultModalShown) {
          state.resultModalShown = true;
          setTimeout(() => {
            if (!state.win) openFailureAnimationPrompt();
            else openSuccessAnimationPrompt();
          }, 100);
        }
        if (view.showRules && !state.rulesShown && !state.rulesActive && !$("modalBack").classList.contains("show")) openRulesModal();
        return true;
      }

      function readBoardSnapshot() {
        if (!BOARD_MODE) return false;
        try {
          const raw = localStorage.getItem(MARINEFORD_SNAPSHOT_KEY);
          if (!raw) return false;
          return applyBoardView(JSON.parse(raw)?.view);
        } catch (_) {
          return false;
        }
      }

      function readBoardCommandResult(event) {
        if (!BOARD_MODE || event?.key !== MARINEFORD_COMMAND_RESULT_KEY || !event?.newValue) return;
        try {
          const result = JSON.parse(event.newValue);
          if (result?.view) applyBoardView(result.view);
          if (result?.type === "rollRescueDie") showRescueRollResult(result.result);
          if (result?.type === "startBattle" && result?.result && result.result.ok === false && (result.result.error || result.result.message)) {
            openModal("無法開始戰鬥", `<div class="dialog-sub">${escapeText(result.result.error || result.result.message)}</div>`);
          }
        } catch (_) {}
      }

      function preloadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = src;
        });
      }

      function preloadRescueAssets() {
        return Promise.all([
          preloadImage(executionTopGuardFrameUrl),
          preloadImage(executionTopGuardHalfUrls.left),
          preloadImage(executionTopGuardHalfUrls.right),
        ]);
      }

      function playConquerorIntroVideo(page) {
        return new Promise((resolve) => {
          if (!page) {
            resolve(false);
            return;
          }
          const layer = document.createElement("div");
          layer.className = "conqueror-video-layer";
          const video = document.createElement("video");
          video.src = conquerorIntroVideoUrl;
          video.muted = false;
          video.volume = 1;
          video.playsInline = true;
          video.preload = "auto";
          video.setAttribute("playsinline", "");
          video.removeAttribute("muted");
          layer.appendChild(video);
          page.appendChild(layer);
          let done = false;
          let prompted = false;
          let promptButton = null;
          let timeoutId = 0;
          const finish = () => {
            if (done) return;
            done = true;
            clearTimeout(timeoutId);
            layer.classList.add("fade-out");
            setTimeout(() => {
              video.pause();
              layer.remove();
              resolve(true);
            }, 300);
          };
          const armTimeout = (ms) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(finish, ms);
          };
          const startVideo = (fromPrompt = false) => {
            if (done) return;
            if (fromPrompt) {
              try { video.currentTime = 0; } catch (_) {}
            }
            video.muted = false;
            video.volume = 1;
            video.removeAttribute("muted");
            const playPromise = video.play();
            if (playPromise?.then) {
              playPromise
                .then(() => {
                  promptButton?.remove();
                  promptButton = null;
                  layer.classList.remove("needs-sound");
                  armTimeout(11200);
                })
                .catch(() => {
                  if (prompted) {
                    finish();
                    return;
                  }
                  prompted = true;
                  clearTimeout(timeoutId);
                  layer.classList.add("needs-sound");
                  promptButton = document.createElement("button");
                  promptButton.type = "button";
                  promptButton.className = "conqueror-video-sound-prompt";
                  promptButton.textContent = "點擊播放霸氣影片";
                  promptButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    startVideo(true);
                  }, { once: true });
                  layer.appendChild(promptButton);
                  armTimeout(30000);
                });
            } else {
              armTimeout(11200);
            }
          };
          video.addEventListener("ended", finish, { once: true });
          video.addEventListener("error", finish, { once: true });
          armTimeout(11200);
          startVideo();
        });
      }

      function capturedIdsForPlayer(playerId) {
        return state.slots.filter((slot) => slot.playerId === playerId && slot.cardId).map((slot) => slot.cardId);
      }

      function helperIdsForPlayer(playerId) {
        return state.helpers.filter((entry) => entry.playerId === playerId).map((entry) => entry.cardId);
      }

      function fighterIdsForPlayer(player) {
        if (!player) return [];
        const captured = new Set(capturedIdsForPlayer(player.id));
        return player.crew.filter((id) => !captured.has(id)).concat(helperIdsForPlayer(player.id));
      }

      function leaderIdForPlayer(player) {
        const fighters = fighterIdsForPlayer(player);
        const chosen = state.nextLeader[player?.id];
        return fighters.includes(chosen) ? chosen : fighters[0] || "";
      }

      function setLeaderForPlayer(playerId, cardId) {
        const player = playerById(playerId);
        const fighters = fighterIdsForPlayer(player);
        if (!player || !fighters.includes(cardId)) return false;
        state.nextLeader[playerId] = cardId;
        if (player.crew.includes(cardId)) {
          player.crew = [cardId, ...player.crew.filter((id) => id !== cardId)];
        }
        sendBoardCommand("switchLeader", { playerId, cardId });
        return true;
      }

      function hardResetDemo() {
        state.players = JSON.parse(JSON.stringify(basePlayers));
        state.returnedCardPool = [];
        state.rewards = [];
        state.lostWhitebeard = new Set();
        state.joinedWhitebeard = new Set();
        state.rescueDice = 0;

        state.hormoneBoost = {};

        state.started = false;
        state.finished = false;
        state.win = false;
        state.bossIndex = 0;
        state.rounds = executionTurnsFor(0);
        state.slots = [];

        state.rescueDice = 0;
        state.selectedSlotIndex = 0;
        state.rulesShown = false;
        state.rulesActive = false;
        state.rulesAckPending = false;
        state.modalAfterClose = "";
        state.pendingWhitebeardChoice = "";
        state.resultModalShown = false;
        state.failureConfirmPending = false;

      function renderImage(src, label, className = "") {
        return `<span class="${className}"><img src="${src}" alt="${label}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fallback-face" hidden>${initials(label)}</span></span>`;
      }

      function cardMarkup(entry, options = {}) {

        const cls = `${options.main ? "fighter-card main" : "fighter-card helper"}${options.noImage ? " text-only" : ""}`;
        const meta = `${tier(card.tier)} ・ ${card.roleType || "角色"}${entry?.temporary ? " ・ 暫時支援" : ""}`;

          <article class="${cls}">
            ${options.noImage ? "" : `<div class="fighter-img">${renderImage(portrait(id, options.mood || "normal"), nameOf(id))}</div>`}

      function currentSlotIndex() {
        if (!state.slots.length) {
          state.selectedSlotIndex = 0;
          return 0;
        }
        state.selectedSlotIndex = Math.max(0, Math.min(state.slots.length - 1, Number(state.selectedSlotIndex || 0)));
        return state.selectedSlotIndex;
      }

      function slotTimerText(slot, index) {
        const turns = slot?.roundsLeft ?? executionTurnsFor(index);
        return `距離處刑時間還有 ${turns} 回合`;
      }

      function slotStatusText(slot, index) {
        if (slot?.rescued) return "已救出";
        if (slot?.executed) return "已處刑";
        return slotTimerText(slot, index);
      }

      function renderSlots() {
        const index = currentSlotIndex();
        const slot = state.slots[index];
        const visibleSlot = slot && (slot.cardId || state.mode !== "wipe");
        $("executionSlots").style.setProperty("--slot-count", "1");
        if (!visibleSlot) {
          $("executionSlots").innerHTML = "";
          return;
        }
        const slotNo = index + 1;
        if (slot.executed) {
          $("executionSlots").innerHTML = "";
          return;
        }
        if (!slot.cardId) {
          $("executionSlots").innerHTML = `
            <div class="slot-wrap" data-slot-index="${slotNo}">
              ${slot.rescued ? "" : `<div class="timer-badge">${slotTimerText(slot, index)}</div>`}
              <article class="slot empty">
                <div class="slot-img"><span class="fallback-face">待</span></div>
              </article>
            </div>
          `;
          return;
        }
        $("executionSlots").innerHTML = `
          <div class="slot-wrap has-card${slot.rescued ? " rescued" : ""}" data-slot-index="${slotNo}">
            ${slot.rescued ? "" : `<div class="timer-badge">${slotTimerText(slot, index)}</div>`}
            <article class="slot">
              <div class="slot-img${slot.rescued ? " is-rescued" : ""}">${renderImage(portrait(slot.cardId, slot.rescued ? "normal" : "weak"), nameOf(slot.cardId))}</div>
            </article>
          </div>
        `;
      }

      function renderExecutionIntel() {
        const current = currentSlotIndex();
        const currentSlot = state.slots[current];
        const currentPlayer = playerById(currentSlot?.playerId) || activePlayers()[current];
        const leaderId = leaderIdForPlayer(currentPlayer);
        const selfVisible = currentSlot && (currentSlot.cardId || state.mode !== "wipe");
        const others = state.slots
          .map((slot, index) => ({ slot, index }))
          .filter(({ slot, index }) => slot && index !== current && (slot.cardId || state.mode !== "wipe"));
        $("helperLineup").innerHTML = `
          <section class="intel-panel">
            <div class="intel-head">
              <span>處刑台詳情</span>
              <small>${others.length ? `其他 ${others.length} 位` : "自己的"}</small>
            </div>
            ${selfVisible ? `
              <article class="intel-card self">
                ${currentSlot.cardId ? renderImage(portrait(currentSlot.cardId, currentSlot.rescued ? "normal" : "weak"), nameOf(currentSlot.cardId), "intel-portrait") : ""}
                <span class="intel-player">自己的處刑台 ・ ${currentSlot.playerName}</span>
                <b>${currentSlot.cardId ? nameOf(currentSlot.cardId) : "待選處刑者"}</b>
                <strong>${slotStatusText(currentSlot, current)}</strong>
                <small>下次首位：${leaderId ? nameOf(leaderId) : "目前沒有可出戰角色"}</small>
                <div class="intel-actions">
                  <button type="button" data-change-leader="${current}" ${leaderId ? "" : "disabled"}>換隊長</button>
                </div>
              </article>
            ` : `
              <article class="intel-card self">
                <span class="intel-player">自己的處刑台</span>
                <b>尚未抽出</b>
                <strong>先完成進場流程</strong>
              </article>
            `}
            ${others.length ? `
              <div class="intel-list">
                ${others.map(({ slot, index }) => `
                  <button class="intel-card" type="button" data-view-slot="${index}">
                    ${slot.cardId ? renderImage(portrait(slot.cardId, slot.rescued ? "normal" : "weak"), nameOf(slot.cardId), "intel-portrait") : ""}
                    <span class="intel-player">${slot.playerName}</span>
                    <b>${slot.cardId ? nameOf(slot.cardId) : "待選處刑者"}</b>
                    <strong>${slotStatusText(slot, index)}</strong>
                    <small>點擊切換查看這位的處刑台</small>
                  </button>
                `).join("")}
              </div>
            ` : `<div class="intel-empty">目前沒有其他玩家的處刑台資訊。</div>`}
          </section>
        `;
      }

      function renderSides() {
        renderExecutionIntel();
        $("bossLineup").classList.toggle("raid-cleared", Boolean(state.finished && state.win));
        if (state.finished && state.win) {
          $("bossLineup").innerHTML = `
            <div class="enemy-title defeated"><span>已擊敗</span></div>
            <article class="fighter-card text-only defeated">
              <div class="fighter-copy">
                <b>海軍本部突破</b>
                <span class="card-meta">處刑台角色已救出</span>
              </div>
            </article>
          `;

        }
        const boss = bosses[Math.min(state.bossIndex, bosses.length - 1)] || bosses[0];
        const promptText = state.finished
          ? "▲ 查看結果 ▲"
          : state.started
            ? "▲ 點擊戰鬥 ▲"
            : readyToStart()
              ? "▲ 點擊開始救援 ▲"
              : state.setupStep === "chooseExecution"
                ? "▲ 點擊選擇處刑台 ▲"
                : "▲ 點擊繼續整備 ▲";
        $("bossLineup").innerHTML = `
          <div class="enemy-title"><span>目前敵人</span></div>
          <article class="fighter-card main" style="border-color:${boss.tint}" data-open-battle>
            <div class="fighter-img">${renderImage(enemyPortrait(boss.key, state.started ? "angry" : "normal"), boss.name)}</div>
            <div class="fighter-copy">
              <b>${boss.name}</b>
              <span class="card-meta">${boss.role}</span>

      function renderHormonePanel() {
        const allUsed = activePlayers().length > 0 && activePlayers().every((player) => state.hormoneUsed[player.id]);
        $("hormonePanel").classList.toggle("used", allUsed);
        $("hormonePanel").setAttribute("aria-label", allUsed ? "賀爾蒙注射 已全部使用" : "賀爾蒙注射");
      }

      function renderPhases() {
        $("phaseStrip").innerHTML = "";
      }

      function slotsReady() {
        return state.slots.length > 0 && state.slots.every((slot) => slot.cardId);
      }

      function supportReady() {
        return state.mode !== "wipe" || (state.helpers.length > 0 && state.helpers.length >= Math.min(state.count, state.slots.length));
      }

      function readyToStart() {
        return state.setupStep === "ready" && slotsReady() && supportReady();
      }

      function soonestExecutionTurns() {
        const fallback = executionTurnsFor(0);
        const values = state.slots.filter((slot) => slot.cardId).map((slot) => slot.roundsLeft ?? fallback);
        return values.length ? Math.min(...values) : fallback;
      }

      function tickExecutionTimers(amount) {
        state.slots.forEach((slot) => {
          if (!slot.cardId) return;
          slot.roundsLeft = Math.max(0, (slot.roundsLeft ?? executionTurnsFor(0)) - amount);
        });
        state.rounds = soonestExecutionTurns();
        return state.slots.some((slot) => slot.cardId && (slot.roundsLeft ?? 0) <= 0);
      }

      function addExecutionBonusTurns(amount) {
        const bonus = Math.max(0, Math.floor(Number(amount || 0)));
        if (!bonus) return 0;
        let applied = false;
        state.slots.forEach((slot) => {
          if (!slot.cardId || slot.rescued || slot.executed) return;
          slot.roundsLeft = Math.max(0, Number(slot.roundsLeft ?? 0)) + bonus;
          applied = true;
        });
        if (applied) state.rounds = soonestExecutionTurns();
        return applied ? bonus : 0;
      }

      function escapeText(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function showRescueRollResult(result) {

              <b>擲出 ${Number(result.roll || 0)} 點</b>

              <span class="card-meta">剩餘救援骰 x${Number(result.rescueDice || 0)} ・ 最近倒數 ${Number(result.rounds || 0)} 回合</span>
            </article>
          </div>
        `);
      }

        const modeText = state.mode === "wipe" ? "推進城全滅：每位參戰玩家先抽自己隊伍一人上處刑台，再抽白鬍子暫時支援。"

        let primaryText = "開始救援";

          primaryDisabled = true;
          adjustDisabled = true;
        }
        if (state.finished) {
          $("dialogTitle").textContent = state.win ? "救援成功" : "處刑台失守";

            : (state.mode === "wipe" ? "我方處刑台角色回歸卡池，重新招募時修練等額外數值清除；剩餘隊伍回到羅格鎮重新出發。" : "白鬍子處刑台角色消失，之後不能再上處刑台或當幫手。");

          primaryDisabled = true;
          adjustDisabled = true;
        } else if (state.started) {
          $("dialogTitle").textContent = `正在挑戰 ${bosses[state.bossIndex]?.name || "海軍本部"}`;
          $("dialogSub").textContent = "限回合內打倒青雉、黃猿、赤犬、戰國元帥。";
          primaryText = "救援中";

          adjustDisabled = true;

          adjustText = "等待抽籤";
          adjustDisabled = true;

          $("dialogTitle").textContent = "抽白鬍子支援";
          $("dialogSub").textContent = "處刑台角色確定後，再從白鬍子海賊團抽暫時支援角色。";
          primaryText = "抽支援角色";
          primaryDisabled = !slotsReady();
          adjustText = "已上處刑台";
          adjustDisabled = true;
        } else if (state.setupStep === "chooseExecution") {
          $("dialogTitle").textContent = "選擇處刑台角色";
          $("dialogSub").textContent = "自願挑戰與幫忙救援都可以從白鬍子海賊團挑一位上處刑台。";
          primaryText = "選擇白鬍子";
          adjustText = "處刑台調整";
        } else if (readyToStart()) {
          $("dialogTitle").textContent = "準備進入海軍本部";
          $("dialogSub").textContent = modeText;
          primaryText = "開始救援";
        } else {
          $("dialogTitle").textContent = "準備進入海軍本部";
          $("dialogSub").textContent = modeText;
          primaryDisabled = true;
        }
        $("startBtn").textContent = primaryText;
        $("battleBtn").textContent = state.started && !state.finished ? `挑戰${bosses[state.bossIndex]?.name || "敵人"}` : "進入戰鬥";
        const rescueDiceCount = Math.max(0, Number(state.rescueDice || 0));
        $("rescueDiceBtn").textContent = `救援骰 x${rescueDiceCount}`;
        $("rescueDiceBtn").classList.toggle("available", rescueDiceCount > 0 && !state.finished);
        $("rerollBtn").textContent = adjustText;
        $("startBtn").disabled = primaryDisabled || state.animating;
        $("battleBtn").disabled = !state.started || state.finished || state.animating;
        $("rescueDiceBtn").disabled = state.finished || state.animating || rescueDiceCount <= 0;
        $("stallBtn").disabled = BOARD_MODE || !state.started || state.finished || state.animating;
        $("rerollBtn").disabled = adjustDisabled;
        $("debugWinBtn").disabled = !state.started || state.finished || state.animating;
        $("debugLoseBtn").disabled = !state.started || state.finished || state.animating;
      }

      function openModal(title, body, className = "") {
        const modal = $("modal");
        const lotteryMode = className.split(/\s+/).includes("lottery-modal");
        modal.className = `modal${className ? ` ${className}` : ""}`;
        modal.innerHTML = `
          <div class="modal-head">
            <h2>${title}</h2>
            <button class="icon-btn" type="button" data-close-modal>關閉</button>
          </div>
          ${body}
        `;
        $("modalBack").classList.toggle("lottery-mode", lotteryMode);
        if (lotteryMode) {
          const headerClose = modal.querySelector(".modal-head > [data-close-modal]");
          if (headerClose) modal.appendChild(headerClose);
        }
        $("modalBack").classList.add("show");
      }

      function runModalAfterClose(action) {
        if (!action) return;
        setTimeout(() => {
          if (action === "rulesFlow") {
            if (state.mode === "wipe") openLotteryPrompt("crew");
            else openSelectModal();
          }
          if (action === "drawSupport") openLotteryPrompt("support");
        }, 90);
      }

      function closeModal() {
        if (state.animating) return;
        $("modalBack").classList.remove("show");
        if (state.rulesActive) {
          state.rulesAckPending = true;
          sendBoardCommand("rulesShown", {});
        }
        const action = state.rulesActive ? "rulesFlow" : state.modalAfterClose;
        state.rulesActive = false;
        state.modalAfterClose = "";
        runModalAfterClose(action);
      }

      function lotteryTokenHtml(reel, cardId) {
        const mood = reel.source === "crew" ? "weak" : "normal";
        return `

      function buildLotteryView(reel, index) {
        const candidates = (reel.candidates.length ? reel.candidates : [reel.resultId]).filter(Boolean);
        const start = index * 3;
        const tokens = Array.from({ length: 22 }, (_, tokenIndex) => candidates[(start + tokenIndex) % candidates.length]);
        const targetIndex = 16 + (index % 3);
        tokens[targetIndex] = reel.resultId;
        return { reel, tokens, targetIndex };
      }

      function lotteryReelHtml(view, index) {
        return `
          <section class="lottery-reel">
            <small>${view.reel.playerName}</small>
            <div class="lottery-lane" data-lottery-lane="${index}">
              <div class="lottery-track" data-lottery-track="${index}">
                ${view.tokens.map((cardId) => lotteryTokenHtml(view.reel, cardId)).join("")}
              </div>
            </div>
            <div class="lottery-result">
              <span>${view.reel.source === "crew" ? "處刑台抽選" : "白鬍子支援"}</span>
              <strong>抽籤中</strong>
              <span>停在中央金框後公布</span>
            </div>
          </section>
        `;
      }

      function startLotteryTrack(view, index) {
        const track = document.querySelector(`[data-lottery-track="${index}"]`);
        const lane = document.querySelector(`[data-lottery-lane="${index}"]`);
        const token = track?.querySelector(".lottery-token");
        if (!track || !lane || !token) return;
        const gap = parseFloat(getComputedStyle(track).gap || "0") || 0;
        const tokenWidth = token.getBoundingClientRect().width;
        const laneWidth = lane.getBoundingClientRect().width;
        const step = tokenWidth + gap;
        const targetX = -((view.targetIndex * step) - ((laneWidth - tokenWidth) / 2));
        track.style.setProperty("--target-x", `${targetX}px`);
        requestAnimationFrame(() => track.classList.add("is-running"));
      }

      async function runLottery(title, reels, complete, resultTitle, resultNote) {
        if (state.animating || !reels.length) return;
        state.animating = true;
        renderHud();
        const views = reels.map(buildLotteryView);
        openModal(title, `
          <div class="lottery-note">角色卡帶會停在中央金框，停住的就是本次結果。</div>
          <div class="lottery-stage reel-count-${Math.min(4, views.length)}">
            ${views.map((view, index) => lotteryReelHtml(view, index)).join("")}
          </div>
        `, "lottery-modal lottery-running-modal");
        await sleep(80);
        views.forEach(startLotteryTrack);
        await sleep(2750);
        views.forEach((view, index) => {
          const track = document.querySelector(`[data-lottery-track="${index}"]`);
          track?.children?.[view.targetIndex]?.classList.add("hit");
        });
        await sleep(950);
        const entries = complete();
        state.animating = false;
        render();
        openDrawResultModal(resultTitle, entries, resultNote);
      }

      async function drawWipeCrewCaptives() {
        const reels = activePlayers().map((player, index) => {
          const crewId = randomPick(player.crew);
          return { player, playerName: player.name, resultId: crewId, candidates: player.crew.slice(), source: "crew", roundsLeft: executionTurnsFor(index) };
        });
        await runLottery("處刑台抽籤", reels, () => {
          state.slots = reels.filter((reel) => reel.resultId).map((reel) => ({
            playerId: reel.player.id,
            playerName: reel.player.name,
            cardId: reel.resultId,
            source: "crew",
            cleanOnLoss: true,
            roundsLeft: reel.roundsLeft,
          }));
          state.setupStep = "drawSupport";
          state.rounds = soonestExecutionTurns();
          return state.slots;
        }, "處刑台抽籤結果", "已從自己的隊伍抽出上處刑台的角色，下一步抽白鬍子海賊團支援。");
        sendBoardCommand("drawCrew", { slots: state.slots });
        state.modalAfterClose = "drawSupport";
      }

      async function drawWipeSupport() {
        let pool = availableWhitebeards();
        const reels = activePlayers().map((player) => {
          const cardId = randomPick(pool);
          pool = pool.filter((id) => id !== cardId);
          return { player, playerName: player.name, resultId: cardId, candidates: whitebeardIds.filter((id) => !state.lostWhitebeard.has(id) && !state.joinedWhitebeard.has(id)), source: "support" };
        });
        await runLottery("白鬍子支援抽籤", reels, () => {
          state.helpers = limitSupportHelpers(reels.filter((reel) => reel.resultId).map((reel) => ({
            playerId: reel.player.id,
            playerName: reel.player.name,
            cardId: reel.resultId,
            source: "support",
            temporary: true,
          })));
          state.setupStep = "ready";
          return state.helpers;
        }, "白鬍子支援抽籤", "支援角色只在本次海軍本部救援中暫時加入。");
        sendBoardCommand("drawSupport", { helpers: state.helpers });
