<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>推進城</title>
  <link rel="stylesheet" href="css/board-cursor-nami-v3.css?v=20260906-game-cursors-v4">
  <script defer src="js/game_cursor_feedback_v1.js?v=20260906-game-cursors-v4"></script>
  <style>
    :root {
      --bg: #080606;
      --ink: #251309;
      --line: #190a06;
      --paper: #f9e7ad;
      --paper-2: #fff5cb;
      --gold: #e8ba58;
      --teal: #0c7a89;
      --red: #a92c2f;
      --green: #80b96d;
      --muted: rgba(249, 231, 173, 0.68);
      --panel: rgba(18, 7, 6, 0.78);
      --panel-2: rgba(49, 19, 11, 0.88);
      --level: #d85c32;
      --level-soft: rgba(216, 92, 50, 0.32);
      --shadow: 0 28px 72px rgba(0, 0, 0, 0.62);
      --radius: 8px;
      --font: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--paper);
      background: var(--bg);
      font-family: var(--font);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button { font: inherit; }

    .screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 10px;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 220, 117, 0.22), transparent 33%),
        linear-gradient(90deg, rgba(4, 3, 4, 0.94), rgba(98, 23, 18, 0.34) 48%, rgba(4, 3, 4, 0.96)),
        url("images/board/impel_down/backgrounds/prison_cell_hall.webp") center / cover no-repeat,
        #080606;
    }

    .frame {
      position: relative;
      width: min(1500px, 100%);
      height: min(846px, calc(100dvh - 20px));
      min-height: 704px;
      overflow: hidden;
      border: 4px solid var(--line);
      border-radius: 10px;
      background:
        radial-gradient(circle at 52% 36%, var(--level-soft), transparent 39%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.72)),
        url("images/board/impel_down/backgrounds/prison_cell_hall.webp") center / cover no-repeat,
        #120806;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.15) 3px),
        radial-gradient(circle at 50% 44%, transparent 50%, rgba(0, 0, 0, 0.6));
      background-size: 100% 5px, 100% 100%;
      mix-blend-mode: multiply;
    }

    .title-plate {
      position: absolute;
      z-index: 4;
      left: 22px;
      top: 18px;
      width: min(548px, calc(100% - 44px));
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 10px;
      border: 3px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: linear-gradient(90deg, rgba(255, 244, 199, 0.98), rgba(222, 166, 73, 0.96));
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.38);
    }

    .rank-seal {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border: 4px solid var(--line);
      border-radius: 50%;
      color: #fff7d0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.16), transparent 42%),
        linear-gradient(145deg, var(--level), #45100d);
      font-size: 29px;
      font-weight: 1000;
      box-shadow: inset 0 0 0 4px rgba(255, 236, 164, 0.22);
    }

    .title-copy {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    h1 {
      min-width: 0;
      margin: 0;
      font-size: 31px;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subline {
      min-width: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      color: rgba(36, 18, 9, 0.72);
      font-size: 13px;
      font-weight: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subline b { color: var(--red); }

    .resource-row {
      position: absolute;
      z-index: 4;
      right: 20px;
      top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      max-width: 690px;
    }

    .hud-chip {
      min-width: 100px;
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      border: 3px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: linear-gradient(#fff4c7, #dca044);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
    }

    .hud-chip span {
      color: rgba(36, 18, 9, 0.62);
      font-size: 11px;
      font-weight: 1000;
    }

    .hud-chip strong {
      min-width: 0;
      font-size: 18px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button.hud-chip {
      appearance: none;
      text-align: left;
      cursor: pointer;
    }

    button.hud-chip:hover,
    button.hud-chip:focus-visible {
      outline: 2px solid rgba(255, 241, 179, 0.9);
      outline-offset: 2px;
      filter: brightness(1.08);
    }

    button.hud-chip.has-invite {
      animation: team-invite-pulse 1.35s ease-in-out infinite;
    }

    @keyframes team-invite-pulse {
      50% { box-shadow: 0 0 0 5px rgba(123, 230, 214, 0.25), 0 10px 22px rgba(0, 0, 0, 0.3); }
    }

    .tower {
      position: absolute;
      z-index: 3;
      left: 22px;
      top: 112px;
      bottom: 142px;
      width: 268px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }

    .tower-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 2px solid rgba(249, 231, 173, 0.26);
      border-radius: var(--radius);
      background: rgba(18, 7, 6, 0.72);
      backdrop-filter: blur(4px);
      font-weight: 1000;
    }

    .tower-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .floor-list {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 7px;
    }

    .floor-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: stretch;
      gap: 8px;
      padding: 7px;
      border: 2px solid rgba(249, 231, 173, 0.24);
      border-radius: var(--radius);
      color: var(--paper);
      text-align: left;
      background: rgba(18, 8, 6, 0.72);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .floor-row:hover { border-color: rgba(255, 236, 164, 0.72); }

    .floor-row.active {
      border-color: var(--gold);
      color: #fff7d3;
      background:
        linear-gradient(90deg, rgba(255, 210, 98, 0.22), transparent),
        rgba(28, 11, 7, 0.92);
      box-shadow: 0 0 0 2px rgba(232, 186, 88, 0.2), 0 10px 20px rgba(0, 0, 0, 0.28);
    }

    .floor-number {
      width: 42px;
      height: 42px;
      align-self: center;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 231, 157, 0.54);
      border-radius: 50%;
      color: var(--ink);
      background: linear-gradient(#fff0bd, #d7943e);
      font-size: 18px;
      font-weight: 1000;
    }

    .floor-copy {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: 5px;
    }

    .floor-copy strong,
    .floor-copy span,
    .occupants {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .floor-copy strong { font-size: 13px; }

    .floor-copy span {
      color: rgba(249, 231, 173, 0.66);
      font-size: 11px;
      font-weight: 900;
    }

    .occupants {
      display: block;
      color: #fff4c7;
      font-size: 12px;
      font-weight: 1000;
    }

    .main-stage {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      top: 94px;
      bottom: 132px;
      min-width: 0;
    }

    .cage-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      bottom: auto;
      width: min(340px, 56%);
      min-width: 260px;
      height: min(430px, calc(100% - 38px));
      transform: translate(-50%, -50%);
    }

    .cage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: end center;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: radial-gradient(ellipse at 50% 46%, rgba(23, 100, 128, 0.18), rgba(0, 0, 0, 0.52) 76%);
      box-shadow: 0 26px 42px rgba(0, 0, 0, 0.48);
    }

    .cage.free {
      overflow: visible;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .captain {
      position: relative;
      z-index: 1;
      width: 86%;
      height: 92%;
      margin-bottom: 2.2%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 21px 20px rgba(0, 0, 0, 0.68));
    }

    .cage.locked .captain {
      filter: grayscale(0.18) saturate(0.76) brightness(0.78) drop-shadow(0 18px 18px rgba(0, 0, 0, 0.72));
    }

    .captain-fallback {
      position: relative;
      z-index: 1;
      display: none;
      place-items: center;
      width: 156px;
      height: 156px;
      margin-bottom: 0;
      color: var(--paper-2);
    }

    .captain-fallback img { display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 12px 12px rgba(0,0,0,.68)); }

    .cage.fallback .captain-fallback { display: grid; }
    .cage.fallback .captain { display: none; }

    .cage-overlay {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.5));
      transition: opacity 240ms ease, transform 270ms ease;
    }

    .bars {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent 0 8.8%, #110704 9.4% 11.3%, transparent 11.9% 20%),
        linear-gradient(transparent 0 17%, rgba(17, 7, 4, 0.96) 17.7% 20.8%, transparent 21.3% 67%, rgba(17, 7, 4, 0.96) 67.8% 71%, transparent 71.5%);
      box-shadow: inset 0 0 0 3px rgba(255, 226, 143, 0.14);
      transition: opacity 240ms ease, transform 270ms ease;
    }

    .bars,
    .lock { display: none; }

    .lock {
      position: absolute;
      z-index: 4;
      right: 11%;
      top: 45%;
      width: 50px;
      height: 40px;
      border: 4px solid #110704;
      border-radius: 7px;
      background: linear-gradient(#ffe78d, #a45d23);
      box-shadow: 0 9px 0 rgba(0, 0, 0, 0.28);
      transition: opacity 220ms ease, transform 240ms ease;
    }

    .lock::before {
      content: "";
      position: absolute;
      left: 9px;
      top: -32px;
      width: 22px;
      height: 32px;
      border: 4px solid #110704;
      border-bottom: 0;
      border-radius: 17px 17px 0 0;
    }

    .cage.free .bars {
      opacity: 0;
      transform: translateY(-22px);
    }

    .cage.free .cage-overlay {
      opacity: 0;
      transform: translateY(-22px) scale(1.015);
    }

    .cage.free .lock {
      opacity: 0;
      transform: rotate(14deg) translate(24px, 24px);
    }

    .stamp {
      position: absolute;
      z-index: 5;
      right: -10px;
      top: 42px;
      width: 124px;
      height: 124px;
      display: grid;
      place-items: center;
      border: 8px solid rgba(169, 44, 47, 0.9);
      border-radius: 50%;
      color: #fff5cb;
      background: rgba(169, 44, 47, 0.22);
      font-size: 25px;
      font-weight: 1000;
      transform: rotate(-14deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }

    .stamp.show {
      animation: stamp-in 440ms cubic-bezier(.2, 1.35, .42, 1) forwards;
    }

    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(-14deg) scale(1.6); filter: blur(2px); }
      to { opacity: 1; transform: rotate(-14deg) scale(1); filter: blur(0); }
    }

    .event-panel {
      position: absolute;
      z-index: 12;
      left: auto;
      right: 28px;
      top: 50%;
      width: min(540px, calc(100% - 44px));
      height: 286px;
      display: block;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      color: var(--paper);
      background: transparent;
      box-shadow: none;
      overflow: visible;
      transform: translateY(-50%);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .event-panel::before,
    .event-panel::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    .frame.escape-dice-active .event-panel::before {
      z-index: 13;
      inset: -20%;
      background: repeating-linear-gradient(115deg, transparent 0 38px, rgba(255, 255, 255, 0.34) 39px 43px, transparent 44px 92px);
      transform: translateX(-160px);
      animation: escapeDiceSpeedlines 680ms ease-out 80ms both;
    }

    .frame.escape-dice-active .event-panel::after {
      z-index: 13;
      left: 50%;
      top: 50%;
      width: min(520px, 96%);
      height: min(250px, 86%);
      transform: translate(-50%, -50%) scale(0.7);
      background:
        linear-gradient(90deg, transparent 0 4%, rgba(255, 244, 173, 0.92) 48%, transparent 96%),
        linear-gradient(18deg, transparent 0 8%, rgba(255, 92, 92, 0.74) 50%, transparent 92%);
      filter: blur(0);
      animation: escapeDiceImpact 620ms ease-out 1320ms both;
    }

    .frame.panel-hidden .event-panel {
      opacity: 0;
      pointer-events: none;
      transform: translate(18px, -50%) scale(0.96);
    }

    .event-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .event-head strong,
    .event-head span {
      min-width: 0;
      white-space: nowrap;
      overflow: visible;
      text-overflow: ellipsis;
    }

    .event-head strong {
      color: var(--paper-2);
      font-size: 21px;
    }

    .event-head span {
      padding: 4px 7px;
      border: 2px solid rgba(249, 231, 173, 0.28);
      border-radius: 999px;
      color: rgba(249, 231, 173, 0.74);
      font-size: 12px;
      font-weight: 1000;
    }

    .event-art {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
    }

    .event-art::after {
      content: none;
    }

    .event-art > img {
      position: absolute;
      inset: 10px 10px 0;
      width: calc(100% - 20px);
      height: calc(100% - 10px);
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.55));
    }

    .event-symbol {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .event-symbol img { display:block; width:min(58%,220px); height:min(58%,220px); object-fit:contain; filter:drop-shadow(0 8px 20px rgba(0,0,0,.62)); }

    .reward-spin {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      background: transparent;
    }

    .reward-spin::before,
    .reward-spin::after {
      content: none;
    }

    .reward-spin::before {
      background:
        repeating-linear-gradient(115deg, transparent 0 18px, rgba(255, 126, 75, 0.08) 19px 22px),
        repeating-linear-gradient(90deg, transparent 0 34px, rgba(0, 0, 0, 0.18) 35px 40px),
        radial-gradient(circle, transparent 48%, rgba(0, 0, 0, 0.68) 74%);
      mix-blend-mode: screen;
      opacity: 0.62;
      animation: rewardBackdropDrift 1200ms linear infinite;
    }

    .reward-spin::after {
      background: linear-gradient(90deg, transparent, rgba(255, 117, 72, 0.34), transparent);
      transform: translateX(-120%) skewX(-18deg);
      animation: rewardSlash 860ms ease-out 180ms both;
    }

    .reward-clear {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 14%;
      color: #fff5c4;
      font-size: 38px;
      font-weight: 1000;
      letter-spacing: 0.15em;
      text-shadow:
        0 4px 0 #2d0505,
        0 0 18px rgba(255, 117, 72, 0.9),
        0 12px 28px rgba(0, 0, 0, 0.8);
      transform: translate(-50%, -50%) scale(0.62);
      animation: rewardClearText 760ms cubic-bezier(0.14, 1.24, 0.18, 1) both;
    }

    .reward-card {
      position: relative;
      z-index: 2;
      width: min(520px, calc(100% - 10px));
      min-height: 178px;
      margin-top: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      align-items: center;
      padding: 14px 16px;
      border: 2px solid rgba(255, 229, 151, 0.92);
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, rgba(106, 54, 134, 0.22), transparent 42%),
        linear-gradient(145deg, rgba(15, 14, 18, 0.96), rgba(65, 18, 14, 0.94));
      box-shadow:
        inset 0 0 0 4px rgba(255, 255, 255, 0.06),
        0 0 32px rgba(218, 83, 45, 0.34),
        0 18px 44px rgba(0, 0, 0, 0.58);
      transform: translateY(24px) scale(0.86);
      opacity: 0;
      animation: rewardCardIn 780ms cubic-bezier(0.17, 1.18, 0.23, 1) 500ms both;
    }

    .reward-slot-shell {
      position: relative;
      width: 100%;
      height: 140px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 4px solid rgba(102, 58, 16, 0.9);
      border-radius: 18px;
      background:
        linear-gradient(#ded1b0, #a77c4c 48%, #493321),
        radial-gradient(circle at 50% 50%, rgba(255, 218, 139, 0.66), transparent 58%);
      box-shadow:
        inset 0 0 0 4px rgba(255, 230, 176, 0.22),
        inset 0 -14px 24px rgba(31, 17, 10, 0.38),
        0 0 22px rgba(218, 83, 45, 0.34);
    }

    .reward-slot-pointer {
      position: absolute;
      z-index: 3;
      inset: 40px 12px auto;
      height: 60px;
      border-top: 3px solid rgba(255, 248, 224, 0.95);
      border-bottom: 3px solid rgba(97, 45, 13, 0.72);
      background: linear-gradient(180deg, rgba(255, 179, 111, 0.22), rgba(255, 96, 55, 0.12));
      box-shadow: 0 0 15px rgba(255, 126, 75, 0.72);
      pointer-events: none;
    }

    .reward-slot-pointer::before,
    .reward-slot-pointer::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55));
    }

    .reward-slot-pointer::before {
      left: -15px;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 23px solid #d85c32;
    }

    .reward-slot-pointer::after {
      right: -15px;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-right: 23px solid #d85c32;
    }

    .reward-reel {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 0;
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      will-change: transform;
      animation: rewardSlotSpin var(--spin-duration, 2550ms) cubic-bezier(0.14, 0.86, 0.16, 1) 680ms forwards;
    }

    .reward-spin.settled .reward-reel {
      animation: none;
      transform: translateY(var(--slot-end, -900px));
      filter: blur(0);
    }

    .reward-slot-item {
      height: 60px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: #161018;
      font-size: 18px;
      font-weight: 1000;
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(105, 61, 21, 0.22);
      background: linear-gradient(180deg, rgba(236, 218, 178, 0.86), rgba(196, 143, 82, 0.72));
    }

    .reward-slot-item.is-winning {
      color: #210806;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 219, 91, 0.95)),
        radial-gradient(circle at 50% 50%, rgba(255, 122, 67, 0.65), transparent 64%);
      box-shadow:
        inset 0 0 0 3px rgba(142, 0, 0, 0.5),
        0 0 20px rgba(255, 122, 67, 0.86);
    }

    .reward-slot-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      overflow: visible;
      border: 0;
      background: transparent;
    }

    .reward-slot-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.72));
    }

    .reward-slot-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
    }

    .escape-dice {
      position: absolute;
      z-index: 14;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      border: 4px solid rgba(255, 255, 255, 0.86);
      border-radius: 34px;
      color: #2b1007;
      background:
        radial-gradient(circle at 35% 30%, #fffdf0, #ffe5a0 38%, #dfaa4e 72%, #7d3218);
      box-shadow:
        0 0 0 10px rgba(232, 186, 88, 0.15),
        0 0 44px rgba(232, 186, 88, 0.58),
        0 22px 70px rgba(0, 0, 0, 0.42);
      font-size: 72px;
      font-weight: 1000;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.45) rotate(-48deg);
      pointer-events: none;
      isolation: isolate;
    }

    .escape-dice::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -18px;
      border: 3px solid rgba(255, 242, 169, 0.66);
      border-radius: 44px;
      opacity: 0;
      transform: scale(0.7);
      box-shadow: 0 0 32px rgba(232, 186, 88, 0.42);
    }

    .escape-dice.roll::before {
      animation: escapeDiceRing 1.8s ease both;
    }

    .escape-dice.revealed::before {
      opacity: 0.78;
      transform: scale(1.06);
    }

    .escape-dice.roll {
      animation: escapeDiceSpin 1.8s cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    .escape-dice.revealed {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08) rotate(720deg);
      animation: escapeDiceReveal 420ms cubic-bezier(0.16, 1.18, 0.24, 1) both;
    }

    @keyframes escapeDiceSpin {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.36) rotate(-80deg); filter: blur(5px); }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.14) rotate(28deg); filter: blur(0); }
      38% { opacity: 1; transform: translate(-50%, -50%) scale(0.94) rotate(330deg); }
      64% { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(640deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(720deg); filter: blur(0); }
    }

    @keyframes escapeDiceReveal {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.86) rotate(704deg);
        filter: brightness(1);
      }
      42% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.22) rotate(720deg);
        box-shadow:
          0 0 0 16px rgba(232, 186, 88, 0.12),
          0 0 62px rgba(255, 218, 112, 0.78),
          0 22px 70px rgba(0, 0, 0, 0.42);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08) rotate(720deg);
        filter: brightness(1.08);
      }
    }

    @keyframes escapeDiceRing {
      0% { opacity: 0; transform: scale(0.58) rotate(-18deg); }
      16% { opacity: 1; transform: scale(0.92) rotate(0); }
      68% { opacity: 0.74; transform: scale(1.08) rotate(18deg); }
      100% { opacity: 0; transform: scale(1.35) rotate(28deg); }
    }

    @keyframes escapeDiceSpeedlines {
      0% { opacity: 0; transform: translateX(-220px); }

      100% { opacity: 0; transform: translateX(260px); }

    @keyframes escapeDiceImpact {

    const recruits = [
      { id: "prison_buggy", name: "囚服巴奇", unlock: 2, fee: 1800, image: "images/board/battle/portraits/prison_buggy/normal.webp" },
      { id: "prison_mr3", name: "囚服Mr.3", unlock: 3, fee: 2200, image: "images/board/battle/portraits/prison_mr3/normal.webp" },

        activeId: "strawhat",

      };

    function activePlayer() {
      return players.find((player) => player.id === state.activeId) || players[0];
    }

    function floorDef(level = activePlayer().level) {
      return floors.find((floor) => floor.level === level) || floors[0];
    }

    function sameFloorPlayers(level = activePlayer().level) {
      return players.filter((player) => player.level === level && player.status !== "escaped");
    }

    function activeGroup() {
      return sameFloorPlayers(activePlayer().level);
    }

    function activeLeader() {
      const player = activePlayer();
      return player.crew[player.leader] || player.crew[0];
    }

    function isSpinning() {
      return state && (state.phase === "event_spin" || state.phase === "recruit_spin");
    }

    function cancelSpin() {
      if (spinTimer) {
        clearTimeout(spinTimer);
        spinTimer = null;
      }
      if (spinRevealTimer) {
        clearTimeout(spinRevealTimer);
        spinRevealTimer = null;
      }
      if (state) {
        state.spinType = null;
        state.spinItems = [];
        state.spinResultId = null;
        state.spinSettled = false;
      }
    }

    function cancelDiceRoll() {
      if (diceTimer) {
        clearTimeout(diceTimer);
        diceTimer = null;
      }
      if (diceRevealTimer) {
        clearTimeout(diceRevealTimer);
        diceRevealTimer = null;
      }
      if (diceTickTimer) {
        clearInterval(diceTickTimer);
        diceTickTimer = null;
      }
      if (state) state.diceRolling = false;
      if (state) state.diceRevealed = false;
      if (state) state.diceBonus = 0;
      if (state) state.diceTotal = 0;
      if (state) state.diceSuccess = false;
      if (state) state.diceNextBonus = 0;
      const dice = $("diceFace");
      if (dice) dice.classList.remove("roll", "revealed");
    }

    function escapeHtml(text) {
      return String(text || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function rewardSlotLabel(entry = {}) {
      const label = entry.shortLabel || entry.slotLabel || entry.title || entry.name || "抽選";
      return String(label).trim().slice(0, 5);
    }

    function rewardSlotIcon(entry = {}, type = "event") {
      const label = entry.title || entry.name || "抽選";
      if (type === "recruit" && entry.image) {
        return `<img src="${escapeHtml(entry.image)}" alt="${escapeHtml(label)}">`;
      }
      const eventId = ["patrol", "key", "magellan", "ivankov", "hidden"].includes(entry.id) ? entry.id : "unknown";
      return `<img src="images/board/impel_down_ui/event_icons/${eventId}.webp" alt="${escapeHtml(label)}">`;
    }

    function portraitForCage(member = {}, locked = false) {
      const image = member.image || "";
      if (locked && image.includes("/portraits/") && /\/normal\.webp$/.test(image)) {
        return image.replace(/\/normal\.webp$/, "/weak.webp");
      }
      return image;
    }

    function rewardItemKey(entry = {}) {
      return String(entry.id || entry.title || entry.name || "");
    }

    function pickRewardItem(source, previous, avoid = null, offset = 0) {
      const safeSource = source.length ? source : [previous, avoid].filter(Boolean);
      const previousKey = rewardItemKey(previous);
      const avoidKey = rewardItemKey(avoid);
      const preferred = safeSource.filter((entry) => {
        const key = rewardItemKey(entry);
        return key && key !== previousKey && (!avoidKey || safeSource.length <= 2 || key !== avoidKey);
      });
      const fallback = safeSource.filter((entry) => rewardItemKey(entry) !== previousKey);
      const pool = preferred.length ? preferred : (fallback.length ? fallback : safeSource);
      return pool[(Math.floor(Math.random() * pool.length) + offset) % pool.length] || safeSource[0] || avoid || previous || null;
    }

    function rewardReelItems(items, target, targetIndex) {
      const safeItems = items.length ? items : [target].filter(Boolean);
      const winner = target || safeItems[0];
      const reelItems = [];
      for (let index = 0; index < targetIndex; index += 1) {
        const avoidWinnerNeighbor = index === targetIndex - 1 ? winner : null;
        reelItems.push(pickRewardItem(safeItems, reelItems[reelItems.length - 1], avoidWinnerNeighbor, index));
      }
      if (safeItems.length > 1 && rewardItemKey(reelItems[reelItems.length - 1]) === rewardItemKey(winner)) {
        reelItems[reelItems.length - 1] = pickRewardItem(safeItems, reelItems[reelItems.length - 2], winner, targetIndex);
      }
      reelItems.push(winner);
      for (let index = 0; index < safeItems.length; index += 1) {
        reelItems.push(pickRewardItem(safeItems, reelItems[reelItems.length - 1], null, index));
      }
      return reelItems;
    }

    function rewardSpinMarkup(items, type, resultId) {
      const safeItems = items.length ? items : [{ id: "empty", title: "空", symbol: "?" }];
      const target = safeItems.find((item) => item.id === resultId) || safeItems[0];
      const targetIndex = 26;
      const itemHeight = 60;
      const viewportHeight = 140;
      const slotEnd = -((targetIndex * itemHeight) - ((viewportHeight - itemHeight) / 2));
      const reelItems = rewardReelItems(safeItems, target, targetIndex);
      const slots = reelItems.map((entry, index) => `
        <div class="reward-slot-item ${index === targetIndex ? "is-winning" : ""}">
          ${type === "event" ? '<img class="reward-slot-row-frame" src="images/board/impel_down_ui/impel_down_event_roulette_row_frame.webp" alt="" aria-hidden="true">' : ""}
          <span class="reward-slot-icon">${rewardSlotIcon(entry, type)}</span>
          <span class="reward-slot-label">${escapeHtml(rewardSlotLabel(entry))}</span>
        </div>
      `).join("");
      const title = type === "recruit" ? "招募！" : "抽選！";
      const kicker = type === "recruit" ? "推進城隱藏囚犯" : "推進城事件";
      const label = type === "recruit" ? "囚犯抽選中" : "事件抽選中";
      const desc = type === "recruit" ? "補給箱高速轉動中，停住後揭曉招募角色。" : "補給箱高速轉動中，停住後揭曉事件。";
      const centerIcon = type === "recruit" ? "hidden" : "unknown";
      return `
        <div class="reward-spin ${type === "recruit" ? "recruit-reward" : "event-reward"}">
          <div class="reward-clear">${title}</div>
          <div class="reward-card">
            <div class="reward-slot-shell">
              <div class="reward-slot-pointer"></div>
              <div class="reward-reel" style="--slot-end:${slotEnd}px;--spin-duration:${SPIN_SETTLE_MS - 850}ms">${slots}</div>
              <div class="reward-slot-center"><img src="images/board/impel_down_ui/event_icons/${centerIcon}.webp" alt="${type === "recruit" ? "囚犯招募" : "事件抽選"}"></div>
            </div>
            <div class="reward-text">
              <div class="reward-kicker">${kicker}</div>
              <div class="reward-label">${label}</div>
              <div class="reward-desc">${desc}</div>
            </div>
          </div>
        </div>
      `;
    }

    function recruitRailItemAt(items, index) {
      return items[index % items.length];
    }

    function recruitRailItems(items, result) {
      const source = items.length ? items : recruits;
      const railItems = [];
      for (let index = 0; index < RECRUIT_RAIL_COUNT; index += 1) {
        let offset = 0;
        let candidate = index === RECRUIT_RAIL_WIN_INDEX ? result : recruitRailItemAt(source, index);
        const cannotBeResultNeighbor = index === RECRUIT_RAIL_WIN_INDEX - 1 || index === RECRUIT_RAIL_WIN_INDEX + 1;
        while (
          source.length > 1 &&
          (
            (railItems.length && candidate.name === railItems[railItems.length - 1].name) ||
            (cannotBeResultNeighbor && candidate.name === result.name)
          )
        ) {
          offset += 1;
          candidate = recruitRailItemAt(source, index + offset);
        }
        railItems.push(candidate);
      }
      return railItems;
    }

    function recruitRailTokenMarkup(recruit, win = false) {
      return `
        <span class="recruit-rail-token${win ? " win" : ""}">
          <img src="${escapeHtml(recruit.image)}" alt="${escapeHtml(recruit.name)}">
          <b>${escapeHtml(recruit.name)}</b>
        </span>
      `;
    }

    function recruitRailOddsMarkup(items) {
      const source = items.length ? items : recruits;
      return recruits.map((recruit) => {
        const available = source.some((entry) => entry.id === recruit.id);
        return `<span>${available ? `L${recruit.unlock} ${recruitOdds(recruit, source)}%` : `L${recruit.unlock} -`}</span>`;
      }).join("");
    }

    function recruitRailSpinMarkup(items, resultId, settled = false) {
      const source = items.length ? items : recruits;
      const result = source.find((recruit) => recruit.id === resultId) || source[0] || recruits[0];
      const rail = recruitRailItems(source, result).map((recruit, index) => (
        recruitRailTokenMarkup(recruit, settled && index === RECRUIT_RAIL_WIN_INDEX)
      )).join("");
      return `
        <div class="rail-recruit-spin ${settled ? "revealed" : "spinning"}" style="--recruit-rail-duration:${RECRUIT_SPIN_MS}ms">
          <section class="recruit-rail-machine" aria-label="懸賞木牌軌角色招募">
            <div class="recruit-rail-title">
              <span>推進城隱藏囚犯</span>
              <b>07 懸賞木牌軌</b>
            </div>
            <div class="recruit-rail-status">${settled ? `停下：${escapeHtml(result.name)}` : "招募中..."}</div>
            <div class="recruit-rail-window">
              <div class="recruit-rail-track">${rail}</div>
            </div>
            <div class="recruit-rail-pointer"></div>
            <div class="recruit-rail-odds">${recruitRailOddsMarkup(source)}</div>
            <div class="recruit-rail-result">
              <span class="recruit-rail-result-portrait"><img src="${escapeHtml(result.image)}" alt="${escapeHtml(result.name)}"></span>
              <span class="recruit-rail-result-copy">
                <strong>${escapeHtml(result.name)}</strong>
                <span>LEVEL ${result.unlock} 解鎖</span>
                <span>招募成功</span>
              </span>
            </div>
            <div class="recruit-rail-scan"></div>
          </section>
        </div>
      `;
    }

    function formatBeli(value) {
      return Number(value || 0).toLocaleString("zh-Hant-TW");
    }

    function setActive(id) {
      if (isSpinning()) return;
      const player = players.find((entry) => entry.id === id);
      if (!player || player.status === "escaped") return;
      cancelDiceRoll();
      state.activeId = id;
      state.event = null;
      state.moveFromEvent = null;
      state.allowEscape = false;
      if (player.status === "locked") state.phase = "locked";
      else if (player.status === "wait_event") state.phase = "wait_event";
      else state.phase = "free";
      state.dice = "?";
      render();
    }

    function eventById(id) {
      return eventPool.find((event) => event.id === id) || eventPool[0];
    }

    function allRecruitsJoined() {
      return recruits.every((recruit) => state.recruited.includes(recruit.id));
    }

    function magellanAvailable() {
      return Number(activePlayer().level || 1) >= 4;
    }

    function eventDrawPool() {
      const hasRecruit = !allRecruitsJoined();
      return eventPool.filter((event) => {
        if (event.id === "hidden") return hasRecruit;
        if (event.id === "magellan") return magellanAvailable();
        return true;
      });
    }

    function drawEvent() {
      if (state.phase !== "free" || isSpinning()) return;
      const pool = eventDrawPool();
      const event = pool[Math.floor(Math.random() * pool.length)] || pool[0];
      state.phase = "event_spin";
      state.spinType = "event";
      state.spinItems = pool;
      state.spinResultId = event.id;
      state.spinSettled = false;
      state.event = null;
      state.moveFromEvent = null;
      state.allowEscape = false;
      render();
      spinTimer = setTimeout(() => {
        spinTimer = null;
        state.event = event.id;
        state.phase = event.id === "hidden" ? "recruit" : "event";
        state.spinType = null;
        state.spinItems = [];
        state.spinResultId = null;
        state.spinSettled = false;
        render();
      }, SPIN_SETTLE_MS);
    }

    function groupName() {
      return activeGroup().map((player) => player.name).join("、");
    }

    function rollEscape() {
      const player = activePlayer();
      if (state.diceRolling || state.phase !== "locked" || player.status !== "locked") return;
      cancelDiceRoll();
      const need = player.level;
      const bonus = Math.max(0, Number(player.escapeBonus || 0));
      const face = Math.floor(Math.random() * 6) + 1;
      const total = face + bonus;
      const success = total >= need;
      const nextBonus = success ? 0 : Math.min(6, bonus + 1);
      state.dice = "?";
      state.diceBonus = bonus;
      state.diceTotal = total;
      state.diceSuccess = success;
      state.diceNextBonus = nextBonus;
      state.diceRolling = true;
      state.diceRevealed = false;
      render();
      $("diceFace").classList.remove("roll");
      void $("diceFace").offsetWidth;
      $("diceFace").classList.add("roll");
      let tick = 0;
      diceTickTimer = setInterval(() => {
        tick += 1;
        const dice = $("diceFace");
        if (dice) dice.textContent = String(((tick + face) % 6) + 1);
      }, 86);
      diceTimer = setTimeout(() => {
        diceTimer = null;
        if (diceTickTimer) {
          clearInterval(diceTickTimer);
          diceTickTimer = null;
        }
        state.dice = String(face);
        state.diceRevealed = true;
        render();
        diceRevealTimer = setTimeout(() => {
          diceRevealTimer = null;
          activeGroup().forEach((entry) => {
            entry.escapeBonus = nextBonus;
            if (success) entry.status = "wait_event";
          });
          if (success) state.phase = "wait_event";
          state.event = null;
          state.diceRolling = false;
          state.diceRevealed = false;
          $("diceFace").classList.remove("roll", "revealed");
          render();
        }, ESCAPE_DICE_REVEAL_MS);
      }, ESCAPE_DICE_ROLL_MS);
    }

    function nextTurn() {
      const player = activePlayer();
      if (player.status === "wait_event") {
        player.status = "free";
        state.phase = "free";
        render();
      }
    }

    function resolveEventSuccess() {
      const event = eventById(state.event);
      if (state.phase !== "event") return;
      if (event.id === "magellan" && !magellanAvailable()) {
        state.event = null;
        state.phase = "free";
        render();
        return;
      }
      if (event.id === "ivankov") {
        healGroup();
        state.phase = "free";
        state.event = null;
        render();
        return;
      }
      state.phase = "move";
      state.moveFromEvent = event.id;
      state.allowEscape = event.id === "magellan";
      render();
    }

    function resolveEventFail() {
      const event = eventById(state.event);
      if (event.id === "patrol" || event.id === "magellan") {
        activeGroup().forEach((player) => {
          if (player.type === "prisoner") player.status = "locked";
        });
        state.phase = activePlayer().status === "locked" ? "locked" : "free";
      } else {
        state.phase = "free";
      }
      state.event = null;
      render();
    }

    function healGroup() {
      activeGroup().forEach((player) => {
        player.crew.forEach((member) => {
          member.hp = member.maxHp;
          member.sp = member.maxSp;
        });
      });
    }

    function moveGroup(direction) {
      if (state.phase !== "move") return;
      const fromLevel = activePlayer().level;
      const nextLevel = direction === "up" ? fromLevel - 1 : fromLevel + 1;
      if (nextLevel < 1) {
        escapeGroup("往上離開 LEVEL 1");
        return;
      }
      if (nextLevel > 6) {
        stayOnFloor();
        return;
      }
      const group = activeGroup();
      group.forEach((player) => {
        player.level = nextLevel;
        if (player.status !== "locked") player.status = "free";
      });
      state.phase = "free";
      state.event = null;
      state.moveFromEvent = null;
      state.allowEscape = false;
      render();
    }

    function stayOnFloor() {
      state.phase = "free";
      state.event = null;
      state.moveFromEvent = null;
      state.allowEscape = false;
      render();
    }

    function escapeGroup(reason = "直接逃出推進城") {
      activeGroup().forEach((player) => {
        player.status = "escaped";
        player.level = 0;
      });
      state.phase = "escaped";
      state.event = null;
      state.moveFromEvent = null;
      state.allowEscape = false;
      render();
    }

    function recruitPool() {
      return recruits.filter((recruit) => activePlayer().level >= recruit.unlock && !state.recruited.includes(recruit.id));
    }

    function recruitBoost(recruit) {
      return Number(state.recruitBoosts?.[recruit.id] || 0);
    }

    function recruitBaseWeight(recruit) {
      return RECRUIT_BASE_WEIGHTS[recruit.unlock] ?? Math.max(5, 40 - (recruit.unlock * 5));
    }

    function recruitBoostCost(recruit) {
      return recruit ? recruit.unlock * RECRUIT_BOOST_UNIT_COST : 0;
    }

    function recruitWeight(recruit, pool = recruitPool()) {
      const poolBoost = pool.reduce((sum, entry) => sum + recruitBoost(entry), 0);
      const ownBoost = recruitBoost(recruit);
      return Math.max(1, recruitBaseWeight(recruit) + (ownBoost * 4) - (poolBoost - ownBoost));
    }

    function recruitOdds(recruit, pool = recruitPool()) {
      if (!pool.length || !pool.some((entry) => entry.id === recruit.id)) return 0;
      const total = pool.reduce((sum, entry) => sum + recruitWeight(entry, pool), 0);
      return total ? Math.round((recruitWeight(recruit, pool) / total) * 100) : 0;
    }

    function ensureRecruitFocus() {
      const pool = recruitPool();
      if (!pool.length) {
        state.focusRecruitId = null;
        state.focusBoost = 0;
        return null;
      }
      if (!state.focusRecruitId || !pool.some((recruit) => recruit.id === state.focusRecruitId)) {
        state.focusRecruitId = pool[0].id;
      }
      const selected = pool.find((recruit) => recruit.id === state.focusRecruitId) || pool[0];
      state.focusBoost = selected ? recruitBoost(selected) : 0;
      return selected;
    }

    function selectRecruitFocus(id) {
      if (isSpinning() || state.phase !== "recruit") return;
      const recruit = recruitPool().find((entry) => entry.id === id);
      if (!recruit) return;
      state.focusRecruitId = recruit.id;
      state.focusBoost = recruitBoost(recruit);
      render();
    }

    function weightedRecruitDraw() {
      const pool = recruitPool();
      if (!pool.length) return null;
      const weights = pool.map((recruit) => recruitWeight(recruit, pool));
      const total = weights.reduce((sum, weight) => sum + weight, 0);
      let roll = Math.random() * total;
      for (let index = 0; index < pool.length; index += 1) {
        roll -= weights[index];
        if (roll <= 0) return pool[index];
      }
      return pool[0];
    }

    function recruitSpecial() {
      if (state.phase !== "recruit" || isSpinning()) return;
      const pool = recruitPool();
      const recruit = weightedRecruitDraw();
      if (!recruit) {
        state.phase = "free";
        state.event = null;
        render();
        return;
      }
      const cost = RECRUIT_DRAW_COST;
      if (activePlayer().coins < cost) {
        render();
        return;
      }
      const playerId = activePlayer().id;
      state.phase = "recruit_spin";
      state.spinType = "recruit";
      state.spinItems = pool;
      state.spinResultId = recruit.id;
      state.spinSettled = false;
      render();
      spinTimer = setTimeout(() => {
        spinTimer = null;
        state.spinSettled = true;
        render();
        spinRevealTimer = setTimeout(() => {
          spinRevealTimer = null;
          const player = players.find((entry) => entry.id === playerId);
          if (!player || player.status === "escaped") {
            cancelSpin();
            render();
            return;
          }
          state.activeId = playerId;
          player.coins -= cost;
          state.recruited.push(recruit.id);
          state.lastRecruit = recruit.id;
          state.focusBoost = 0;
          state.focusRecruitId = null;
          state.recruitBoosts = {};
          state.phase = "free";
          state.event = null;
          state.spinType = null;
          state.spinItems = [];
          state.spinResultId = null;
          state.spinSettled = false;
          render();
        }, RECRUIT_REVEAL_MS);
      }, RECRUIT_SPIN_MS);
    }

    function boostRecruitFocus() {
      if (isSpinning() || state.phase !== "recruit") return;
      const pool = recruitPool();
      if (!pool.length) return;
      const selected = ensureRecruitFocus();
      if (!selected) return;
      const currentBoost = recruitBoost(selected);
      const boostCost = recruitBoostCost(selected);
      if (currentBoost >= MAX_RECRUIT_BOOST || activePlayer().coins < boostCost) {
        render();
        return;
      }
      activePlayer().coins -= boostCost;
      state.recruitBoosts[selected.id] = currentBoost + 1;
      state.focusBoost = state.recruitBoosts[selected.id];
      render();
    }

    function skipRecruit() {
      if (isSpinning()) return;
      state.phase = "free";
      state.event = null;
      state.focusRecruitId = null;
      state.focusBoost = 0;
      state.recruitBoosts = {};
      render();
    }

    function reset() {
      cancelSpin();
      cancelDiceRoll();
      players[0].level = 4;
      players[0].status = "locked";
      players[0].escapeBonus = 0;
      players[0].coins = 50000;
      players[0].leader = 0;
      players[0].crew.forEach((member, index) => {
        const hp = [84, 92, 70, 88][index];
        const sp = [2, 1, 3, 2][index];
        member.hp = hp;
        member.sp = sp;
      });
      players[1].level = 5;
      players[1].status = "free";
      players[1].escapeBonus = 0;
      players[1].coins = 50000;
      players[1].leader = 0;
      players[1].crew.forEach((member) => {
        member.hp = member.maxHp;
        member.sp = member.maxSp;
      });
      players[2].level = 2;
      players[2].status = "free";
      players[2].escapeBonus = 0;
      players[2].coins = 50000;
      players[2].leader = 0;
      players[2].crew.forEach((member) => {
        member.hp = member.maxHp;
        member.sp = member.maxSp;
      });
      state = initialState();
      render();
    }

    function commandButtons() {
      const player = activePlayer();
      if (state.diceRolling) return ["擲骰中", "擲骰中", "往上", true];
      if (state.phase === "event_spin") return ["抽選中", "抽選中", "往上", true];
      if (state.phase === "recruit_spin") return ["招募中", "招募中", "放棄", true];
      if (state.phase === "locked") return ["擲逃籠骰", "切換玩家", "往上", true];
      if (state.phase === "wait_event") return ["下一回合", "切換玩家", "往上", true];
      if (state.phase === "free") return ["抽事件", "切換玩家", "往上", true];
      if (state.phase === "event") {
        const event = eventById(state.event);
        if (event.id === "patrol") return ["戰鬥勝利", "戰鬥失敗", "往上", true];
        if (event.id === "magellan") return ["挑戰勝利", "挑戰失敗", "往上", true];
        if (event.id === "key") return ["選擇移動", "不移動", "往上", true];
        if (event.id === "ivankov") return ["完全治癒", "離開", "往上", true];
      }
      if (state.phase === "move") return ["往上", player.level >= 6 ? "不移動" : "往下", "直接逃出", !state.allowEscape];
      if (state.phase === "recruit") return ["花貝里抽", "提高機率", "放棄", false];
      if (state.phase === "escaped") return ["重置", "切換玩家", "往上", true];
      return ["確認", "切換玩家", "往上", true];
    }

    function primaryAction() {
      if (isSpinning() || state.diceRolling) return;
      if (state.phase === "locked") rollEscape();
      else if (state.phase === "wait_event") nextTurn();
      else if (state.phase === "free") drawEvent();
      else if (state.phase === "event") resolveEventSuccess();
      else if (state.phase === "move") moveGroup("up");
      else if (state.phase === "recruit") recruitSpecial();
      else if (state.phase === "escaped") reset();
    }

    function secondaryAction() {
      if (isSpinning() || state.diceRolling) return;
      if (state.phase === "move") {
        if (activePlayer().level >= 6) stayOnFloor();
        else moveGroup("down");
      }
      else if (state.phase === "event") resolveEventFail();
      else if (state.phase === "recruit") boostRecruitFocus();
      else {
        const available = players.filter((player) => player.status !== "escaped");
        const index = available.findIndex((player) => player.id === state.activeId);
        const next = available[(index + 1) % available.length] || players[0];
        setActive(next.id);
      }
    }

    function thirdAction() {
      if (isSpinning() || state.diceRolling) return;
      if (state.phase === "move" && state.allowEscape) escapeGroup("直接逃出推進城");
      else if (state.phase === "recruit") skipRecruit();
    }

    function setTheme() {
      const floor = floorDef();
      document.documentElement.style.setProperty("--level", floor.accent);
      document.documentElement.style.setProperty("--level-soft", floor.glow);
    }

    function renderFloors() {
      $("floorList").innerHTML = floors.map((floor) => {
        const occupants = players.filter((player) => player.level === floor.level && player.status !== "escaped");
        const names = occupants.length
          ? occupants.map((player) => `${player.name}${player.status === "locked" ? "・關" : ""}`).join("、")
          : "無人";
        return `
          <button class="floor-row${floor.level === activePlayer().level ? " active" : ""}" type="button" data-floor="${floor.level}">
            <span class="floor-number">${floor.level}</span>
            <span class="floor-copy">
              <strong>LEVEL ${floor.level} ${floor.name}</strong>
              <span class="occupants">${names}</span>
            </span>
          </button>
        `;
      }).join("");
      document.querySelectorAll("[data-floor]").forEach((button) => {
        button.addEventListener("click", () => {
          const floor = Number(button.dataset.floor);
          const player = players.find((entry) => entry.level === floor && entry.status !== "escaped");
          if (player) setActive(player.id);
        });
      });
    }

    function renderRecruits() {
      const strip = $("recruitStrip");
      if (!strip) return;
      strip.classList.toggle("spinning", state.phase === "recruit_spin");
      strip.innerHTML = recruits.map((recruit) => {
        const unlocked = activePlayer().level >= recruit.unlock;
        const joined = state.recruited.includes(recruit.id);
        const focus = state.focusRecruitId === recruit.id;
        return `
          <button class="recruit-chip${unlocked ? " unlocked" : ""}${joined ? " joined" : ""}${focus ? " focus" : ""}" type="button" data-recruit="${recruit.id}" ${unlocked && !joined && !isSpinning() ? "" : "disabled"}>
            <img src="${recruit.image}" alt="${recruit.name}">
            <span>${joined ? "已招募" : `L${recruit.unlock}`}</span>
          </button>
        `;
      }).join("");
      document.querySelectorAll("[data-recruit]").forEach((button) => {
        button.addEventListener("click", () => {
          if (isSpinning()) return;
          const recruit = recruits.find((entry) => entry.id === button.dataset.recruit);
          if (!recruit || activePlayer().level < recruit.unlock || state.recruited.includes(recruit.id)) return;
          state.focusRecruitId = recruit.id;
          render();
        });
      });
    }

    function renderRecruitModal() {
      const modal = $("recruitModal");
      if (!modal) return;
      const open = state.phase === "recruit";
      modal.hidden = !open;
      if (!open) return;

      const player = activePlayer();
      const pool = recruitPool();
      const selected = ensureRecruitFocus();
      const selectedAvailable = selected && pool.some((recruit) => recruit.id === selected.id);
      const selectedBoost = selected ? recruitBoost(selected) : 0;
      const selectedBoostCost = selected ? recruitBoostCost(selected) : 0;
      $("recruitPoolText").textContent = `LEVEL ${player.level} 解鎖囚犯 ${pool.length} 人`;
      $("recruitWalletText").textContent = formatBeli(player.coins);

      $("prisonerGrid").innerHTML = recruits.map((recruit) => {
        const available = pool.some((entry) => entry.id === recruit.id);
        const joined = state.recruited.includes(recruit.id);
        const locked = player.level < recruit.unlock;
        const selectedClass = selected?.id === recruit.id ? " selected" : "";
        const stateClass = joined ? " joined" : locked ? " locked" : "";
        const odds = available ? recruitOdds(recruit, pool) : 0;
        const boost = recruitBoost(recruit);
        return `
          <button class="prisoner-card${selectedClass}${stateClass}" type="button" data-prisoner="${recruit.id}" ${available ? "" : "disabled"}>
            <span class="prisoner-portrait">
              <img src="${escapeHtml(recruit.image)}" alt="${escapeHtml(recruit.name)}">
            </span>
            <span class="prisoner-info">
              <span class="prisoner-heading">
                <strong>${escapeHtml(recruit.name)}</strong>
                <span class="prisoner-badge">L${recruit.unlock}</span>
              </span>
              <span class="prisoner-meta">
                <span>${joined ? "已招募" : locked ? "未解鎖" : "可招募"}</span>
              </span>
              <span class="prisoner-odds">
                <span>${odds}%</span>
                <span class="prisoner-boost">+${boost * 4}%</span>
              </span>
            </span>
          </button>
        `;
      }).join("") || `<div class="prisoner-empty">目前沒有可招募囚犯</div>`;

      if (selected) {
        $("recruitDetailImg").src = selected.image;
        $("recruitDetailImg").alt = selected.name;
        $("recruitDetailName").textContent = selected.name;
        $("recruitDetailMeta").textContent = `LEVEL ${selected.unlock} 解鎖`;
        $("recruitOddsText").textContent = `${selectedAvailable ? recruitOdds(selected, pool) : 0}%`;
        $("recruitBoostText").textContent = `+${selectedBoost * 4}% / +${MAX_RECRUIT_BOOST * 4}%`;
        $("recruitBoostCostText").textContent = formatBeli(selectedBoostCost);
        $("recruitFeeText").textContent = formatBeli(RECRUIT_DRAW_COST);
      } else {
        $("recruitDetailImg").removeAttribute("src");
        $("recruitDetailImg").alt = "無可招募囚犯";
        $("recruitDetailName").textContent = "無可招募囚犯";
        $("recruitDetailMeta").textContent = `LEVEL ${player.level}`;
        $("recruitOddsText").textContent = "0%";
        $("recruitBoostText").textContent = `+0% / +${MAX_RECRUIT_BOOST * 4}%`;
        $("recruitBoostCostText").textContent = "0";
        $("recruitFeeText").textContent = "0";
      }

      $("modalBoostBtn").disabled = !selectedAvailable || selectedBoost >= MAX_RECRUIT_BOOST || player.coins < selectedBoostCost;
      $("modalRecruitBtn").textContent = "花貝里抽";
      $("modalRecruitBtn").disabled = !selectedAvailable || !selected || player.coins < RECRUIT_DRAW_COST;
      $("modalSkipBtn").disabled = false;

      document.querySelectorAll("[data-prisoner]").forEach((button) => {
        button.addEventListener("click", () => selectRecruitFocus(button.dataset.prisoner));
      });
    }

    function renderEvent() {
      if (state.phase === "event_spin") {
        $("eventArt").innerHTML = rewardSpinMarkup(state.spinItems, "event", state.spinResultId);
      } else if (state.phase === "recruit_spin") {
        $("eventArt").innerHTML = recruitRailSpinMarkup(state.spinItems, state.spinResultId, state.spinSettled);
      } else {
        const artKey = state.phase === "event"
          ? state.event
          : state.phase === "move"
            ? (state.allowEscape ? "move_escape" : "move")
            : state.phase;
        const artPath = staticEventArtAssets[artKey] || "";
        $("eventArt").innerHTML = artPath
          ? `<div class="static-event-result"><img class="static-event-scene" src="${artPath}" alt="" aria-hidden="true"></div>`
          : "";
      }
    }

    function groupResourcesFull() {
      return activeGroup().every((player) => player.crew.every((member) => member.hp === member.maxHp && member.sp === member.maxSp));
    }

    function shouldShowEventPanel() {
      return true;
    }

    function render() {
      setTheme();
      const player = activePlayer();
      const floor = floorDef(player.level || 1);
      const leader = activeLeader();
      const group = activeGroup();
      const cageFree = player.status !== "locked" || state.phase === "escaped";
      const [primary, secondary, third, thirdDisabled] = commandButtons();

      $("frame").classList.toggle("panel-hidden", !shouldShowEventPanel());
      $("frame").classList.toggle("escape-dice-active", state.diceRolling);
      $("frame").classList.toggle("escape-dice-revealed", state.diceRolling && state.diceRevealed);
      $("rankSeal").textContent = floor.rank;
      $("floorTitle").textContent = player.status === "escaped" ? "推進城出口" : `LEVEL ${player.level} ${floor.name}`;
      $("squadText").textContent = group.map((entry) => entry.name).join("、") || player.name;
      $("phaseText").textContent = isSpinning() ? "轉盤中" : player.status === "locked" ? "關押中" : player.status === "wait_event" ? "下回合抽事件" : state.phase === "recruit" ? "招募中" : player.status === "escaped" ? "已逃出" : "可行動";
      $("groupCount").textContent = `${group.length || 1}隊`;
      $("coinText").textContent = String(player.coins);
      if (state.phase === "recruit") ensureRecruitFocus();
      $("focusText").textContent = state.focusRecruitId
        ? `${recruits.find((entry) => entry.id === state.focusRecruitId)?.name || "指定"} +${state.focusBoost * 4}%`
        : "無";
      $("diceFace").textContent = state.dice;
      $("diceFace").classList.toggle("roll", state.diceRolling && !state.diceRevealed);
      $("diceFace").classList.toggle("revealed", state.diceRolling && state.diceRevealed);
      $("cage").classList.toggle("free", cageFree);
      $("cage").classList.toggle("locked", player.status === "locked");
      $("stamp").classList.toggle("show", player.status === "wait_event");
      const captainImg = $("captainImg");
      const captainSrc = portraitForCage(leader, player.status === "locked");
      captainImg.alt = leader.name;
      const captainFallbackImg = $("captainFallback")?.querySelector("img");
      if (captainFallbackImg) captainFallbackImg.alt = leader.name || "未知隊長";
      $("cage").classList.remove("fallback");
      captainImg.onerror = () => {
        if (captainSrc !== leader.image && captainImg.getAttribute("src") === captainSrc) {
          captainImg.onerror = () => $("cage").classList.add("fallback");
          captainImg.src = leader.image;
          return;
        }
        $("cage").classList.add("fallback");
      };
      captainImg.src = captainSrc;

      $("primaryBtn").textContent = primary;
      $("secondaryBtn").textContent = secondary;
      $("thirdBtn").textContent = third;
      const busy = isSpinning() || state.diceRolling;
      $("primaryBtn").disabled = busy;
      $("secondaryBtn").disabled = busy;
      $("thirdBtn").disabled = busy || thirdDisabled;
      $("commandTitle").textContent = state.phase === "event_spin"
        ? "事件轉盤抽選中"
        : state.phase === "recruit_spin"
          ? "招募轉盤抽選中"
          : state.diceRolling
            ? state.diceRevealed ? `骰出 ${state.dice}${state.diceBonus ? ` + ${state.diceBonus} = ${state.diceTotal}` : ""}` : "出籠骰轉動中"
            : state.phase === "locked"
        ? `${player.name} 擲逃籠骰`
        : state.phase === "wait_event"
          ? "等待下一回合"
          : state.phase === "free"
            ? `${groupName()} 抽事件`
            : state.phase === "move"
              ? "選擇移動方向"
              : state.phase === "recruit"
                ? "隱藏囚犯招募"
                : state.phase === "escaped"
                  ? "已逃出"
                  : "處理事件";
      $("commandText").textContent = state.phase === "event_spin"
        ? "轉盤停止後會顯示抽到的事件。"
        : state.phase === "recruit_spin"
          ? "轉盤停止後會加入抽中的隱藏囚犯。"
          : state.diceRolling
            ? state.diceRevealed
              ? (state.diceSuccess ? "骰面停留 3 秒後結束判定。" : `失敗，下次逃籠骰 +${state.diceNextBonus || 1}。`)
              : "數字高速變換中，停下才揭曉結果。"
            : state.phase === "locked"
        ? `需要 ${player.level}+。${player.escapeBonus ? `目前補正 +${player.escapeBonus}。` : "層數由上往下算，越深越難。"}`
        : state.phase === "wait_event"
          ? "逃出牢籠後，本回合不能抽事件。"
          : state.phase === "free"
            ? "抽事件後依結果戰鬥、移動、治癒或招募。"
            : state.phase === "move"
              ? "往上是 LEVEL -1，往下是 LEVEL +1；同層玩家會一起行動。"
              : state.phase === "recruit"
                ? "花貝里抽選；可先提高指定角色機率。"
                : "選擇結果。";

      renderFloors();
      renderRecruits();
      renderRecruitModal();
      renderEvent();
    }

    $("primaryBtn").addEventListener("click", primaryAction);
    $("secondaryBtn").addEventListener("click", secondaryAction);
    $("thirdBtn").addEventListener("click", thirdAction);
    $("resetBtn").addEventListener("click", reset);
    $("modalBoostBtn").addEventListener("click", boostRecruitFocus);
    $("modalRecruitBtn").addEventListener("click", recruitSpecial);
    $("modalSkipBtn").addEventListener("click", skipRecruit);

    reset();
  </script>
  <script src="js/board_impel_down.js?v=20260824-team-invite-coop-v16"></script>
</body>
</html>
