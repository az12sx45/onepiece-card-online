  <style>
    :root{ --bg:#121315; --ink:#eaecee; --brand:#ffb84d; --brand-rgb: 255,184,77; --line: rgba(255,255,255,.12); --panel: rgba(15,17,19,.80); --cover:url("images/cover.jpg"); }
    html,body{height:100%;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,Segoe UI,Roboto,"PingFang TC","Noto Sans CJK TC",sans-serif;}
    .bg-anim{ position:fixed; inset:0; overflow:hidden; z-index:-1; background: radial-gradient(1200px 800px at 10% 20%, rgba(255,184,77,.08), transparent 60%), radial-gradient(1200px 800px at 90% 80%, rgba(0,158,255,.07), transparent 60%), linear-gradient(180deg,#0f1113 0%,#14171a 100%); }
    .bg-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:.35; filter:contrast(108%) saturate(108%) brightness(95%); pointer-events:none; }
    body.no-video .bg-anim::after{ content:""; position:absolute; inset:-5%; background-image:var(--cover); background-size:cover; background-position:center; opacity:.28; filter:contrast(110%) saturate(110%) blur(.4px); animation:kenburns 18s ease-in-out infinite alternate; mix-blend-mode:screen; }
    @keyframes kenburns{ 0%{transform:scale(1)} 100%{transform:scale(1.08) translate3d(0,-1.2%,0)} }
    .blink{ animation:blink 1.2s ease-in-out infinite; } @keyframes blink{ 0%,100%{opacity:.35} 50%{opacity:1} }
    .card{ background:#0f1113cc; border:1px solid #2a2e33; border-radius:16px; }
    .btn{ padding:.65rem .9rem; border-radius:.8rem; border:1px solid #2a2e33; background:#171a1e; } .btn:hover{ background:#1e2227; }
    .btn-primary{ background:var(--brand); color:#111; border-color:var(--brand); } .btn-primary:hover{ filter:brightness(1.05); }
    .avatar{ width:72px; height:72px; border-radius:999px; overflow:hidden; border:2px solid rgba(255,255,255,.08); background:#0c0e10; flex:none; }
    .avatar, .avatar img{ aspect-ratio:1/1; } .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .avatar.is-active{ border-color:#ffd36a; box-shadow:0 0 0 3px rgba(255,184,77,.25); }
    .avatar:hover{ border-color:#6b7280; }
    .mono{ display:flex; align-items:center; justify-content:center; font-weight:700; font-size:28px; color:#111; background:#ffd36a; }
    .title-wrap{ display:inline-block; perspective:1000px; }
    .title-main, .title-sub{ will-change: transform, opacity, filter; text-shadow: 0 2px 12px rgba(0,0,0,.45), 0 0 1px rgba(0,0,0,.35); }
    @keyframes tiltDrop{ 0%{opacity:0; transform:rotateX(18deg) translateY(-12px) scale(.98)} 100%{opacity:1; transform:rotateX(0) translateY(0) scale(1)} }
    .fx-tiltDrop{ transform-origin:50% 80%; animation:tiltDrop .8s cubic-bezier(.2,.9,.2,1) .1s both; }
    .fx-shine{ position:relative; overflow:hidden; }
    .fx-shine::after{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.0) 35%, rgba(255,211,106,.65) 50%, rgba(255,255,255,.0) 65%, transparent 100%); transform:translateX(-120%); animation:shineSweep 1.6s ease-out .5s both; mix-blend-mode:screen; pointer-events:none; }
    @keyframes shineSweep{ to{ transform:translateX(120%);} }
    @keyframes fadeUp{ 0%{opacity:0; transform:translateY(12px)} 100%{opacity:1; transform:translateY(0)} } .fx-fadeUp{ animation:fadeUp .7s ease-out .15s both; }
    .wave{ --stagger:.06s; --dur:1.4s; --amp:8px; --delayStart:1.2s; }
    .wave .char{ display:inline-block; transform:translateY(0); animation: waveBounce var(--dur) ease-in-out infinite; animation-delay: calc(var(--i) * var(--stagger) + var(--delayStart)); }
    @keyframes waveBounce{ 0%,100%{transform:translateY(0)} 35%{transform:translateY(calc(-1 * var(--amp)))} 70%{transform:translateY(0)} }
    .wave-sm{ --amp:5px; --dur:1.6s; --stagger:.055s; }
    .lock-overlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); color:#fff; z-index:50; text-align:center; padding:24px; backdrop-filter: blur(6px); }
    .lock-overlay .panel{ background:rgba(17,17,17,.85); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:18px 20px; max-width:420px; }
    .lock-overlay .icon{ font-size:40px; line-height:1; margin-bottom:10px; }
    @media (orientation: portrait){ .lock-overlay{ display:flex; } body.lock-scroll{ overflow:hidden; } }
    @media (orientation: landscape){ .card{ max-height:86vh; overflow:auto; } .avatar{ width:64px; height:64px; } }
    @media (max-height: 420px) and (orientation: landscape){ .title-main{ font-size: clamp(28px, 6vw, 48px); } .title-sub{ font-size: clamp(18px, 3.6vw, 28px); } .avatar{ width:56px; height:56px; } }
    @media (min-width: 768px) and (max-width: 1024px){ .title-main{ font-size: clamp(48px, 6.4vw, 92px); letter-spacing:.01em; } .title-sub{ font-size: clamp(28px, 3.8vw, 52px); } .wave{ --amp: 8px; } .wave-sm{ --amp: 5px; } }
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape){ .title-main{ font-size: clamp(44px, 5.8vw, 86px); } .title-sub{ font-size: clamp(26px, 3.4vw, 48px); } }
    @media (min-width: 1024px){ .wave{ --amp: 9px; } .wave-sm{ --amp: 6px; } } @media (min-width: 1536px){ .wave{ --amp: 10px; } .wave-sm{ --amp: 7px; } }
    .audio-toggle{ position: fixed; right: 12px; bottom: 12px; z-index: 30; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 10px; backdrop-filter: blur(6px); }
    .audio-toggle button{ display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); }
    .audio-toggle button:hover{ background: rgba(255,255,255,.1); }
    .audio-toggle .vol{ appearance:none; width:120px; height:4px; border-radius:999px; background:#444; }
    .audio-toggle .vol::-webkit-slider-thumb{ appearance:none; width:14px; height:14px; border-radius:999px; background:#ffd36a; border:1px solid #b3831b; }
    @media (max-width: 640px){ .audio-toggle{ gap:6px; padding:6px 8px; } .audio-toggle .vol{ width:86px; } }

   /* === Player Title Badge (Luxury / same as profile.html) === */
.player-title-badge{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 18px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  text-align:center;
  white-space:nowrap;
  box-sizing:border-box;
  user-select:none;
}
.player-title-badge .text{
  position:relative;
  z-index:3;
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

@keyframes float{ 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-3px);} }
@keyframes pulse{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.18);} }
@keyframes softGlow{ 0%,100%{opacity:.5;} 50%{opacity:.95;} }
@keyframes shine{ 0%{transform:translateX(-130%);opacity:0;} 20%{opacity:0;} 40%{transform:translateX(130%);opacity:1;} 60%{opacity:0;} 100%{transform:translateX(130%);opacity:0;} }

.player-title-badge.tier-1{
  border-radius:8px;
  border:1px solid rgba(119,124,132,.85);
  background:linear-gradient(135deg,#333842,#171920);
  color:#d0d3d8;
  text-shadow:0 0 6px rgba(0,0,0,.8);
}

.player-title-badge.tier-2{
  border-radius:999px;
  padding:7px 22px;
  border:1px solid #63d2ff;
  background:linear-gradient(135deg,#1b4d7e,#63d2ff);
  color:#e8f9ff;
  box-shadow:0 0 10px rgba(99,210,255,.45);
  overflow:visible;
}
.player-title-badge.tier-2::before,
.player-title-badge.tier-2::after{
  content:"";
  position:absolute; top:0; bottom:0; width:14px;
  background:inherit;
}
.player-title-badge.tier-2::before{ left:-8px; transform:skewX(-24deg); }
.player-title-badge.tier-2::after{ right:-8px; transform:skewX(24deg); }

.player-title-badge.tier-3{
  padding:7px 20px;
  color:#ffe4c4;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.12) 0,transparent 55%),
    radial-gradient(circle at 100% 100%,rgba(255,120,60,.25) 0,transparent 55%),
    linear-gradient(135deg,#3a0f18,#8b1c24);
  border:2px solid #f48c2b;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.55),
    0 0 16px rgba(244,140,43,.65);
  clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);
}
.player-title-badge.tier-3::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:10px;
  border:1px dashed rgba(255,223,186,.35);
  opacity:.7;
}

.player-title-badge.tier-4{
  padding:8px 22px 10px;
  color:#f9f0ff;
  background:radial-gradient(circle at top,#5c35b5,#1e1032);
  border:2px solid #e1c4ff;
  box-shadow:
    0 0 0 1px rgba(90,40,200,.55),
    0 0 18px rgba(147,96,255,.85);
  border-radius:16px 16px 10px 10px;
  overflow:visible;
  animation:float 5s ease-in-out infinite;
}
.player-title-badge.tier-4::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-10px;
  transform:translateX(-50%);
  width:60%;
  height:16px;
  background:linear-gradient(to bottom,#e1c4ff,#6e3bd1);
  clip-path:polygon(50% 100%,0 0,100% 0);
  box-shadow:0 4px 10px rgba(0,0,0,.55);
}

.player-title-badge.tier-5{
  padding:8px 28px;
  color:#fff9e0;
  background:linear-gradient(135deg,#5a2400,#ffcf66);
  border-radius:999px;
  border:3px solid #ffe08a;
  box-shadow:
    0 0 0 1px rgba(255,224,138,.45),
    0 0 22px rgba(255,204,110,.9);
  overflow:visible;
  animation:float 4.5s ease-in-out infinite, pulse 3.8s ease-in-out infinite;
}
.player-title-badge.tier-5::before,
.player-title-badge.tier-5::after{
  content:"";
  position:absolute;
  top:50%;
  width:26px;
  height:16px;
  background:radial-gradient(circle at 0 50%,rgba(255,255,255,.95) 0,rgba(255,224,138,.1) 70%);
  transform:translateY(-50%);
  filter:drop-shadow(0 0 8px rgba(255,224,138,.75));
}
.player-title-badge.tier-5::before{
  left:-16px;
  clip-path:polygon(100% 0,0 50%,100% 100%);
}
.player-title-badge.tier-5::after{
  right:-16px;
  clip-path:polygon(0 0,100% 50%,0 100%);
}
.player-title-badge.tier-5 .text::after{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,transparent 0,rgba(255,255,255,.85) 45%,transparent 75%);
  mix-blend-mode:screen;
  transform:translateX(-130%);
  animation:shine 3.6s ease-in-out infinite;
}

.player-title-badge.tier-6{
  padding:9px 36px;
  color:#fffdf5;
  background:
    radial-gradient(circle at 20% 0,rgba(255,255,255,.4) 0,transparent 55%),
    radial-gradient(circle at 80% 100%,rgba(255,210,120,.7) 0,transparent 55%),
    linear-gradient(135deg,#4b2a00,#c68b00,#ffe7a3);
  border-radius:999px;
  border:4px solid #ffe9c4;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.38),
    0 0 0 6px rgba(158,106,32,.65),
    0 0 32px rgba(255,243,196,.95);
  overflow:visible;
  position:relative;
  text-shadow:
    0 0 8px rgba(0,0,0,1),
    0 0 18px rgba(255,245,210,1);
  animation:float 4.2s ease-in-out infinite, pulse 3.4s ease-in-out infinite;
}
.player-title-badge.tier-6::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:999px;
  border:2px solid rgba(255,252,230,.85);
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.65),
    0 0 14px rgba(255,252,210,.6);
  opacity:.98;
  z-index:1;
}
.player-title-badge.tier-6::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 12% 50%,#fff 0,rgba(255,255,255,0) 55%),
    radial-gradient(circle at 88% 50%,#fff 0,rgba(255,255,255,0) 55%),
    radial-gradient(circle at 50% -10%,#fff 0,rgba(255,255,255,0) 60%);
  mix-blend-mode:screen;
  opacity:.65;
  z-index:1;
}
.player-title-badge.tier-6 .crown{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  font-size:15px;
  text-shadow:0 0 10px #ffffff, 0 0 18px rgba(255,230,160,1);
  z-index:4;
}
.player-title-badge.tier-6 .pendant{
  position:absolute;
  bottom:-14px;
  left:50%;
  transform:translateX(-50%);
  width:18px;height:18px;
  background:radial-gradient(circle,#fff7d0 0,#f0b400 45%,#8b4c00 100%);
  border-radius:50%;
  box-shadow:0 4px 8px rgba(0,0,0,.75), 0 0 10px rgba(255,230,170,.9);
  z-index:2;
}
.player-title-badge.tier-6 .pendant::before{
  content:"";
  position:absolute;
  top:-6px; left:50%;
  transform:translateX(-50%);
  width:9px;height:5px;border-radius:999px;
  background:radial-gradient(circle,#fffbe6 0,#b57a1f 100%);
}
.player-title-badge.tier-6 .glow{
  position:absolute;
  inset:-30%;
  background:radial-gradient(circle,rgba(255,255,255,.42) 0,transparent 60%);
  mix-blend-mode:screen;
  opacity:.6;
  z-index:0;
  animation:softGlow 4.4s ease-in-out infinite;
}

/* === WaitingRoom layout tweaks === */
.lobby-card{
  padding: 28px !important;
  max-width: 1100px;
}

.lobby-grid{
  gap: 14px;
}

.lobby-player{
  padding: 14px 14px;
  gap: 14px;
  min-height: 96px; /* 讓稱號+按鈕不擠 */
}

.lobby-player .avatar{
  width: 78px;
  height: 78px;
}

/* 稱號在等待室：統一縮小、限制寬度、避免擠壓按鈕 */
.lobby-player .player-title-badge{
  font-size: 11px;
  padding: 5px 14px;
  max-width: 320px;
}

/* T6 在等待室：縮小一級，並把裝飾(皇冠/吊飾)縮小，排版更穩 */
.lobby-player .player-title-badge.tier-6{
  padding: 6px 18px;
  border-width: 3px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.30),
    0 0 0 5px rgba(158,106,32,.55),
    0 0 22px rgba(255,243,196,.80);
  transform: scale(0.92);
  transform-origin: left center;
}
.lobby-player .player-title-badge.tier-6 .crown{
  top: -12px;
  font-size: 13px;
}
.lobby-player .player-title-badge.tier-6 .pendant{
  bottom: -12px;
  width: 16px;
  height: 16px;
}

/* === WaitingRoom: 點玩家頭像的功能選單（踢出 / 加好友）=== */
.pmenu-back{
  position:fixed; inset:0; z-index:240;
}
.pmenu-sheet{
  position:fixed; z-index:241;
  min-width: 180px;
  background: rgba(20,26,31,.98);
  border:1px solid rgba(255,255,255,.12);
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
}
.pmenu-hd{
  display:flex; gap:10px; align-items:center;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.10);
  margin-bottom: 8px;
}
.pmenu-ava{ width:40px; height:40px; border-radius: 12px; overflow:hidden; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); }
.pmenu-ava img{ width:100%; height:100%; object-fit:cover; display:block; }
.pmenu-name{ font-weight:800; font-size:14px; color: rgba(255,255,255,.92); }
.pmenu-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius: 12px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.92);
  padding: 9px 10px;
  font-weight: 800;
  cursor: pointer;
}
.pmenu-btn:hover{ background: rgba(255,255,255,.10); }
.pmenu-btn.danger{ border-color: rgba(255,100,100,.35); background: rgba(255,80,80,.08); }
.pmenu-btn.danger:hover{ background: rgba(255,80,80,.14); }
.pmenu-tip{ margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.55); text-align:center; }


    
/* === WaitingRoom: 文字聊天框（融入主題） === */
.lobby-chatwrap{
  border:1px solid rgba(var(--brand-rgb), .55);
  background: rgba(0,0,0,.16);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset;
}
.lobby-chatbox{
  height: 220px;
  overflow:auto;
  padding: 10px;
  border-radius: 14px;
  border:1px solid rgba(var(--brand-rgb), .30);
  background: rgba(0,0,0,.28);
}
.lobby-chatrow{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin-bottom: 10px;
}
.lobby-chatrow:last-child{ margin-bottom: 0; }

/* 自己訊息靠右 */
.lobby-chatrow.me{
  flex-direction: row-reverse;
}
.lobby-chatrow.me .lobby-chatmeta{
  text-align:right;
}
.lobby-chatrow.me .lobby-chatname{
  justify-content:flex-end;
}
.lobby-chatava{
  width:34px; height:34px;
  border-radius: 999px;          /* ✅ 圓形頭像 */
  overflow:hidden;
  border:none;                   /* ✅ 移除方形外框 */
  background: transparent;        /* ✅ 不要底色 */
  flex: 0 0 auto;
}
.lobby-chatava img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:999px; }

.lobby-chatmeta{ flex: 1 1 auto; min-width: 0; }
.lobby-chatname{
  font-size: 12px;
  color: rgba(255,255,255,.80);
  font-weight: 800;
  display:flex;
  align-items:center;
  gap:8px;
}
.lobby-chattime{
  font-size: 11px;
  color: rgba(255,255,255,.45);
  font-weight: 600;
}
.lobby-chattext{
  margin-top: 4px;
  font-size: 13px;
  color: rgba(255,255,255,.92);
  white-space: pre-wrap;
  word-break: break-word;
  display:inline-block;
  max-width: 100%;
  padding: 7px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
}
.lobby-chatrow.me .lobby-chattext{
  background: rgba(var(--brand-rgb), .12);
  border-color: rgba(var(--brand-rgb), .28);
}
.lobby-chatinput{
  margin-top: 10px;
  display:flex;
  gap:10px;
}
.lobby-chatinput input{
  flex:1 1 auto;
  border-radius: 14px;
  border:1px solid rgba(var(--brand-rgb), .28);
  background: rgba(0,0,0,.28); /* ✅ 不要白底，跟主題一致 */
  color: rgba(255,255,255,.92);
  padding: 10px 12px;
  outline:none;
}
.lobby-chatinput input::placeholder{
  color: rgba(255,255,255,.45);
}
.lobby-chatinput input:focus{
  border-color: rgba(var(--brand-rgb), .65);
  box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .14);
}
.lobby-chatbtn{
  flex: 0 0 auto;
  border-radius: 14px;
  border:1px solid rgba(var(--brand-rgb), .38);
  background: rgba(var(--brand-rgb), .14);
  color: rgba(255,255,255,.92);
  padding: 10px 14px;
  font-weight: 900;
  cursor:pointer;
}
.lobby-chatbtn:hover{ background: rgba(var(--brand-rgb), .20); }

/* === Rules Flipbook Modal === */
    .rulesOverlay{ position: fixed; inset: 0; background: rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index: 9999; }
    .rulesCard{
      width: 94vw; height: 92vh; max-height: none;
      background: rgba(10,12,18,0.92);
      border: 2px solid rgba(255, 211, 106, 0.75);
      box-shadow: 0 0 0 1px rgba(255, 184, 77, 0.35), 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.04);

<body class="no-video">
  <div class="lock-overlay" id="lockOverlay">

      <div id="txtRotateHint" class="text-sm opacity-80">若仍無法旋轉，請解鎖畫面旋轉或從瀏覽器選單開啟「允許旋轉」。</div>
    </div>
  </div>

  <div class="bg-anim">
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto" poster="images/cover.jpg">

    </video>
  </div>

  <div id="root" class="min-h-dvh flex items-center justify-center p-6"></div>

  <script>
    (function initBGVideo(){
      const v = document.getElementById('bgVideo');
      if(!v) return;
      const enableVideo = ()=> document.body.classList.remove('no-video');
      const fallback = ()=> document.body.classList.add('no-video');
      v.addEventListener('loadeddata', enableVideo, {once:true});
      v.addEventListener('canplay', enableVideo, {once:true});
      v.addEventListener('error', fallback, {once:true});
      const tryPlay = ()=> v.play().then(enableVideo).catch(fallback);
      window.addEventListener('pointerdown', tryPlay, {once:true});
      window.addEventListener('keydown', tryPlay, {once:true});
      tryPlay();
    })();

    (function orientationGate(){
      const overlay = document.getElementById('lockOverlay');
      function apply(){
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        document.body.classList.toggle('lock-scroll', isPortrait);
        if(overlay){ overlay.style.display = isPortrait ? 'flex' : 'none'; }
      }
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
      apply();
    })();

    async function tryLockLandscape(){
      try{
        if(screen.orientation && screen.orientation.lock){
          await screen.orientation.lock('landscape');
        }
      }catch(e){}
    }

    (function applyStaticI18n(){
      const I18N = window.__I18N;
      if(!I18N) return;
      const $t = (k)=>I18N.t(k);

      const a = document.getElementById('txtRotateTitle');
      const b = document.getElementById('txtRotateHint');
      if(a) a.textContent = $t('ui.rotateTitle');
      if(b) b.textContent = $t('ui.rotateHint');

      document.documentElement.setAttribute('lang', I18N.getLang());
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    // ========================
    //  雲端主控版：Start Page
    // ========================

    const SERVER_URL = 'https://onepiece-card-online.onrender.com';
    const socket = io(SERVER_URL, { transports: ['websocket'] });

    // === Presence：讓伺服器把此 socket 綁定到 userId（邀請/好友在線狀態會用到）===
    function sendPresence(pageName='start'){
      try{
        const secret = String(localStorage.getItem('opSecret')||'').trim();
        if(!secret) return;
        socket.timeout(8000).emit('PRESENCE_SET', { secret, page: pageName }, ()=>{});
      }catch(_){}
    }
    socket.on('connect', ()=>{
      // 連線一建立就回報一次，避免 onlineUsers 留著舊 socketId 造成「顯示在線但收不到邀請」
      sendPresence('start');
    });
    // 每 30 秒補送一次（Render / 某些網路情境可能會斷線重連，保險）
    setInterval(()=>sendPresence('start'), 30000);

    // === I18N 防呆 ===
    const I18N = window.__I18N || {
      getLang: () => 'zh-Hant',
      setLang: () => {},
      SUPPORTED: ['zh-Hant'],
      getLangLabel: () => '繁體中文',
      t: (k) => k
    };
    const t = (key, vars) => (I18N && typeof I18N.t === 'function') ? I18N.t(key, vars) : key;

    // === 等待室本地狀態（不落地）===
    let __lobby = {
      roomId:'',
      me:{ playerId:null, secret: (localStorage.getItem('opSecret')||''), name:'', avatar:1 },
      snapshot:null,
      cpuCount: 0
    };

    socket.on('JOINED', ({ playerId, secret })=>{
      __lobby.me.playerId = playerId;
      __lobby.me.secret   = secret;
      try { localStorage.setItem('opSecret', secret); } catch {}
    });

    socket.on('EMIT', (e)=>{
      if(!e) return;

      // ✅ 伺服器 push 的 toast（提示文字）
      if (e.type === 'toast'){
        try{
          if(typeof window.toast === 'function') window.toast(String(e.text||''));
          else console.log('[toast]', e.text);
        }catch(_){}
        return;
      }

      // ✅ 遊戲邀請：等待室邀請通知（會觸發底下的 Lobby Invite Modal）
      if (e.type === 'lobby_invite'){
        try{ console.log('[EMIT] lobby_invite', e); }catch(_){}

        try{
          const inv = e.invite;
          if(!inv) return;
          window.__pendingLobbyInvites = Array.isArray(window.__pendingLobbyInvites) ? window.__pendingLobbyInvites : [];
          window.__pendingLobbyInvites.push(inv);

          // 若 modal 的 handler 已經載入 → 立即顯示最後一筆
          if(typeof window.__onLobbyInvite === 'function'){
            const last = window.__pendingLobbyInvites[window.__pendingLobbyInvites.length-1];
            window.__pendingLobbyInvites = [];
            window.__onLobbyInvite(last);
          }
        }catch(err){
          console.warn('[lobby_invite] handler failed', err);
        }
        return;
      }

      // ✅ 被房主踢出等待室
      if (e.type === 'lobby_kicked'){
        try{
          if(typeof window.__forceLeaveLobby === 'function') window.__forceLeaveLobby({ reason:'kicked', roomId: e.roomId });
        }catch(_){ }
        return;
      }

      if (e?.type === 'lobby'){
        __lobby.snapshot = e.lobby;
        if (!__lobby.roomId) __lobby.roomId = e.lobby?.roomId || __lobby.roomId;
        if (typeof window.__setLobby === 'function') window.__setLobby(e.lobby);
        return;
      }
      if (e?.type === 'nav_game'){
        const url = new URL('game.html', location.origin);
        url.searchParams.set('server', SERVER_URL);
        url.searchParams.set('room',   __lobby.roomId);
        url.searchParams.set('name',   __lobby.me.name || 'P');
        url.searchParams.set('avatar', String(__lobby.me.avatar || 1));
        const humanCount = Array.isArray(__lobby.snapshot?.players)
          ? Math.max(1, __lobby.snapshot.players.length)
          : 1;
        const cpuCount2 = Number(__lobby.snapshot?.cpuCount ?? __lobby.cpuCount ?? 0) || 0;
        const totalCount = Math.max(1, humanCount + Math.max(0, cpuCount2));
        url.searchParams.set('n', String(totalCount));

        // ★ 把等待室的「每位玩家已裝備稱號」快照存到 sessionStorage，讓 game.html 能顯示
try{
  const map = {};
  const arr = Array.isArray(__lobby.snapshot?.players) ? __lobby.snapshot.players : [];
  arr.forEach(p=>{
    const label = String(p?.title ?? p?.equippedTitle ?? p?.equipped ?? "").trim();
    const tier0 = Number(p?.titleTier ?? p?.equippedTier ?? 1) || 1;
    const tier = Math.min(6, Math.max(1, tier0));

    const sec = String(p?.secret || "").trim();
    const pid = (p && (p.playerId ?? p.pid ?? p.id));

    if (label) {
      if (sec) map[`sec:${sec}`] = { label, tier };   // ✅ 主 key：不會因洗牌改變
      if (pid != null) map[`id:${pid}`] = { label, tier }; // 🧯 備援：舊寫法也留著
    }
  });
  sessionStorage.setItem('opRoomTitles', JSON.stringify(map));
}catch(e){}

        location.href = url.toString();
        return;
      }
    });

    // === 雲端 API helpers（主控）===
    async function cloudGet(secret){
      return await new Promise((resolve)=>{
        socket.timeout(8000).emit('PROFILE_GET', { secret }, (err, res)=>{
          if(err || !res?.ok) return resolve(null);
          resolve(res.profile || null);
        });
      });
    }

    async function cloudUpdate(secret, patch){
      return await new Promise((resolve)=>{
        socket.timeout(8000).emit('PROFILE_UPDATE', { secret, patch }, (err, res)=>{
          if(err) return resolve({ ok:false, error:'timeout' });
          resolve(res || { ok:false, error:'unknown' });
        });
      });
    }

    // === 把雲端資料 normalize 成 start.html 使用的 profile 結構 ===
    function normalizeCloudProfile(cloud){
      const name = String(cloud?.name || '').trim();
    const avatarNum0 = Number(cloud?.avatar ?? 1) || 1;
let avatar = Math.min(50, Math.max(1, avatarNum0));

// 允許免費範圍：1~30
const FREE_MAX = 30;

// 讀取雲端擁有清單（商店購買紀錄）
const ownedAvatars = Array.isArray(cloud?.stats?.client?.shop?.ownedAvatars)
  ? cloud.stats.client.shop.ownedAvatars.map(n => Number(n)).filter(n => Number.isFinite(n))
  : [];

// 若選到 31+，但沒買過 → 強制降回 1（或 30 也行）
if (avatar > FREE_MAX && !ownedAvatars.includes(avatar)) {
  avatar = 1;
}

const avatarUrl = `images/avatars/${avatar}.webp`;


      const client = (cloud?.stats?.client && typeof cloud.stats.client === 'object')
        ? cloud.stats.client
        : null;

      const equippedTitle = String(client?.titles?.equipped || '').trim();
      const equippedTier  = Number(client?.titles?.equippedTier || 1) || 1;

      return {
        playerName: name,
        playerAvatar: avatar,
        avatarUrl,
        client,
        wall: cloud?.stats?.wall || null,

        // ✅ 新增：等待室顯示用
        equippedTitle,
        equippedTier
      };
    }

    // === 若雲端沒 client，給一份最小預設（仍然只存雲端）===
    function makeDefaultClient(name, avatar){
      return {
        player: { name: name || '', avatar: avatar || 1 },
        totals: { coins: 0, games: 0, wins: 0 },
        deluxeUnlocked: [],
        titles: { owned: [], equipped: '', equippedTier: 1 },
        recent: [],
        _appliedMatchKeys: []
      };
    }

    // === 工具 ===
    const {useState, useEffect, useMemo} = React;
    const MIN_PLAYERS = 2;

    function uid(){ return Math.random().toString(36).slice(2,10); }
    function genRoomId(){
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s="";
      for(let i=0;i<6;i++) s += letters[Math.floor(Math.random()*letters.length)];
      return s;
    }
    function getMeId(){
      let me = sessionStorage.getItem("op_me_id");
      if(!me){
        me = "me_" + uid();
        sessionStorage.setItem("op_me_id", me);
      }
      return me;
    }

    function WaveText({ text, className="", small=false }){
      const chars = Array.from(text);
      const waveClass = small ? "wave wave-sm" : "wave";
      return (
        <span className={`${waveClass} ${className}`}>
          {chars.map((ch, idx) => (
            <span className="char" style={{["--i"]: idx}} key={idx}>
              {ch === " " ? "\u00A0" : ch}
            </span>
          ))}
        </span>
      );
    }

    function PressAnyKey({onProceed}){
      useEffect(()=>{
        const h=(e)=>{
          e.preventDefault();
          onProceed();
          tryLockLandscape();
          window.__OPAudio?.startAudio();
        };
        window.addEventListener('keydown', h, {once:true});
        window.addEventListener('pointerdown', h, {once:true});
        return ()=>{
          window.removeEventListener('keydown', h);
          window.removeEventListener('pointerdown', h);
        };
      }, [onProceed]);

      return (
        <div className="relative w-full min-h-[92vh] select-none">
          <div className="absolute left-1/2 -translate-x-1/2 top-[60vh] md:top-[58vh] text-center space-y-2">
            <div className="title-wrap">
              <div className="title-main font-black tracking-tight whitespace-nowrap fx-tiltDrop fx-shine text-[clamp(28px,8.2vw,48px)] [@media(orientation:landscape)]:text-[clamp(24px,6.6vw,44px)] md:text-[clamp(52px,5.2vw,96px)] lg:text-[clamp(60px,4.6vw,110px)] xl:text-[clamp(68px,4vw,128px)]">
                <WaveText text={t("brand.titleEn")} />
              </div>
              <div className="title-sub font-extrabold text-amber-300 mt-2 fx-fadeUp whitespace-nowrap text-[clamp(16px,5.2vw,28px)] [@media(orientation:landscape)]:text-[clamp(16px,3.6vw,24px)] md:text-[clamp(30px,3.2vw,56px)] lg:text-[clamp(34px,2.8vw,64px)] xl:text-[clamp(38px,2.4vw,72px)]">
                <WaveText text={t("brand.titleSub")} small />
              </div>
            </div>
          </div>

          <div
            className="absolute left-1/2 -translate-x-1/2 text-sm md:text-base text-neutral-200 blink md:bottom-8"
            style={{bottom:"calc(env(safe-area-inset-bottom, 0px) - 10px)", paddingBottom:0}}
          >
            {t("ui.pressAnyKey")}
          </div>
        </div>
      );
    }

    // =========================
    //  Auth Panel（只負責拿 secret）
    // =========================
    function AuthPanel({ onAuthed, onSkip }) {
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    try {
      const savedUser = localStorage.getItem("op_last_username") || "";
      const savedPass = localStorage.getItem("op_last_password") || "";
      if (savedUser) setUsername(savedUser);
      if (savedPass) setPassword(savedPass);
    } catch {}
  }, []);

  function submit() {
    if (!username || !password) {
      setErr("請輸入帳號與密碼");
      return;
    }

    setLoading(true);
    setErr("");

    const evt = mode === "login" ? "AUTH_LOGIN" : "AUTH_REGISTER";

    socket.timeout(12000).emit(evt, { username, password }, (e, res) => {
      setLoading(false);

      if (e || !res?.ok) {
        setErr(res?.error || e?.message || "連線失敗");
        return;
      }

      try {
        localStorage.setItem("op_last_username", username);
        localStorage.setItem("op_last_password", password);
      } catch {}

      localStorage.setItem("opSecret", res.secret);
      __lobby.me.secret = res.secret;

      onAuthed?.(res.secret);
    });
  }

  return (
    <form
      onSubmit={(e) => {
        e.preventDefault();
        submit();
      }}
      className="card w-[min(420px,90vw)] p-6 space-y-4"
    >
      <h2 className="text-xl font-bold text-amber-300 text-center">
        {mode === "login" ? "帳號登入" : "建立帳號"}
      </h2>

      <input
        className="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"
        placeholder="帳號（英文 / 數字）"
        value={username}
        onChange={(e) => setUsername(e.target.value)}
      />

      <input
        type="password"
        className="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"
        placeholder="密碼（至少 6 碼）"
        value={password}
        onChange={(e) => setPassword(e.target.value)}
      />

      {err && <div className="text-sm text-red-400">{err}</div>}

      <button
        type="submit"
        className="btn-primary btn w-full"
        disabled={loading}
      >
        {loading ? "連線中…" : mode === "login" ? "登入" : "註冊"}
      </button>

      <div className="flex justify-between text-sm text-neutral-400">
        <button
          type="button"
          className="underline"
          onClick={() => setMode(mode === "login" ? "register" : "login")}
        >
          {mode === "login" ? "我要註冊" : "已有帳號"}
        </button>

        <button
          type="button"
          className="underline"
          onClick={onSkip}
        >
          先不登入
        </button>
      </div>
    </form>
  );
}

    // =========================
    //  Main Menu（雲端資料顯示）
    // =========================
    function MainMenu({ profile, onStart, onRule, onLangChange, onProfilePage, onRefreshCloud, cloudLoading }) {
      const cur = I18N.getLang();
      return (
        <div className="card w-[min(520px,92vw)] p-6 text-center space-y-6 relative">

            <label className="text-[11px] text-neutral-300 mr-2">{t("ui.lang")}</label>
            <select className="btn text-sm py-1 px-2" value={cur} onChange={(e)=> onLangChange?.(e.target.value)}>
              {I18N.SUPPORTED.map(l=>(
                <option key={l} value={l}>{I18N.getLangLabel(l)}</option>
              ))}
            </select>
          </div>

          <div className="flex items-center justify-center gap-3">
            <div className="avatar is-active">
              <img src={profile?.avatarUrl} alt=""/>
            </div>
            <div className="text-left">
              <div className="text-sm text-neutral-400">已登入</div>
              <div className="text-lg font-bold text-amber-300">
                {profile?.playerName || "（尚未設定名稱）"}
              </div>
            </div>
          </div>

          <button className="btn-primary btn w-full text-lg py-3" onClick={onStart}>
            {t("ui.startGame")}
          </button>

          <button className="btn w-full text-lg py-3" onClick={onProfilePage}>
            個人頁面
          </button>

          <button className="btn w-full text-lg py-3" onClick={()=>location.href="shop.html"}>

    function NameAvatarCloud({ initialName, initialAvatar, secret, onDone }){
      const [name,setName]=useState(initialName || "");
      const [pick,setPick]=useState(Math.min(30, Math.max(1, Number(initialAvatar)||1)));
      const [saving,setSaving]=useState(false);
      const [err,setErr]=useState("");

      const avatars = useMemo(
  ()=> Array.from({length:30},(_,i)=>`images/avatars/${i+1}.webp`),
  []
);


      async function handleSubmit(e){
        e.preventDefault();
        const safe=(name||"").trim()||"無名航海士";
        const avatar = Math.min(30, Math.max(1, Number(pick)||1));


        setSaving(true);
        setErr("");

        const res = await cloudUpdate(secret, (prev=>({
          name: safe,
          avatar: String(avatar),
          stats: {
            ...(prev?.stats || {}),
            client: (prev?.stats?.client && typeof prev.stats.client === 'object')
              ? {
                  ...prev.stats.client,
                  player: { name: safe, avatar }
                }
              : makeDefaultClient(safe, avatar)
          }
        }))(window.__lastCloudProfile || null));

        setSaving(false);

        if(!res?.ok){
          if(res?.error === 'name_taken'){
            setErr('此名稱已有人取用（全服不可重複），請換一個。');
          }else if(res?.error === 'bad_name'){
            setErr('名稱不合法：請輸入 1~16 字，不能全空白。');
          }else{
            setErr("雲端儲存失敗，請重試（確認網路/伺服器）");

          return;
        }

        onDone?.({ playerName:safe, playerAvatar:avatar, avatarUrl:avatars[avatar-1] });
      }

                  />
                </div>

                    maxLength={16}

      const [cpuCount, setCpuCount] = useState(() => {
        try {
          const v = Number(localStorage.getItem("op_cpu_count") || "0");
          if (Number.isNaN(v)) return 0;
          return Math.min(3, Math.max(0, v));
        } catch {
          return 0;
        }
      });

      const meId = getMeId();


      // ====== 房間清單（公開等待室） ======
      const [roomList, setRoomList] = useState([]);
      const [listLoading, setListLoading] = useState(false);
      const [listErr, setListErr] = useState("");

      function fetchRoomList(){
        try{
          if(!socket){ setListErr("Socket 未連線"); return; }
          setListLoading(true);
          setListErr("");
          socket.timeout(8000).emit("ROOM_LIST_GET", {}, (err, res) => {
            setListLoading(false);
            if(err || !res?.ok){
              setListErr(res?.error || "取得房間清單失敗");
              return;
            }
            setRoomList(Array.isArray(res.rooms) ? res.rooms : []);
          });
        }catch(e){
          setListLoading(false);
          setListErr("取得房間清單失敗");
        }
      }

      useEffect(() => {
        fetchRoomList();
        if(!socket) return;
        const onUpd = (p) => {
          try{
            if(p && Array.isArray(p.rooms)) setRoomList(p.rooms);
          }catch{}
        };
        socket.on("ROOM_LIST_UPDATE", onUpd);
        const t = setInterval(fetchRoomList, 5000);
        return () => {
          clearInterval(t);
          try{ socket.off("ROOM_LIST_UPDATE", onUpd); }catch{}
        };
      }, []);


      function createRoom() {
        const id = genRoomId();
        __lobby.roomId = id;
        __lobby.me.name = profile.playerName;
        __lobby.me.avatar = profile.playerAvatar;
        __lobby.cpuCount = cpuCount;

        try { localStorage.setItem("op_cpu_count", String(cpuCount)); } catch {}

        socket.emit("JOIN_ROOM", {
          roomId: id,
          displayName: profile.playerName,
          avatar: profile.playerAvatar,

          // ✅ 新增：稱號（server 若有存進 lobby，就能讓其他人也看到）
          title: profile.equippedTitle || "",
          titleTier: profile.equippedTier || 1,

          secret: __lobby.me.secret,
          cpuCount
        });

        onEnter(id, { host: true, cpuCount });
      }

      function doJoin(codeRaw) {
        const code = (codeRaw || "").toUpperCase().replace(/\s+/g, "");
        if (!code) { alert(t("ui.alertNeedRoomId")); return; }

        __lobby.roomId = code;
        __lobby.me.name = profile.playerName;
        __lobby.me.avatar = profile.playerAvatar;

        socket.emit("JOIN_ROOM", {
          roomId: code,

          avatar: profile.playerAvatar,

          title: profile.equippedTitle || "",
          titleTier: profile.equippedTier || 1,

          secret: __lobby.me.secret,
        });

        onEnter(code, { host: false });
      }

      function tryJoin() {
        doJoin(joinCode);
      }

      function randomJoin(){
        // 從房間清單裡隨機挑一個「等待中且未滿」的房間加入
        const cand = Array.isArray(roomList)
          ? roomList.filter(r => {
              const total = Number(r.total || 0);
              const status = String(r.status || 'waiting');
              return status === 'waiting' && total > 0 && total < 6;
            })
          : [];
        if(!cand.length){
          alert('目前沒有可加入的房間（等待中且未滿）');
          return;
        }
        const pick = cand[Math.floor(Math.random() * cand.length)];
        doJoin(pick.roomId);
      }


      // ===== List View（只顯示所有房間 + 返回/隨機加入） =====
      if(view === 'list'){
        return (

                <button
                  type="button"
                  className="btn"
                  onClick={randomJoin}
                  title="從等待中且未滿的房間隨機加入"
                >
                  隨機加入
                </button>
                <button
                  type="button"
                  onClick={fetchRoomList}
                  className={"btn " + (listLoading ? "opacity-60 cursor-not-allowed" : "")}
                  disabled={listLoading}
                >
                  {listLoading ? "更新中…" : "刷新"}
                </button>
              </div>
            </div>

            {listErr && <div className="text-sm text-red-400">{listErr}</div>}

            {!listErr && (!roomList || roomList.length === 0) && (
              <div className="text-sm text-neutral-400">目前沒有等待室房間</div>
            )}

            {roomList && roomList.length > 0 && (
              <div className="space-y-2">
                {roomList
                  .slice()
                  .sort((a,b)=>{
                    const sa = String(a.status||'waiting');
                    const sb = String(b.status||'waiting');
                    const wa = (sa==='waiting')?0:(sa==='playing')?2:1;
                    const wb = (sb==='waiting')?0:(sb==='playing')?2:1;
                    if(wa!==wb) return wa-wb;
                    return String(a.roomId||'').localeCompare(String(b.roomId||''));
                  })
                  .map((r) => {
                    const total = Number(r.total || 0);
                    const cpu = Number(r.cpuCount || 0);
                    const full = total >= 6;
                    const status = String(r.status || 'waiting');
                    const joinable = (status === 'waiting') && !full;

                    return (
                      <div key={r.roomId} className="flex items-center justify-between gap-3 border border-neutral-700/60 rounded-xl px-3 py-3 bg-black/15">
                        <div className="min-w-0">

                            <div className="font-semibold text-amber-300 text-lg">{(r.hostName ? `${r.hostName}的等待室` : `等待室`)}</div>
                            {status !== 'waiting' && (
                              <span className="text-[11px] px-2 py-0.5 rounded-full border border-neutral-500/40 bg-neutral-500/10 text-neutral-200">
                                {status === 'playing' ? '遊戲中' : '狀態：' + status}

                        <button
                          type="button"

                          disabled={!joinable}
                          onClick={() => doJoin(r.roomId)}
                        >
                          {!joinable ? (full ? "已滿" : "不可加入") : "加入"}
                        </button>
                      </div>
                    );
                  })}
              </div>
            )}

            <div className="text-xs text-neutral-500 text-right">提示：只列出公開等待室房間（自動 5 秒更新一次）</div>
          </div>
        );
      }

      return (
        <div className="card w-[min(980px,96vw)] p-5 md:p-6 space-y-6">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

          <div className="grid md:grid-cols-2 gap-6">

function titleTierOf(p){

    function App(){

        const params = new URLSearchParams(location.search);
        const fromProfile = params.get("from") === "profile";
        const autoJoin = params.get("autojoin") === "1";
        const pendingJoin = !!(sessionStorage.getItem("op_pending_join_room") || "").trim();
        const hasSecret = !!(localStorage.getItem("opSecret") || "").trim();
        // ✅ 若是從其他頁面接受邀請回來：直接跳過「按一下開始」畫面
        if (fromProfile || autoJoin || pendingJoin) return hasSecret ? "boot" : "auth";
        return "press";
      });

// ====== 控制好友框顯示（登入完成後才顯示）======
useEffect(() => {
  const dock = document.getElementById("friendDock");
  if (!dock) return;

  // 只有登入完成並進入主流程才顯示
  const showStages = ["menu", "choice", "waiting"];

}, [stage]);

// ====== 伺服器強制離開等待室（例如：被房主踢出）======
useEffect(() => {
  window.__forceLeaveLobby = (opt={}) => {
    try{
      // 若不是在等待室，忽略
      if(stage !== 'waiting') return;

      // 不需要再送 LEAVE_ROOM（踢人時 server 已經移除）
      try{
        if(typeof window.toast === 'function'){
          const msg = (opt?.reason === 'kicked') ? '你已被房主踢出房間' : '已離開房間';
          window.toast(msg);
        }
      }catch(_){ }

      // 切回選房 + 清掉 lobby 記憶體
      setStage('choice');
      __lobby = {
        roomId:'',
        me:{ playerId:__lobby.me.playerId, secret:__lobby.me.secret, name:__lobby.me.name, avatar:__lobby.me.avatar },
        snapshot:null,
        cpuCount: 0
      };
    }catch(_){ }
  };

  return () => { try{ window.__forceLeaveLobby = null; }catch(_){} };
}, [stage]);


      // expose current stage for non-React scripts (invite auto-join)
      useEffect(()=>{ try{ window.__stageNow = stage; }catch{} }, [stage]);

      const [secret, setSecret] = useState(()=> (localStorage.getItem("opSecret") || "").trim());
      const [cloudProfile, setCloudProfile] = useState(null); // normalized for UI
      const [cloudLoading, setCloudLoading] = useState(false);
      const [cloudErr, setCloudErr] = useState("");

      const [roomInfo,setRoomInfo]=useState(null);

        const b = document.getElementById("txtRotateHint");
        if(a) a.textContent = t("ui.rotateTitle");
        if(b) b.textContent = t("ui.rotateHint");
        setLangTick(x=>x+1);
      }

      async function pullCloudProfile(nextSecret){
        const s = (nextSecret || secret || "").trim();
        if(!s) return null;

        setCloudLoading(true);
        setCloudErr("");

        const cloud = await cloudGet(s);

        setCloudLoading(false);

        if(!cloud){
          setCloudErr("雲端讀取失敗（PROFILE_GET），請確認網路或重新登入。");
          return null;
        }

        // 存一份給 NameAvatarCloud patch 參考（避免覆蓋 stats）
        window.__lastCloudProfile = cloud;

        const normalized = normalizeCloudProfile(cloud);
        setCloudProfile(normalized);
        window.__cloudProfile = normalized;

        // 同步 __lobby（只留記憶體）
        __lobby.me.secret = s;
        __lobby.me.name = normalized.playerName || '';
        __lobby.me.avatar = normalized.playerAvatar || 1;

        return normalized;
      }

      // boot：有 secret 就拉雲端，決定要 menu 還是 create-character
      useEffect(()=>{
        if(stage !== "boot") return;

        // prevent stale async boot from overriding stage after auto-join (e.g., when accepting an invite)
        const token = Date.now();
        try{ window.__bootToken = token; }catch{}

        pullCloudProfile().then((p)=>{
          try{
            if(window.__bootToken !== token) return;
            if(window.__stageNow && window.__stageNow !== "boot") return;
          }catch(_){}

          if(!p) return;
          const hasName = !!String(p.playerName||'').trim();
          const hasAvatar = Number(p.playerAvatar||0) > 0;
          if(hasName && hasAvatar) setStage("menu");
          else setStage("profileCloud");
        });
      }, [stage]);

        setStage("waiting");

            {stage==="press" && (
              <PressAnyKey onProceed={()=>{

                setStage(hasSecret ? "boot" : "auth");

            {stage==="boot" && (

                <div className="mt-2 flex gap-2 justify-center">
                  <button className="btn" onClick={()=>setStage("auth")}>重新登入</button>
                  <button className="btn" onClick={()=>pullCloudProfile()}>重試</button>
                </div>
              </div>
            )}

            {stage==="profileCloud" && (
              <NameAvatarCloud
                secret={secret}
                initialName={cloudProfile?.playerName}
                initialAvatar={cloudProfile?.playerAvatar || 1}
                onDone={(p)=>{
                  setCloudProfile(p);
                  __lobby.me.name = p.playerName;
                  __lobby.me.avatar = p.playerAvatar;
                  setStage("menu");
                }}
              />
            )}

            {stage==="menu" && cloudProfile && (
              <MainMenu
                profile={cloudProfile}
                cloudLoading={cloudLoading}
                onRefreshCloud={()=>pullCloudProfile()}
                onStart={()=> setStage("choice")}
                onProfilePage={()=>{ location.href = "profile.html"; }}
                onRule={()=> setStage("rule")}
                onLangChange={changeLang}
              />
            )}

            {stage==="choice" && cloudProfile && (
              <RoomChoice
                profile={cloudProfile}
                onEnter={enterRoom}
                onBackToMenu={()=> setStage("menu")}
              />
            )}

            {stage==="waiting" && roomInfo && cloudProfile && (
              <WaitingRoom
                roomId={roomInfo.id}
                profile={cloudProfile}
                onLeave={()=>{
                  const rid = __lobby?.roomId || roomInfo?.id || "";
                  try{
                    socket.emit("LEAVE_ROOM", { roomId: rid, playerId: __lobby.me.playerId, secret: __lobby.me.secret }, ()=>{});
                  }catch{}
                  setStage("choice");
                  __lobby = {
                    roomId:'',
                    me:{ playerId:__lobby.me.playerId, secret:__lobby.me.secret, name:__lobby.me.name, avatar:__lobby.me.avatar },
                    snapshot:null,
                    cpuCount: 0
                  };
                }}
              />
            )}

            <RuleModal show={stage==="rule"} onClose={()=> setStage("menu")} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

  <div class="audio-toggle" id="audioCtrl" style="display:none">
    <button id="btnMute" title="靜音/取消靜音" aria-label="Mute/Unmute">
      <svg id="icoVol" width="16" height="16" viewBox="0 0 24 24" fill="#ffd36a">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path id="wave" d="M16 8c1.5 1.5 1.5 6.5 0 8" stroke="#ffd36a" stroke-width="2" fill="none"></path>
      </svg>
    </button>
    <input id="rngVol" class="vol" type="range" min="0" max="100" step="1" value="65" />
  </div>

  <script>
  (function(){
    const S={ muteKey:"op_audio_mute", volKey:"op_audio_vol", hasStarted:false, fadeTimer:null, autoTried:false };
    const $intro=document.getElementById('sfxIntro');
    const $bgm=document.getElementById('bgm');
    const $wrap=document.getElementById('audioCtrl');
    const $btn=document.getElementById('btnMute');
    const $ico=document.getElementById('icoVol');
    const $wave=document.getElementById('wave');
    const $rng=document.getElementById('rngVol');

    const savedMute=localStorage.getItem(S.muteKey);
    const savedVol=localStorage.getItem(S.volKey);
    let muted=savedMute==="1";
    let vol=isNaN(+savedVol)?20:Math.max(0,Math.min(100,+savedVol));

    setVolume(vol);
    applyMuteUI();
    $wrap.style.display='flex';

    function setVolume(v){
      vol=v;
      $rng.value=String(v);
      const gain=muted?0:(v/100);
      if($bgm) $bgm.volume=Math.min(1,Math.max(0,gain));
      if($intro) $intro.volume=Math.min(1,Math.max(0,Math.min(0.9,gain*1.2)));
      localStorage.setItem(S.volKey,String(v));
    }

    function fade(el,target,ms){
      if(!el) return;
      clearInterval(S.fadeTimer);
      const stepMs=40, steps=Math.max(1,Math.round(ms/stepMs));
      const start=el.volume;
      let n=0;
      S.fadeTimer=setInterval(()=>{
        n++;
        const t=n/steps;
        el.volume=start+(target-start)*t;
        if(n>=steps){
          clearInterval(S.fadeTimer);
          el.volume=target;
        }
      }, stepMs);
    }

    function applyMuteUI(){
      const on=!muted;
      $ico.setAttribute('fill', on?'#ffd36a':'#bbb');
      $wave.setAttribute('stroke', on?'#ffd36a':'#bbb');
    }

    async function tryAutoStart(){
      if(S.autoTried||S.hasStarted) return;
      S.autoTried=true;
      try{
        setVolume(vol);
        if($bgm) await $bgm.play();
        if(!muted && $bgm) $bgm.volume=Math.min(1,vol/100);
        S.hasStarted=true;
      }catch(e){
        S.hasStarted=false;
      }
    }

    async function startAudioAfterGesture(){
      if(S.hasStarted) return;
      S.hasStarted=true;
      try{
        if($bgm){
          $bgm.volume=0;
          await $bgm.play().catch(()=>{});
        }
        if($intro && $intro.src){
          $intro.currentTime=0;
          $intro.volume=Math.min(1,(vol/100)*0.9);
          await $intro.play().catch(()=>{});
          $intro.onended=()=>{
            if(!muted && $bgm) fade($bgm, Math.min(1, vol/100), 1200);
          };
        }else{
          if(!muted && $bgm) fade($bgm, Math.min(1, vol/100), 800);
        }
      }catch(e){
        S.hasStarted=false;
      }
    }

    $btn.addEventListener('click', ()=>{
      muted=!muted;
      localStorage.setItem(S.muteKey, muted?"1":"0");
      applyMuteUI();
      if(muted){
        if($bgm) fade($bgm,0,250);
        if($intro && !$intro.paused) fade($intro,0,150);
      }else{
        setVolume(vol);
        if($bgm && $bgm.paused){
          $bgm.play().catch(()=>{});
        }
        if($bgm) fade($bgm, Math.min(1, vol/100), 250);
      }
    });

    $rng.addEventListener('input', (e)=> setVolume(+e.target.value));
    document.addEventListener('DOMContentLoaded', tryAutoStart);

    window.__OPAudio = {
      startAudio: startAudioAfterGesture,
      setVolume,
      mute: ()=>{ if(!muted) $btn.click(); },
      unmute: ()=>{ if(muted) $btn.click(); }
    };
  })();

<script>
(function(){
  function q(id){ return document.getElementById(id); }
  const back = q('lobbyInviteBack');
  const ava  = q('lobbyInviteAva');
  const sub  = q('lobbyInviteSub');
  const meta = q('lobbyInviteMeta');
  const bOk  = q('lobbyInviteOk');
  const bNo  = q('lobbyInviteNo');
  const bMu  = q('lobbyInviteMute');

  let curInvite = null;

  function avatarUrlById(id){
    const n = Math.max(1, Math.min(2000, Number(id)||1));
    return `images/avatars/${n}.webp`;
  }

  function hide(){
    curInvite = null;
    if(back){ back.style.display='none'; back.setAttribute('aria-hidden','true'); }
  }

  function show(inv){
    if(!inv) return;
    curInvite = inv;
    if(ava) ava.src = avatarUrlById(inv.fromAvatar);
    if(sub) sub.textContent = `${String(inv.fromName||'好友')} 邀請你加入等待室`;
    if(meta) meta.textContent = `房號：${String(inv.roomId||'—')}`;
    if(back){ back.style.display='flex'; back.setAttribute('aria-hidden','false'); }
  }

  // 給 socket.on('EMIT') 呼叫用（若先收到，會暫存在 __pendingLobbyInvites）
  window.__onLobbyInvite = function(inv){
    try{ show(inv); }catch(e){ console.warn('[invite show failed]', e); }
  };

  // 若邀請在本 script 載入前就先收到：補撈最後一筆直接顯示
  try{
    const list = window.__pendingLobbyInvites;
    if(Array.isArray(list) && list.length){
      const last = list[list.length-1];
      window.__pendingLobbyInvites = [];
      show(last);
    }
  }catch(_){ }

  back && back.addEventListener('click', (e)=>{ if(e.target===back) hide(); });

  function respond(action){
    const inv = curInvite;
    if(!inv) return hide();
    const sec = String(localStorage.getItem('opSecret')||'').trim();
    const sock = window.socket;
    if(!sec || !sock){
      hide();
      alert('尚未登入或 socket 未連線');
      return;
    }
    sock.timeout(12000).emit('LOBBY_INVITE_RESPOND', { secret: sec, inviteId: inv.inviteId, action }, (err, res)=>{
      if(err || !res?.ok){
        hide();
        alert(res?.error || '回覆邀請失敗');
        return;
      }
      if(action==='accept'){
        const roomId = String(res.roomId || inv.roomId || '').trim();
        if(roomId){
          try{
            const prof = window.__cloudProfile;
            const name = String(prof?.playerName || window.__lobby?.me?.name || 'P').trim() || 'P';
            const avatar = Number(prof?.playerAvatar || window.__lobby?.me?.avatar || 1) || 1;
            const title = String(prof?.equippedTitle || '').trim();
            const tier  = Number(prof?.equippedTier || 1) || 1;
            sock.emit('JOIN_ROOM', { roomId, displayName: name, avatar, title, titleTier: tier, secret: sec });
            window.__enterRoom && window.__enterRoom(roomId, { host:false });
          }catch(e){
            console.warn('[invite accept join failed]', e);
          }
        }
      }
      hide();
    });
  }

  bOk && bOk.addEventListener('click', ()=> respond('accept'));
  bNo && bNo.addEventListener('click', ()=> respond('reject'));
  bMu && bMu.addEventListener('click', ()=> respond('mute5'));
})();
</script>

// ===== 防止「自己看到自己訊息重複」：DM_SEND callback + DM_NEW echo 會造成重複顯示 =====
// 做法：送出成功時先把訊息簽名記到快取；收到同一則 DM_NEW（from=自己）就略過。
const __fdRecentSig = new Map(); // peerId -> Set(sig)
function __fdMsgSig(m){
  // 用 from/to/ts/body 組合做簽名；伺服器 echo 時通常一致
  const from = Number(m?.from)||0;
  const to   = Number(m?.to)||0;
  const ts   = Number(m?.ts)||0;
  const body = String(m?.body||"");
  return `${from}|${to}|${ts}|${body}`;
}
function __fdMarkRecent(m){
  try{
    const fromId = Number(m?.from)||0;
    const peerId = (fromId === Number(me?.userId)) ? Number(m?.to) : fromId;
    if(!peerId) return;
    const sig = __fdMsgSig(m);
    let set = __fdRecentSig.get(peerId);
    if(!set){ set = new Set(); __fdRecentSig.set(peerId, set); }
    set.add(sig);
    setTimeout(()=>{
      try{
        const s = __fdRecentSig.get(peerId);
        if(!s) return;
        s.delete(sig);
        if(s.size===0) __fdRecentSig.delete(peerId);
      }catch{}
    }, 12000);
  }catch{}
}

  function ensureSocket(){
    // ✅ 重要：朋友聊天/未讀/打字提示依賴同一條 socket
    // 以前這裡會在 sock.connected === false 時「重建 socket」，導致 DM_NEW 監聽掛在舊 socket 上 → 訊息不即時
    if (sock) return sock;
    if (window.socket) { sock = window.socket; return sock; }

    const url =
      window.SERVER_URL ||
      window.serverURL ||
      localStorage.getItem("op_server_url") ||
      (location.origin.includes("onrender.com") ? location.origin : location.origin);

    if (typeof io !== "function"){
      setHint("缺少 Socket.IO（io）");
      return null;
    }

    sock = io(url, { transports: ["websocket"] });
    window.socket = sock;
    return sock;
  }

  function ensureSecret(){
    secret = (window.secret || localStorage.getItem("op_secret") || localStorage.getItem("opSecret") || "").trim();

  function isAuthed(){

  async function socialAuth(){
    ensureSocket();
    ensureSecret();
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("SOCIAL_AUTH", { secret }, (err, res) => {
      if(err || !res?.ok){
        setHint("好友/聊天：尚未登入（缺少 secret）");
        return;
      }
      me = res.me || me;
      renderMeMini();

      try{ sock.emit("PRESENCE_SET", { secret, page: "start" }); }catch{}
      setHint("");
      fetchFriends();
    });
  }

  function fetchFriends(){
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("FRIENDS_GET", { secret }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "好友清單讀取失敗");
        return;
      }
      friends = (res.friends || []).slice(0, 200);
      
      requestsIn = (res.requestsIn || []).slice(0, 200);
      requestsOut = (res.requestsOut || []).slice(0, 200);
renderFriends();
      // sync open chat online status
      for(const [peerId, w] of openChats.entries()){
        const f = friends.find(x=>x.userId===peerId);
        if(f){
          w.peer = f;
          updateWinHeader(peerId);
        }
      }
    });
  }

  function bringToFront(peerId){
    chatOrder = chatOrder.filter(x=>x!==peerId);
    chatOrder.push(peerId);
    // rebuild DOM order (row-reverse means last is closest to right)
    for(const id of chatOrder){
      const w = openChats.get(id);
      if(w && w.el) tray.appendChild(w.el);
    }
  }

  function updateWinHeader(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    const f = w.peer;
    const name = f?.name || ("#" + peerId);
    w.nameEl.textContent = name;
    w.statusEl.textContent = f?.online ? (f?.activity || "線上") : "離線";
    w.avaImg.src = avatarUrlById(f?.avatar || 1);
  }

  function setWinBadge(peerId, n){
    const w = openChats.get(peerId);
    if(!w) return;
    const v = Math.max(0, Number(n)||0);
    if(v<=0){
      w.badgeEl.style.display="none";
      w.badgeEl.textContent = "";
      return;
    }
    w.badgeEl.style.display="inline-flex";
    w.badgeEl.textContent = String(Math.min(99, v));
  }

  function scrollLogToBottom(peerId){
    const w = openChats.get(peerId);
    if(!w || !w.log) return;
    // 避免縮小狀態/剛開啟時高度尚未計算，使用 raf + setTimeout 雙保險
    try{ requestAnimationFrame(()=>{ try{ w.log.scrollTop = w.log.scrollHeight + 9999; }catch{} }); }catch{}
    setTimeout(()=>{ try{ w.log.scrollTop = w.log.scrollHeight + 9999; }catch{} }, 0);
  }

function appendMsgTo(peerId, m){
    const w = openChats.get(peerId);
    if(!w) return;
    const div = document.createElement("div");
    div.className = "fd-msg" + (Number(m.from) === Number(me.userId) ? " me" : "");
    div.textContent = m.body || "";
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = fmtTime(m.ts);
    div.appendChild(t);
    w.log.appendChild(div);
    scrollLogToBottom(peerId);
  }

  function loadHistory(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    w.log.innerHTML = "";
    sock.timeout(12000).emit("DM_HISTORY", { secret, withUserId: peerId, limit: 60 }, (err, res) => {
      if(err || !res?.ok){
        appendMsgTo(peerId, { from: peerId, body: "（讀取聊天記錄失敗）", ts: Date.now() });
        return;
      }
      const msgs = res.messages || [];
      for(const m of msgs) appendMsgTo(peerId, m);
    
      scrollLogToBottom(peerId);
  });
  }

  function sendMsg(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    const body = String(w.inp.value||"").trim();
    if(!body) return;
    w.inp.value = "";
    sock.timeout(12000).emit("DM_SEND", { secret, toUserId: peerId, body }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "送出失敗");
        return;
      }
      setHint("");
        if(res.message){
          __fdMarkRecent(res.message);
          appendMsgTo(peerId, res.message);
        }
    });
  }

  function closeChat(peerId){
    const w = openChats.get(peerId);
    if(!w) return;
    w.el.remove();
    openChats.delete(peerId);
    chatOrder = chatOrder.filter(x=>x!==peerId);

  function toggleMin(peerId){

    if(!w) return;
    w.minimized = !w.minimized;

    else w.el.classList.remove("minimized");

      setWinBadge(peerId, 0);
      w.el.classList.remove("unreadPulse");
      unread.set(peerId, 0);
      renderFriends();
      setTimeout(()=> w.inp?.focus(), 0);

  function openChat(peer){
    const peerId = Number(peer.userId);
    unread.set(peerId, 0);
    renderFriends();

    // 使用者主動開啟聊天 -> 視為已讀，停止提醒動畫
    stopUnreadPulse(peerId);

    if(openChats.has(peerId)){
      // restore + focus + bring front
      bringToFront(peerId);
      const w = openChats.get(peerId);
      w.peer = peer;
      updateWinHeader(peerId);
      if(w.minimized) toggleMin(peerId);
      setWinBadge(peerId, 0);
      setTimeout(()=> w.inp?.focus(), 0);
      return;
    }

    // cap windows like LoL (avoid overflow)
    const MAX_OPEN = 4;
    if(chatOrder.length >= MAX_OPEN){
      const kick = chatOrder.shift();
      if(kick != null) closeChat(kick);
    }

    const el = createChatWindow(peer);
    tray.appendChild(el);
    chatOrder.push(peerId);

    bringToFront(peerId);
    loadHistory(peerId);
    setTimeout(()=> openChats.get(peerId)?.inp?.focus(), 0);
  }

  function startUnreadPulse(peerId){
    const w = openChats.get(peerId);
    if(!w?.el) return;
    w.el.classList.add("unreadPulse");
  }
  function stopUnreadPulse(peerId){
    const w = openChats.get(peerId);
    if(!w?.el) return;
    w.el.classList.remove("unreadPulse");
  }

  // 當收到未讀訊息時：自動開「縮小聊天室」並慢慢忽暗忽明提醒
  function openChatAuto(peerId){
    peerId = Number(peerId);
    if(!Number.isFinite(peerId) || peerId<=0) return;

    const peer =
      friends.find(x => Number(x.userId) === peerId) ||
      { userId: peerId, name: "好友", avatar: 1, online: false };

    if(openChats.has(peerId)){
      const w = openChats.get(peerId);
      w.peer = peer;
      updateWinHeader(peerId);

      if(!w.minimized) toggleMin(peerId);

      const cnt = Math.max(1, Number(unread.get(peerId)||0) || 0);
      setWinBadge(peerId, cnt);
      startUnreadPulse(peerId);
      return;
    }

    const MAX_OPEN = 4;
    if(chatOrder.length >= MAX_OPEN){
      const kick = chatOrder.shift();
      if(kick != null) closeChat(kick);
    }

    const el = createChatWindow(peer);
    tray.appendChild(el);
    chatOrder.push(peerId);

    bringToFront(peerId);

    const w = openChats.get(peerId);
    if(w && !w.minimized) toggleMin(peerId);

    loadHistory(peerId);

    const cnt = Math.max(1, Number(unread.get(peerId)||0) || 0);
    setWinBadge(peerId, cnt);
    startUnreadPulse(peerId);
  }


  // click anywhere on collapsed dock to expand
  dock.addEventListener("click", (e) => {
    if(dock.classList.contains("collapsed")){
      if(e.target && (e.target.id === "fdMinBtn")) return;
      dock.classList.remove("collapsed");
      try{ localStorage.setItem("op_fdock_collapsed", "0"); }catch{}
      updateDockMinIcon();
    }
  });

  minBtn.addEventListener("click", () => {
    dock.classList.toggle("collapsed");
    updateDockMinIcon();
    renderMeMini();
    try{ localStorage.setItem("op_fdock_collapsed", dock.classList.contains("collapsed") ? "1" : "0"); }catch{}
  });

  addBtn.addEventListener("click", () => {
    const name = String(addInp.value||"").trim();
    if(!name) return;
    addInp.value = "";
    if(!sock){ setHint("好友/聊天：Socket 尚未連線"); return; }
    if(!secret){ setHint("好友/聊天：請先登入（缺少 opSecret）"); return; }
    sock.timeout(12000).emit("FRIEND_ADD_BY_NAME", { secret, name }, (err, res) => {
      if(err || !res?.ok){
        setHint(res?.error || "加入失敗");
        return;
      }
      setHint("");
      fetchFriends();
    });
  });

  addInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter") addBtn.click();
  });

  function wireSocketEvents(){
    if(!sock) return;

    // ✅ socket 可能自動重連；重連後要再做一次 SOCIAL_AUTH，否則伺服器不會把新 socket 記成在線上，DM_NEW 收不到
    if(!sock.__fdock_wired){
      sock.__fdock_wired = true;
      sock.on("connect", ()=>{
        try{
          ensureSecret();
          if(secret) socialAuth();
        }catch{}
      });
    }
    sock.on("FRIENDS_DIRTY", () => fetchFriends());
    sock.on("DM_NEW", (m) => {
      if(!isAuthed()) return;

      const fromId = Number(m.from);
      const peerId = (fromId === me.userId) ? Number(m.to) : fromId;

      // window open?
      if(openChats.has(peerId)){
        // 防止自己端重複：若此 DM_NEW 是我剛剛 DM_SEND 成功回傳的同一則，就略過
        if(Number(m?.from) === Number(me?.userId)){
          const sig = __fdMsgSig(m);
          const set = __fdRecentSig.get(peerId);
          if(set && set.has(sig)) return;
        }
        appendMsgTo(peerId, m);

        const w = openChats.get(peerId);
        // if minimized and message from other side -> show small badge on window
        if(w?.minimized && Number(m.from) !== Number(me.userId)){
          const cur = Number(w.badgeEl.textContent||"0") || 0;
          setWinBadge(peerId, cur + 1);
          startUnreadPulse(peerId);
        }else{
          setWinBadge(peerId, 0);
        }
      }else{
        // dock unread badge + 自動跳出縮小聊天室提醒
        if(Number(m.from) !== Number(me.userId)){
          const next = (unread.get(peerId)||0) + 1;
          unread.set(peerId, next);
          renderFriends();
          openChatAuto(peerId);
        }
      }
    });
  }

  // init
  ensureSocket();
  ensureSecret();
  wireSocketEvents();
  renderMeMini();
  socialAuth();
  setInterval(() => { if(secret) fetchFriends(); }, 12000);
})();
</script>

<script>
(function(){
  // ✅ 從其他頁面接受邀請後，會先把 roomId 放在 sessionStorage，跳回 start.html
  const roomId = String(sessionStorage.getItem('op_pending_join_room') || '').trim();
  if(!roomId) return;
  // 注意：不要在 React 初始化前清掉 pendingJoin，否則會回到「按任意鍵開始」。

  function pickMe(){
    // 盡量用雲端 profile，其次 fallback 用 localStorage
    const p = window.__cloudProfile || {};
    const name =
      String(p.playerName || localStorage.getItem('op_name') || localStorage.getItem('op_player_name') || 'P').trim() || 'P';
    const avatar = Number(p.playerAvatar || localStorage.getItem('op_avatar') || localStorage.getItem('op_player_avatar') || 1) || 1;
    const title = String(p.equippedTitle || '').trim();
    const tier  = Number(p.equippedTier || 1) || 1;
    return { name, avatar, title, tier };
  }

  function ensureSocket(){
    // 這頁本來就會建立 window.socket（等待室主連線）
    return window.socket || null;
  }

  function tick(){
    const sock = ensureSocket();
    if(!sock || !sock.connected){ return setTimeout(tick, 200); }
    if(typeof window.__enterRoom !== 'function'){ return setTimeout(tick, 200); }

    // wait until boot/profile fetch is not actively driving the stage
    const st = String(window.__stageNow || '').trim();
    if(!st || st === 'press' || st === 'auth' || st === 'boot'){ return setTimeout(tick, 200); }

    const sec = String(localStorage.getItem('opSecret')||'').trim();
    if(!sec){ console.warn('[autoJoin] missing opSecret'); return; }

    const me = pickMe();
    try{
      try{ window.__pendingJoinActive = true; }catch{}
      sock.emit('JOIN_ROOM', { roomId, displayName: me.name, avatar: me.avatar, title: me.title, titleTier: me.tier, secret: sec });
      window.__enterRoom(roomId, { host:false });
      // ✅ 這時才清掉 pendingJoin（確保已跳過 press 並開始自動加入）
      try{ sessionStorage.removeItem('op_pending_join_room'); sessionStorage.removeItem('op_pending_join_via'); }catch(_){ }

      setTimeout(()=>{ try{ window.__pendingJoinActive = false; }catch{} }, 1500);
    }catch(e){
      console.warn('[autoJoin] failed', e);
    }
  }
  tick();
})();
</script>
