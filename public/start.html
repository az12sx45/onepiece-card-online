  <style>
    :root{ --bg:#121315; --ink:#eaecee; --brand:#ffb84d; --cover:url("images/cover.jpg"); }
    html,body{height:100%;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,Segoe UI,Roboto,"PingFang TC","Noto Sans CJK TC",sans-serif;}
    .bg-anim{ position:fixed; inset:0; overflow:hidden; z-index:-1; background: radial-gradient(1200px 800px at 10% 20%, rgba(255,184,77,.08), transparent 60%), radial-gradient(1200px 800px at 90% 80%, rgba(0,158,255,.07), transparent 60%), linear-gradient(180deg,#0f1113 0%,#14171a 100%); }
    .bg-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:.35; filter:contrast(108%) saturate(108%) brightness(95%); pointer-events:none; }
    body.no-video .bg-anim::after{ content:""; position:absolute; inset:-5%; background-image:var(--cover); background-size:cover; background-position:center; opacity:.28; filter:contrast(110%) saturate(110%) blur(.4px); animation:kenburns 18s ease-in-out infinite alternate; mix-blend-mode:screen; }
    @keyframes kenburns{ 0%{transform:scale(1)} 100%{transform:scale(1.08) translate3d(0,-1.2%,0)} }
    .blink{ animation:blink 1.2s ease-in-out infinite; } @keyframes blink{ 0%,100%{opacity:.35} 50%{opacity:1} }
    .card{ background:#0f1113cc; border:1px solid #2a2e33; border-radius:16px; }
    .btn{ padding:.65rem .9rem; border-radius:.8rem; border:1px solid #2a2e33; background:#171a1e; } .btn:hover{ background:#1e2227; }
    .btn-primary{ background:var(--brand); color:#111; border-color:var(--brand); } .btn-primary:hover{ filter:brightness(1.05); }
    .avatar{ width:72px; height:72px; border-radius:999px; overflow:hidden; border:2px solid rgba(255,255,255,.08); background:#0c0e10; flex:none; }
    .avatar, .avatar img{ aspect-ratio:1/1; } .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .avatar.is-active{ border-color:#ffd36a; box-shadow:0 0 0 3px rgba(255,184,77,.25); }
    .avatar:hover{ border-color:#6b7280; }
    .mono{ display:flex; align-items:center; justify-content:center; font-weight:700; font-size:28px; color:#111; background:#ffd36a; }
    .title-wrap{ display:inline-block; perspective:1000px; }
    .title-main, .title-sub{ will-change: transform, opacity, filter; text-shadow: 0 2px 12px rgba(0,0,0,.45), 0 0 1px rgba(0,0,0,.35); }
    @keyframes tiltDrop{ 0%{opacity:0; transform:rotateX(18deg) translateY(-12px) scale(.98)} 100%{opacity:1; transform:rotateX(0) translateY(0) scale(1)} }
    .fx-tiltDrop{ transform-origin:50% 80%; animation:tiltDrop .8s cubic-bezier(.2,.9,.2,1) .1s both; }
    .fx-shine{ position:relative; overflow:hidden; }
    .fx-shine::after{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.0) 35%, rgba(255,211,106,.65) 50%, rgba(255,255,255,.0) 65%, transparent 100%); transform:translateX(-120%); animation:shineSweep 1.6s ease-out .5s both; mix-blend-mode:screen; pointer-events:none; }
    @keyframes shineSweep{ to{ transform:translateX(120%);} }
    @keyframes fadeUp{ 0%{opacity:0; transform:translateY(12px)} 100%{opacity:1; transform:translateY(0)} } .fx-fadeUp{ animation:fadeUp .7s ease-out .15s both; }
    .wave{ --stagger:.06s; --dur:1.4s; --amp:8px; --delayStart:1.2s; }
    .wave .char{ display:inline-block; transform:translateY(0); animation: waveBounce var(--dur) ease-in-out infinite; animation-delay: calc(var(--i) * var(--stagger) + var(--delayStart)); }
    @keyframes waveBounce{ 0%,100%{transform:translateY(0)} 35%{transform:translateY(calc(-1 * var(--amp)))} 70%{transform:translateY(0)} }
    .wave-sm{ --amp:5px; --dur:1.6s; --stagger:.055s; }
    .lock-overlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); color:#fff; z-index:50; text-align:center; padding:24px; backdrop-filter: blur(6px); }
    .lock-overlay .panel{ background:rgba(17,17,17,.85); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:18px 20px; max-width:420px; }
    .lock-overlay .icon{ font-size:40px; line-height:1; margin-bottom:10px; }
    @media (orientation: portrait){ .lock-overlay{ display:flex; } body.lock-scroll{ overflow:hidden; } }
    @media (orientation: landscape){ .card{ max-height:86vh; overflow:auto; } .avatar{ width:64px; height:64px; } }
    @media (max-height: 420px) and (orientation: landscape){ .title-main{ font-size: clamp(28px, 6vw, 48px); } .title-sub{ font-size: clamp(18px, 3.6vw, 28px); } .avatar{ width:56px; height:56px; } }
    @media (min-width: 768px) and (max-width: 1024px){ .title-main{ font-size: clamp(48px, 6.4vw, 92px); letter-spacing:.01em; } .title-sub{ font-size: clamp(28px, 3.8vw, 52px); } .wave{ --amp: 8px; } .wave-sm{ --amp: 5px; } }
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape){ .title-main{ font-size: clamp(44px, 5.8vw, 86px); } .title-sub{ font-size: clamp(26px, 3.4vw, 48px); } }
    @media (min-width: 1024px){ .wave{ --amp: 9px; } .wave-sm{ --amp: 6px; } } @media (min-width: 1536px){ .wave{ --amp: 10px; } .wave-sm{ --amp: 7px; } }
    .audio-toggle{ position: fixed; right: 12px; bottom: 12px; z-index: 30; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 10px; backdrop-filter: blur(6px); }
    .audio-toggle button{ display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); }
    .audio-toggle button:hover{ background: rgba(255,255,255,.1); }
    .audio-toggle .vol{ appearance:none; width:120px; height:4px; border-radius:999px; background:#444; }
    .audio-toggle .vol::-webkit-slider-thumb{ appearance:none; width:14px; height:14px; border-radius:999px; background:#ffd36a; border:1px solid #b3831b; }
    @media (max-width: 640px){ .audio-toggle{ gap:6px; padding:6px 8px; } .audio-toggle .vol{ width:86px; } }

   /* === Player Title Badge (Luxury / same as profile.html) === */
.player-title-badge{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 18px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  text-align:center;
  white-space:nowrap;
  box-sizing:border-box;
  user-select:none;
}
.player-title-badge .text{
  position:relative;
  z-index:3;
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

@keyframes float{ 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-3px);} }
@keyframes pulse{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.18);} }
@keyframes softGlow{ 0%,100%{opacity:.5;} 50%{opacity:.95;} }
@keyframes shine{ 0%{transform:translateX(-130%);opacity:0;} 20%{opacity:0;} 40%{transform:translateX(130%);opacity:1;} 60%{opacity:0;} 100%{transform:translateX(130%);opacity:0;} }

.player-title-badge.tier-1{
  border-radius:8px;
  border:1px solid rgba(119,124,132,.85);
  background:linear-gradient(135deg,#333842,#171920);
  color:#d0d3d8;
  text-shadow:0 0 6px rgba(0,0,0,.8);
}

.player-title-badge.tier-2{
  border-radius:999px;
  padding:7px 22px;
  border:1px solid #63d2ff;
  background:linear-gradient(135deg,#1b4d7e,#63d2ff);
  color:#e8f9ff;
  box-shadow:0 0 10px rgba(99,210,255,.45);
  overflow:visible;
}
.player-title-badge.tier-2::before,
.player-title-badge.tier-2::after{
  content:"";
  position:absolute; top:0; bottom:0; width:14px;
  background:inherit;
}
.player-title-badge.tier-2::before{ left:-8px; transform:skewX(-24deg); }
.player-title-badge.tier-2::after{ right:-8px; transform:skewX(24deg); }

.player-title-badge.tier-3{
  padding:7px 20px;
  color:#ffe4c4;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.12) 0,transparent 55%),
    radial-gradient(circle at 100% 100%,rgba(255,120,60,.25) 0,transparent 55%),
    linear-gradient(135deg,#3a0f18,#8b1c24);
  border:2px solid #f48c2b;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.55),
    0 0 16px rgba(244,140,43,.65);
  clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);
}
.player-title-badge.tier-3::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:10px;
  border:1px dashed rgba(255,223,186,.35);
  opacity:.7;
}

.player-title-badge.tier-4{
  padding:8px 22px 10px;
  color:#f9f0ff;
  background:radial-gradient(circle at top,#5c35b5,#1e1032);
  border:2px solid #e1c4ff;
  box-shadow:
    0 0 0 1px rgba(90,40,200,.55),
    0 0 18px rgba(147,96,255,.85);
  border-radius:16px 16px 10px 10px;
  overflow:visible;
  animation:float 5s ease-in-out infinite;
}
.player-title-badge.tier-4::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-10px;
  transform:translateX(-50%);
  width:60%;
  height:16px;
  background:linear-gradient(to bottom,#e1c4ff,#6e3bd1);
  clip-path:polygon(50% 100%,0 0,100% 0);
  box-shadow:0 4px 10px rgba(0,0,0,.55);
}

.player-title-badge.tier-5{
  padding:8px 28px;
  color:#fff9e0;
  background:linear-gradient(135deg,#5a2400,#ffcf66);
  border-radius:999px;
  border:3px solid #ffe08a;
  box-shadow:
    0 0 0 1px rgba(255,224,138,.45),
    0 0 22px rgba(255,204,110,.9);
  overflow:visible;
  animation:float 4.5s ease-in-out infinite, pulse 3.8s ease-in-out infinite;
}
.player-title-badge.tier-5::before,
.player-title-badge.tier-5::after{
  content:"";
  position:absolute;
  top:50%;
  width:26px;
  height:16px;
  background:radial-gradient(circle at 0 50%,rgba(255,255,255,.95) 0,rgba(255,224,138,.1) 70%);
  transform:translateY(-50%);
  filter:drop-shadow(0 0 8px rgba(255,224,138,.75));
}
.player-title-badge.tier-5::before{
  left:-16px;
  clip-path:polygon(100% 0,0 50%,100% 100%);
}
.player-title-badge.tier-5::after{
  right:-16px;
  clip-path:polygon(0 0,100% 50%,0 100%);
}
.player-title-badge.tier-5 .text::after{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,transparent 0,rgba(255,255,255,.85) 45%,transparent 75%);
  mix-blend-mode:screen;
  transform:translateX(-130%);
  animation:shine 3.6s ease-in-out infinite;
}

.player-title-badge.tier-6{
  padding:9px 36px;
  color:#fffdf5;
  background:
    radial-gradient(circle at 20% 0,rgba(255,255,255,.4) 0,transparent 55%),
    radial-gradient(circle at 80% 100%,rgba(255,210,120,.7) 0,transparent 55%),
    linear-gradient(135deg,#4b2a00,#c68b00,#ffe7a3);
  border-radius:999px;
  border:4px solid #ffe9c4;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.38),
    0 0 0 6px rgba(158,106,32,.65),
    0 0 32px rgba(255,243,196,.95);
  overflow:visible;
  position:relative;
  text-shadow:
    0 0 8px rgba(0,0,0,1),
    0 0 18px rgba(255,245,210,1);
  animation:float 4.2s ease-in-out infinite, pulse 3.4s ease-in-out infinite;
}
.player-title-badge.tier-6::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:999px;
  border:2px solid rgba(255,252,230,.85);
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.65),
    0 0 14px rgba(255,252,210,.6);
  opacity:.98;
  z-index:1;
}
.player-title-badge.tier-6::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 12% 50%,#fff 0,rgba(255,255,255,0) 55%),
    radial-gradient(circle at 88% 50%,#fff 0,rgba(255,255,255,0) 55%),
    radial-gradient(circle at 50% -10%,#fff 0,rgba(255,255,255,0) 60%);
  mix-blend-mode:screen;
  opacity:.65;
  z-index:1;
}
.player-title-badge.tier-6 .crown{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  font-size:15px;
  text-shadow:0 0 10px #ffffff, 0 0 18px rgba(255,230,160,1);
  z-index:4;
}
.player-title-badge.tier-6 .pendant{
  position:absolute;
  bottom:-14px;
  left:50%;
  transform:translateX(-50%);
  width:18px;height:18px;
  background:radial-gradient(circle,#fff7d0 0,#f0b400 45%,#8b4c00 100%);
  border-radius:50%;
  box-shadow:0 4px 8px rgba(0,0,0,.75), 0 0 10px rgba(255,230,170,.9);
  z-index:2;
}
.player-title-badge.tier-6 .pendant::before{
  content:"";
  position:absolute;
  top:-6px; left:50%;
  transform:translateX(-50%);
  width:9px;height:5px;border-radius:999px;
  background:radial-gradient(circle,#fffbe6 0,#b57a1f 100%);
}
.player-title-badge.tier-6 .glow{
  position:absolute;
  inset:-30%;
  background:radial-gradient(circle,rgba(255,255,255,.42) 0,transparent 60%);
  mix-blend-mode:screen;
  opacity:.6;
  z-index:0;
  animation:softGlow 4.4s ease-in-out infinite;
}


/* === Tier-6 overflow guard (避免祖先容器裁切皇冠/吊飾) === */
.player-title-badge,
.player-title-badge *{ overflow: visible !important; }

    /* === Rules Flipbook Modal === */
    .rulesOverlay{ position: fixed; inset: 0; background: rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index: 9999; }
    .rulesCard{
      width: 94vw; height: 92vh; max-height: none;
      background: rgba(10,12,18,0.92);
      border: 2px solid rgba(255, 211, 106, 0.75);
      box-shadow: 0 0 0 1px rgba(255, 184, 77, 0.35), 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      border-radius: 20px; overflow: hidden; display:flex; flex-direction: column;
    }
    .rulesTopBar{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .rulesTitleMain{ font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.92); }
    .rulesTitleSub{ font-size: 12px; margin-top: 4px; color: rgba(255,255,255,0.60); }
    .rulesCloseBtn{ background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.86); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .rulesCloseBtn:hover{ background: rgba(255,255,255,0.12); }
    .rulesBody{
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 14px;
      flex: 1; min-height: 0; overflow: hidden;
    }
    @media (max-width: 920px){ .rulesBody{ grid-template-columns: 1fr; } }
    .rulesImageWrap{
      border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      aspect-ratio: 16 / 9;
      min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .rulesImage{ width: 100%; height: 100%; object-fit: contain; display: block; }
    .rulesText{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      padding: 12px 14px;
      color: rgba(255,255,255,0.86);
      overflow: auto; min-height: 0;
    }
    .rulesBullets{ margin: 0; padding-left: 18px; line-height: 1.7; font-size: 14px; }
    .rulesTip{
      margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      background: rgba(255, 190, 88, 0.12); border: 1px solid rgba(255, 190, 88, 0.25);
      color: rgba(255,255,255,0.90); font-size: 13px;
    }
    .rulesFooter{ padding: 12px 16px; display:flex; align-items:center; justify-content:space-between; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
    .rulesNavBtn{
      padding: 10px 12px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.88);
    }
    .rulesNavBtn:disabled{ opacity: 0.35; cursor: not-allowed; }
    .rulesNavBtn.primary{ background: rgba(255, 190, 88, 0.16); border-color: rgba(255, 190, 88, 0.35); }
    .rulesDots{ display:flex; gap: 8px; align-items:center; justify-content:center; flex: 1; }
    .rulesDot{ width: 10px; height: 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.10); cursor: pointer; }
    .rulesDot.active{ background: rgba(255, 190, 88, 0.55); border-color: rgba(255, 190, 88, 0.75); }
    .rulesHintLine{ padding: 0 16px 12px; color: rgba(255,255,255,0.50); font-size: 12px; }
    .rulesSectionTitle{ font-size: 16px; font-weight: 700; margin-bottom: 8px; padding-bottom: 6px; color: #ffd36a; border-bottom: 1px solid rgba(255, 211, 106, 0.35); letter-spacing: .02em; }
    @media (max-width: 640px) { .rulesCard{ width: 100vw; height: 100dvh; max-height: none; border-radius: 0; } }

    @media (min-width: 1920px){
      .rulesTitleMain{ font-size: 22px; }
      .rulesTitleSub{ font-size: 14px; }
      .rulesSectionTitle{ font-size: 19px; }
      .rulesBullets{ font-size: 16px; line-height: 1.75; }
      .rulesTip{ font-size: 15px; }
      .rulesNavBtn{ font-size: 16px; padding: 12px 16px; }
      .rulesHintLine{ font-size: 13px; }
    }
    @media (min-width: 2560px){
      .rulesTitleMain{ font-size: 26px; }
      .rulesTitleSub{ font-size: 16px; }
      .rulesSectionTitle{ font-size: 22px; }
      .rulesBullets{ font-size: 18px; line-height: 1.8; }
      .rulesTip{ font-size: 17px; }
      .rulesNavBtn{ font-size: 18px; padding: 14px 18px; }
      .rulesHintLine{ font-size: 15px; }
    }
  </style>
</head>

<body class="no-video">
  <div class="lock-overlay" id="lockOverlay">
    <div class="panel">
      <div class="icon">🔄</div>
      <div id="txtRotateTitle" class="text-lg font-semibold mb-1">請將手機旋轉至橫向以獲得最佳體驗</div>
      <div id="txtRotateHint" class="text-sm opacity-80">若仍無法旋轉，請解鎖畫面旋轉或從瀏覽器選單開啟「允許旋轉」。</div>
    </div>
  </div>

  <div class="bg-anim">
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto" poster="images/cover.jpg">
      <source src="videos/start.mp4" type="video/mp4">
    </video>
  </div>

  <div id="root" class="min-h-dvh flex items-center justify-center p-6"></div>

  <script>
    (function initBGVideo(){
      const v = document.getElementById('bgVideo');
      if(!v) return;
      const enableVideo = ()=> document.body.classList.remove('no-video');
      const fallback = ()=> document.body.classList.add('no-video');
      v.addEventListener('loadeddata', enableVideo, {once:true});
      v.addEventListener('canplay', enableVideo, {once:true});
      v.addEventListener('error', fallback, {once:true});
      const tryPlay = ()=> v.play().then(enableVideo).catch(fallback);
      window.addEventListener('pointerdown', tryPlay, {once:true});
      window.addEventListener('keydown', tryPlay, {once:true});
      tryPlay();
    })();

    (function orientationGate(){
      const overlay = document.getElementById('lockOverlay');
      function apply(){
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        document.body.classList.toggle('lock-scroll', isPortrait);
        if(overlay){ overlay.style.display = isPortrait ? 'flex' : 'none'; }
      }
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
      apply();
    })();

    async function tryLockLandscape(){
      try{
        if(screen.orientation && screen.orientation.lock){
          await screen.orientation.lock('landscape');
        }
      }catch(e){}
    }

    (function applyStaticI18n(){
      const I18N = window.__I18N;
      if(!I18N) return;
      const $t = (k)=>I18N.t(k);

      const a = document.getElementById('txtRotateTitle');
      const b = document.getElementById('txtRotateHint');
      if(a) a.textContent = $t('ui.rotateTitle');
      if(b) b.textContent = $t('ui.rotateHint');

      document.documentElement.setAttribute('lang', I18N.getLang());
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    // ========================
    //  雲端主控版：Start Page
    // ========================

    const SERVER_URL = 'https://onepiece-card-online.onrender.com';
    const socket = io(SERVER_URL, { transports: ['websocket'] });

    // === I18N 防呆 ===
    const I18N = window.__I18N || {
      getLang: () => 'zh-Hant',
      setLang: () => {},
      SUPPORTED: ['zh-Hant'],
      getLangLabel: () => '繁體中文',
      t: (k) => k
    };
    const t = (key, vars) => (I18N && typeof I18N.t === 'function') ? I18N.t(key, vars) : key;

    // === 等待室本地狀態（不落地）===
    let __lobby = {
      roomId:'',
      me:{ playerId:null, secret: (localStorage.getItem('opSecret')||''), name:'', avatar:1 },
      snapshot:null,
      cpuCount: 0
    };

    socket.on('JOINED', ({ playerId, secret })=>{
      __lobby.me.playerId = playerId;
      __lobby.me.secret   = secret;
      try { localStorage.setItem('opSecret', secret); } catch {}
    });

    socket.on('EMIT', (e)=>{
      if (e?.type === 'lobby'){
        __lobby.snapshot = e.lobby;
        if (!__lobby.roomId) __lobby.roomId = e.lobby?.roomId || __lobby.roomId;
        if (typeof window.__setLobby === 'function') window.__setLobby(e.lobby);
        return;
      }
      if (e?.type === 'nav_game'){
        try{ socket.close(); }catch{}
        const url = new URL('game.html', location.origin);
        url.searchParams.set('server', SERVER_URL);
        url.searchParams.set('room',   __lobby.roomId);
        url.searchParams.set('name',   __lobby.me.name || 'P');
        url.searchParams.set('avatar', String(__lobby.me.avatar || 1));
        const count = Array.isArray(__lobby.snapshot?.players)
          ? Math.max(1, __lobby.snapshot.players.length)
          : 1;
        url.searchParams.set('n', String(count));

        // ★ 把等待室的「每位玩家已裝備稱號」快照存到 sessionStorage，讓 game.html 能顯示
        try{
          const map = {};
          const arr = Array.isArray(__lobby.snapshot?.players) ? __lobby.snapshot.players : [];
          arr.forEach(p=>{
            const pid = (p && (p.playerId ?? p.pid ?? p.id));
            const c = p?.client || {};
            const titles = c?.titles || {};
            const label = String(
              p?.title ??
              p?.equippedTitle ??
              p?.equipped ??
              titles?.equipped ??
              c?.equippedTitle ??
              c?.title ??
              c?.titleLabel ??
              ''
            ).trim();
            const tier0 = Number(
              p?.titleTier ??
              p?.equippedTier ??
              titles?.equippedTier ??
              c?.equippedTier ??
              c?.titleTier ??
              1
            ) || 1;
            const tier = Math.min(6, Math.max(1, tier0));
            if (pid != null && label) map[String(pid)] = { label, tier };
          });
          sessionStorage.setItem('opRoomTitles', JSON.stringify(map));
        }catch(e){}
        location.href = url.toString();
        return;
      }
    });

    // === 雲端 API helpers（主控）===
    async function cloudGet(secret){
      return await new Promise((resolve)=>{
        socket.timeout(8000).emit('PROFILE_GET', { secret }, (err, res)=>{
          if(err || !res?.ok) return resolve(null);
          resolve(res.profile || null);
        });
      });
    }

    async function cloudUpdate(secret, patch){
      return await new Promise((resolve)=>{
        socket.timeout(8000).emit('PROFILE_UPDATE', { secret, patch }, (err, res)=>{
          resolve(!err && !!res?.ok);
        });
      });
    }

    // === 把雲端資料 normalize 成 start.html 使用的 profile 結構 ===
    function normalizeCloudProfile(cloud){
      const name = String(cloud?.name || '').trim();
      const avatarNum = Number(cloud?.avatar ?? 1) || 1;
      const avatar = Math.min(40, Math.max(1, avatarNum));
      const avatarUrl = `images/avatars/${avatar}.webp`;

      const client = (cloud?.stats?.client && typeof cloud.stats.client === 'object')
        ? cloud.stats.client
        : null;

      const equippedTitle = String(client?.titles?.equipped || '').trim();
      const equippedTier  = Number(client?.titles?.equippedTier || 1) || 1;

      return {
        playerName: name,
        playerAvatar: avatar,
        avatarUrl,
        client,
        wall: cloud?.stats?.wall || null,

        // ✅ 新增：等待室顯示用
        equippedTitle,
        equippedTier
      };
    }

    // === 若雲端沒 client，給一份最小預設（仍然只存雲端）===
    function makeDefaultClient(name, avatar){
      return {
        player: { name: name || '', avatar: avatar || 1 },
        totals: { coins: 0, games: 0, wins: 0 },
        deluxeUnlocked: [],
        titles: { owned: [], equipped: '', equippedTier: 1 },
        recent: [],
        _appliedMatchKeys: []
      };
    }

    // === 工具 ===
    const {useState, useEffect, useMemo} = React;
    const MIN_PLAYERS = 2;

    function uid(){ return Math.random().toString(36).slice(2,10); }
    function genRoomId(){
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s="";
      for(let i=0;i<6;i++) s += letters[Math.floor(Math.random()*letters.length)];
      return s;
    }
    function getMeId(){
      let me = sessionStorage.getItem("op_me_id");
      if(!me){
        me = "me_" + uid();
        sessionStorage.setItem("op_me_id", me);
      }
      return me;
    }

    function WaveText({ text, className="", small=false }){
      const chars = Array.from(text);
      const waveClass = small ? "wave wave-sm" : "wave";
      return (
        <span className={`${waveClass} ${className}`}>
          {chars.map((ch, idx) => (
            <span className="char" style={{["--i"]: idx}} key={idx}>
              {ch === " " ? "\u00A0" : ch}
            </span>
          ))}
        </span>
      );
    }

    function PressAnyKey({onProceed}){
      useEffect(()=>{
        const h=(e)=>{
          e.preventDefault();
          onProceed();
          tryLockLandscape();
          window.__OPAudio?.startAudio();
        };
        window.addEventListener('keydown', h, {once:true});
        window.addEventListener('pointerdown', h, {once:true});
        return ()=>{
          window.removeEventListener('keydown', h);
          window.removeEventListener('pointerdown', h);
        };
      }, [onProceed]);

      return (
        <div className="relative w-full min-h-[92vh] select-none">
          <div className="absolute left-1/2 -translate-x-1/2 top-[60vh] md:top-[58vh] text-center space-y-2">
            <div className="title-wrap">
              <div className="title-main font-black tracking-tight whitespace-nowrap fx-tiltDrop fx-shine text-[clamp(28px,8.2vw,48px)] [@media(orientation:landscape)]:text-[clamp(24px,6.6vw,44px)] md:text-[clamp(52px,5.2vw,96px)] lg:text-[clamp(60px,4.6vw,110px)] xl:text-[clamp(68px,4vw,128px)]">
                <WaveText text={t("brand.titleEn")} />
              </div>
              <div className="title-sub font-extrabold text-amber-300 mt-2 fx-fadeUp whitespace-nowrap text-[clamp(16px,5.2vw,28px)] [@media(orientation:landscape)]:text-[clamp(16px,3.6vw,24px)] md:text-[clamp(30px,3.2vw,56px)] lg:text-[clamp(34px,2.8vw,64px)] xl:text-[clamp(38px,2.4vw,72px)]">
                <WaveText text={t("brand.titleSub")} small />
              </div>
            </div>
          </div>

          <div
            className="absolute left-1/2 -translate-x-1/2 text-sm md:text-base text-neutral-200 blink md:bottom-8"
            style={{bottom:"calc(env(safe-area-inset-bottom, 0px) - 10px)", paddingBottom:0}}
          >
            {t("ui.pressAnyKey")}
          </div>
        </div>
      );
    }

    // =========================
    //  Auth Panel（只負責拿 secret）
    // =========================
    function AuthPanel({ onAuthed, onSkip }) {
      const [mode, setMode] = useState("login");
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      useEffect(() => {
        try {
          const savedUser = localStorage.getItem("op_last_username") || "";
          const savedPass = localStorage.getItem("op_last_password") || "";
          if (savedUser) setUsername(savedUser);
          if (savedPass) setPassword(savedPass);
        } catch {}
      }, []);

      function submit() {
        if (!username || !password) {
          setErr("請輸入帳號與密碼");
          return;
        }
        setLoading(true);
        setErr("");

        const evt = mode === "login" ? "AUTH_LOGIN" : "AUTH_REGISTER";

        socket.timeout(12000).emit(evt, { username, password }, (e, res) => {
          setLoading(false);
          if (e || !res?.ok) {
            setErr(res?.error || e?.message || "連線失敗");
            return;
          }

          try {
            localStorage.setItem("op_last_username", username);
            localStorage.setItem("op_last_password", password);
          } catch {}

          localStorage.setItem("opSecret", res.secret);
          __lobby.me.secret = res.secret;

          onAuthed?.(res.secret);
        });
      }

      return (
        <div className="card w-[min(420px,90vw)] p-6 space-y-4">
          <h2 className="text-xl font-bold text-amber-300 text-center">
            {mode === "login" ? "帳號登入" : "建立帳號"}
          </h2>

          <input
            className="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"
            placeholder="帳號（英文 / 數字）"
            value={username}
            onChange={e=>setUsername(e.target.value)}
          />

          <input
            type="password"
            className="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"
            placeholder="密碼（至少 6 碼）"
            value={password}
            onChange={e=>setPassword(e.target.value)}
          />

          {err && <div className="text-sm text-red-400">{err}</div>}

          <button className="btn-primary btn w-full" disabled={loading} onClick={submit}>
            {loading ? "連線中…" : (mode === "login" ? "登入" : "註冊")}
          </button>

          <div className="flex justify-between text-sm text-neutral-400">
            <button className="underline" onClick={()=>setMode(mode==="login"?"register":"login")}>
              {mode === "login" ? "我要註冊" : "已有帳號"}
            </button>
            <button className="underline" onClick={onSkip}>
              先不登入
            </button>
          </div>
        </div>
      );
    }

    // =========================
    //  Main Menu（雲端資料顯示）
    // =========================
    function MainMenu({ profile, onStart, onRule, onLangChange, onProfilePage, onRefreshCloud, cloudLoading }) {
      const cur = I18N.getLang();
      return (
        <div className="card w-[min(520px,92vw)] p-6 text-center space-y-6 relative">
          <div className="absolute right-4 top-4">
            <label className="text-[11px] text-neutral-300 mr-2">{t("ui.lang")}</label>
            <select className="btn text-sm py-1 px-2" value={cur} onChange={(e)=> onLangChange?.(e.target.value)}>
              {I18N.SUPPORTED.map(l=>(
                <option key={l} value={l}>{I18N.getLangLabel(l)}</option>
              ))}
            </select>
          </div>

          <div className="flex items-center justify-center gap-3">
            <div className="avatar is-active">
              <img src={profile?.avatarUrl} alt=""/>
            </div>
            <div className="text-left">
              <div className="text-sm text-neutral-400">已登入</div>
              <div className="text-lg font-bold text-amber-300">
                {profile?.playerName || "（尚未設定名稱）"}
              </div>
            </div>
          </div>

          <button className="btn-primary btn w-full text-lg py-3" onClick={onStart}>
            {t("ui.startGame")}
          </button>

          <button className="btn w-full text-lg py-3" onClick={onProfilePage}>
            個人頁面
          </button>

          <button className="btn w-full text-lg py-3" onClick={()=>location.href="shop.html"}>
            商店
          </button>

          <button className="btn w-full text-lg py-3" onClick={onRule}>
            {t("ui.rules")}
          </button>

          <button
            className={"btn w-full text-sm py-2 " + (cloudLoading ? "opacity-60 cursor-not-allowed" : "")}
            onClick={onRefreshCloud}
            disabled={cloudLoading}
            title="重新從雲端拉取玩家資料"
          >
            {cloudLoading ? "雲端同步中…" : "重新同步雲端資料"}
          </button>

          <div className="text-xs text-neutral-400 mt-2">{t("brand.tagline")}</div>
        </div>
      );
    }

    // =========================
    //  Rule Modal（原樣保留）
    // =========================
    function RuleModal({ show, onClose }) {
      const pages = React.useMemo(
        () => [
          { id: "overview",      key: "rules.overview",      img: "images/rules/01-overview.webp" },
          { id: "header",        key: "rules.header",        img: "images/rules/02-header-bar.webp" },
          { id: "gallery",       key: "rules.gallery",       img: "images/rules/03-card-gallery.webp" },
          { id: "cardDetail",    key: "rules.cardDetail",    img: "images/rules/04-card-detail.webp" },
          { id: "venuePanel",    key: "rules.venuePanel",    img: "images/rules/05-venue-panel.webp" },
          { id: "venueBg",       key: "rules.venueBg",       img: "images/rules/06-venue-background.webp" },
          { id: "players",       key: "rules.players",       img: "images/rules/07-players-panel.webp" },
          { id: "discard",       key: "rules.discard",       img: "images/rules/08-discard-panel.webp" },
          { id: "log",           key: "rules.log",           img: "images/rules/09-log-panel.webp" },
          { id: "drawOnly",      key: "rules.drawOnly",      img: "images/rules/10-draw-card.webp" },
          { id: "afterDrawView", key: "rules.afterDrawView", img: "images/rules/11-after-draw.webp" },
          { id: "playCardCoreRule", key: "rules.playCardCoreRule", img: "images/rules/12-play-card-mechanic.webp" },
          { id: "example-play-6",  key: "rules.examplePlay6",  img: "images/rules/13-example-play-6.webp" },
          { id: "example-play-13", key: "rules.examplePlay13", img: "images/rules/14-example-play-13.webp" },
          { id: "extra-rules",     key: "rules.extraRules",    img: "images/rules/15-extra-rules.webp" },
        ],
        []
      );
      const [idx, setIdx] = React.useState(0);
      React.useEffect(() => { if (show) setIdx(0); }, [show]);
      React.useEffect(() => {
        if (!show) return;
        const onKeyDown = (e) => {
          if (e.key === "Escape") onClose?.();
          if (e.key === "ArrowLeft") setIdx((v) => Math.max(0, v - 1));
          if (e.key === "ArrowRight") setIdx((v) => Math.min(pages.length - 1, v + 1));
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [show, onClose, pages.length]);

      if (!show) return null;
      const page = pages[idx];
      const isFirst = idx === 0;
      const isLast = idx === pages.length - 1;

      const data = t(page.key) || {};
      const title = data.title || page.id;
      const bullets = Array.isArray(data.bullets) ? data.bullets : [];
      const tip = data.tip || "";

      return (
        <div className="rulesOverlay" onMouseDown={(e)=>{ if (e.target.classList.contains("rulesOverlay")) onClose?.(); }}>
          <div className="rulesCard" role="dialog" aria-modal="true">
            <div className="rulesTopBar">
              <div className="rulesTitleWrap">
                <div className="rulesTitleMain">{t("ui.rules")}</div>
                <div className="rulesTitleSub">{idx + 1} / {pages.length} ｜ {title}</div>
              </div>
              <button className="rulesCloseBtn" onClick={onClose}>{t("ui.close")}</button>
            </div>

            <div className="rulesBody">
              <div className="rulesImageWrap">
                <img
                  src={page.img}
                  alt={title}
                  className="rulesImage"
                  loading="lazy"
                  draggable={false}
                  onError={(e)=>{ console.warn("Rules image missing:", page.img); e.currentTarget.style.opacity = 0.25; }}
                />
              </div>

              <div className="rulesText">
                <div className="rulesSectionTitle">{title}</div>
                <ul className="rulesBullets">
                  {bullets.map((line, i) => (<li key={i}>{line}</li>))}
                </ul>
                {tip ? <div className="rulesTip">{t("ui.tipPrefix")} {tip}</div> : null}
              </div>
            </div>

            <div className="rulesFooter">
              <button className="rulesNavBtn" onClick={()=>setIdx(v=>Math.max(0, v-1))} disabled={isFirst} title="Prev (←)">
                {t("ui.prev")}
              </button>

              <div className="rulesDots" aria-label="pages">
                {pages.map((p, i) => (
                  <button
                    key={p.id}
                    className={"rulesDot" + (i === idx ? " active" : "")}
                    onClick={()=>setIdx(i)}
                    title={p.id}
                    aria-label={`go page ${i + 1}`}
                  />
                ))}
              </div>

              <button className="rulesNavBtn primary" onClick={()=>setIdx(v=>Math.min(pages.length-1, v+1))} disabled={isLast} title="Next (→)">
                {t("ui.next")}
              </button>
            </div>

            <div className="rulesHintLine">{t("ui.rulesHotkeys")}</div>
          </div>
        </div>
      );
    }

    // =========================
    //  雲端建角（不落地）
    // =========================
    function NameAvatarCloud({ initialName, initialAvatar, secret, onDone }){
      const [name,setName]=useState(initialName || "");
      const [pick,setPick]=useState(initialAvatar || 1);
      const [saving,setSaving]=useState(false);
      const [err,setErr]=useState("");

      const avatars=useMemo(()=> Array.from({length:40},(_,i)=>`images/avatars/${i+1}.webp`), []);

      async function handleSubmit(e){
        e.preventDefault();
        const safe=(name||"").trim()||"無名航海士";
        const avatar = Math.min(40, Math.max(1, Number(pick)||1));

        setSaving(true);
        setErr("");

        const ok = await cloudUpdate(secret, (prev=>({
          name: safe,
          avatar: String(avatar),
          stats: {
            ...(prev?.stats || {}),
            client: (prev?.stats?.client && typeof prev.stats.client === 'object')
              ? {
                  ...prev.stats.client,
                  player: { name: safe, avatar }
                }
              : makeDefaultClient(safe, avatar)
          }
        }))(window.__lastCloudProfile || null));

        setSaving(false);

        if(!ok){
          setErr("雲端儲存失敗，請重試（確認網路/伺服器）");
          return;
        }

        onDone?.({ playerName:safe, playerAvatar:avatar, avatarUrl:avatars[avatar-1] });
      }

      return (
        <form onSubmit={handleSubmit} className="card w-[min(980px,96vw)] p-5 md:p-6">
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <h2 className="text-xl font-bold">{t("ui.createCharacter")}</h2>
            <div className="text-xs text-neutral-400">（雲端主控：這裡會直接寫入雲端）</div>
          </div>

          <div className="grid [@media(orientation:landscape)]:grid-cols-2 md:grid-cols-3 gap-5 mt-4">
            <div className="md:col-span-1">
              <div className="flex items-center gap-3">
                <div className={"avatar "+(pick?"is-active":"")}>
                  <img
                    src={avatars[pick-1]}
                    alt=""
                    onError={(e)=>{
                      e.currentTarget.replaceWith(Object.assign(
                        document.createElement('div'),
                        {className:'mono avatar',innerText:(name||'').slice(0,1)||t('ui.you')}
                      ));
                    }}
                  />
                </div>
                <div>
                  <input
                    className="mt-1 w-56 rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2 outline-none focus:border-amber-400"
                    maxLength={16}
                    placeholder={t("ui.namePlaceholder")}
                    value={name}
                    onChange={(e)=>setName(e.target.value)}
                  />
                </div>
              </div>

              {err && <div className="mt-2 text-sm text-red-400">{err}</div>}
            </div>

            <div className="md:col-span-2">
              <div className="flex items-center justify-between">
                <div className="font-semibold">{t("ui.chooseAvatar")}</div>
              </div>
              <div className="mt-2 grid grid-cols-5 sm:grid-cols-6 md:grid-cols-7 lg:grid-cols-8 gap-3">
                {avatars.map((src,idx)=>(
                  <button
                    key={idx}
                    type="button"
                    onClick={()=>setPick(idx+1)}
                    className={"avatar "+(pick===idx+1?"is-active":"")}
                  >
                    <img src={src} alt={"avatar-"+(idx+1)} />
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="mt-5 flex flex-col sm:flex-row gap-3">
            <button className="btn-primary btn grow" type="submit" disabled={saving}>
              {saving ? "儲存中…" : t("ui.createRoomTitle")}
            </button>
            <button
              className="btn grow"
              type="button"
              disabled={saving}
              onClick={(e)=>handleSubmit(e)}
              title="同一份設定，儲存雲端後繼續"
            >
              {saving ? "儲存中…" : t("ui.joinRoom")}
            </button>
          </div>
        </form>
      );
    }

    // =========================
    //  Room Choice（只用雲端 profile）
    // =========================
    function RoomChoice({ profile, onEnter }) {
      const [joinCode, setJoinCode] = useState("");
      const [cpuCount, setCpuCount] = useState(() => {
        try {
          const v = Number(localStorage.getItem("op_cpu_count") || "0");
          if (Number.isNaN(v)) return 0;
          return Math.min(3, Math.max(0, v));
        } catch {
          return 0;
        }
      });

      const meId = getMeId();

      function createRoom() {
        const id = genRoomId();
        __lobby.roomId = id;
        __lobby.me.name = profile.playerName;
        __lobby.me.avatar = profile.playerAvatar;
        __lobby.cpuCount = cpuCount;

        try { localStorage.setItem("op_cpu_count", String(cpuCount)); } catch {}

        socket.emit("JOIN_ROOM", {
          roomId: id,
          displayName: profile.playerName,
          avatar: profile.playerAvatar,

          // ✅ 新增：稱號（server 若有存進 lobby，就能讓其他人也看到）
          title: profile.equippedTitle || "",
          titleTier: profile.equippedTier || 1,

          // ✅ 再補一份 client.titles（有些 server 只會把 client 原樣帶回 lobby）
          client: { titles: { equipped: profile.equippedTitle || "", equippedTier: profile.equippedTier || 1 } },
          equippedTitle: profile.equippedTitle || "",
          equippedTier: profile.equippedTier || 1,

          secret: __lobby.me.secret,
          cpuCount
        });

        onEnter(id, { host: true, cpuCount });
      }

      function tryJoin() {
        const code = (joinCode || "").toUpperCase().replace(/\s+/g, "");
        if (!code) { alert(t("ui.alertNeedRoomId")); return; }

        __lobby.roomId = code;
        __lobby.me.name = profile.playerName;
        __lobby.me.avatar = profile.playerAvatar;

        socket.emit("JOIN_ROOM", {
          roomId: code,
          displayName: profile.playerName,
          avatar: profile.playerAvatar,

          title: profile.equippedTitle || "",
          titleTier: profile.equippedTier || 1,

          secret: __lobby.me.secret,
        });

        onEnter(code, { host: false });
      }

      return (
        <div className="card w-[min(980px,96vw)] p-5 md:p-6 space-y-6">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <div className="text-sm text-neutral-400">{t("ui.roomMode")}</div>
              <div className="text-xl font-bold text-amber-300">{t("ui.createOrJoin")}</div>
            </div>
            <div className="flex items-center gap-3">
              <div className="avatar is-active"><img src={profile.avatarUrl} alt="" /></div>
              <div className="text-sm text-right">
                <div className="text-neutral-300">{profile.playerName}</div>
                <div className="text-xs text-neutral-500">{t("ui.playerId", {id: meId})}</div>
              </div>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div className="space-y-4 border border-neutral-700/70 rounded-xl p-4 bg-black/20">
              <div className="flex items-center justify-between">
                <div className="font-semibold">{t("ui.createRoomTitle")}</div>
                <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-400/40">
                  {t("ui.host")}
                </span>
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <label className="text-sm font-medium text-amber-200">{t("ui.cpuCountLabel")}</label>
                  <span className="text-[11px] text-neutral-400">{t("ui.cpuCountHint")}</span>
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {[0, 1, 2, 3].map((n) => {
                    const active = cpuCount === n;
                    return (
                      <button
                        key={n}
                        type="button"
                        onClick={() => setCpuCount(n)}
                        className={"btn text-sm py-1.5 " + (active ? "bg-amber-400 text-black border-amber-300 shadow" : "")}
                      >
                        {t("ui.people", {n})}
                      </button>
                    );
                  })}
                </div>
              </div>

              <button type="button" onClick={createRoom} className="btn-primary btn w-full mt-2 py-2.5 text-base">
                {t("ui.createNewRoom")}
              </button>
            </div>

            <div className="space-y-4 border border-neutral-700/70 rounded-xl p-4 bg-black/10">
              <div className="font-semibold">{t("ui.joinFriendRoom")}</div>

              <div className="space-y-2">
                <label className="text-sm text-neutral-300">{t("ui.enterRoomCode")}</label>
                <input
                  className="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm outline-none focus:border-amber-400"
                  placeholder={t("ui.roomCodePlaceholder")}
                  value={joinCode}
                  onChange={(e) => setJoinCode(e.target.value)}
                  maxLength={8}
                />
                <div className="text-[11px] text-neutral-500">{t("ui.roomCodeHint")}</div>
              </div>

              <button type="button" onClick={tryJoin} className="btn w-full mt-2 py-2.5 text-base">
                {t("ui.joinRoomBtn")}
              </button>
            </div>
          </div>

          <div className="text-xs text-neutral-500 text-right">{t("ui.suggestion")}</div>
        </div>
      );
    }

    // =========================
    //  Waiting Room（加稱號顯示）
    // =========================
    function WaitingRoom({roomId, profile, onLeave}){
      const [lobby, setLobby] = useState(()=> __lobby.snapshot);
      const mePid = __lobby.me.playerId;

      useEffect(()=>{
        window.__setLobby = setLobby;
        return ()=>{ window.__setLobby = null; };
      }, []);

      const players = lobby?.players||[];
      function pidOf(p){ return p.playerId ?? p.pid ?? p.id; }
      function nameOf(p){ return p.displayName ?? p.name ?? 'P'; }
      function avatarOf(p){ return p.avatar ?? 1; }

      // ✅ 稱號取值（等待室快照優先，其次從玩家 client.titles / client.equippedTitle 取）
      function titleOf(p){
        // lobby snapshot 可能直接帶在 p.title / p.equippedTitle，也可能在 p.client.titles.equipped
        const c = p?.client || {};
        const titles = c?.titles || {};
        return String(
          p?.title ??
          p?.equippedTitle ??
          p?.equipped ??
          titles?.equipped ??
          c?.equippedTitle ??
          c?.title ??
          c?.titleLabel ??
          ""
        ).trim();
      }
      function titleTierOf(p){
        const c = p?.client || {};
        const titles = c?.titles || {};
        const n = Number(
          p?.titleTier ??
          p?.equippedTier ??
          titles?.equippedTier ??
          c?.equippedTier ??
          c?.titleTier ??
          1
        ) || 1;
        return Math.min(6, Math.max(1, n));
      }



      const cpuCount = lobby?.cpuCount ?? 0;
      const amHost = lobby && (lobby.host === mePid);
      const canStart = (players.length + cpuCount) >= MIN_PLAYERS && players.every(p => !!p.ready);

      function copyId(){
        if(!lobby?.roomId) return;
        navigator.clipboard?.writeText(lobby.roomId);
        alert(t("ui.alertCopiedRoomId", { roomId: lobby.roomId }));
      }

      function toggleReady(willReady){
        socket.emit('ACTION', {
          roomId: __lobby.roomId,
          playerId: __lobby.me.playerId,
          secret: __lobby.me.secret,
          type: willReady ? 'LOBBY_READY' : 'LOBBY_UNREADY'
        });
      }

      function startGame(){
        if(!amHost) return;
        socket.emit('ACTION', {
          roomId: __lobby.roomId,
          playerId: __lobby.me.playerId,
          secret: __lobby.me.secret,
          type: 'START_GAME'
        });
      }

      const me = players.find(p=> pidOf(p)===mePid);
      const myReady = !!me?.ready;

      if(!lobby){
        return (
          <div className="card w=[min(820px,96vw)] p-6">
            <div className="text-lg font-bold mb-2">{t("ui.connectingLobby")}</div>
            <button className="btn" onClick={onLeave}>{t("ui.back")}</button>
          </div>
        );
      }

      return (
        <div className="card w-[min(980px,96vw)] p-6">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="text-xs text-neutral-400">{t("ui.roomId")}</div>
              <div className="text-2xl font-extrabold tracking-widest">{lobby.roomId}</div>
            </div>
            <div className="flex gap-2">
              <button className="btn" onClick={copyId}>{t("ui.copyRoomId")}</button>
              <button className="btn" onClick={onLeave}>{t("ui.leaveRoom")}</button>
              {amHost && (
                <button
                  className={`btn-primary ${canStart? "": "opacity-50 cursor-not-allowed"}`}
                  onClick={startGame}
                  disabled={!canStart}
                  title={canStart? t("ui.startGameBtn") : t("ui.startGameNeed")}
                >
                  {t("ui.startGameBtn")}
                </button>
              )}
            </div>
          </div>

          {cpuCount > 0 && (
            <div className="mt-3 text-xs text-amber-200 flex items-center gap-2">
              <span className="px-2 py-0.5 rounded-full border border-amber-400/40 bg-amber-500/10">
                {t("ui.cpuPlayers", {n: cpuCount})}
              </span>
              <span className="text-[11px] text-neutral-400">{t("ui.cpuWillJoin")}</span>
            </div>
          )}

          <div className="mt-5 space-y-5">
            <div>
              <div className="text-sm text-neutral-300 mb-2">{t("ui.humanPlayers", {n: players.length})}</div>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {players.map(p=> {
                  const pid = pidOf(p);
                  const isHost = lobby.host === pid;
                  const isMe   = pid === mePid;
                  const ready  = !!p.ready;
                  const avatarUrl = `images/avatars/${avatarOf(p)}.webp`;

                  const tt = titleOf(p) || (isMe ? (profile?.equippedTitle || "") : "");
                  const tier = titleTierOf(p) || (isMe ? (profile?.equippedTier || 1) : 1);

                  return (
                    <div key={pid} className="flex items-center justify-between gap-3 rounded-xl border border-neutral-700/60 bg-black/30 px-3 py-2">
                      <div className="flex items-center gap-3">
                        <div className={"avatar "+(isHost?"is-active":"")}><img src={avatarUrl} alt=""/></div>
                        <div>
                          <div className="font-semibold leading-tight flex flex-wrap items-center gap-2">
                            <span>{nameOf(p)}</span>
{tt ? (
  (Math.min(6, Math.max(1, Number(tier)||1)) === 6) ? (
    <span className="player-title-badge tier-6">
      <span className="glow"></span>
      <span className="crown">👑</span>
      <span className="text">{tt}</span>
      <span className="pendant"></span>
    </span>
  ) : (
    <span className={`player-title-badge tier-${Math.min(6, Math.max(1, Number(tier)||1))}`}>
      <span className="text">{tt}</span>
    </span>
  )
) : null}

                          </div>

                          <div className="text-xs text-neutral-400 flex items-center gap-2">
                            {isHost
                              ? <span className="px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-200 border border-amber-400/30">{t("ui.host")}</span>
                              : <span className="opacity-60">{t("ui.player")}</span>}
                            {ready
                              ? <span className="px-1.5 py-0.5 rounded bg-emerald-400/15 text-emerald-200 border border-emerald-400/30">{t("ui.ready")}</span>
                              : <span className="px-1.5 py-0.5 rounded bg-neutral-600/20 text-neutral-200 border border-neutral-600/40">{t("ui.notReady")}</span>}
                          </div>
                        </div>
                      </div>
                      {isMe && (
                        <button className="btn" onClick={()=>toggleReady(!myReady)}>
                          {myReady ? t("ui.meUnready") : t("ui.meReady")}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {cpuCount > 0 && (
              <div>
                <div className="text-sm text-neutral-300 mb-2">{t("ui.cpuPlayersList", {n: cpuCount})}</div>
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {Array.from({length: cpuCount}).map((_, idx) => {
                    const cpuIdx = (idx % 3) + 1;
                    const avatarUrl = `images/avatars/cpu${cpuIdx}.webp`;
                    const cpuNames = [t("cpu.name1"), t("cpu.name2"), t("cpu.name3")];
                    const name = cpuNames[idx] || `CPU ${idx + 1}`;
                    return (
                      <div key={`cpu-${idx}`} className="flex items-center justify-between gap-3 rounded-xl border border-neutral-700/60 bg-black/40 px-3 py-2">
                        <div className="flex items-center gap-3">
                          <div className="avatar is-active"><img src={avatarUrl} alt={name}/></div>
                          <div>
                            <div className="font-semibold leading-tight text-amber-200">{name}</div>
                            <div className="text-xs text-neutral-400 flex items-center gap-2">
                              <span className="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-200 border border-sky-400/40">{t("ui.cpuTag")}</span>
                              <span className="px-1.5 py-0.5 rounded bg-emerald-400/15 text-emerald-200 border border-emerald-400/30">{t("ui.ready")}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================
    //  App（雲端主控流程）
    // =========================
    function App(){
      const [stage, setStage] = useState(() => {
        const params = new URLSearchParams(location.search);
        const fromProfile = params.get("from") === "profile";
        const hasSecret = !!(localStorage.getItem("opSecret") || "").trim();
        if (fromProfile) return hasSecret ? "boot" : "auth";
        return "press";
      });

      const [secret, setSecret] = useState(()=> (localStorage.getItem("opSecret") || "").trim());
      const [cloudProfile, setCloudProfile] = useState(null); // normalized for UI
      const [cloudLoading, setCloudLoading] = useState(false);
      const [cloudErr, setCloudErr] = useState("");

      const [roomInfo,setRoomInfo]=useState(null);
      getMeId();

      const [langTick, setLangTick] = useState(0);
      function changeLang(next){
        I18N.setLang(next);
        document.documentElement.setAttribute("lang", I18N.getLang());
        const a = document.getElementById("txtRotateTitle");
        const b = document.getElementById("txtRotateHint");
        if(a) a.textContent = t("ui.rotateTitle");
        if(b) b.textContent = t("ui.rotateHint");
        setLangTick(x=>x+1);
      }

      async function pullCloudProfile(nextSecret){
        const s = (nextSecret || secret || "").trim();
        if(!s) return null;

        setCloudLoading(true);
        setCloudErr("");

        const cloud = await cloudGet(s);

        setCloudLoading(false);

        if(!cloud){
          setCloudErr("雲端讀取失敗（PROFILE_GET），請確認網路或重新登入。");
          return null;
        }

        // 存一份給 NameAvatarCloud patch 參考（避免覆蓋 stats）
        window.__lastCloudProfile = cloud;

        const normalized = normalizeCloudProfile(cloud);
        setCloudProfile(normalized);

        // 同步 __lobby（只留記憶體）
        __lobby.me.secret = s;
        __lobby.me.name = normalized.playerName || '';
        __lobby.me.avatar = normalized.playerAvatar || 1;

        return normalized;
      }

      // boot：有 secret 就拉雲端，決定要 menu 還是 create-character
      useEffect(()=>{
        if(stage !== "boot") return;
        pullCloudProfile().then((p)=>{
          if(!p) return;
          const hasName = !!String(p.playerName||'').trim();
          const hasAvatar = Number(p.playerAvatar||0) > 0;
          if(hasName && hasAvatar) setStage("menu");
          else setStage("profileCloud");
        });
      }, [stage]);

      function enterRoom(id, extra){
        setRoomInfo({id, host: !!extra?.host});
        setStage("waiting");
      }

      return (
        <div className="w-full max-w-[1200px] mx-auto">
          <div className="min-h-dvh flex items-center justify-center">
            {stage==="auth" && (
              <AuthPanel
                onAuthed={(s)=>{
                  setSecret(s);
                  setStage("boot");
                }}
                onSkip={()=> alert("需要登入才能進入（雲端主控版）")}
              />
            )}

            {stage==="press" && (
              <PressAnyKey onProceed={()=>{
                const hasSecret = !!(localStorage.getItem("opSecret") || "").trim();
                setStage(hasSecret ? "boot" : "auth");
              }} />
            )}

            {stage==="boot" && (
              <div className="card w-[min(520px,92vw)] p-6 text-center space-y-3">
                <div className="text-lg font-bold text-amber-300">讀取雲端玩家資料…</div>
                <div className="text-sm text-neutral-400">（雲端主控：不讀本地玩家資料）</div>
                {cloudErr && <div className="text-sm text-red-400">{cloudErr}</div>}
                <div className="mt-2 flex gap-2 justify-center">
                  <button className="btn" onClick={()=>setStage("auth")}>重新登入</button>
                  <button className="btn" onClick={()=>pullCloudProfile()}>重試</button>
                </div>
              </div>
            )}

            {stage==="profileCloud" && (
              <NameAvatarCloud
                secret={secret}
                initialName={cloudProfile?.playerName}
                initialAvatar={cloudProfile?.playerAvatar || 1}
                onDone={(p)=>{
                  setCloudProfile(p);
                  __lobby.me.name = p.playerName;
                  __lobby.me.avatar = p.playerAvatar;
                  setStage("menu");
                }}
              />
            )}

            {stage==="menu" && cloudProfile && (
              <MainMenu
                profile={cloudProfile}
                cloudLoading={cloudLoading}
                onRefreshCloud={()=>pullCloudProfile()}
                onStart={()=> setStage("choice")}
                onProfilePage={()=>{ location.href = "profile.html"; }}
                onRule={()=> setStage("rule")}
                onLangChange={changeLang}
              />
            )}

            {stage==="choice" && cloudProfile && (
              <RoomChoice
                profile={cloudProfile}
                onEnter={enterRoom}
              />
            )}

            {stage==="waiting" && roomInfo && cloudProfile && (
              <WaitingRoom
                roomId={roomInfo.id}
                profile={cloudProfile}
                onLeave={()=>{
                  setStage("choice");
                  __lobby = {
                    roomId:'',
                    me:{ playerId:__lobby.me.playerId, secret:__lobby.me.secret, name:__lobby.me.name, avatar:__lobby.me.avatar },
                    snapshot:null,
                    cpuCount: 0
                  };
                }}
              />
            )}

            <RuleModal show={stage==="rule"} onClose={()=> setStage("menu")} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>

  <div class="audio-toggle" id="audioCtrl" style="display:none">
    <button id="btnMute" title="靜音/取消靜音" aria-label="Mute/Unmute">
      <svg id="icoVol" width="16" height="16" viewBox="0 0 24 24" fill="#ffd36a">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path id="wave" d="M16 8c1.5 1.5 1.5 6.5 0 8" stroke="#ffd36a" stroke-width="2" fill="none"></path>
      </svg>
    </button>
    <input id="rngVol" class="vol" type="range" min="0" max="100" step="1" value="65" />
  </div>

  <script>
  (function(){
    const S={ muteKey:"op_audio_mute", volKey:"op_audio_vol", hasStarted:false, fadeTimer:null, autoTried:false };
    const $intro=document.getElementById('sfxIntro');
    const $bgm=document.getElementById('bgm');
    const $wrap=document.getElementById('audioCtrl');
    const $btn=document.getElementById('btnMute');
    const $ico=document.getElementById('icoVol');
    const $wave=document.getElementById('wave');
    const $rng=document.getElementById('rngVol');

    const savedMute=localStorage.getItem(S.muteKey);
    const savedVol=localStorage.getItem(S.volKey);
    let muted=savedMute==="1";
    let vol=isNaN(+savedVol)?20:Math.max(0,Math.min(100,+savedVol));

    setVolume(vol);
    applyMuteUI();
    $wrap.style.display='flex';

    function setVolume(v){
      vol=v;
      $rng.value=String(v);
      const gain=muted?0:(v/100);
      if($bgm) $bgm.volume=Math.min(1,Math.max(0,gain));
      if($intro) $intro.volume=Math.min(1,Math.max(0,Math.min(0.9,gain*1.2)));
      localStorage.setItem(S.volKey,String(v));
    }

    function fade(el,target,ms){
      if(!el) return;
      clearInterval(S.fadeTimer);
      const stepMs=40, steps=Math.max(1,Math.round(ms/stepMs));
      const start=el.volume;
      let n=0;
      S.fadeTimer=setInterval(()=>{
        n++;
        const t=n/steps;
        el.volume=start+(target-start)*t;
        if(n>=steps){
          clearInterval(S.fadeTimer);
          el.volume=target;
        }
      }, stepMs);
    }

    function applyMuteUI(){
      const on=!muted;
      $ico.setAttribute('fill', on?'#ffd36a':'#bbb');
      $wave.setAttribute('stroke', on?'#ffd36a':'#bbb');
    }

    async function tryAutoStart(){
      if(S.autoTried||S.hasStarted) return;
      S.autoTried=true;
      try{
        setVolume(vol);
        if($bgm) await $bgm.play();
        if(!muted && $bgm) $bgm.volume=Math.min(1,vol/100);
        S.hasStarted=true;
      }catch(e){
        S.hasStarted=false;
      }
    }

    async function startAudioAfterGesture(){
      if(S.hasStarted) return;
      S.hasStarted=true;
      try{
        if($bgm){
          $bgm.volume=0;
          await $bgm.play().catch(()=>{});
        }
        if($intro && $intro.src){
          $intro.currentTime=0;
          $intro.volume=Math.min(1,(vol/100)*0.9);
          await $intro.play().catch(()=>{});
          $intro.onended=()=>{
            if(!muted && $bgm) fade($bgm, Math.min(1, vol/100), 1200);
          };
        }else{
          if(!muted && $bgm) fade($bgm, Math.min(1, vol/100), 800);
        }
      }catch(e){
        S.hasStarted=false;
      }
    }

    $btn.addEventListener('click', ()=>{
      muted=!muted;
      localStorage.setItem(S.muteKey, muted?"1":"0");
      applyMuteUI();
      if(muted){
        if($bgm) fade($bgm,0,250);
        if($intro && !$intro.paused) fade($intro,0,150);
      }else{
        setVolume(vol);
        if($bgm && $bgm.paused){
          $bgm.play().catch(()=>{});
        }
        if($bgm) fade($bgm, Math.min(1, vol/100), 250);
      }
    });

    $rng.addEventListener('input', (e)=> setVolume(+e.target.value));
    document.addEventListener('DOMContentLoaded', tryAutoStart);

    window.__OPAudio = {
      startAudio: startAudioAfterGesture,
      setVolume,
      mute: ()=>{ if(!muted) $btn.click(); },
      unmute: ()=>{ if(muted) $btn.click(); }
    };
  })();
  </script>

  <script>
    // === Service Worker 註冊（離線快取核心）===
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch((err) => console.warn("SW register failed:", err));
      });
    }
  </script>
