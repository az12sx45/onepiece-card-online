<div id="txtRotateHint" class="text-sm opacity-80">若仍無法旋轉，請解鎖畫面旋轉或從瀏覽器選單開啟「允許旋轉」。</div>

  <script>
    (function initBGVideo(){
      const v = document.getElementById('bgVideo');
      if(!v) return;
      const enableVideo = ()=> document.body.classList.remove('no-video');
      const fallback = ()=> document.body.classList.add('no-video');
      v.addEventListener('loadeddata', enableVideo, {once:true});
      v.addEventListener('canplay', enableVideo, {once:true});
      v.addEventListener('error', fallback, {once:true});
      const tryPlay = ()=> v.play().then(enableVideo).catch(fallback);
      window.addEventListener('pointerdown', tryPlay, {once:true});
      window.addEventListener('keydown', tryPlay, {once:true});
      tryPlay();
    })();
    (function orientationGate(){
      const overlay = document.getElementById('lockOverlay');
      function apply(){
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        document.body.classList.toggle('lock-scroll', isPortrait);
        if(overlay){ overlay.style.display = isPortrait ? 'flex' : 'none'; }
      }
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
      apply();
    })();
    async function tryLockLandscape(){
      try{
        if(screen.orientation && screen.orientation.lock){
          await screen.orientation.lock('landscape');
        }
      }catch(e){}
    }

(function applyStaticI18n(){
  const I18N = window.__I18N;
  if(!I18N) return;
  const $t = (k)=>I18N.t(k);

  const a = document.getElementById('txtRotateTitle');
  const b = document.getElementById('txtRotateHint');
  if(a) a.textContent = $t('ui.rotateTitle');
  if(b) b.textContent = $t('ui.rotateHint');

  document.documentElement.setAttribute('lang', I18N.getLang());
})();


  </script>

  <script type="text/babel" data-presets="env,react">
    // === (2) 連線與全域參數：置於 React 程式碼最上方 ===
    const SERVER_URL = 'https://onepiece-card-online.onrender.com';
    const socket = io(SERVER_URL, { transports: ['websocket'] });

    // === 等待室本地狀態（非必須存在於 localStorage）
    let __lobby = {
      roomId:'',
      me:{ playerId:null, secret: localStorage.getItem('opSecret')||'', name:'', avatar:1 },
      snapshot:null
    };

    // 伺服器回覆：拿到自己的 playerId / secret
    socket.on('JOINED', ({ playerId, secret })=>{
      __lobby.me.playerId = playerId;
      __lobby.me.secret   = secret;
      try { localStorage.setItem('opSecret', secret); } catch {}
    });

    // 伺服器廣播等待室快照或導向遊戲
    socket.on('EMIT', (e)=>{
      // ★ 等待室快照（房號 / 玩家清單 / 房主 / ready 狀態）
      if (e?.type === 'lobby'){
        __lobby.snapshot = e.lobby;
        if (!__lobby.roomId) __lobby.roomId = e.lobby?.roomId || __lobby.roomId;
        // 通知 WaitingRoom 立即重繪
        if (typeof window.__setLobby === 'function') window.__setLobby(e.lobby);
        return;
      }

      // ★ 後端要求進入遊戲
      if (e?.type === 'nav_game'){
        try{ socket.close(); }catch{}
        const url = new URL('game.html', location.origin);
        url.searchParams.set('server', SERVER_URL);
        url.searchParams.set('room',   __lobby.roomId);
        url.searchParams.set('name',   __lobby.me.name || 'P');
        url.searchParams.set('avatar', String(__lobby.me.avatar || 1));
        const count = Array.isArray(__lobby.snapshot?.players)
          ? Math.max(1, __lobby.snapshot.players.length)
          : 1;
        url.searchParams.set('n', String(count));    // ← 不再預設 4
        location.href = url.toString();
        return;
      }
    });

    // === 原常數/工具：保留必要者 ===
    const {useState, useEffect, useMemo} = React;
// === I18N 防呆：避免字典/腳本載入失敗造成整頁白屏 ===
const I18N = window.__I18N || {
  getLang: () => 'zh-Hant',
  setLang: () => {},
  SUPPORTED: ['zh-Hant'],
  getLangLabel: () => '繁體中文',
  t: (k) => k
};
const t = (key, vars) => (I18N && typeof I18N.t === 'function') ? I18N.t(key, vars) : key;

// === (i18n) 補齊 start.html 會用到的 key（就算外部字典缺漏也不會跳回中文/顯示 key）===
    const MIN_PLAYERS = 2; // 開局最低人數

    function uid(){ return Math.random().toString(36).slice(2,10); }
    function genRoomId(){ const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s += letters[Math.floor(Math.random()*letters.length)]; return s; }
    function getMeId(){ let me = sessionStorage.getItem("op_me_id"); if(!me){ me = "me_" + uid(); sessionStorage.setItem("op_me_id", me); } return me; }

    function WaveText({ text, className="", small=false }){
      const chars = Array.from(text);
      const waveClass = small ? "wave wave-sm" : "wave";
      return (
        <span className={`${waveClass} ${className}`}>
          {chars.map((ch, idx) => (
            <span className="char" style={{["--i"]: idx}} key={idx}>
              {ch === " " ? "\u00A0" : ch}
            </span>
          ))}
        </span>
      );
    }

function PressAnyKey({onProceed}){
  useEffect(()=>{
    const h=(e)=>{
      e.preventDefault();
      onProceed();
      tryLockLandscape();
      window.__OPAudio?.startAudio();
    };
    window.addEventListener('keydown', h, {once:true});
    window.addEventListener('pointerdown', h, {once:true});
    return ()=>{
      window.removeEventListener('keydown', h);
      window.removeEventListener('pointerdown', h);
    };
  }, [onProceed]);

  return (
    <div className="relative w-full min-h-[92vh] select-none">
      <div className="absolute left-1/2 -translate-x-1/2 top-[60vh] md:top-[58vh] text-center space-y-2">
        <div className="title-wrap">
          <div className="title-main font-black tracking-tight whitespace-nowrap fx-tiltDrop fx-shine text-[clamp(28px,8.2vw,48px)] [@media(orientation:landscape)]:text-[clamp(24px,6.6vw,44px)] md:text-[clamp(52px,5.2vw,96px)] lg:text-[clamp(60px,4.6vw,110px)] xl:text-[clamp(68px,4vw,128px)]">
            <WaveText text={t("brand.titleEn")} />
          </div>
          <div className="title-sub font-extrabold text-amber-300 mt-2 fx-fadeUp whitespace-nowrap text-[clamp(16px,5.2vw,28px)] [@media(orientation:landscape)]:text-[clamp(16px,3.6vw,24px)] md:text-[clamp(30px,3.2vw,56px)] lg:text-[clamp(34px,2.8vw,64px)] xl:text-[clamp(38px,2.4vw,72px)]">
            <WaveText text={t("brand.titleSub")} small />
          </div>
        </div>
      </div>

      <div
        className="absolute left-1/2 -translate-x-1/2 text-sm md:text-base text-neutral-200 blink md:bottom-8"
        style={{bottom:"calc(env(safe-area-inset-bottom, 0px) - 10px)", paddingBottom:0}}
      >
        {t("ui.pressAnyKey")}
      </div>
    </div>
  );
}


    // === 主選單：開始遊戲 / 遊戲規則 ===
   function MainMenu({ onStart, onRule, onLangChange }) {
  const cur = I18N.getLang();

  return (
    <div className="card w-[min(480px,90vw)] p-6 text-center space-y-6 relative">
      {/* Language selector */}
      <div className="absolute right-4 top-4">
        <label className="text-[11px] text-neutral-300 mr-2">{t("ui.lang")}</label>
        <select
          className="btn text-sm py-1 px-2"
          value={cur}
          onChange={(e)=> onLangChange?.(e.target.value)}

      <h1 className="text-2xl font-bold tracking-wide text-amber-300">

}


       // === 遊戲規則彈窗（最終版） ===
    function RuleModal({ show, onClose }) {

      return (

              </p>
              <ul className="list-disc ml-5 space-y-1">
                <li>

                </li>
                <li>

            {/* 二、一局流程 */}
            <section className="space-y-1.5">

              <ol className="list-decimal ml-5 space-y-1">
                <li>
                  所有玩家各獲得 1 張<strong>起始手牌</strong>
                  （不公開，只有本人可見）。

                  畫面上方會顯示：

   function RoomChoice({ profile, intent, onEnter }) {
  const [joinCode, setJoinCode] = useState("");
  const [cpuCount, setCpuCount] = useState(() => {
    // 從 localStorage 讀取上一次的 CPU 設定（預設 0）
    try {
      const v = Number(localStorage.getItem("op_cpu_count") || "0");
      if (Number.isNaN(v)) return 0;
      return Math.min(3, Math.max(0, v));
    } catch {
      return 0;
    }
  });

  const meId = getMeId(); // 僅用於本機識別，不影響後端

  // === 建立房：emit JOIN_ROOM，帶入 CPU 設定 ===
  function createRoom() {
    const id = genRoomId();
    __lobby.roomId = id;
    __lobby.me.name = profile.playerName;
    __lobby.me.avatar = profile.playerAvatar;
    __lobby.cpuCount = cpuCount; // 先存在本地，全域記錄，之後後端 / AI 會用到

    // 記住 CPU 設定（下次開遊戲會自動帶出）
    try {
      localStorage.setItem("op_cpu_count", String(cpuCount));
    } catch (e) {}

    socket.emit("JOIN_ROOM", {
      roomId: id,
      displayName: profile.playerName,
      avatar: profile.playerAvatar,
      secret: __lobby.me.secret,
      cpuCount, // ← 新增：這一房預計加入幾個 CPU 玩家
    });

    // onEnter 第二個參數帶出 host / cpuCount 等資訊給 WaitingRoom 使用
    onEnter(id, { host: true, cpuCount });
  }

  // === 加入房：保持原本邏輯 ===
  function tryJoin() {
    const code = (joinCode || "").toUpperCase().replace(/\s+/g, "");

    onEnter(code, { host: false });

            <div className="text-neutral-300">{profile.playerName}</div>
            <div className="text-xs text-neutral-500">{t("ui.playerId", {id: meId})}</div>
          </div>
        </div>
      </div>

      {/* 左右兩欄：建立房、加入房 */}
      <div className="grid md:grid-cols-2 gap-6">
        {/* 左：建立房間 */}
        <div className="space-y-4 border border-neutral-700/70 rounded-xl p-4 bg-black/20">
          <div className="flex items-center justify-between">
            <div className="font-semibold">{t("ui.createRoomTitle")}</div>

// === (4) 等待室：全面使用 __lobby.snapshot ===
function WaitingRoom({roomId, profile, onLeave}){
  const [lobby, setLobby] = useState(()=> __lobby.snapshot);
  const mePid = __lobby.me.playerId;

  useEffect(()=>{
    window.__setLobby = setLobby;
    return ()=>{ window.__setLobby = null; };
  }, []);

  const players = lobby?.players||[];
  // 後端欄位防呆：支援 playerId/id, displayName/name
  function pidOf(p){ return p.playerId ?? p.pid ?? p.id; }
  function nameOf(p){ return p.displayName ?? p.name ?? 'P'; }
  function avatarOf(p){ return p.avatar ?? 1; }

  const cpuCount = lobby?.cpuCount ?? 0;  // 從伺服器拿到的 CPU 數量

  const amHost = lobby && (lobby.host === mePid);
  const canStart =
  (players.length + cpuCount) >= MIN_PLAYERS &&  // 真人 + CPU 要 ≥ 最低人數
  players.every(p => !!p.ready);                // 真人全部按準備


  function copyId(){
    if(!lobby?.roomId) return;
    navigator.clipboard?.writeText(lobby.roomId);
   alert(t("ui.alertCopiedRoomId", { roomId: lobby.roomId }));
  }

  // 切換準備
  function toggleReady(willReady){
    socket.emit('ACTION', {
      roomId: __lobby.roomId,
      playerId: __lobby.me.playerId,
      secret: __lobby.me.secret,
      type: willReady ? 'LOBBY_READY' : 'LOBBY_UNREADY'
    });
  }

  // {t("ui.host")}開局
  function startGame(){
    if(!amHost) return;
    socket.emit('ACTION', {
      roomId: __lobby.roomId,
      playerId: __lobby.me.playerId,
      secret: __lobby.me.secret,
      type: 'START_GAME'
    });
  }

  // 我的 ready 狀態（只看真人列表）
  const me = players.find(p=> pidOf(p)===mePid);
  const myReady = !!me?.ready;

  if(!lobby){
    return (
      <div className="card w=[min(820px,96vw)] p-6">
        <div className="text-lg font-bold mb-2">{t("ui.connectingLobby")}</div>
        <button className="btn" onClick={onLeave}>{t("ui.back")}</button>
      </div>
    );
  }

  return (
    <div className="card w-[min(980px,96vw)] p-6">
      {/* 上方：房號 + 按鈕列 */}
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div className="text-xs text-neutral-400">{t("ui.roomId")}</div>
          <div className="text-2xl font-extrabold tracking-widest">{lobby.roomId}</div>
        </div>
        <div className="flex gap-2">
          <button className="btn" onClick={copyId}>{t("ui.copyRoomId")}</button>
          <button className="btn" onClick={onLeave}>{t("ui.leaveRoom")}</button>
          {amHost && (
            <button
              className={`btn-primary ${canStart? "": "opacity-50 cursor-not-allowed"}`}
              onClick={startGame}
              disabled={!canStart}
              title={canStart? t("ui.startGameBtn") : t("ui.startGameNeed")}
            >
              {t("ui.startGameBtn")}
            </button>
          )}
        </div>
      </div>

      {/* CPU 數量提示 */}
      {cpuCount > 0 && (
        <div className="mt-3 text-xs text-amber-200 flex items-center gap-2">
          <span className="px-2 py-0.5 rounded-full border border-amber-400/40 bg-amber-500/10">
            {t("ui.cpuPlayers", {n: cpuCount})}
          </span>
          <span className="text-[11px] text-neutral-400">
            {t("ui.cpuWillJoin")}
          </span>
        </div>
      )}

      {/* 真人 + CPU 列表 */}
      <div className="mt-5 space-y-5">
        {/* 真人{t("ui.player")}區 */}
        <div>
          <div className="text-sm text-neutral-300 mb-2">
            {t("ui.humanPlayers", {n: players.length})}
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
            {players.map(p=> {
              const pid = pidOf(p);
              const isHost = lobby.host === pid;
              const isMe   = pid === mePid;
              const ready  = !!p.ready;
              const avatarUrl = `images/avatars/${avatarOf(p)}.webp`;
              return (
                <div
                  key={pid}
                  className="flex items-center justify-between gap-3 rounded-xl border border-neutral-700/60 bg-black/30 px-3 py-2"
                >
                  <div className="flex items-center gap-3">
                    <div className={"avatar "+(isHost?"is-active":"")}><img src={avatarUrl} alt=""/></div>
                    <div>
                      <div className="font-semibold leading-tight">{nameOf(p)}</div>
                      <div className="text-xs text-neutral-400 flex items-center gap-2">
                        {isHost
                          ? <span className="px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-200 border border-amber-400/30">{t("ui.host")}</span>
                          : <span className="opacity-60">{t("ui.player")}</span>}
                        {ready
                          ? <span className="px-1.5 py-0.5 rounded bg-emerald-400/15 text-emerald-200 border border-emerald-400/30">{t("ui.ready")}</span>
                          : <span className="px-1.5 py-0.5 rounded bg-neutral-600/20 text-neutral-200 border border-neutral-600/40">{t("ui.notReady")}</span>}
                      </div>
                    </div>
                  </div>
                  {isMe && (
                    <button className="btn" onClick={()=>toggleReady(!myReady)}>
                      {myReady ? t("ui.meUnready") : t("ui.meReady")}
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
        {/* CPU {t("ui.player")}區 */}
        {cpuCount > 0 && (
          <div>
            <div className="text-sm text-neutral-300 mb-2">
              {t("ui.cpuPlayersList", {n: cpuCount})}
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">

  <!-- === 一鍵下載全部資源 (UI) === -->
  <div id="preloadBox" class="mt-4 text-center" style="padding:16px;">
    <button id="btnPreloadAll" class="btn btn-primary">
      📦 一次下載全部資源（建議 Wi-Fi）
    </button>
    <div class="preload-track">
      <div id="preloadBarInner" class="preload-bar"></div>
    </div>
    <div id="preloadStatus" class="text-sm text-neutral-300 mt-2"></div>
  </div>
  <audio id="sfxIntro" src="audio/intro.mp3" preload="auto" loop autoplay></audio>
  <audio id="bgm" src="audio/bgm.mp3" preload="auto" loop autoplay></audio>
  <!-- === 一鍵下載全部資源：邏輯 === -->
  <script>
    // 要預先下載的資源清單
    // （這裡我先幫你列出 BGM + 影片，你之後可以依 sw.js 再加 / 改）
    const PRELOAD_ASSETS = [
      'images/cover.jpg',
      // 頭像（1~30）
      ...Array.from({length:30}, (_,i)=>`images/avatars/${i+1}.webp`),
      // BGM：track01 ~ track20
      ...Array.from({length:20}, (_,i)=>`audio/bgm/track${String(i+1).padStart(2,'0')}.mp3`),
      // 影片
      'videos/start.mp4',
      'videos/coin.mp4',
      // 強化影片 0~19
      ...Array.from({length:20}, (_,i)=>`videos/enh/${i}.mp4`),
    ];

    async function preloadAllAssets() {
      const btn  = document.getElementById('btnPreloadAll');
      const info = document.getElementById('preloadStatus');
      const bar  = document.getElementById('preloadBarInner');

      if (!btn || !info) return;

      btn.disabled = true;
      let ok = 0, fail = 0;
      const total = PRELOAD_ASSETS.length;

      info.textContent = `開始下載（0 / ${total}）...`;
      if (bar) bar.style.width = '0%';

      for (const url of PRELOAD_ASSETS) {
        try {
          await fetch(url, { cache: "reload" });
          ok++;
        } catch(err) {
          console.warn("下載失敗：", url, err);
          fail++;
        }
        const done = ok + fail;
        const pct  = Math.round(done / total * 100);
        info.textContent = `下載中... ${done} / ${total}（${pct}%）`;
        if (bar) bar.style.width = `${pct}%`;
      }

      info.textContent = `完成！成功 ${ok} 項，失敗 ${fail} 項。`;
      if (bar) bar.style.width = '100%';
      btn.disabled = false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('btnPreloadAll');
      if (btn) btn.addEventListener('click', preloadAllAssets);
    });
  </script>

  <div class="audio-toggle" id="audioCtrl" style="display:none">
    <button id="btnMute" title="靜音/取消靜音" aria-label="Mute/Unmute">
      <svg id="icoVol" width="16" height="16" viewBox="0 0 24 24" fill="#ffd36a">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path id="wave" d="M16 8c1.5 1.5 1.5 6.5 0 8" stroke="#ffd36a" stroke-width="2" fill="none"></path>
      </svg>
    </button>
    <input id="rngVol" class="vol" type="range" min="0" max="100" step="1" value="65" />
  </div>

  <script>
  (function(){
    const S={ muteKey:"op_audio_mute", volKey:"op_audio_vol", hasStarted:false, fadeTimer:null, autoTried:false };
    const $intro=document.getElementById('sfxIntro');
    const $bgm=document.getElementById('bgm');
    const $wrap=document.getElementById('audioCtrl');
    const $btn=document.getElementById('btnMute');
    const $ico=document.getElementById('icoVol');
    const $wave=document.getElementById('wave');
    const $rng=document.getElementById('rngVol');
    const savedMute=localStorage.getItem(S.muteKey);
    const savedVol=localStorage.getItem(S.volKey);
    let muted=savedMute==="1";
    let vol=isNaN(+savedVol)?20:Math.max(0,Math.min(100,+savedVol));
    setVolume(vol);
    applyMuteUI();
    $wrap.style.display='flex';
    function setVolume(v){
      vol=v;
      $rng.value=String(v);
      const gain=muted?0:(v/100);
      $bgm.volume=Math.min(1,Math.max(0,gain));
      if($intro) $intro.volume=Math.min(1,Math.max(0,Math.min(0.9,gain*1.2)));
      localStorage.setItem(S.volKey,String(v));
    }
    function fade(el,target,ms){
      clearInterval(S.fadeTimer);
      const stepMs=40, steps=Math.max(1,Math.round(ms/stepMs));
      const start=el.volume;
      let n=0;
      S.fadeTimer=setInterval(()=>{
        n++;
        const t=n/steps;
        el.volume=start+(target-start)*t;
        if(n>=steps){
          clearInterval(S.fadeTimer);
          el.volume=target;
        }
      }, stepMs);
    }
    function applyMuteUI(){
      const on=!muted;
      $ico.setAttribute('fill', on?'#ffd36a':'#bbb');
      $wave.setAttribute('stroke', on?'#ffd36a':'#bbb');
    }
    async function tryAutoStart(){
      if(S.autoTried||S.hasStarted) return;
      S.autoTried=true;
      try{
        setVolume(vol);
        await $bgm.play();
        if(!muted) $bgm.volume=Math.min(1,vol/100);
        S.hasStarted=true;
      }catch(e){
        S.hasStarted=false;
      }
    }
    async function startAudioAfterGesture(){
      if(S.hasStarted) return;
      S.hasStarted=true;
      try{
        $bgm.volume=0;
        await $bgm.play().catch(()=>{});
        if($intro && $intro.src){
          $intro.currentTime=0;
          $intro.volume=Math.min(1,(vol/100)*0.9);
          await $intro.play().catch(()=>{});
          $intro.onended=()=>{
            if(!muted) fade($bgm, Math.min(1, vol/100), 1200);
          };
        }else{
          if(!muted) fade($bgm, Math.min(1, vol/100), 800);
        }
      }catch(e){
        S.hasStarted=false;
      }
    }
    $btn.addEventListener('click', ()=>{
      muted=!muted;
      localStorage.setItem(S.muteKey, muted?"1":"0");
      applyMuteUI();
      if(muted){
        fade($bgm,0,250);
        if($intro && !$intro.paused) fade($intro,0,150);
      }else{
        setVolume(vol);
        if($bgm.paused){
          $bgm.play().catch(()=>{});
        }
        fade($bgm, Math.min(1, vol/100), 250);
      }
    });
    $rng.addEventListener('input', (e)=> setVolume(+e.target.value));
    document.addEventListener('DOMContentLoaded', tryAutoStart);
    window.__OPAudio = {
      startAudio: startAudioAfterGesture,
      setVolume,
      mute: ()=>{ if(!muted) $btn.click(); },
      unmute: ()=>{ if(muted) $btn.click(); }
    };
  })();
  </script>
