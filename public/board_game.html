<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="航海王大富翁">
  <meta name="theme-color" content="#06111d">
  <link rel="manifest" href="board_manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <title>航海王大富翁 | 正式遊戲</title>
  <link rel="stylesheet" href="css/board-cursor-nami-v3.css?v=20260905-game-cursors-v3">
  <script defer src="js/game_cursor_feedback_v1.js?v=20260905-game-cursors-v1"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("desktop_frame") === "1" || params.get("layout") === "responsive") return;
      const portableTouch = window.matchMedia?.("(pointer: coarse)")?.matches
        || Number(navigator.maxTouchPoints || 0) > 1
        || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || "");
      if (!portableTouch && params.get("layout") !== "desktop") return;
      const fixedUrl = new URL("board_fixed_viewport.html", window.location.href);
      fixedUrl.search = window.location.search;
      fixedUrl.hash = window.location.hash;
      window.location.replace(fixedUrl.href);
    })();
  </script>
  <style>
    :root{
      --board-bg:url("images/board/backgrounds/board_bg_start.webp");
      --board-map-bg:url("images/board/backgrounds/board_bg_map_main.webp");
      --panel:rgba(247,252,255,.62);
      --panel-strong:rgba(252,254,255,.8);
      --line:rgba(255,255,255,.68);
      --text:#17384b;
      --muted:#5f8194;
      --gold:#efbb56;
      --gold-2:#d79a34;
      --shadow:0 18px 42px rgba(33,102,132,.14);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family:"Noto Sans TC",system-ui,-apple-system,Segoe UI,sans-serif;
      color:var(--text);
      background:
        linear-gradient(180deg, rgba(242,250,255,.14), rgba(128,200,232,.10)),
        var(--board-bg) center center / cover no-repeat fixed;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.72;
      background:
        linear-gradient(180deg, rgba(247,252,255,.22) 0%, rgba(242,250,255,.10) 38%, rgba(104,181,216,.08) 100%),
        radial-gradient(circle at 21% 28%, rgba(255,255,255,.78), transparent 7%),
        radial-gradient(circle at 29% 25%, rgba(255,255,255,.58), transparent 6%),
        radial-gradient(circle at 72% 21%, rgba(255,255,255,.8), transparent 7%),
        radial-gradient(circle at 79% 25%, rgba(255,255,255,.56), transparent 5%);
    }
    .page{
      width:100%;
      margin:0 auto;
      min-height:100vh;
      padding:0;
      position:relative;
      z-index:1;
    }
    .topbar,
    .board-card,
    .side-card{
      border-radius:24px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(241,251,255,.34));
      backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
    }
    .topbar{
      padding:12px 14px;
      display:grid;
      gap:10px;
      margin-bottom:10px;
    }
    .topbar.game-clean-hidden,
    .sidebar.game-clean-hidden{
      display:none;
    }
    .toprow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .back-link{
      border:none;
      background:transparent;
      color:#2f6781;
      cursor:pointer;
      font-weight:900;
      padding:0;
    }
    .mode-badge{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.42);
      border:1px solid rgba(255,255,255,.7);
      font-size:12px;
      font-weight:900;
      color:#336b84;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .title{
      margin:0;
      font-size:24px;
      font-weight:900;
      color:#205a76;
    }
    .subtitle{
      margin-top:6px;
      color:#6a8c9c;
      font-size:12px;
    }
    .meta-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .meta-pill{
      display:inline-flex;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.56);
      border:1px solid rgba(255,255,255,.78);
      color:#3a7088;
      font-size:12px;
      font-weight:900;
    }
    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:0;
      align-items:start;
    }
    .board-card{
      min-height:100vh;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      backdrop-filter:none;
      overflow:hidden;
    }
    .board-tools{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:6px;
      position:fixed;
      right:16px;
      top:16px;
      z-index:50;
      margin:0;
      flex-wrap:nowrap;
      transform-origin:top right;
      filter:drop-shadow(0 9px 13px rgba(0,0,0,.42));
    }
    .map-turn-banner{
      position:fixed;
      left:16px;
      top:16px;
      z-index:52;
      width:min(440px, calc(100vw - 32px));
      min-height:0;
      aspect-ratio:1822 / 583;
      display:block;
      padding:0;
      border:0;
      border-radius:0;
      color:#f7fcff;
      background:transparent url("images/board/map_hud_ui/map_turn_status_frame_v1.webp") center/100% 100% no-repeat;
      box-shadow:none;
      filter:drop-shadow(0 11px 15px rgba(0,0,0,.48));
      pointer-events:none;
    }
    .map-turn-banner::before{
      display:none;
    }
    .map-turn-banner.is-your-turn{
      filter:drop-shadow(0 11px 15px rgba(0,0,0,.48)) drop-shadow(0 0 11px rgba(255,214,111,.44));
    }
    .map-turn-avatar{
      position:absolute;
      left:8.4%;
      top:21.3%;
      width:20.9%;
      height:auto;
      aspect-ratio:1;
      border-radius:50%;
      overflow:hidden;
      background:transparent;
      border:0;
    }
    .map-turn-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .map-turn-copy{
      position:absolute;
      left:34.2%;
      top:23.5%;
      width:56.8%;
      height:62.5%;
      min-width:0;
      display:grid;
      align-content:center;
      gap:1px;
      overflow:hidden;
    }
    .map-turn-kicker{
      color:#ffe38c;
      font-size:12px;
      font-weight:950;
      letter-spacing:.08em;
    }
    .map-turn-name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:22px;
      line-height:1.1;
      font-weight:950;
      text-shadow:0 2px 10px rgba(0,0,0,.28);
    }
    .map-turn-step{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:rgba(229,247,255,.88);
      font-size:12px;
      font-weight:800;
    }
    .turn-transition-banner{
      position:fixed;
      inset:0;
      z-index:620;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      opacity:0;
      visibility:hidden;
      transform:translateY(10px);
      transition:opacity .22s ease, transform .22s ease, visibility .22s ease;
      background:linear-gradient(180deg, rgba(4,18,28,.08), rgba(4,18,28,.28));
    }
    .turn-transition-banner.open{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
      pointer-events:auto;
    }
    .turn-transition-card{
      position:relative;
      width:min(820px, calc(100vw - 28px));
      min-height:0;
      aspect-ratio:1822 / 583;
      display:block;
      padding:0;
      border:0;
      border-radius:0;
      color:#f8fcff;
      background:transparent url("images/board/map_hud_ui/map_turn_status_frame_v1.webp") center/100% 100% no-repeat;
      box-shadow:none;
      filter:drop-shadow(0 24px 30px rgba(0,0,0,.58));
      overflow:visible;
    }
    .turn-transition-avatar{
      position:absolute;
      left:8.4%;
      top:21.3%;
      width:20.9%;
      height:auto;
      aspect-ratio:1;
      border-radius:50%;
      overflow:hidden;
      background:transparent;
      border:0;
      box-shadow:none;
    }
    .turn-transition-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .turn-transition-copy{
      position:absolute;
      left:34.2%;
      top:22%;
      width:56.8%;
      height:64%;
      min-width:0;
      display:grid;
      align-content:center;
      overflow:hidden;
    }
    .turn-transition-kicker{
      color:#ffe38c;
      font-size:13px;
      font-weight:950;
      letter-spacing:0;
    }
    .turn-transition-title{
      margin-top:4px;
      font-size:clamp(30px, 5vw, 56px);
      line-height:1.02;
      font-weight:950;
      letter-spacing:0;
      overflow-wrap:anywhere;
      text-shadow:0 4px 18px rgba(0,0,0,.34);
    }
    .turn-transition-subtitle{
      margin-top:8px;
      color:rgba(229,247,255,.86);
      font-size:15px;
      font-weight:850;
      letter-spacing:0;
      overflow-wrap:anywhere;
    }
    .turn-transition-banner.is-your-turn .turn-transition-card{
      filter:drop-shadow(0 24px 30px rgba(0,0,0,.58)) drop-shadow(0 0 18px rgba(255,214,111,.46));
    }
    .map-tool-btn{
      min-width:78px;
      min-height:44px;
      border:0;
      border-radius:0;
      padding:0 18px;
      cursor:pointer;
      font-weight:950;
      font-size:12px;
      color:#f8e6b9;
      background:transparent url("images/board/encounter_ui/encounter_action_button_frame.webp") center/100% 100% no-repeat;
      text-shadow:0 2px 3px #000;
      filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
    }
    .map-tool-btn:hover:not(:disabled){
      filter:brightness(1.18) drop-shadow(0 3px 3px rgba(0,0,0,.42));
    }
    #focusPlayerBtn{min-width:126px}
    #viewWholeMapBtn{min-width:96px}
    #saveGameBtn,#loadGameBtn{min-width:72px}
    .map-tool-btn:disabled{
      opacity:.58;
      cursor:not-allowed;
    }
    .cpu-speed-control{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:0 18px;
      border-radius:0;
      background:transparent url("images/board/battle_command_ui/battle_command_notice_frame.webp") center/100% 100% no-repeat;
      border:0;
      color:#f5fcff;
      box-shadow:none;
    }
    .cpu-speed-control[hidden]{
      display:none;
    }
    .cpu-speed-label{
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .cpu-speed-select{
      height:28px;
      min-width:68px;
      border:1px solid rgba(113,207,214,.58);
      border-radius:5px;
      padding:0 8px;
      color:#f8e6b9;
      background:rgba(4,20,32,.84);
      font-weight:900;
      font-size:12px;
    }
    .cpu-speed-select:disabled{
      opacity:.62;
      cursor:not-allowed;
    }
    .cpu-speed-hint{
      font-size:11px;
      font-weight:800;
      color:rgba(235,249,255,.82);
      white-space:nowrap;
    }
    .cpu-strategy-btn{
      min-height:28px;
      min-width:76px;
      border:0;
      border-radius:0;
      padding:0 12px;
      color:#f8e6b9;
      background:transparent url("images/board/encounter_ui/encounter_action_button_frame.webp") center/100% 100% no-repeat;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      text-shadow:0 2px 3px #000;
    }
    .cpu-strategy-btn:disabled{
      opacity:.58;
      cursor:not-allowed;
    }
    .cpu-strategy-list{
      display:grid;
      gap:10px;
      margin-top:12px;
    }
    .cpu-strategy-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 150px;
      gap:10px;
      align-items:center;
      padding:10px;
      border-radius:8px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
    }
    .cpu-strategy-name{
      font-weight:950;
    }
    .cpu-strategy-desc{
      margin-top:3px;
      color:rgba(229,247,255,.82);
      font-size:12px;
      line-height:1.45;
    }
    .mission-complete-toast{
      position:fixed;
      left:50%;
      top:18px;
      width:min(520px, calc(100vw - 32px));
      min-height:88px;
      transform:translate(-50%, -18px) scale(.98);
      z-index:360;
      pointer-events:none;
      opacity:0;
      padding:14px 46px 15px;
      border-radius:0;
      border:0;
      color:#fff7cf;
      background:transparent url("images/board/battle_command_ui/battle_command_notice_frame.webp") center/100% 100% no-repeat;
      box-shadow:none;
      filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));
      text-align:center;
      transition:opacity .22s ease, transform .22s ease;
      box-sizing:border-box;
    }
    .mission-complete-toast.show{
      opacity:1;
      transform:translate(-50%, 0) scale(1);
    }
    .mission-toast-kicker{
      display:block;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
      color:#ffd978;
    }
    .mission-toast-title{
      margin-top:3px;
      font-size:18px;
      font-weight:950;
      line-height:1.25;
      color:#fffbe8;
      text-shadow:0 2px 6px rgba(0,0,0,.22);
    }
    .mission-toast-sub{
      margin-top:4px;
      font-size:12px;
      font-weight:800;
      line-height:1.35;
      color:rgba(255,252,227,.86);
    }
    .item-thumb{
      position:relative;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      overflow:hidden;
      border:2px solid rgba(255,219,135,.52);
      border-radius:8px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,220,126,.28), transparent 62%),
        linear-gradient(180deg,#4b3328,#21191c);
      color:#f3ce78;
      font-weight:950;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), inset 0 -12px 18px rgba(0,0,0,.18), 0 3px 0 rgba(32,18,14,.24);
    }
    .item-thumb img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      padding:3px;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.34));
    }
    .item-thumb-fallback{
      display:none;
    }
    .item-thumb.fallback .item-thumb-fallback{
      display:grid;
      place-items:center;
      width:100%;
      height:100%;
    }
    .item-thumb-fallback img{display:block;width:88%;height:88%;object-fit:contain;padding:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.62))}
    .inline-item-thumb{
      width:100%;
      height:100%;
      border:0;
      border-radius:5px;
      box-shadow:none;
      background:transparent;
      font-size:24px;
    }
    .item-thumb.lineage-factor-icon{
      isolation:isolate;
      border:0;
      border-radius:8px;
      background:#000;
      box-shadow:none;
    }
    .lineage-factor-portrait-window{
      position:absolute;
      z-index:1;
      top:21.8%;
      left:22.6%;
      width:54.8%;
      height:56%;
      overflow:hidden;
      border-radius:50%;
      background:#000;
    }
    .item-thumb img.lineage-factor-portrait{
      width:100%;
      height:100%;
      padding:0;
      object-fit:cover;
      object-position:center 16%;
      transform:scale(1.55);
      transform-origin:50% 18%;
      filter:none;
    }
    .item-thumb img.lineage-factor-icon-frame{
      position:absolute;
      z-index:2;
      inset:0;
      width:100%;
      height:100%;
      padding:0;
      object-fit:contain;
      object-position:center;
      filter:none;
      pointer-events:none;
    }
    .backpack-item-icon .inline-item-thumb.lineage-factor-icon{
      width:auto;
      max-width:100%;
      height:100%;
      aspect-ratio:1;
      margin:auto;
    }
    .item-thumb.postgame-clue-icon{
      isolation:isolate;
      container-type:inline-size;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .item-thumb img.postgame-clue-icon-frame{
      position:absolute;
      z-index:1;
      inset:0;
      width:100%;
      height:100%;
      padding:0;
      object-fit:contain;
      object-position:center;
      clip-path:inset(1.4% 16.6% 1.5% 16.6% round 3.2%);
      filter:none;
      pointer-events:none;
    }
    .postgame-clue-island-window{
      position:absolute;
      z-index:2;
      top:19.3%;
      left:30.2%;
      width:39.6%;
      height:60.8%;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:7%;
      background:radial-gradient(circle at 50% 52%,#19485f,#02080d 70%);
    }
    .item-thumb img.postgame-clue-island{
      width:100%;
      height:100%;
      padding:0;
      object-fit:contain;
      object-position:center;
      transform:scale(1.04);
      filter:drop-shadow(0 3px 5px rgba(0,0,0,.72));
    }
    .postgame-clue-card-rank{
      position:absolute;
      z-index:3;
      top:7%;
      left:20.2%;
      width:10.8%;
      height:10.8%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff2b8;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(7px,10.5cqw,22px);
      font-weight:950;
      line-height:.78;
      text-shadow:0 2px 5px #000,0 0 7px rgba(103,235,255,.72);
      pointer-events:none;
    }
    .postgame-clue-card-rank::after{
      content:"◆";
      margin-top:.22em;
      color:#63eaff;
      font-size:.46em;
      line-height:1;
      text-shadow:0 1px 3px #000,0 0 5px rgba(72,224,255,.9);
    }
    .postgame-clue-card-rank.corner-bottom{
      top:auto;
      left:auto;
      right:20.2%;
      bottom:7%;
      transform:rotate(180deg);
    }
    .postgame-clue-card-rank.double{font-size:clamp(6px,8cqw,17px)}
    .backpack-item-icon .inline-item-thumb.postgame-clue-icon{
      width:auto;
      max-width:100%;
      height:100%;
      aspect-ratio:1;
      margin:auto;
      container-type:inline-size;
    }
    .item-reveal-hud{
      --item-reveal-glow:rgba(255,219,128,.48);
      position:fixed;
      inset:0;
      z-index:395;
      display:grid;
      place-items:center;
      pointer-events:none;
      visibility:hidden;
      opacity:0;
      overflow:hidden;
      background:rgba(0,0,0,0);
    }
    .item-reveal-hud.show{
      visibility:visible;
      pointer-events:auto;
      animation:itemRevealBackdrop 2.1s ease both;
    }
    .item-reveal-hud.awaiting{
      cursor:pointer;
    }
    .item-reveal-hud::before{
      content:"";
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(circle at 50% 42%, var(--item-reveal-glow), transparent 42%),
        linear-gradient(180deg, rgba(8,12,18,.86), rgba(11,9,8,.72) 48%, rgba(4,5,8,.88));
      opacity:0;
    }
    .item-reveal-hud.show::before{
      animation:itemRevealVeil 2.1s ease both;
    }
    .item-reveal-card{
      position:relative;
      width:min(1480px, calc(100vw - 24px), calc((100vh - 16px) * 1.776833));
      aspect-ratio:1672 / 941;
      container-type:inline-size;
      color:#fff7df;
      text-align:center;
      opacity:0;
      transform:translateY(22px) scale(.96);
    }
    .item-reveal-hud.show .item-reveal-card{
      animation:itemRevealCard 2.1s cubic-bezier(.18,.82,.25,1) both;
    }
    .item-reveal-panel-frame{
      position:absolute;
      z-index:1;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
      filter:drop-shadow(0 24px 42px rgba(0,0,0,.66));
    }
    .item-reveal-stage{
      position:absolute;
      z-index:2;
      left:14%;
      top:13%;
      width:72%;
      height:53%;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .item-reveal-stage::before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:64%;
      height:74%;
      transform:translate(-50%, -50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,226,143,.42), transparent 68%);
      filter:blur(20px);
      opacity:.9;
    }
    .item-reveal-image{
      position:absolute;
      z-index:2;
      left:22%;
      top:8%;
      width:56%;
      height:84%;
      max-width:none;

      filter:none;
      overflow:visible;
      transform:translate(var(--backpack-bag-x,0px),var(--backpack-bag-y,0px));

    .backpack-bag-art::before{
      content:"";
      position:absolute;
      left:calc(50% + var(--backpack-closed-x,0px));
      top:calc(50% + var(--backpack-closed-y,5px));
      width:var(--backpack-closed-w,93px);
      height:var(--backpack-closed-h,81px);

      border-radius:0;
      outline:0;
      background:url("images/board/items/backpack_closed_ui.webp?v=20260514-bag-frame-clean") center bottom/auto 100% no-repeat;
      box-shadow:none;
      opacity:0;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }
    .backpack-bag-art::after{
      content:"";
      position:absolute;
      left:calc(50% + var(--backpack-open-x,0px));
      top:calc(50% + var(--backpack-open-y,0px));
      width:var(--backpack-open-w,100px);
      height:var(--backpack-open-h,88px);
      z-index:2;
      border:0;
      border-radius:0;
      outline:0;
      background:url("images/board/items/backpack_open_ui.webp?v=20260514-bag-frame-clean") center bottom/auto 100% no-repeat;
      opacity:1;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }
    .backpack-bag-art span,
    .backpack-bag-art span::before,
    .backpack-bag-art span::after{
      content:none;
      display:none;
    }
    .backpack-bag-art.is-opening{
      animation:backpackOpenBagPulse .72s ease both;
    }
    .backpack-bag-art.is-opening::before{
      display:block;
      content:"";
      animation:backpackCloseThenOpen .72s ease both;
    }
    .backpack-bag-art.is-opening::after{
      animation:backpackOpenHideThenShow .72s ease both;
    }
    .backpack-bag-art.is-closing{
      animation:backpackCloseBagFinal .24s ease both;
    }
    .backpack-bag-art.is-closing::before{
      display:block;
      content:"";

      0%,100%{ transform:translate(var(--backpack-bag-x,0px),var(--backpack-bag-y,0px)) scale(1); }

    @keyframes backpackCloseThenOpen{
      0%,45%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
      58%,100%{ opacity:0; transform:translate(-50%,calc(-50% - 2px)) scale(1.03); }
    }
    @keyframes backpackOpenHideThenShow{

      animation:seaChestReadyPulse 1.45s ease-in-out infinite alternate;
    }
    @keyframes seaChestReadyPulse{
      from{filter:brightness(1) drop-shadow(0 0 4px rgba(255,218,92,.16))}
      to{filter:brightness(1.07) drop-shadow(0 0 15px rgba(255,218,92,.5))}
    }
    .sea-chest-stage-shell.is-result .sea-chest-stage-head{
      position:absolute;
      z-index:3;
      left:14.2%;
      top:72.2%;
      width:61.4%;
      height:18.6%;
      box-sizing:border-box;
      padding:1% 1.7%;
      display:grid;
      align-content:center;
      justify-items:start;
      gap:.35cqw;
      overflow:hidden;
      text-align:left;
    }
    .sea-chest-stage-shell.is-result .sea-chest-stage-title{
      margin:0;
      padding:.08em 0;
      color:#fff5cf;
      font-size:clamp(11px,2.25cqw,32px);
      line-height:1.12;
      font-weight:1000;
    }
    .sea-chest-stage-shell.is-result .sea-chest-stage-meta{
      max-width:100%;
      padding:.08em 0;
      color:#fff0bb;
      font-size:clamp(7px,1.22cqw,17px);
      line-height:1.25;
      font-weight:850;
    }
    .sea-chest-stage-shell.is-result .tier-strip{
      justify-content:flex-start;
      gap:.45cqw;
      margin:0;
    }
    .sea-chest-stage-shell.is-result .tier-chip{
      padding:.25cqw .7cqw;
      font-size:clamp(6px,.85cqw,12px);
    }
    .sea-chest-stage-shell.is-result .sea-chest-result-card{
      position:absolute;
      z-index:2;
      left:14%;
      top:13%;
      width:72%;
      height:53%;
      display:grid;
      place-items:center;
      margin:0;
      overflow:hidden;
    }
    .sea-chest-stage-modal .sea-chest-stage-shell.is-result .sea-chest-card-art.reveal{
      position:relative;
      inset:auto;
      width:46%;
      height:84%;
      max-width:none;
      min-height:0;
      margin:0;
      border:0;
      aspect-ratio:auto;
      overflow:hidden;
      background:transparent;
      box-shadow:none;
    }
    .sea-chest-stage-shell.is-result .sea-chest-shuffle-row{
      left:auto;
      top:auto;
      right:12.15%;
      bottom:8.2%;
      width:8.3%;
      height:auto;
      aspect-ratio:1;
    }
    .sea-chest-stage-shell.is-result .sea-chest-shuffle-row .modal-btn{
      padding:0;
      color:transparent;
      font-size:0;
      background:url("images/board/map_hud_ui/action_icons/action_notice_icon_treasure.webp") center / 78% 78% no-repeat;
      filter:drop-shadow(0 0 9px rgba(77,224,255,.46));
      animation:evolutionContinuePulse 1.1s ease-in-out infinite;
    }
    @media (max-height:520px) and (orientation:landscape){
      .sea-chest-stage-shell,
      .sea-chest-stage-shell.is-result{width:min(1480px,calc(100vw - 16px),calc((100vh - 10px) * 1.776833))}
    }
    @media (max-width:500px) and (orientation:portrait){
      .sea-chest-stage-shell:not(.is-result) .sea-chest-stage-meta{display:none}
      .sea-chest-stage-shell.is-result .sea-chest-stage-meta{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .sea-chest-stage-shell.is-result .tier-strip{display:none}
    }

    /* V270：地圖視覺只覆蓋正式地圖本體；移除 map-visual-vintage 即回到原始版。 */
    .game-board.map-visual-vintage{
      background:
        linear-gradient(180deg, rgba(202,157,88,.44), rgba(136,91,44,.3)),
        var(--board-map-bg) center center / 100% 100% no-repeat;
      background-blend-mode:color,normal;
      box-shadow:
        inset 0 0 0 2px rgba(77,46,22,.3),
        inset 0 0 150px rgba(57,31,13,.26);
    }
    .game-board.map-visual-vintage::before{
      z-index:0;
      opacity:.68;
      background:
        radial-gradient(ellipse at center, transparent 54%, rgba(78,43,18,.2) 82%, rgba(49,28,13,.38) 100%),
        repeating-linear-gradient(12deg, rgba(78,45,20,.028) 0 1px, transparent 1px 8px),
        repeating-linear-gradient(102deg, rgba(255,239,196,.024) 0 1px, transparent 1px 11px);
      mix-blend-mode:multiply;
    }
    .game-board.map-visual-vintage::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.2;
      background:
        radial-gradient(circle at 12% 22%, rgba(255,236,185,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 72%, rgba(72,39,17,.36) 0 1px, transparent 2px),
        radial-gradient(circle at 84% 18%, rgba(255,236,185,.38) 0 1px, transparent 2px);
      background-size:17px 19px,23px 27px,31px 29px;
      mix-blend-mode:soft-light;
    }
    .game-board.map-visual-vintage .board-edge{
      height:10px;
      background:
        repeating-linear-gradient(90deg,
          rgba(78,48,24,.96) 0 22px,
          rgba(151,103,55,.92) 22px 30px,
          rgba(224,187,120,.86) 30px 35px);
      box-shadow:
        0 0 0 1px rgba(46,29,15,.3),
        0 4px 10px rgba(49,29,13,.25),
        inset 0 1px 0 rgba(255,232,174,.46);
      opacity:.88;
    }
    .game-board.map-visual-vintage .sea-tile{
      border-color:rgba(85,52,25,.84);
      background:linear-gradient(145deg, rgba(235,210,154,.98), rgba(164,115,62,.96));
      color:#55361f;
      box-shadow:
        0 0 0 1px rgba(255,234,181,.36),
        0 4px 9px rgba(58,34,16,.26);
    }
    .game-board.map-visual-vintage .sea-tile.type-event{
      border-color:rgba(91,59,31,.82);
      background:linear-gradient(145deg, rgba(246,226,181,.98), rgba(185,139,82,.94));
      color:#5d3a20;
    }
    .game-board.map-visual-vintage .sea-tile.type-chest{
      border-color:rgba(114,73,20,.9);
      background:linear-gradient(145deg, rgba(255,227,133,.98), rgba(190,125,38,.96));
      color:#6a3f10;
    }
    .game-board.map-visual-vintage .sea-tile.route-choice{
      border-color:rgba(255,229,153,.98);
      background:linear-gradient(145deg, rgba(255,222,113,.99), rgba(177,101,22,.98));
      box-shadow:
        0 0 0 3px rgba(118,70,22,.34),
        0 0 17px rgba(255,194,73,.72),
        0 0 28px rgba(94,49,14,.46);
    }
    .game-board.map-visual-vintage .sea-tile.scout-encounter{
      border-color:rgba(231,207,158,.86);
      background:linear-gradient(145deg, rgba(49,39,29,.99), rgba(14,12,10,.99));
      color:#f1dfb9;
      box-shadow:
        0 0 0 4px rgba(50,31,16,.36),
        0 0 18px rgba(14,10,7,.86),
        0 0 30px rgba(219,181,111,.22);
    }
    .game-board.map-visual-vintage .sea-tile.route-claimed{
      border-color:rgba(121,48,31,.92);
      background:linear-gradient(145deg, rgba(219,162,126,.98), rgba(142,60,43,.96));
      color:#5f2418;
      box-shadow:0 6px 15px rgba(83,36,23,.3);
    }
    .game-board.map-visual-vintage .sea-tile.route-claimed-by-me{
      border-color:rgba(105,35,25,.98);
      background:linear-gradient(145deg, rgba(208,128,101,.99), rgba(112,36,30,.98));
      color:#fff0d5;
      box-shadow:0 0 0 4px rgba(245,216,157,.14), 0 10px 24px rgba(81,29,21,.38);
    }
    .game-board.map-visual-vintage .island-visual-art img,
    .game-board.map-visual-vintage .map-decoration img{
      filter:
        sepia(.48)
        saturate(.78)
        contrast(1.08)
        brightness(.92)
        drop-shadow(0 12px 14px rgba(64,38,18,.3)) !important;
    }
    .game-board.map-visual-vintage .island-visual-glow{
      opacity:.46;
      background:radial-gradient(ellipse at center, rgba(205,161,91,.42), rgba(99,57,25,.18) 48%, transparent 74%);
      filter:blur(5px);
    }
    .game-board.map-visual-vintage .island-node .k,
    .game-board.map-visual-vintage .island-node .m{
      color:#4d321e;
      text-shadow:0 1px 0 rgba(255,231,176,.62);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar game-clean-hidden" aria-hidden="true">
      <div class="toprow">
        <button type="button" class="back-link" id="backToLobbyBtn">返回等待室</button>
        <div class="mode-badge">Board Game</div>
      </div>
      <div class="toprow">
        <div>
          <h1 class="title" id="gameRoomTitle">偉大航道正式遊戲</h1>
          <div class="subtitle">海上很多格，只有到島後才決定下一座島。</div>
        </div>
        <div class="meta-row">
          <span class="meta-pill">房號 <strong id="gameRoomCode" style="margin-left:6px;">B7412</strong></span>
          <span class="meta-pill">當前玩家 <strong id="currentTurnName" style="margin-left:6px;">—</strong></span>
          <span class="meta-pill">流程 <strong id="turnStepName" style="margin-left:6px;">開局命運骰</strong></span>
        </div>
      </div>
      <div class="player-strip" id="gamePlayerStrip"></div>
      <div class="setup-draft-top-strip" id="setupDraftTopStrip" hidden></div>
    </section>

    <section class="layout">
      <section class="board-card">
        <div class="board-tools">
          <button type="button" class="map-tool-btn" id="focusPlayerBtn">回到目前玩家</button>
          <button type="button" class="map-tool-btn" id="viewWholeMapBtn">查看全圖</button>
          <div class="cpu-speed-control" id="cpuSpeedControl">
            <span class="cpu-speed-label">CPU</span>
            <select class="cpu-speed-select" id="cpuSpeedSelect" aria-label="CPU 回合倍速">
              <option value="1">1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
              <option value="2.5">2.5x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
              <option value="6">6x</option>
            </select>
            <span class="cpu-speed-hint" id="cpuSpeedHint">房主</span>
            <button type="button" class="cpu-strategy-btn" id="cpuStrategyBtn">CPU指令</button>
          </div>
          <button type="button" class="map-tool-btn" id="saveGameBtn">存檔</button>
          <button type="button" class="map-tool-btn" id="loadGameBtn">讀檔</button>
        </div>
        <div class="map-turn-banner" id="mapTurnBanner" aria-live="polite"></div>
        <div class="board-viewport" id="boardViewport">
          <div class="board-panzoom" id="boardPanZoomLayer">
            <div class="game-board" id="boardGameMap" data-map-visual-style="original"></div>
          </div>
        </div>
      </section>

      <aside class="sidebar game-clean-hidden" aria-hidden="true">
        <section class="side-card">
          <h2 class="side-title">目前玩家</h2>
          <div class="current-card" id="currentPlayerCard"></div>
          <div class="action-grid">
            <button type="button" class="game-btn secondary" id="useItemBtn">背包</button>
            <button type="button" class="game-btn primary" id="rollDiceBtn">擲骰前進</button>
            <button type="button" class="game-btn secondary" id="inspectTileBtn">查看目前格子</button>
          </div>
          <div class="last-roll" id="lastRollText">尚未擲骰</div>
        </section>

        <section class="side-card">
          <h2 class="side-title">航海紀錄</h2>
          <div class="game-log" id="eventLog"></div>
        </section>
      </aside>
    </section>
  </main>

  <div class="board-modal-backdrop" id="boardModalBack">
    <section class="board-modal" id="boardModal" role="dialog" aria-label="board-game-modal"></section>
  </div>
  <div class="dice-hud" id="diceHud" aria-hidden="true">
    <section class="dice-hud-card">
      <div class="dice-hud-title" id="diceHudTitle"></div>
      <div class="dice-hud-sub" id="diceHudSubtitle"></div>
      <div class="dice-orb theme-move" id="diceHudOrb">
        <img class="dice-orb-image" id="diceHudFaceImage" alt="" decoding="async" draggable="false" hidden>
        <span class="dice-orb-text" id="diceHudFaceText">?</span>
      </div>
    </section>
  </div>
  <div class="turn-transition-banner" id="turnTransitionBanner" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <section class="turn-transition-card">
      <div class="turn-transition-avatar"><img id="turnTransitionAvatar" src="" alt="" decoding="async"></div>
      <div class="turn-transition-copy">
        <div class="turn-transition-kicker" id="turnTransitionKicker">NEXT TURN</div>
        <div class="turn-transition-title" id="turnTransitionTitle">輪到你了</div>
        <div class="turn-transition-subtitle" id="turnTransitionSubtitle">準備操作。</div>
      </div>
    </section>
  </div>
  <div class="mission-complete-toast" id="missionCompleteToast" aria-live="polite" aria-atomic="true">
    <span class="mission-toast-kicker">MISSION CLEAR</span>
    <div class="mission-toast-title" data-mission-toast-title>任務完成</div>
    <div class="mission-toast-sub" data-mission-toast-sub>可以領取任務獎勵。</div>
  </div>
  <div class="evolution-hud" id="evolutionHud" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <section class="evolution-card">
      <div class="evolution-material-stage">
        <div class="evolution-material-aura"></div>
        <div class="evolution-character-window" id="evolutionHudCharacterWindow">
          <img class="evolution-character-img before" id="evolutionHudCharacterBefore" src="" alt="" onerror="if(this.dataset.fallbackSrc){this.src=this.dataset.fallbackSrc;this.dataset.fallbackSrc='';}else{this.hidden=true;}">
          <img class="evolution-character-img after" id="evolutionHudCharacterAfter" src="" alt="" onerror="if(this.dataset.fallbackSrc){this.src=this.dataset.fallbackSrc;this.dataset.fallbackSrc='';}else{this.hidden=true;}">
        </div>
        <img class="evolution-character-frame" id="evolutionHudCharacterFrame" data-src="images/board/evolution_ui/evolution_portrait_frame_v1.webp?v=20260831-portable-prefetch-v397" alt="" aria-hidden="true">
        <img class="evolution-material-img" id="evolutionHudMaterial" src="" alt="" onerror="this.hidden=true;">
      </div>
      <div class="evolution-dialogue" id="evolutionHudDialogue">
        <p class="evolution-sub" id="evolutionHudSub">新的力量覺醒。</p>
        <div class="evolution-continue" id="evolutionHudContinue">點擊繼續</div>
      </div>
      <div class="evolution-rule"></div>
    </section>
  </div>

  <div class="item-reveal-hud" id="itemRevealHud" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <section class="item-reveal-card">
      <img class="item-reveal-panel-frame" id="itemRevealPanelFrame" data-src="images/board/item_reveal_ui/important_item_reveal_panel_frame.webp?v=20260831-portable-prefetch-v397" alt="" aria-hidden="true">
      <div class="item-reveal-stage">
        <img class="item-reveal-image" id="itemRevealImage" src="" alt="" onerror="this.hidden=true;">
        <div class="postgame-clue-reveal" id="postgameClueReveal" hidden>
          <img class="postgame-clue-reveal-frame" id="postgameClueRevealFrame" data-src="images/board/postgame_clue_ui/york_clue_playing_card_frame_v2.webp?v=20260831-portable-prefetch-v397" alt="" aria-hidden="true">
          <img class="postgame-clue-reveal-island" id="postgameClueRevealIsland" src="" alt="">
          <span class="postgame-clue-reveal-rank corner-top" id="postgameClueRevealRank">A</span>
          <span class="postgame-clue-reveal-rank corner-bottom" id="postgameClueRevealRankMirror" aria-hidden="true">A</span>
        </div>
      </div>
      <div class="item-reveal-dialogue">
        <p class="item-reveal-title" id="itemRevealTitle">重要道具</p>
        <h2 class="item-reveal-name" id="itemRevealName">獲得道具</h2>
        <p class="item-reveal-line" id="itemRevealLine">新的重要道具已加入背包。</p>
      </div>
      <div class="item-reveal-continue" id="itemRevealContinue" aria-label="點擊繼續">點擊繼續</div>
    </section>
  </div>

  <script src="js/board_shared.js?v=20260831-portable-prefetch-v397"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/board_cards.js?v=20260827-zorojuro-enma-v348"></script>
  <script src="js/board_map_layout_override.js"></script>
  <script src="js/bgm_metadata.js?v=20260901-bgm-continuity-v407"></script>
  <script src="js/choose_bgm.js?v=20260901-bgm-continuity-v407"></script>
  <script src="js/bgm_manager.js?v=20260901-bgm-continuity-v407"></script>
  <script src="js/board_items.js?v=20260827-zorojuro-enma-v348"></script>
  <script src="js/board_york_clue_puzzle.js?v=20260824-york-tier3-practice-v307"></script>
  <script src="js/board_missions.js?v=20260817-main-mission-flow-v2"></script>
  <script src="js/battle_hit_effect_settings.js?v=20260505-cast-sfx-v1"></script>
  <script src="js/onepiece_prebattle_lines.js?v=20260819-zephyr-name-v4"></script>
  <script src="js/board_cosmetic_frame_preview.js?v=20260729-rocks-conqueror-frame-v1"></script>
  <script src="js/board_enemy_spawn_regions.js?v=20260829-regional-enemy-spawns-v381"></script>
  <script src="js/board_game.js?v=20260903-reconnect-monotonic-v429"></script>
</body>
</html>
