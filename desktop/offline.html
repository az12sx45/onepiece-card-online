<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>ONE PIECE 桌遊啟動器 - 無法連線</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #eef8f7;
      background: radial-gradient(circle at top, #164454 0, #071b27 48%, #030b12 100%);
    }
    main {
      width: min(34rem, calc(100vw - 3rem));
      padding: 2.25rem;
      text-align: center;
      border: 1px solid #b99a50;
      border-radius: 1rem;
      background: rgba(4, 20, 30, .92);
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .45);
    }
    h1 { margin: 0 0 1rem; color: #e8ca74; font-size: 1.65rem; }
    p { margin: .5rem 0; line-height: 1.7; color: #c9d8da; }
  </style>
</head>
<body>
  <main>
    <h1>暫時無法連上偉大航道</h1>
    <p>請確認網路連線後重新啟動 ONE PIECE 桌遊啟動器。</p>
    <p>桌面版的圖片快取不包含遊戲程式，因此仍需連線才能進入遊戲。</p>
  </main>
</body>
</html>
