name: iOS trial build
on:
  push:
    branches: [codex/tabletop-ios-trial]
    paths: ['ios/**', '.github/workflows/ios-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare verified launcher and three games
        env:
          IOS_SOURCE_COMMIT: ${{ github.sha }}
        run: node ios/prepare.mjs
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Verify launcher bridge contracts
        run: node ios/bridge-qa.mjs
      - name: Verify native content signatures
        run: |
          mkdir -p ios/build
          swiftc ios/Sources/ContentUpdate.swift ios/signature-qa.swift -o ios/build/signature-qa
          ios/build/signature-qa ios/GameAssets/launcher-content.json
      - name: Compile unsigned device app
        run: |
          xcodebuild -project ios/TabletopIOS.xcodeproj -scheme TabletopIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for local signing
        run: |
          node ios/package-qa.mjs ios/build/Build/Products/Release-iphoneos/TabletopIOS.app
          mkdir -p ios/build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/TabletopIOS.app ios/build/Payload/
          cd ios/build
          zip -qr TabletopIOS-full-assets.ipa Payload
          shasum -a 256 TabletopIOS-full-assets.ipa > TabletopIOS-full-assets.sha256
      - name: Verify simulator installation
        run: |
          xcodebuild -project ios/TabletopIOS.xcodeproj -scheme TabletopIOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/simulator-build CODE_SIGNING_ALLOWED=NO build > ios/build/simulator-build.log 2>&1
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/simulator-build/Build/Products/Release-iphonesimulator/TabletopIOS.app
          echo 'Simulator installation PASS; physical device acceptance NOT_RUN' > ios/build/simulator-install.txt
      - name: Export app core for lossless local full-asset assembly
        run: |
          cd ios/build/Payload
          zip -qr ../TabletopIOS-core.zip TabletopIOS.app -x 'TabletopIOS.app/GameAssets/*' 'TabletopIOS.app/GameAssets/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tabletop-ios-core-v012
          path: |
            ios/build/TabletopIOS-core.zip
            ios/build/simulator-install.txt
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tabletop-ios-full-assets
          path: |
            ios/build/TabletopIOS-full-assets.ipa
            ios/build/TabletopIOS-full-assets.sha256
            ios/GameAssets/build-evidence.json
          retention-days: 7
