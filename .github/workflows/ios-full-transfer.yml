name: Transfer verified full iOS IPA
on:
  push:
    branches: [codex/tabletop-ios-trial]
    paths: ['.github/workflows/ios-full-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tabletop-ios-full-assets
          run-id: 38072566416
          github-token: ${{ github.token }}
          path: original
      - name: Split unchanged verified IPA
        run: |
          mkdir parts
          sha256sum -c original/build/TabletopIOS-full-assets.sha256 --ignore-missing || true
          cd original/build
          sha256sum -c TabletopIOS-full-assets.sha256
          split -b 400M -d -a 2 TabletopIOS-full-assets.ipa ../../parts/TabletopIOS-full-assets.ipa.part-
          cd ../..
          cp original/build/TabletopIOS-full-assets.sha256 parts/
          cp original/Resources/build-evidence.json parts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-00
          path: parts/TabletopIOS-full-assets.ipa.part-00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-01
          path: parts/TabletopIOS-full-assets.ipa.part-01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-02
          path: parts/TabletopIOS-full-assets.ipa.part-02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-03
          path: parts/TabletopIOS-full-assets.ipa.part-03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-04
          path: parts/TabletopIOS-full-assets.ipa.part-04
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-05
          path: parts/TabletopIOS-full-assets.ipa.part-05
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-part-06
          path: parts/TabletopIOS-full-assets.ipa.part-06
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ipa-evidence
          path: |
            parts/TabletopIOS-full-assets.sha256
            parts/build-evidence.json
          retention-days: 7
