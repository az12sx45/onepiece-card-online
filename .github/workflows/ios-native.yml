name: PO iOS unsigned native build
on:
  push:
    branches: [codex/ios-native-v038, codex/ios-board-update-host-v070]
    paths: [candidate/**, .github/workflows/ios-native.yml]
permissions:
  contents: read
concurrency:
  group: po-ios-native-build
  cancel-in-progress: false
jobs:
  device:
    if: github.repository == 'az12sx45/onepiece-card-online' && github.event.repository.private == false
    permissions:
      contents: write
      actions: read
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check remaining free artifact capacity
        id: storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 candidate/tools/prepare_ci_storage.py
      - name: Verify exact source and create isolated build environment
        run: |
          python3 -m venv "$RUNNER_TEMP/po-python"
          "$RUNNER_TEMP/po-python/bin/python" -m pip install --disable-pip-version-check SCons==4.11.1
          "$RUNNER_TEMP/po-python/bin/python" candidate/tools/setup_macos.py --root "$RUNNER_TEMP/po-godot"
      - name: Compile arm64 device app without Apple credentials
        run: |
          args=()
          if [ "$GITHUB_REF_NAME" = 'codex/ios-board-update-host-v070' ]; then
            args+=(--board-update-host-v070)
          fi
          "$RUNNER_TEMP/po-python/bin/python" candidate/tools/build_macos.py --candidate candidate --godot "$RUNNER_TEMP/po-godot/Godot.app/Contents/MacOS/Godot" --out "$RUNNER_TEMP/po-build" "${args[@]}"
      - name: Collect bounded diagnostics
        if: always()
        run: |
          mkdir -p ci-result
          if [ -d "$RUNNER_TEMP/po-build/logs" ]; then cp "$RUNNER_TEMP/po-build/logs/"*.log ci-result/; fi
          if [ -f "$RUNNER_TEMP/po-build/build-result.json" ]; then cp "$RUNNER_TEMP/po-build/build-result.json" ci-result/; fi
          if [ -f "$RUNNER_TEMP/po-storage-guard.json" ]; then cp "$RUNNER_TEMP/po-storage-guard.json" ci-result/; fi
          if [ -f "$RUNNER_TEMP/po-build/board-qa/native-turn-control-sync.js" ]; then
            mkdir -p ci-result/board-qa
            cp "$RUNNER_TEMP/po-build/board-qa/native-turn-control-sync.js" ci-result/board-qa/
          fi
          printf '%s\n' 'Unsigned development candidate only. No Apple credentials or iPhone acceptance.' > ci-result/NOTICE.txt
      - name: Verify bounded unsigned candidate size
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          guard=json.loads((root/'po-storage-guard.json').read_text())
          ipa=root/'po-build/PO-iOS-UNSIGNED.ipa'
          if ipa.stat().st_size>guard['maximumCandidateBytes']:raise SystemExit('Candidate exceeds reserved free storage; upload stopped')
          PY
      - name: Save diagnostics for one day
        id: diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: po-ios-build-report
          path: ci-result/
          retention-days: 1
      - name: Save unsigned candidate for one day
        id: candidate
        continue-on-error: true
        if: success() && steps.storage.outputs.artifact-upload-allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PO-iOS-UNSIGNED
          path: ${{ runner.temp }}/po-build/PO-iOS-UNSIGNED.ipa
          retention-days: 1
          compression-level: 0
      - name: Retain verified candidate in dedicated draft release
        if: success() && (steps.storage.outputs.artifact-upload-allowed != 'true' || steps.candidate.outcome == 'failure' || steps.diagnostics.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B candidate/tools/save_ci_release.py
