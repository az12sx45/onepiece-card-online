name: Marineford iOS origin feasibility
on:
  push:
    branches: [codex/ios-marineford-origin-v066]
permissions:
  contents: read
jobs:
  origin:
    if: github.repository == 'az12sx45/onepiece-card-online' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and observe native WebKit origin
        run: |
          clang++ -fobjc-arc -framework Cocoa -framework WebKit candidate/tools/probe_marineford_origin.mm -o "$RUNNER_TEMP/probe-marineford-origin"
          "$RUNNER_TEMP/probe-marineford-origin" candidate/bundle-resources/launcher-web "$RUNNER_TEMP/marineford-origin.json"
      - name: Compile and verify installed Marineford programs
        run: |
          python3 -B candidate/tools/prepare_marineford_fixture.py --assets candidate/bundle-resources/launcher-web --out "$RUNNER_TEMP/marineford-fixtures"
          clang++ -fobjc-arc -framework Cocoa -framework WebKit -I candidate/native candidate/tools/check_marineford_webkit.mm -o "$RUNNER_TEMP/check-marineford-program"
          "$RUNNER_TEMP/check-marineford-program" candidate/bundle-resources/launcher-web "$RUNNER_TEMP/marineford-fixtures" candidate/tools/fixtures
      - name: Verify existing-version launcher controls
        run: |
          clang -fobjc-arc -framework Cocoa -framework WebKit -I candidate/native candidate/tools/check_launcher_webkit.m -o "$RUNNER_TEMP/check-marineford-launcher"
          "$RUNNER_TEMP/check-marineford-launcher" candidate/bundle-resources/launcher-web
      - name: Save bounded origin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marineford-ios-origin
          path: ${{ runner.temp }}/marineford-origin.json
          retention-days: 1
