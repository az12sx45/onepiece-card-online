<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2e7dd"><meta name="robots" content="noindex,nofollow,noarchive">
<title>仁鈞＆姮儒｜幸福祝福冊</title><link rel="stylesheet" href="./book.css"><script src="./book.js" defer></script>
</head><body>
<header class="masthead"><div class="wordmark">R <span>&</span> H</div><div class="masthead-title">我們的幸福，因你而完整</div><div class="connection" id="indicator" role="status"><i></i><span id="linkStatus">正在連線…</span></div></header>
<main class="book-viewport" aria-label="仁鈞與姮儒的婚禮祝福紀念冊"><div class="book-scale" id="bookScale">
<div class="book-cover"></div><div class="paper-stack stack-left"></div><div class="paper-stack stack-right"></div>
<div class="book" id="book">
<section class="paper left-page" id="leftPage" aria-label="新人合照與拍照分組 QR Code">
<span class="page-ornament ornament-top" aria-hidden="true"></span><div class="eyebrow">THE BEGINNING OF FOREVER</div>
<figure class="couple-photo"><img src="./assets/couple.jpg" alt="仁鈞與姮儒的真實合照" width="1000" height="750"></figure>
<h1>仁鈞 <span>♡</span> 姮儒</h1><p class="couple-note">謝謝你，成為我們故事裡的一頁。</p>
<div class="join-us"><a class="qr-link" href="https://tantan-lily-photo-groups-2026.onrender.com/" target="_blank" rel="noopener" aria-label="開啟拍照分組查詢網站"><img id="lookupQR" src="./assets/lookup-qr.svg" alt="掃描前往拍照分組與祝福填寫網站" width="210" height="210"></a><div class="join-copy"><span class="mini-label">JOIN OUR MEMORIES</span><h2>拍照分組</h2><p>掃描 QR Code，<br>查詢組別並留下祝福</p><span class="tiny-heart" aria-hidden="true">— ♡ —</span></div></div>
<span class="page-ornament ornament-bottom" aria-hidden="true"></span><div class="paper-footer">WITH LOVE, RENJUN & HENGRU</div></section>
<section class="paper right-page" id="rightPage" aria-label="當前賓客祝福"></section>
<div class="page-turn-shadow" id="pageTurnShadow" aria-hidden="true"></div>
<div class="turning-sheet" id="turningSheet" aria-hidden="true" hidden><div class="sheet-face sheet-front" id="sheetFront"></div><div class="sheet-face sheet-back"><div class="reverse-border"><span class="reverse-flower">❦</span><span class="reverse-monogram">R <em>&</em> H</span><span class="reverse-note">每一頁，都是愛。</span><span class="reverse-flower small">❦</span></div></div><div class="sheet-edge"></div></div>
<div class="book-gutter" aria-hidden="true"></div></div><div class="ribbon" aria-hidden="true"></div></div></main>
<footer class="toolbar"><div class="playback-info"><span class="live-label">幸福典藏</span><span id="pageStatus">等待第一份祝福</span><span class="total">共 <b id="wishCount">0</b> 則</span></div><nav class="controls" aria-label="祝福冊播放控制">
<button type="button" id="prev" aria-label="上一頁">‹ <span>上一頁</span></button><button type="button" id="pause">暫停播放</button><button type="button" id="next" aria-label="下一頁"><span>下一頁</span> ›</button><span class="control-divider"></span><button type="button" id="replay">重新播放</button><button type="button" id="fullscreen">全螢幕</button><button type="button" id="export">匯出祝福</button><button type="button" id="manage">管理</button></nav></footer>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="adminDialog" class="admin-dialog"><form method="dialog" class="dialog-heading"><h2>祝福冊管理</h2><button aria-label="關閉管理視窗">×</button></form><form id="adminLogin" class="admin-login"><label for="adminToken">管理金鑰</label><input type="password" id="adminToken" autocomplete="off" placeholder="輸入管理員金鑰"><button type="submit">解鎖管理</button><p>金鑰只保留在這個分頁的記憶體；關閉或重整後需重新輸入。</p></form><div id="adminPanel" hidden><div class="admin-actions"><button type="button" id="adminRefresh">重新載入</button><button type="button" id="adminCSV">匯出全部 CSV</button><button type="button" id="adminBackup">完整備份 JSON（含頭像）</button><button type="button" id="adminLogout">鎖定</button></div><p class="admin-help">隱藏後不再公開展示；可重新公開。刪除為保留紀錄的軟刪除。</p><div id="adminList"></div></div><p id="adminStatus" role="status"></p></dialog>
